Q("fh6","¿Cuáles son los indicios de PÉRDIDA de la Conciencia Situacional?",["Cansancio y hambre","Ambigüedad (incertidumbre, duda, vacilación), fijación de la atención y confusión","Silencio en cabina","Exceso de comunicación"],1,"Indicios de pérdida de la C.S.: AMBIGÜEDAD (incertidumbre, duda, vacilación), FIJACIÓN DE LA ATENCIÓN y CONFUSIÓN.","AH Clase 6");
Q("fh6","¿Cuáles son las defensas para mantener la Conciencia Situacional?",["Descansar y alimentarse","Briefings, seguir los procedimientos, trabajar en equipo y mantener la comunicación eficaz","Volar menos horas","Confiar en la experiencia"],1,"Defensas para mantener la C.S.: BRIEFINGS, SEGUIR LOS PROCEDIMIENTOS, TRABAJAR EN EQUIPO y MANTENER LA COMUNICACIÓN EFICAZ.","AH Clase 6");
Q("fh6","Entre las recomendaciones para mantener la C.S., ¿qué se dice sobre delegar?",["Nunca delegar","Evitar la saturación de tareas y delegar las que se puedan, PERO NUNCA LA RESPONSABILIDAD","Delegar todo lo posible","Delegar solo al TAC1"],1,"Recomendación: «Evitar la saturación de tareas, delegar las que se puedan pero NUNCA LA RESPONSABILIDAD». Otras: tomar conciencia de que es un proceso activo, identificar signos precoces de pérdida, usar siempre las listas de chequeo, priorizar tareas, detectar modelos mentales limitantes, resolver discrepancias por diálogo y evitar la complacencia.","AH Clase 6");
Q("fh6","¿Qué recomienda el material sobre la persona que está al lado?",["Que se debe supervisar","Que ese «tonto» que está al lado suyo puede tener la respuesta exacta","Que hay que corregirla","Que no debe interrumpir"],1,"Una de las 10 recomendaciones para mantener la conciencia situacional: «Ese “tonto” que está al lado suyo puede tener la respuesta exacta». Y también: «Acordar que ante la dificultad, el primero que la ve, la canta».","AH Clase 6");
Q("fh6","¿Cuáles son las barreras en la Toma de Decisiones?",["El liderazgo y la jerarquía","Calidad de la información, tiempo disponible y sesgos cognitivos","El ruido y la fatiga","La falta de procedimientos"],1,"Barreras en la Toma de Decisiones: CALIDAD DE LA INFORMACIÓN, TIEMPO DISPONIBLE y SESGOS COGNITIVOS.","AH Clase 6");
Q("fh6","¿Cuáles son los pasos de la Toma de Decisiones ANALÍTICA?",["Actuar y luego evaluar","Percibir e identificar el problema, pedir información, escuchar opiniones, utilizar todos los recursos disponibles, elegir un curso de acción y realizar un análisis (evaluación)","Seguir el procedimiento sin analizar","Consultar al comandante siempre"],1,"Toma de decisiones ANALÍTICA: percibir e identificar el problema, pedir información, escuchar opiniones, utilizar todos los recursos disponibles, elegir un curso de acción (resolver) y realizar un análisis (evaluación).","AH Clase 6");
Q("fh6","¿Cuándo se aplica la Toma de Decisiones INTUITIVA o AUTOMÁTICA?",["Cuando hay tiempo de sobra","En situaciones de emergencia, cuando no hay tiempo para analizar; se basa en el entrenamiento, la experiencia y el conocimiento, y responde al cumplimiento de procedimientos","Cuando el equipo no se pone de acuerdo","En vuelos de rutina"],1,"Toma de decisiones INTUITIVA O AUTOMÁTICA: situaciones de emergencia, no hay tiempo para analizar; se basa en el entrenamiento, la experiencia y el conocimiento, y responde al cumplimiento de procedimientos.","AH Clase 6");

/* ================= TEC · CONOCIMIENTOS TÉCNICOS ================= */
Q("tec1","¿Qué estudia la aerodinámica?",["El clima en altura","Las leyes que rigen el movimiento del aire y las reacciones que se originan sobre un cuerpo sólido en movimiento","La navegación por instrumentos","El diseño de motores"],1,"Aerodinámica: ciencia que estudia las leyes relativas que rigen el movimiento del aire y las reacciones que se originan sobre un cuerpo sólido en movimiento. Cuando un avión está en vuelo es debido a que se está generando una fuerza llamada SUSTENTACIÓN.","Aerodinámica");
Q("tec1","¿Cómo se define un avión?",["Cualquier aeronave con motor","Aeronave propulsada mecánicamente que deriva su sustentación en vuelo principalmente de reacciones aerodinámicas sobre superficies que permanecen FIJAS","Una aeronave más pesada que el aire","Un vehículo que vuela sobre 10.000 pies"],1,"Avión: aeronave propulsada mecánicamente, que deriva su sustentación en vuelo principalmente de reacciones aerodinámicas sobre superficies que permanecen FIJAS (a diferencia del helicóptero, cuyas superficies giran).","Aerodinámica");
Q("tec1","¿Cuáles son las 5 partes de la estructura de un avión?",["Alas, motores, cabina, cola y tren","Fuselaje, alas, empenaje, tren de aterrizaje y motores","Cockpit, cabina, bodega, alas y motores","Nariz, cuerpo, cola, alas y hélices"],1,"La estructura de un avión está compuesta de: FUSELAJE, ALAS, EMPENAJE, TREN DE ATERRIZAJE y MOTORES.","Aerodinámica");
Q("tec1","¿Cuáles son las partes de un perfil alar?",["Punta, raíz y centro","Borde de ataque, borde de fuga, cara superior o dorsal, cara inferior o ventral y cuerda alar","Flap, slat y alerón","Superior, inferior y lateral"],1,"En un perfil alar se distinguen: borde de ataque, borde de fuga, cara superior o dorsal, cara inferior o ventral y cuerda alar. La parte superior tiene cierto grado de curvatura y la inferior es más recta.","Aerodinámica");
Q("tec1","¿Qué es el viento relativo?",["El viento de costado en la pista","El viento que se genera en sentido contrario a la dirección del movimiento del avión","El viento en altura","La corriente de chorro"],1,"Viento relativo: es el viento que se genera en sentido CONTRARIO a la dirección del movimiento del avión.","Aerodinámica");
Q("tec1","¿Qué es el ángulo de ataque?",["El ángulo de subida del avión","El ángulo formado por la cuerda alar y la dirección del viento relativo","El ángulo del tren de aterrizaje","La inclinación de los flaps"],1,"Ángulo de ataque: es el ángulo formado por la CUERDA ALAR y la DIRECCIÓN DEL VIENTO RELATIVO. Este ángulo tiene una relación muy directa con el comportamiento de la sustentación en el perfil alar.","Aerodinámica");
Q("tec1","¿Qué es el STALL?",["Una falla de motor","Pérdida brusca de sustentación producida por un excesivo ángulo de ataque","Una pérdida de presurización","Un exceso de velocidad"],1,"STALL: pérdida brusca de sustentación producida por un EXCESIVO ÁNGULO DE ATAQUE. A mayor ángulo de ataque la sustentación aumenta, pero al ascender con potencia fija la velocidad disminuye hasta llegar a un punto en que se genera el stall.","Aerodinámica");
Q("tec1","Los ALERONES controlan el movimiento de…",["Cabeceo, en el eje transversal","Alabeo o roll, en el eje longitudinal","Guiño o yaw, en el eje vertical","Ascenso y descenso"],1,"Los ALERONES están en el extremo de cada ala, en el borde de fuga. Controlan el movimiento lateral del avión llamado ALABEO o ROLL, en el eje LONGITUDINAL.","Aerodinámica");
Q("tec1","El TIMÓN DE PROFUNDIDAD controla…",["El alabeo","El cabeceo o pitch, haciendo que el avión suba o descienda","El guiño","La velocidad"],1,"El TIMÓN DE PROFUNDIDAD está en el borde de fuga del plano fijo horizontal del empenaje; controla el avión haciendo que suba o descienda. El movimiento se llama CABECEO o PITCH.","Aerodinámica");
Q("tec1","El TIMÓN DE DIRECCIÓN produce el movimiento llamado…",["Alabeo","Cabeceo","Guiño o yaw, en el eje vertical","Rotación"],2,"El TIMÓN DE DIRECCIÓN está en el borde de fuga del plano vertical del empenaje, haciendo que el avión se desplace a la izquierda o a la derecha. Ese movimiento se llama GUIÑO o YAW, en el eje VERTICAL.","Aerodinámica");
Q("tec1","¿Cuáles son las 4 fuerzas que afectan el vuelo recto y nivelado?",["Empuje, freno, subida y bajada","Sustentación (arriba), peso o gravedad (abajo), tracción (adelante) y resistencia al avance (atrás)","Presión, temperatura, densidad y velocidad","Alabeo, cabeceo, guiño y deriva"],1,"Las 4 fuerzas: SUSTENTACIÓN (lift, hacia arriba), PESO o gravedad (weight, hacia abajo), TRACCIÓN (thrust, hacia adelante) y RESISTENCIA AL AVANCE (drag, hacia atrás).","Aerodinámica");
Q("tec1","¿Para qué sirven los FLAPS?",["Para frenar en tierra","Para aumentar la superficie del ala y su curvatura, permitiendo ángulos de ataque mayores y operar a bajas velocidades en despegues y aterrizajes","Para reducir la sustentación","Para dirigir el avión"],1,"Los FLAPS aumentan la superficie del ala y su curvatura, lo que permite usar ángulos de ataque mayores y poder operar a bajas velocidades en maniobras como despegues y aterrizajes. Junto con los SLATS (dispositivos de borde de ataque) son los dispositivos hipersustentadores.","Aerodinámica");
Q("tec1","¿Qué son los SPOILERS y para qué se usan en emergencia?",["Aumentan la sustentación","Son superficies que DISMINUYEN la sustentación; se usan como Speed Brakes en descensos de emergencia","Controlan la dirección","Calientan el borde de ataque"],1,"Los SPOILERS constan de varias aletas ubicadas en la cara superior de las alas y actúan en vuelo o en tierra para DISMINUIR LA SUSTENTACIÓN. Se usan como Speed Brakes en descensos de emergencia, maniobra que requiere descender rápidamente sin avanzar, con ángulo de picada pronunciado y gran razón de descenso (para alcanzar los 10.000 pies).","Aerodinámica");
Q("tec1","¿Qué son los compensadores?",["Los flaps de emergencia","Mecanismos que permiten que las superficies de control se mantengan en una posición determinada, reduciendo el esfuerzo físico","Los frenos del tren","Los estabilizadores de cabina"],1,"Compensadores: mecanismos que permiten que las superficies de control se mantengan en una posición determinada, reduciendo el esfuerzo físico en las superficies primarias de control.","Aerodinámica");
Q("tec1","¿Qué es la presurización?",["El aumento de velocidad en crucero","El bombeo activo de aire comprimido en la cabina para garantizar la seguridad y confort de los ocupantes","La presión de los neumáticos","El sistema hidráulico"],1,"Presurización: es el bombeo activo de aire comprimido en la cabina de una aeronave para garantizar la seguridad y confort de los ocupantes. Cuando un avión se despresuriza se pierde esa capacidad.","Aerodinámica");
Q("tec1","¿Cuál es el propósito del sistema ANTIHIELO?",["Derretir el hielo del fuselaje","Mantener calefaccionado el borde de ataque, previniendo la formación de hielo y evitando el deterioro de las características aerodinámicas","Enfriar los motores","Descongelar el tren de aterrizaje"],1,"Los sistemas antihielo evitan la formación de hielo mediante un equipo que calienta el BORDE DE ATAQUE, licuando el hielo que pueda formarse y evitando que se acumule. Su propósito es prevenir la formación de hielo evitando el deterioro de las características aerodinámicas. También existen sistemas que depositan una película líquida de anticongelante.","Aerodinámica");

Q("tec2","¿Qué es la meteorología?",["El estudio de las nubes","Ciencia que estudia los fenómenos que ocurren en la atmósfera, especialmente los relacionados con la predicción del tiempo","El estudio del viento","La medición de la presión"],1,"Meteorología: ciencia que estudia los fenómenos que ocurren en la Atmósfera, especialmente aquellos relacionados con la precisión de la predicción del tiempo.","Meteorología");
Q("tec2","¿Qué instrumento mide la velocidad del viento?",["Barómetro","Anemómetro","Pluviómetro","Termómetro"],1,"PLUVIÓMETRO: cantidad de lluvia caída · TERMÓMETRO: temperatura · ANEMÓMETRO: velocidad del viento · BARÓMETRO: presión atmosférica.","Meteorología");
Q("tec2","¿Qué instrumento mide la presión atmosférica?",["Anemómetro","Barómetro","Pluviómetro","Higrómetro"],1,"El BARÓMETRO mide la presión atmosférica. El anemómetro mide la velocidad del viento, el pluviómetro la cantidad de lluvia caída y el termómetro la temperatura.","Meteorología");
Q("tec2","¿Cuál es la composición del aire de la atmósfera?",["50% oxígeno y 50% nitrógeno","Oxígeno 21%, nitrógeno 78%, otros gases 1% y vapor de agua en porcentaje variable","Nitrógeno 21% y oxígeno 78%","100% oxígeno"],1,"La capa gaseosa que rodea la tierra está compuesta por: OXÍGENO 21%, NITRÓGENO 78%, otros gases 1% y VAPOR DE AGUA en porcentaje variable.","Meteorología");
Q("tec2","¿En qué capa ocurren la mayoría de los fenómenos meteorológicos?",["Estratósfera","Troposfera","Tropopausa","Mesosfera"],1,"En la TROPOSFERA ocurren la mayoría de los fenómenos meteorológicos. Sus principales características son la disminución de la temperatura y presión atmosférica por altura (cada 1000 pies) y la ocurrencia de movimientos verticales de masas de aire. En la alta troposfera ocurre la corriente de chorro (jetstream).","Meteorología");
Q("tec2","¿Qué es la tropopausa?",["La capa más alta de la atmósfera","El límite entre la troposfera y la estratosfera; región de relativa calma donde la temperatura se mantiene constante","La zona de mayor turbulencia","El nivel de crucero estándar"],1,"La TROPOPAUSA marca el límite entre la troposfera y la estratosfera. Es una región de relativa calma ya que todos los fenómenos meteorológicos ocurren por debajo de esta capa. Allí la temperatura se mantiene constante para luego ascender al llegar a la estratosfera.","Meteorología");
Q("tec2","¿Cuál es la diferencia entre NIEBLA y NEBLINA?",["La niebla es de día y la neblina de noche","En la NIEBLA la visibilidad es menor a 1.000 m; en la NEBLINA es mayor de 1.000 m y menor a 3.000 m","La neblina tiene más humedad","Son lo mismo"],1,"NIEBLA: condensación del vapor de agua en pequeñísimas gotas, formando nubes al nivel del suelo, con visibilidad reducida a MENOS DE 1.000 m; gran humedad y color gris. NEBLINA: tipo de niebla en la que la visibilidad es MAYOR de 1.000 m y MENOR a 3.000 m.","Meteorología");
Q("tec2","¿Cuáles son los valores de la Atmósfera Estándar?",["0 °C y 1000 hPa","Nivel medio del mar, latitud 45°, 15 °C, 29.92 pulgadas de mercurio (1013.2 hPa)","20 °C y 760 hPa","10 °C y 1020 hPa"],1,"ATMÓSFERA ESTÁNDAR: altitud a nivel medio del mar, latitud 45°, temperatura 15 °C, presión 29.92 pulgadas de mercurio = 1013.2 hectopascales = 760 mm de mercurio = 14.7 libras por pulgada cuadrada.","Meteorología");
Q("tec2","¿Qué es el efecto Coriolis y cómo afecta al hemisferio sur?",["El giro de los motores","Por la rotación de la tierra, las corrientes de aire deflectan hacia la derecha en el hemisferio norte y hacia la IZQUIERDA en el hemisferio sur","Solo afecta al ecuador","Produce las nubes"],1,"EFECTO DE CORIOLIS: en la atmósfera las masas se mueven en línea recta hasta que una fuerza exterior las afecte (rotación de la tierra). Las corrientes de aire en el hemisferio norte deflectan hacia la DERECHA y en el hemisferio sur hacia la IZQUIERDA. Influye en los tiempos de desplazamiento Este-Oeste y viceversa.","Meteorología");
Q("tec2","¿Qué es la corriente de chorro (Jetstream)?",["Un viento de superficie","Una zona angosta de fuertes vientos en la alta troposfera, con rango de 50 a 300 nudos","Una corriente marina","El aire de los motores"],1,"La CORRIENTE DE CHORRO es una zona angosta de fuertes vientos en la ALTA TROPOSFERA. No hay un valor de velocidad establecido por definición, pero se considera un rango que puede variar desde 50 a 300 NUDOS. Frecuentemente se encuentran 2 jetstream en cada hemisferio: uno polar y otro subtropical.","Meteorología");
Q("tec2","¿De qué están compuestas las nubes ALTAS?",["Gotas de agua","Cristales de hielo (cirrus, cirrocúmulos y cirrostratos)","Vapor de agua","Polvo y humedad"],1,"Las nubes se dividen en cuatro grupos: altas, medias, bajas y de extenso desarrollo vertical. Las ALTAS son los Cirrus, Cirrocúmulos y Cirrostratos, y están compuestas de CRISTALES DE HIELO.","Meteorología");
Q("tec2","¿Qué tipo de nube es peligrosa para la aviación por estar asociada a fuertes turbulencias?",["Los cirrus","Las nubes de extenso desarrollo vertical: cúmulos y cumulonimbos","Los estratos","Los altocúmulos"],1,"Las nubes de extenso desarrollo vertical (Cúmulos y Cumulonimbos) contienen agua de muy baja temperatura, nieve y cristales de hielo. Internamente tienen gran inestabilidad por corrientes ascendentes y descendentes que provocan descargas eléctricas. Este tipo de nubosidad es PELIGROSA para la aviación por estar asociada a fuertes turbulencias.","Meteorología");
Q("tec2","¿Qué es un FRENTE?",["Una masa de aire","La superficie de discontinuidad entre dos masas de aire de características diferentes","Una zona de lluvia","La parte delantera de una tormenta"],1,"FRENTE: superficie de discontinuidad entre dos masas de aire de características diferentes. La zona de contacto entre dos masas de aire diferentes es la zona frontal o frente.","Meteorología");
Q("tec2","¿Qué caracteriza a un FRENTE FRÍO?",["Nubosidad estratos y sin turbulencia","Nubosidad cumuliforme, techo medio alto, buena visibilidad, TURBULENCIA por aire inestable, precipitación, tormentas ocasionales, granizo y nieve","Llovizna continua y aire estable","Ausencia de nubes"],1,"FRENTE FRÍO: el aire frío avanza hacia el caliente penetrando por debajo como una cuña. Se caracteriza por nubosidad CUMULIFORME, techo medio alto, visibilidad buena (excepto durante precipitaciones), TURBULENCIA por aire inestable en bajos niveles, precipitación, tormentas ocasionales, granizo y nieve.","Meteorología");
Q("tec2","¿Qué caracteriza a un FRENTE CALIENTE?",["Turbulencia y aire inestable","Nubosidad estratos, estratocúmulos y nimbostratos, techo bajo, visibilidad restringida, SIN turbulencia, aire estable y precipitación tipo llovizna","Granizo y tormentas","Cielo despejado"],1,"FRENTE CALIENTE: el aire caliente avanza hacia el frío por encima de él, como por una rampa suave. Se caracteriza por nubosidad estratos, estratocúmulos y nimbostratos, techo bajo, visibilidad restringida, SIN TURBULENCIA, aire estable y precipitación tipo llovizna.","Meteorología");
Q("tec2","¿Qué es la ONDA MONTAÑA?",["Una nube en forma de montaña","Una obstrucción a la atmósfera causada por una barrera montañosa, con fuertes corrientes verticales y turbulencia severa","Un tipo de frente","La turbulencia de estela"],1,"ONDA MONTAÑA: obstrucción que afecta a la atmósfera causada por una barrera montañosa; se caracteriza por fuertes corrientes verticales y TURBULENCIA SEVERA. En Chile se produce a causa de la Cordillera de los Andes cuando se cumplen determinadas condiciones atmosféricas.","Meteorología");
Q("tec2","¿Qué es el WINDSHEAR?",["Un viento de cola","Remolinos entre dos corrientes de aire de diferente velocidad y/o dirección, en cualquier nivel de la troposfera","La turbulencia de las montañas","Un cambio de presión"],1,"El WINDSHEAR genera remolinos entre dos corrientes de aire de diferente velocidad en cualquier nivel de la troposfera. La diferencia puede ser en velocidad y/o dirección del viento. Se presenta frecuentemente asociado a formaciones nubosas cumuliformes.","Meteorología");
Q("tec2","¿Qué es la turbulencia de aire claro (CAT)?",["La turbulencia dentro de las nubes","Turbulencia en altos niveles de vuelo sobre 15.000 pies que NO tiene causas térmicas, producida eventualmente por el jetstream","La turbulencia en el despegue","La turbulencia por estela"],1,"La corriente de chorro (jetstream) eventualmente produce turbulencia de aire claro (CLEAR AIR TURBULENCE). Este término se refiere a turbulencia en altos niveles de vuelo SOBRE 15.000 PIES que NO tiene causas térmicas.","Meteorología");
Q("tec2","¿Dónde se encuentran las turbulencias más fuertes que puede encontrar una aeronave?",["En la tropopausa","En el centro de un CB (cumulonimbo)","Cerca del suelo","En la estratosfera"],1,"Las turbulencias más fuertes que puede encontrar una aeronave están en el CENTRO DE UN CB (cumulonimbo). Estas nubes pueden tener fuertes corrientes ascendentes y, plenamente desarrolladas, producen tormentas eléctricas y fuertes lluvias. Los pilotos por precaución evitan introducirse en este tipo de nubosidad.","Meteorología");
Q("tec2","¿Qué es una ISOBARA?",["Línea de igual temperatura","Línea que une puntos de igual PRESIÓN; si están muy juntas, habrá vientos muy fuertes","Línea de igual velocidad del viento","Línea de igual humedad"],1,"ISOBARA: línea que une puntos de igual presión. Si las isobaras están demasiado juntas significa que nos encontraremos con vientos demasiado fuertes. ISOTACA: une puntos de igual velocidad del viento. ISOTERMA: une puntos de igual temperatura.","Meteorología");
Q("tec2","¿Qué es una ISOTACA?",["Línea de igual presión","Línea que une puntos de igual velocidad del viento","Línea de igual temperatura","Línea de igual altitud"],1,"ISOTACA: son líneas que unen puntos de igual VELOCIDAD DEL VIENTO (el viento sopla con la misma intensidad).","Meteorología");
Q("tec2","¿Qué es un METAR?",["Un radar meteorológico","Un informe de aeródromo meteorológico: observación que proporciona información sobre el tiempo ACTUAL","Un pronóstico a 24 horas","Un instrumento de medición"],1,"METAR (Informe de aeródromo meteorológico): es una observación meteorológica que proporciona información sobre el tiempo ACTUAL.","Meteorología");
Q("tec2","¿Qué es la INVERSIÓN TÉRMICA?",["El enfriamiento nocturno","Condición de la atmósfera por la cual la temperatura AUMENTA con la altura en vez de disminuir","El calentamiento del aire en verano","El cambio de estación"],1,"INVERSIÓN TÉRMICA: condición de la atmósfera por la cual la temperatura aumenta con la altura en vez de disminuir (interrupción de la gradiente vertical de temperatura).","Meteorología");

Q("tec3","¿Qué es la navegación aérea?",["El control del tráfico","La técnica de planificar y efectuar un vuelo de manera de estar permanentemente ubicado respecto al terreno o mantenerse en las rutas aéreas siguiendo los rumbos correspondientes","El pilotaje automático","La comunicación con la torre"],1,"Navegación aérea: técnica de planificar y efectuar un vuelo de manera de estar permanentemente ubicado con respecto al terreno o, si el vuelo se efectúa sobre rutas aéreas, poder mantenerse en ellas siguiendo los rumbos correspondientes.","Navegación");
Q("tec3","¿Cuál es la sigla del aeropuerto de Santiago?",["STG","SCL (Arturo Merino Benítez)","SAN","CHI"],1,"Santiago: aeropuerto Arturo Merino Benítez, sigla SCL. Otros: Concepción/Carriel Sur CCP · Puerto Montt/El Tepual PMC · Punta Arenas/Carlos Ibáñez del Campo PUQ · Antofagasta/Cerro Moreno ANF · Iquique/Diego Aracena IQQ · Arica/Chacalluta ARI · Calama/El Loa CJC.","Navegación");
Q("tec3","¿Cuál es la sigla del aeropuerto de Punta Arenas?",["PMC","PUQ (Carlos Ibáñez del Campo)","PNT","BBA"],1,"Punta Arenas: aeropuerto Carlos Ibáñez del Campo, sigla PUQ. Puerto Natales/Teniente Julio Gallardo PNT · Balmaceda BBA · Coyhaique/Teniente Vidal CYQ · Puerto Montt/El Tepual PMC.","Navegación");
Q("tec3","¿Cuál es la sigla del aeropuerto internacional de Lima?",["LMA","LIM (Jorge Chávez)","PER","EZE"],1,"Lima: aeropuerto Jorge Chávez, sigla LIM. Buenos Aires: Ministro Pistarini EZE y Aeroparque AEP · Mendoza/El Plumerillo MDZ · Montevideo/Carrasco MVD · Miami MIA · Córdoba/Ing. Ambrosio Taravella COR.","Navegación");
Q("tec3","¿Cuántos grados corresponden al OESTE en los puntos cardinales?",["000°","090°","180°","270°"],3,"Puntos cardinales: NORTE 000° · ESTE 090° · SUR 180° · OESTE 270°.","Navegación");
Q("tec3","¿Qué es la navegación OBSERVADA o VISUAL?",["La que usa GPS","La que se realiza utilizando una carta geográfica con referencias visuales como un cerro, un río, un pueblo o un camino","La que usa radioayudas","La que hace el piloto automático"],1,"Navegación observada o visual: es aquella que se realiza utilizando una carta geográfica, con referencias visuales como un cerro, un río, un pueblo, un camino, etc.","Navegación");
Q("tec3","¿Qué es la navegación ESTIMADA?",["La que se hace de memoria","Aquella en que el piloto, en relación a la velocidad a la que vuela, determina el tiempo que tardará en un tramo, dando una estimada horaria al próximo punto","La navegación por satélite","La navegación visual"],1,"Navegación estimada: el piloto, en relación a la velocidad a la cual está volando, determina el tiempo que va a tardar en un tramo, dando una estimada horaria al próximo punto que tiene trazado o quiere alcanzar.","Navegación");
Q("tec3","¿Qué son los MERIDIANOS?",["Círculos paralelos al Ecuador","Líneas de referencia que van del polo norte al polo sur; 180 hacia el este y 180 hacia el oeste del meridiano 0 (Greenwich)","Las rutas aéreas","Las líneas de igual presión"],1,"MERIDIANOS: líneas de referencia que van desde el polo norte al polo sur. Se trazaron 180 meridianos hacia el este y 180 hacia el oeste del meridiano 0 o meridiano de Greenwich. Son la mitad de un círculo cuyos planos pasan por el centro de la tierra (partes de un círculo máximo). Los PARALELOS son circunferencias paralelas al Ecuador.","Navegación");
Q("tec3","¿Cuánto demora la rotación de la tierra y en qué sentido se realiza?",["24 horas exactas, de este a oeste","23 horas 56 minutos y 4 segundos, en sentido de OESTE A ESTE","12 horas, de norte a sur","365 días"],1,"ROTACIÓN: movimiento que efectúa la tierra en torno a su eje en 23 horas 56 min y 4 seg, constituyendo un día completo; se realiza en el sentido de OESTE A ESTE. TRASLACIÓN: movimiento alrededor del sol en órbita elíptica, en 365 días 4 hrs y 48 min (un año).","Navegación");
Q("tec3","¿Qué es la variación magnética?",["La diferencia entre rumbo y curso","El ángulo o diferencia formado entre el norte verdadero (polo norte geográfico) y el norte magnético","La desviación por el viento","El error del altímetro"],1,"VARIACIÓN MAGNÉTICA: es el ángulo/diferencia formado entre el NORTE VERDADERO (polo norte geográfico) y el NORTE MAGNÉTICO (polo norte magnético), ya que los polos geográficos no coinciden con los magnéticos.","Navegación");
Q("tec3","¿Cuál es la diferencia entre CURSO y RUMBO?",["Son sinónimos","El CURSO es la dirección de la línea que une dos puntos dibujada en una carta; el RUMBO es la dirección a la que apunta la nariz del avión (eje longitudinal)","El curso es magnético y el rumbo verdadero","El rumbo lo fija la torre"],1,"CURSO: dirección de la línea que une dos puntos seleccionados, dibujada en una carta y medida en grados en sentido de los punteros del reloj a partir del norte verdadero o magnético. RUMBO: dirección a la que apunta LA NARIZ DEL AVIÓN (eje longitudinal), medida en grados en el mismo sentido.","Navegación");
Q("tec3","¿Cuántos grados de longitud comprende un huso horario?",["10 grados","15 grados","20 grados","30 grados"],1,"Considerando que la tierra gira de W a E una vez en 24 hrs, se convino internacionalmente que CADA 15 GRADOS de longitud habrá una hora de diferencia. Esa extensión de territorio recibe el nombre de huso horario. Existen 12 husos horarios a cada lado del meridiano 0.","Navegación");
Q("tec3","Al desplazarse hacia el OESTE respecto de la hora UTC, ¿qué se hace con las horas?",["Se suman","Se restan","No cambian","Se duplican"],1,"OESTE: se deben RESTAR. ESTE: se deben SUMAR. La hora de referencia es el Tiempo Universal Coordinado (UTC).","Navegación");
Q("tec3","¿Qué es el meridiano 180?",["El meridiano de Greenwich","El meridiano internacional de fecha: según el sentido en que nos desplazamos, ganamos o perdemos un día al cruzarlo","El ecuador","El límite de la troposfera"],1,"El meridiano 180 es denominado MERIDIANO INTERNACIONAL DE FECHA, ya que según sea el sentido en que nos desplazamos, ganamos o perdemos un día al cruzar ese meridiano.","Navegación");
Q("tec3","¿Por qué se estandarizó el uso de la hora UTC en la aviación?",["Por costumbre británica","Para evitar errores en los servicios de aviación: se usa en relojes de cockpit, equipos de navegación, cartas aeronáuticas y oficinas de control de tránsito aéreo","Para simplificar los horarios comerciales","Por exigencia de IATA"],1,"A fin de evitar errores en los servicios de aviación se ha estandarizado el uso de la hora UTC en los relojes de los cockpits, equipos de navegación, cartas aeronáuticas y oficinas de servicios de control de tránsito aéreo.","Navegación");
Q("tec3","¿Cuál es la diferencia entre VFR e IFR?",["VFR es de día e IFR de noche","VFR son reglas de vuelo VISUAL apoyadas en carta de vuelo visual; IFR son reglas de vuelo INSTRUMENTAL apoyadas en carta de aerovías y requieren habilitación","VFR es nacional e IFR internacional","VFR es para aviones pequeños solamente"],1,"VFR (Visual Flight Rules): reglas de vuelo visual, se apoyan con una carta de vuelo visual; normalmente las realizan pilotos con poca experiencia. IFR (Instrumental Flight Rules): reglas de vuelo instrumental, se apoyan con una carta de aerovías; para volar por instrumentos los pilotos deben contar con una HABILITACIÓN.","Navegación");
Q("tec3","¿Qué instrumento mide la «razón de ascenso o descenso» en pies por minuto?",["Altímetro","Variómetro","Horizonte artificial","Anemómetro"],1,"VARIÓMETRO: indicador de velocidad vertical expresada en «razón de ascenso o descenso» en pies por minuto. ALTÍMETRO: mide niveles de presión interpretando la distancia vertical entre el avión y una referencia. HORIZONTE ARTIFICIAL (indicador de actitud): señala la posición del avión con relación al horizonte terrestre.","Navegación");
Q("tec3","¿Qué es el ILS?",["Un sistema de aterrizaje instrumental compuesto por transmisores en tierra y receptores en el avión","Un sistema de comunicación","Un radar meteorológico","Un tipo de aerovía"],0,"ILS (Instrumental Landing System): equipo compuesto por transmisores en tierra y receptores en el avión. Las estaciones de radioayudas proporcionan información de dirección y/o distancias hacia esas emisoras, están indicadas en las cartas y permiten hacer uso de aerovías en vuelos instrumentales.","Navegación");
Q("tec3","¿Qué es un aeródromo de alternativa?",["El aeropuerto de origen","Aquel especificado en el plan de vuelo al que puede dirigirse una aeronave cuando no sea aconsejable o posible aterrizar en el de destino","Un aeropuerto militar","Una pista de emergencia"],1,"AERÓDROMO DE ALTERNATIVA: es aquel especificado en el plan de vuelo, al que puede dirigirse una aeronave cuando no sea aconsejable o posible aterrizar en el aeródromo de destino.","Navegación");
Q("tec3","¿Qué diferencia a un AEROPUERTO de un aeródromo?",["El tamaño de la pista","El aeropuerto dispone de los servicios adecuados para la llegada y salida de aeronaves desde y hacia otros países: policía internacional, aduanas y SAG","El número de vuelos diarios","Que tiene torre de control"],1,"AEROPUERTO: aeródromo que dispone de los servicios adecuados para la llegada y salida de aeronaves desde y hacia otros países: policía internacional, servicio de aduanas y servicio agrícola y ganadero (SAG). PISTA: área dispuesta para el despegue y aterrizaje. PLATAFORMA: área destinada al estacionamiento de aeronaves.","Navegación");
Q("tec3","¿Qué es el S.A.R. y de quién depende?",["El servicio de extinción de incendios de la DGAC","El Servicio Aéreo de Rescate, que efectúa búsqueda, salvamento y rescate; depende de la Fuerza Aérea de Chile","El control de tránsito aéreo","El servicio meteorológico"],1,"S.A.R. (Servicio Aéreo de Rescate): tiene como función efectuar tareas o misiones tendientes a la búsqueda, salvamento y/o rescate de aeronaves o personas extraviadas, accidentadas y/o siniestradas. DEPENDE DE LA FUERZA AÉREA DE CHILE.","Navegación");
Q("tec3","¿Qué es el S.E.I. y de quién depende?",["El Servicio de Seguridad y Extinción de Incendio, dependiente de los servicios de tránsito aéreo (DGAC)","El servicio de rescate de la FACh","Un servicio privado del aeropuerto","El servicio de emergencias médicas"],0,"S.E.I. (Servicio de Seguridad y Extinción de Incendio): organismo dependiente de los servicios de tránsito aéreo (DGAC), cuya misión es efectuar tareas de extinción de incendio, ayuda, apoyo y rescate en tierra a cualquier aeronave operando dentro de ese aeródromo.","Navegación");
Q("tec3","¿Qué es el «Walk Around» en la terminología aeronáutica?",["Caminar por la cabina","La inspección exterior del avión","El recorrido de los pasajeros","La ronda del personal de seguridad"],1,"Terminología frecuente: Runway = pista · Ramp = rampa · Control Tower = torre de control · WALK AROUND = INSPECCIÓN EXTERIOR DEL AVIÓN · Lobby = área de espera · Immigration = policía internacional.","Navegación");
Q("tec3","¿Qué comprenden los servicios de tránsito aéreo?",["Solo el control de aeródromo","Información de vuelo, alerta (trabaja con el SAR), notificación de tránsito aéreo, control de área, control de aproximación y control de aeródromo","Solo el control de área","La meteorología y la navegación"],1,"Los servicios de tránsito aéreo comprenden: servicio de información de vuelo, servicio de alerta (trabaja con el SAR), servicio de notificación de tránsito aéreo, servicio de control de área, servicio de control de aproximación (llegada y salida) y servicio de control de aeródromo. En Chile los presta la DGAC.","Navegación");

/* ================= TARJETAS DE REPASO · ETAPA 2 ================= */
/* EGA */
C("ega1","Turbulencia: los 3 niveles","LIGERA: líquidos se agitan sin salpicar, trolleys manejables · MODERADA: líquidos salpican, difícil caminar · SEVERA: objetos lanzados, caminar imposible → TAC se sienta INMEDIATAMENTE donde esté, no verifica pax, frena trolleys en el lugar.");
C("ega1","Tiempo Útil de Conciencia (TUC)","18.000 ft → 20 min · 22.000 ft → 10 min · 25.000 ft → 3 min · 30.000 ft → 1-2 min · 35.000 ft → 30 seg · 40.000 ft → 15 seg.");
C("ega1","Descompresión rápida","Signos: explosión/ruido, niebla, ráfaga de aire, caída de máscaras. Acción: máscara MÁS CERCANA + asegurarse + ordenar máscaras y cinturón. Sentados hasta «TRIPULACIÓN ALTITUD SEGURA». Lenta: despejar 4 filas (2 adelante, 2 atrás).");
C("ega1","Desembarque rápido","Orden TM: «TRIPULACIÓN DESEMBARQUE RÁPIDO». Sin toboganes, por manga o escalera. Pax salen SIN equipaje. Un TAC sale con ellos. Si escala a emergencia: «TRIPULACIÓN… EVACUAR, EVACUAR».");
C("ega1","UMR · Ubicación de Mínimo Riesgo","En todos los A320 es el centro de la PUERTA TRASERA DERECHA (4R). Antes de trasladar un objeto sospechoso: deslizar una tarjeta de seguridad debajo verificando que no tenga cables.");
C("ega2","Prioridades S-O-S","S: Sobrevivir al impacto (cinturón/arnés, CL o CP, posición de protección) · O: Orden de evacuación (con la orden de la TM) · S: Sobrevivir afuera (alejarse, grupo; ditching: inflar chaleco).");
C("ega2","ATTENTION CREW AT STATIONS","La TM está evaluando: ir a estaciones, guardar elementos, asegurar área, bloquear baños, puertas en automático y esperar. «PERMANECER SENTADOS» = no habrá evacuación. «EVACUAR EVACUAR» = evacuación inmediata.");
C("ega2","Los 90 segundos","Tiempo máximo de evacuación, porque tras un accidente con fuego el aumento de temperatura, humo, gases tóxicos y fuego hacen imposible la supervivencia a partir de ese lapso.");
C("ega2","Órdenes de evacuación · TIERRA","«SUELTEN CINTURONES… DEJEN TODO / RELEASE SEAT BELTS… LEAVE EVERYTHING» · «SALGAN POR ACÁ… SALTEN, SALTEN / GET OUT THIS WAY… JUMP, JUMP» · A los 2 primeros: «USTED Y USTED, AYUDEN ABAJO».");
C("ega2","Órdenes de evacuación · AGUA","«PÓNGASE EL CHALECO SALVAVIDAS / PUT LIFE VEST ON» · «SUELTEN CINTURONES, DEJEN TODO» · «SALGAN POR ACÁ, INFLEN EL CHALECO / GET OUT THIS WAY, INFLATE LIFE VEST» (con balsa: SUBAN A LA BALSA).");
C("ega2","Salida no habilitada","«SALIDA BLOQUEADA… SALGAN POR ALLÁ / BLOCKED EXIT… GO THAT WAY». Una salida no está habilitada si se atascó, el tobogán no se infló ni manualmente, no está en posición segura, está dañado o hay peligros externos.");
C("ega3","Posición de detención","Posición de un TAC o ABP para contener el flujo mientras se habilita la salida: sujetarse, mano abierta en señal de detención y ordenar «DETÉNGASE - STOP».");
C("ega3","Después de la evacuación","Alejar a los pax de combustible, fuego y vehículos · llevarlos a área segura · mantenerlos juntos y CONTARLOS · asistir heridos. La tripulación es responsable hasta ser relevada por los servicios de rescate.");
C("ega3","Ditching","Detectar agua → «PÓNGASE EL CHALECO». Desconectar tobogán (FOR DITCHING ONLY). Usar el tobogán como flotación: buscar el cuchillo «Knife» y cortar el mooring line. Sector alar: instalar cuerda y engancharla en el ala.");
C("ega4","TESTI","T Tipo de emergencia (forzoso o ditching) · E Evacuación necesaria (en ditching se asume que sí) · S Señal de evacuación (PA y/o Evac Command) · T Tiempo disponible (crítico) · I Información adicional.");
C("ega4","7 pasos de preparación de cabina","1 TESTI · 2 Fraseología (luces al máximo) · 3 ABP · 4 Cabina · 5 Aviso «PRÓXIMOS AL ATERRIZAJE» (2.000 ft, 2 min antes) · 6 «BRACE FOR IMPACT» (500 ft, 30 seg antes) · 7 Después del contacto.");
C("ega4","ABP · números clave","2 ABP por cada PUERTA · 1 ABP por cada salida del SECTOR ALAR. Se sientan en asiento de pasillo cercano a la puerta (o adyacente a la salida alar). El tobogán se infla en 10 segundos.");
C("ega5","Sellos de botiquines","VERDE: operativo · AMARILLO: verificar con la TM en el libro de vuelo · ROJO: fue utilizado y hay elementos bajo stock mínimo. MK: solo personal de salud con autorización del comandante. FAK: puede abrirlo la TC.");
C("ega5","Chalecos salvavidas","Pasajeros AMARILLO · Tripulación ROJO FOSFORESCENTE. Adulto: infante de MÁS de 15 kg (cinta entre las piernas). Infante (Aeromarine/Switlik/Hoover): MENOS de 15 kg, con cuerda para amarrar al adulto. Se infla AL SALIR del avión.");
C("ega5","ELT","Emite 48 HORAS. Frecuencias 243 y 121.5 MHz (bip corto) y 406.25 MHz (bip largo, COSPAS-SARSAT). El sello soluble libera la antena ~5 min en el agua. Se apaga sacándolo del agua e invirtiéndolo (o switch en OFF).");
C("ega5","Extintores de halón","Duración 6 a 8 segundos (Kidde con manómetro: 8 a 10) · Alcance ~2 metros · Apuntar a la BASE del fuego y descargar la totalidad. Chequeo: manómetro en verde, pin insertado, sello intacto y vigencia.");
C("ega5","PBE · los tres modelos","AIR LIQUIDE: indicador VERDE operativo / ROJO no operativo, 15 min · DRÄGER: cinta amarilla pre cortada INTACTA = operativo, 20 min · SCOTT/AVOX: indicador NO EN ROSADO = operativo (gris o blanco sirve), 15 min.");
C("ega5","Oxígeno portátil","Capacidad 310 litros. HI: 4 lts/min, 75 min, adulto · LOW: 2 lts/min, 150 min, infante · HI+LO: 6 lts/min, 50 min, 2 personas. Dejar remanente de 500 PSI. Chequeo: 1500 PSI primer vuelo, 1200 PSI siguientes.");
C("ega6","Tetraedro del fuego","Combustible (reductor) + Oxígeno (comburente) + Calor + Reacción en cadena. Extinción: sofocación (quitar O₂), enfriamiento (agua), remoción (quitar combustible) e INHIBICIÓN de la reacción en cadena (halón).");
C("ega6","Roles en el combate del fuego","ATACANTE: identifica, se protege (PBE) y ataca · INFORMANTE: avisa a la TM (quién/dónde, ubicación, fuente, severidad, progreso, N° de extintores, hace cuánto) · ASISTENTE: provee equipo y reemplaza al atacante · SOPORTE: reubica pax y da primeros auxilios.");
C("ega6","Batería de litio en llamas","Halón sobre las llamas → verter AGUA o líquido NO alcohólico para enfriar → con guantes, sumergir el PED en un recipiente con agua → guardarlo en el BAÑO POSTERIOR → bloquear el baño y vigilar. El humo es tóxico a los ~90 segundos.");
/* MP */
C("mp1","NOTOC","Notificación de cargas especiales al capitán, por escrito antes de la salida. Requieren NOTOC: DGR (mercancías peligrosas), AVI (animales vivos), HUM (restos no cremados), HEG (huevos fértiles), LHO (órganos) y HEA (más de 90 kilos).");
C("mp3","Las 9 clases de MP","1 Explosivos · 2 Gases (2.1 inflamables, 2.2 no inflamables no tóxicos, 2.3 tóxicos) · 3 Líquidos inflamables (60 °C) · 4 Sólidos inflamables (4.1, 4.2 pirofórico, 4.3 con agua) · 5 Oxidantes y peróxidos · 6 Tóxicos e infecciosos · 7 Radiactivos · 8 Corrosivos · 9 Misceláneos.");
C("mp3","Identificación de MP","Asignar el N° ONU (UN Number, 4 dígitos) y el nombre apropiado de expedición. El ID 8000 se usa cuando la MP NO está clasificada por el comité de expertos de la ONU.");
C("mp4","Baterías de litio del pasajero","Hasta 100 Wh y 12 V: permitidas. Repuestos: máximo 2 por persona, protegidas, SOLO en cabina. PMED (médicos): entre 100 y 160 Wh, litio entre 2 y 8 g. Silla de ruedas con ion litio: máx. 300 Wh (o 2 de 160 Wh).");
C("mp4","MP prohibidas al pasajero","Armas de electrochoque (Taser) · Gas pimienta y elementos discapacitadores · Equipaje con baterías no extraíbles sobre 0,3 g de metal litio o 2,7 Wh · Maletines de seguridad con baterías de litio o material pirotécnico. Prohibidos en persona, mano y bodega.");
C("mp4","Códigos de la Tabla 2.3A","El piloto al mando debe estar informado de la ubicación de: OXYG (oxígeno), WCLB (silla con ion litio), WCBD (batería no derramable) y WCBW (batería derramable). Anexo A: autorización del explotador (3 copias: pax, explotador, AVSEC).");
C("mp6","Compartimientos de carga","A: fácil acceso, se puede actuar · B: acceso con extintor manual + detector · C: detector + sistema integral desde el cockpit · D: controla el fuego LIMITANDO EL OXÍGENO · E: solo aviones de carga.");
C("mp6","Derrame de MP en tierra","AÍSLE (alejar personas) · EVALÚE (NOTOC, detalles del derrame) · ACTÚE (centro de coordinación, SSEI) · REPORTE. Claves alfabéticas clave: W = si se moja emite gases venenosos (NUNCA agua) · P = veneno · S = pirofórico · X = comburente.");
/* AVSEC */
C("av1","Convenios clave","CHICAGO 1944: crea la OACI (sede Montreal, 193 Estados) · TOKIO 1963: delitos a bordo y facultades del comandante · MONTREAL 1999: responsabilidad de aerolíneas (reemplaza Varsovia 1929) · ANEXO 17 (1974): protección contra interferencia ilícita.");
C("av2","Retenidos vs Prohibidos","RETENIDOS: no pueden ir en cabina pero SÍ en bodega, sin acceso durante el vuelo. PROHIBIDOS (requisados): no deben subir al avión de ninguna forma (cortaplumas, cuchillos, tijeras, palillos, punzones).");
C("av3","Códigos de emergencia","7500: secuestro o amenaza · 7600: fallo de radio · 7700: emergencia general. CÓDIGO BRAVO: asustar deliberadamente para identificar la amenaza real · CÓDIGO ADAM: niño desaparecido.");
C("av3","Objeto sospechoso a bordo","NO manipular, no cortar cables, no abrir, no levantar. Informar al capitán: ubicación exacta y descripción (tamaño, color, olor, forma). Alejar a los pax AL MENOS 4 FILAS, cabezas cubiertas y bajas, PED apagados. Trasladar a la UMR (4R).");
/* RAE */
C("rae1","Jerarquía normativa DGAC","DAR: «ley», reglamentos mandatorios; solo los modifica el PRESIDENTE DE LA REPÚBLICA · DAN: norma técnica u operacional; solo la modifica el DIRECTOR DE LA DGAC · DAP: procedimientos · DAC: circulares.");
C("rae1","Reglamentos que debes ubicar","DAR 01 licencias personal · DAR 63 / DAN 63 licencias tripulación excepto pilotos · DAR 06 operación de aeronaves · DAR 17 interferencia ilícita · DAR 18 mercancías peligrosas · DAN 121 operación de vuelos · DAN 152 SMS · DAN 13-01 SARSEV.");
C("rae2","Licencia TAC: números clave","Edad mínima 18 años · Máximo 3 habilitaciones (+1 si es de la misma familia) · Experiencia reciente: 3 despegues y 3 aterrizajes cada 90 días por habilitación · Verificación de competencias ante DGAC cada 3 años (DAN 121: anual).");
C("rae3","Fórmula del PSV","PSV = 1 hora antes del ETD + TIEMPO DE VUELO + 30 min de debriefing. Ejemplo: TV 7:00 → PSV 8:30. Máximos: jornada ordinaria 12 h (extensible a 14) · jornada especial 20 h en 24 h. Límites: 160 mes / 450 trimestre / 1600 año.");
C("rae3","Tabla PSV → PD","7 h o menos → 10 · 8 → 11 · 9 → 12 · 10 → 13 · 11 → 14 · … · 20 → 24. Cambio de longitud de 45° = +2 horas de PD, y +30 min por cada 15° adicionales. Período nocturno: 21:00 a 06:00.");
C("rae3","Ley 20.321 · números","Rol de vuelo con 5 días de anticipación · máximo 18 noches fuera de base · hasta 5 días continuos → 2 días de descanso; de 6 a 10 días → 4 días · nunca más de 10 días continuados · 106 horas de descanso mensual (4 días con sábado y domingo).");
/* FH */
C("fh2","Más tres / Menos ocho","El 80% de todos los accidentes ocurre en los 3 primeros minutos de vuelo y los 8 últimos: 11 minutos críticos. Causas: 50% fallo del piloto, 22% mecánico, 12% meteorología, 9% sabotajes, 7% otras.");
C("fh2","Los 3 conceptos de todo accidente","SECUENCIA DE EVENTOS (hechos encadenados en orden lógico) · PRECEDENTE CONOCIDO (si un factor produjo un accidente y no se corrige, se repetirá) · RELACIÓN HOMBRE-MÁQUINA-MEDIO AMBIENTE.");
C("fh3","Hombre - Máquina - Medio Ambiente","El HOMBRE realiza «acciones con falta de seguridad» · La MÁQUINA posee «condiciones mecánicas inseguras» · El MEDIO AMBIENTE aporta «condiciones físicas inseguras». Entre 70% y 80% de los accidentes se deben al error humano.");
C("fh4","Comunicación efectiva","Barreras FÍSICAS: ruido, tono, fatiga, sueño, hambre, conectividad, barbijo · PSICOSOCIALES: resentimiento, preocupación, status, prejuicios, creencias, dogmatismo, idioma. ASERTIVIDAD: punto medio entre pasividad y agresividad.");
C("fh5","Estilos de líder","DOMINANTE: resultados, dirige, cambios rápidos, aprende actuando · LÓGICO: innovación, explica, cambios cuidadosos, estudia · INSPIRADOR: oportunidades, confianza, cambios radicales, pregunta · APOYADOR: facilita, participa, cambios lentos, escucha.");
C("fh5","Liderazgo situacional","DIRECTIVO: tarea, comunicación unidireccional · PERSUASIVO: tarea + equipo, «vende» la idea, bidireccional · PARTICIPATIVO: colaboradores, consulta y decide · DELEGATIVO: grupo maduro, delega la decisión y ellos asumen la responsabilidad.");
C("fh6","Conciencia situacional","Nivel 1 PERCEPCIÓN → Nivel 2 COMPRENSIÓN → Nivel 3 PROYECCIÓN. Influyen: atención, memoria de trabajo, estrés y fatiga. Pérdida: ambigüedad, fijación de la atención y confusión. Defensas: briefings, procedimientos, equipo y comunicación eficaz.");
C("fh6","Toma de decisiones","ANALÍTICA: percibir el problema, pedir información, escuchar opiniones, usar recursos, elegir y evaluar. INTUITIVA/AUTOMÁTICA: emergencias, sin tiempo de análisis, basada en entrenamiento, experiencia y procedimientos. Barreras: calidad de información, tiempo y sesgos.");
/* TEC */
C("tec1","Ejes y controles primarios","ALERONES → alabeo (roll) → eje LONGITUDINAL · TIMÓN DE PROFUNDIDAD → cabeceo (pitch) → eje transversal · TIMÓN DE DIRECCIÓN → guiño (yaw) → eje VERTICAL.");
C("tec1","Las 4 fuerzas del vuelo","SUSTENTACIÓN (lift, arriba) · PESO (weight, abajo) · TRACCIÓN (thrust, adelante) · RESISTENCIA AL AVANCE (drag, atrás). STALL = pérdida brusca de sustentación por excesivo ángulo de ataque.");
C("tec1","Superficies secundarias","FLAPS y SLATS: hipersustentadores, aumentan superficie y curvatura para volar lento en despegue y aterrizaje. SPOILERS: DISMINUYEN la sustentación; como Speed Brakes en el descenso de emergencia para alcanzar los 10.000 pies.");
C("tec2","Atmósfera estándar","Nivel medio del mar · latitud 45° · 15 °C · 29.92 pulgadas de mercurio = 1013.2 hPa = 760 mm Hg = 14.7 psi. Aire: 78% nitrógeno, 21% oxígeno, 1% otros gases + vapor de agua variable.");
C("tec2","Niebla vs Neblina","NIEBLA: visibilidad MENOR a 1.000 m, gran humedad, color gris. NEBLINA: visibilidad MAYOR de 1.000 m y MENOR a 3.000 m.");
C("tec2","Frente frío vs frente caliente","FRÍO: nubosidad cumuliforme, techo medio alto, buena visibilidad, TURBULENCIA, tormentas, granizo. CALIENTE: estratos y nimbostratos, techo bajo, visibilidad restringida, SIN turbulencia, aire estable, llovizna.");
C("tec2","Causas de turbulencia","Corrientes convectivas · obstrucción al flujo del viento (mecánica) · ONDA MONTAÑA (Cordillera de los Andes) · WINDSHEAR · cumulonimbos (la peor: el centro de un CB) · JETSTREAM, que produce turbulencia de aire claro sobre 15.000 pies.");
C("tec3","Husos horarios","Cada 15° de longitud = 1 hora. 12 husos a cada lado del meridiano 0 (Greenwich). Al ESTE se SUMAN horas, al OESTE se RESTAN. El meridiano 180 es el internacional de fecha. La aviación usa hora UTC.");
C("tec3","Siglas de aeropuertos chilenos","SCL Santiago (Arturo Merino Benítez) · CCP Concepción · PMC Puerto Montt · PUQ Punta Arenas · ANF Antofagasta · IQQ Iquique · ARI Arica · CJC Calama · ZCO Temuco · ZAL Valdivia · LSC La Serena · BBA Balmaceda.");
C("tec3","SAR vs SEI","S.A.R. (Servicio Aéreo de Rescate): búsqueda, salvamento y rescate; depende de la FUERZA AÉREA DE CHILE. S.E.I. (Seguridad y Extinción de Incendio): extinción y rescate en tierra en el aeródromo; depende de los servicios de tránsito aéreo (DGAC).");


/* ================= A320 · HABILITACIÓN DE FLOTA ================= */
Q("a1","¿Cuál es el techo operacional del A320?",["35.000 pies","39.000 pies","41.000 pies","45.000 pies"],1,"A320: techo operacional 39.000 pies · velocidad crucero 880 km/hr · largo del fuselaje 39 mts · envergadura 34 mts · altura 3,40 mts. Autonomía de corto a mediano alcance, aproximadamente 6 horas.","A320 Día 1");
Q("a1","¿Cuál es la autonomía aproximada del A320?",["2 horas","4 horas","6 horas","10 horas"],2,"Los A320 son aviones de fuselaje angosto de 1 pasillo, con dos motores montados bajo las alas y autonomía de corto a mediano alcance: aproximadamente 6 HORAS.","A320 Día 1");
Q("a1","¿Qué es el sistema Fly by Wire del A320?",["Un sistema de comunicación por cable","Las superficies de control primarias y secundarias son eléctricamente controladas e hidráulicamente activas","Un piloto automático de emergencia","El sistema de entretenimiento a bordo"],1,"Los A320 utilizan el sistema FLY BY WIRE: las superficies de control primarias y secundarias son eléctricamente controladas e hidráulicamente activas. Los bastones laterales de mando (sidestick) controlan cabeceo, alabeo y virajes coordinados con el timón de dirección.","A320 Día 1");
Q("a1","¿Qué significa ECAM?",["Emergency Cabin Alert Monitor","Electronic Centralized Aircraft Monitoring: sistema de monitoreo en la cabina de mando","Electric Cabin Management","Engine Control And Monitoring"],1,"ECAM = Electronic Centralized Aircraft Monitoring. Es el sistema de monitoreo que el avión dispone en la cabina de mando (por ejemplo, ahí la TM verifica el estado de puertas y toboganes).","A320 Día 1");
Q("a1","¿Qué es el APU y dónde está ubicado?",["Un motor auxiliar en el ala","Una turbina ubicada en el empenaje que suministra energía eléctrica y neumática, y funciona en tierra y/o vuelo","La unidad de presurización","El sistema de oxígeno de emergencia"],1,"APU (Auxiliary Power Unit): turbina ubicada en el EMPENAJE del avión que suministra energía eléctrica y neumática. Funciona en tierra y/o vuelo, a requerimiento de los pilotos.","A320 Día 1");
Q("a1","¿Cómo se compone el tren de aterrizaje del A320?",["3 piernas principales y 1 de nariz","Tren principal de 2 piernas con frenos (se retracta hacia el centro) y tren de nariz de 1 pierna dirigible (se retracta hacia adelante)","4 piernas, todas dirigibles","2 piernas fijas"],1,"TREN PRINCIPAL: 2 piernas, con frenos, se retracta hacia el centro. TREN DE NARIZ: 1 pierna, dirigible, se retracta hacia adelante.","A320 Día 1");
Q("a1","¿Cómo es el sistema de combustible del A320?",["Un solo tanque central","Dos tanques en las alas y uno en el sector central del fuselaje; el carguío es a presión por el ala RH y NO tiene vaciado rápido","Cuatro tanques alares","Tanques en el empenaje"],1,"Combustible: dos tanques ubicados en las alas y uno en el sector central del fuselaje. El carguío se efectúa a presión por el ala RH (derecha). NO TIENE VACIADO RÁPIDO de combustible.","A320 Día 1");
Q("a1","¿Qué caracteriza a las bodegas del A320?",["Son 3 y no están presurizadas","Dos bodegas presurizadas más una pequeña llamada bulk (presurizada y calefaccionada), con acceso por el lado RH y sistema fijo de detección y extinción de fuego","Solo una bodega grande","Están en el empenaje"],1,"El A320 tiene DOS bodegas presurizadas y una bodega pequeña denominada BULK, presurizada y calefaccionada. Se ubican en la parte baja del fuselaje, con acceso por el lado RH, y están equipadas con sistema fijo de detección y extinción de fuego controlado desde la cabina de mando.","A320 Día 1");
Q("a1","¿Cuál es la fuente PRIMARIA de suministro eléctrico?",["El APU","Los generadores de los motores","El carro de tierra","Las baterías"],1,"Fuente primaria: los GENERADORES DE LOS MOTORES. Fuentes alternativas: el APU o el carro de tierra.","A320 Día 1");
Q("a1","A un nivel de vuelo de 39.000 pies, ¿cuál es la altitud de cabina del A320?",["4.000 pies","6.000 pies","8.000 pies","10.000 pies"],2,"La presión de cabina se controla automáticamente por las válvulas out flow. A un nivel de vuelo de 39.000 pies la altitud de cabina es de 8.000 PIES.","A320 Día 1");
Q("a1","¿Qué ocurre con la energía del botón PED en una descompresión de cabina?",["Se mantiene activa","Se corta automáticamente","Debe cortarla el TAC1","Solo se corta si lo ordena el Comandante"],1,"El VCC (Video Control Center) está ubicado en el OHB junto a la puerta 1L. Un botón PED controla el sistema de energía para usar computadores personales en los asientos con conector. EN DESCOMPRESIÓN DE CABINA SE CORTA AUTOMÁTICAMENTE la energía.","A320 Día 1");
Q("a1","En la configuración 186 del A320, ¿dónde están las salidas del sector alar?",["Filas 8 y 9","Filas 11 y 12 / 12 y 13","Filas 20 y 21","Filas 1 y 2"],1,"Configuración 186: jumpseat 2/3 · elemento de flotación cojín o chaleco · SECTOR ALAR filas 11 y 12 / 12 y 13 · máscaras de oxígeno: 1 adicional en todas las filas de asientos.","A320 Día 1");
Q("a1","¿Qué asientos NO tienen respaldo reclinable?",["Los de la última fila","Los ubicados en los accesos a la salida de emergencia","Los de primera fila","Los del pasillo"],1,"Equipamiento de los asientos: cinturón de seguridad, bandeja plegable, chaleco salvavidas o cojín, barra de retención para asegurar el equipaje de mano, y respaldos reclinables EXCEPTO los ubicados en los accesos a la salida de emergencia.","A320 Día 1");
Q("a1","¿Qué contiene el PSU sobre cada fila de asientos?",["Solo las luces de lectura","Señales de no fumar y cinturones, luz de lectura, botón y luz de llamada al TAC, parlantes, boquillas de aire y un generador químico de oxígeno","El detector de humo","El sistema de entretenimiento"],1,"El PSU (Passenger Service Unit) contiene: señales no fumar y abrochar cinturones, luz de lectura individual, botón y luz de llamada a TAC, parlantes y boquillas de aire individuales ajustables, y adicionalmente un compartimento con un GENERADOR QUÍMICO DE OXÍGENO.","A320 Día 1");
Q("a1","¿Qué se verifica en el chequeo pre-vuelo del galley?",["Solo la limpieza","Seguros operativos, frenos de carros operativos, circuit breakers operativos, tapa de basurero operativa y sin elementos extraños","Los hornos encendidos","El stock de catering"],1,"Chequeo pre-vuelo del galley: seguros operativos, frenos de carros operativos, circuit breakers operativos, tapa de basurero operativa y sin elementos extraños.","A320 Día 1");
Q("a1","¿Dónde está instalado el detector de humo del baño?",["En la puerta","Detrás de la rejilla del techo, para monitorear el aire extraído","Bajo el lavamanos","En el basurero"],1,"El aire usado se extrae por una rejilla en el techo del baño y se descarga al exterior. DETRÁS DE LA REJILLA está instalado un detector de humo para monitorear el aire extraído; si hay humo se activa una alerta visual y auditiva.","A320 Día 1");
Q("a1","¿Qué señal auditiva produce la activación del detector de humo en cabina?",["Un chime simple HI","Triple chime LO repetitivo por 30 segundos en los parlantes de cabina","Una sirena continua","El sonido del EVAC"],1,"Al activarse el detector de humo: señales auditivas y visuales en cabina de mando, TRIPLE CHIME LO REPETITIVO (30 segundos) en parlantes de cabina, luz roja intermitente y texto fijo en todos los AIP, luz ámbar intermitente en el ACP del área afectada y afuera del baño afectado, e indicación en el botón SMOKE RESET del FAP y AAP.","A320 Día 1");
Q("a1","¿Qué hacen los botones Reset o Smoke Reset?",["Apagan el detector","Silencian las señales AUDITIVAS; las visuales se apagan cuando cesa el humo en el ducto","Desactivan el extintor","Reinician el CIDS"],1,"Los botones Reset o Smoke Reset SILENCIAN LAS SEÑALES AUDITIVAS. Las señales visuales se apagan cuando cesa el humo en el ducto.","A320 Día 1");
Q("a1","¿Cómo es el extintor fijo del baño?",["Un cilindro portátil","Una esfera roja con halón/freón sobre el compartimiento de basura, con 1 tubo de descarga hacia el basurero y manómetro que debe estar en rango verde","Un sistema de agua","Una manta ignífuga"],1,"Extintor fijo ubicado SOBRE el compartimiento de basura: esfera roja que contiene halón/freón, con 1 tubo de descarga hacia el compartimento de basura. Cuenta con manómetro que debe estar en RANGO VERDE para asegurar su correcta operación.","A320 Día 1");
Q("a1","¿Qué caracteriza al JUMPSEAT GIRATORIO?",["Está en el galley posterior","El respaldo y asiento están plegados hacia la pared lateral del baño; debe usarlo un TC en despegue y aterrizaje para mantener control visual de la cabina","No tiene arnés","Es para pasajeros"],1,"El jumpseat giratorio tiene respaldo y asiento plegados hacia la pared lateral del baño Le. Debe ser utilizado por un TC durante DESPEGUE Y ATERRIZAJE para mantener CONTROL VISUAL DE LA CABINA. El jumpseat estándar tiene el respaldo adosado a la pared (90°), sin reclinación.","A320 Día 1");
Q("a1","En el jumpseat retráctil, ¿qué es el seguro TTL?",["Un seguro del cinturón","Taxi, Take off and Landing: se baja quedando a la vista una indicación amarilla, tras verificar baño desocupado y puerta cerrada","El seguro del arnés","Un dispositivo de emergencia"],1,"TTL = Taxi, Take off and Landing. Para el jumpseat retráctil: verificar que el baño esté desocupado, verificar puerta cerrada, bajar el seguro TTL (queda a la vista una indicación amarilla) y girar el seguro del JMP a posición vertical para liberar el asiento.","A320 Día 1");
Q("a1","¿Cuál es el chequeo pre-vuelo del jumpseat?",["Solo el cinturón","Plegado automático del asiento, cinturón y arnés operativos, y equipo de emergencia asociado","La altura del asiento","La reclinación"],1,"Chequeo pre vuelo del jumpseat: plegado automático del asiento, cinturón y arnés operativos, y equipo de emergencia asociado.","A320 Día 1");

Q("a2","¿Qué es el CIDS?",["El sistema de comunicaciones externas","Cabin Intercommunication Data System: opera, controla y monitorea los sistemas principales de la cabina","El control de puertas","El sistema de oxígeno"],1,"CIDS (Cabin Intercommunication Data System) opera, controla y monitorea los sistemas principales de la cabina y provee verificaciones de sistemas. Está conectado a: aire acondicionado, comunicaciones, protección de fuego, iluminación, y agua y desechos.","A320 Día 2");
Q("a2","¿Qué es el FAP y qué dos tipos existen?",["El panel del piloto; digital y analógico","Forward Attendant Panel: permite controlar sistemas de cabina y verificar su estatus mediante el CIDS; puede ser pantalla táctil (touch screen) o pantalla rígida de botones","El panel de puertas","El panel de emergencia"],1,"El FAP (Forward Attendant Panel) permite a la tripulación controlar ciertos sistemas de cabina y verificar su estatus mediante el CIDS. Puede ser: a) pantalla táctil o touch screen, b) pantalla rígida o de botones.","A320 Día 2");
Q("a2","¿Qué página del FAP sobre-comanda cualquier otra?",["CABIN STATUS","La página SMOKE ante una alerta de humo","DOORS/SLIDES","TEMPERATURE"],1,"Si el CIDS recibe un mensaje importante, la página del sistema relacionado aparece automáticamente. Una ALERTA DE HUMO despliega la página SMOKE y SOBRE COMANDA CUALQUIER OTRA PÁGINA.","A320 Día 2");
Q("a2","¿Cuáles son los tres estados del botón CABIN READY?",["Rojo, amarillo y verde","Inactivo (tenue), activo (oscuro) y presionado (verde)","Encendido y apagado","Fijo e intermitente"],1,"El botón CABIN READY tiene tres estados: inactivo (tenue), activo (oscuro) y presionado (VERDE). En la etapa correspondiente, previo al despegue y previo al aterrizaje, estando activo debe presionarse para reportar CABIN READY a la cabina de mando.","A320 Día 2");
Q("a2","En el sub panel del FAP, ¿qué hace el botón EMER?",["Llama a emergencias","Activa el sistema de iluminación de emergencia","Silencia la alarma de humo","Activa la evacuación"],1,"Hard keys del sub panel: EMER activa el sistema de iluminación de emergencia · PED POWER controla la energía para PC portátiles · LIGHTS MAIN ON/OFF · LAV MAINT (luces de baño a máxima intensidad) · SCREEN 30 SECs LOCK (modo pasivo para limpieza) · EVAC CMD · EVAC RESET · SMOKE RESET.","A320 Día 2");
Q("a2","¿Qué hace el botón EVAC RESET?",["Activa la evacuación","Silencia la señal auditiva de evacuación para las puertas Fwd","Cancela la orden del comandante","Reinicia el FAP"],1,"EVAC CMD activa la alerta de evacuación. EVAC RESET silencia la señal auditiva de evacuación para las puertas Fwd. SMOKE RESET silencia las señales auditivas de alarma de humo.","A320 Día 2");
Q("a2","¿Dónde está ubicado el AAP y qué controla?",["En el galley delantero; el catering","Al costado de la puerta 4L; iluminación del área de entrada posterior y de cabina, Evac Reset, Evac y Smoke Reset (en aviones CC)","En el cockpit; los motores","Junto al FAP; el agua"],1,"El AAP (Additional Attendant Panel) es un panel de switches ubicado al costado de la PUERTA 4L. Desde ahí se controlan adicionalmente: iluminación del área de entrada posterior, iluminación de cabina de pasajeros, Evac Reset, Evac y Smoke Reset (solo en aviones CC con pantalla Touch Screen).","A320 Día 2");
Q("a2","En el AIP, ¿qué significa una luz ROJA INTERMITENTE?",["Comunicación normal","Llamado de emergencia desde la cabina de mando, alarma de humo activada, falla en el sistema de succión o EVAC COMD activado","Llamada de pasajero","Sistema en prueba"],1,"AIP (Attendant Indication Panel): VERDE FIJA para información de comunicación normal. ROJA INTERMITENTE para llamado de emergencia desde la cabina de mando, alarma de humo activada, falla en sistema de succión y EVAC COMD activado.","A320 Día 2");
Q("a2","En el ACP, ¿qué luz es SIEMPRE fija y nunca intermitente?",["La luz roja de emergencia","La luz azul de llamada de pasajeros a TC","La luz ámbar de baño","La luz verde de interfonía"],1,"Los ACP (Area Call Panel) están en el techo sobre el pasillo. Las llamadas normales son fijas; en anormalidad o emergencia las luces son intermitentes. SOLAMENTE LA LUZ AZUL de llamada de pasajeros a TC será siempre fija, nunca intermitente.","A320 Día 2");
Q("a2","¿Entre qué temperaturas se puede seleccionar el aire acondicionado desde la cabina de mando?",["Entre 15 °C y 25 °C","Entre 18 °C y 30 °C","Entre 20 °C y 28 °C","Entre 16 °C y 32 °C"],1,"Hay tres selectores en la cabina de mando (cabina de mando, cabina FWD y cabina AFT) para controlar la temperatura entre 18 °C y 30 °C.","A320 Día 2");
Q("a2","¿Cuánto puede variar la temperatura desde el FAP respecto a la seleccionada en el cockpit?",["No se puede variar","Está limitada a 2,5 °C más o 2,5 °C menos","Hasta 5 °C","Sin límite"],1,"La variación de temperatura desde el FAP está limitada a 2,5 °C MÁS o 2,5 °C MENOS de la temperatura seleccionada en la cabina de mando.","A320 Día 2");
Q("a2","¿Cuál es la capacidad del tanque de agua y del estanque de desechos del A320?",["100 y 100 litros","200 litros de agua y 170 litros de desechos","300 y 250 litros","150 y 200 litros"],1,"El tanque de AGUA es de 200 LITROS, ubicado en la parte baja del fuselaje, presurizado con aire comprimido. El estanque de DESECHOS tiene capacidad de 170 LITROS. El agua de lavamanos y galleys drena al exterior por las válvulas DRAIN MASTS, calefaccionadas.","A320 Día 2");
Q("a2","¿Qué indica la luz SYSTEM INOP en el módulo Water and Waste?",["Falta de agua","Sistema de succión inoperativo","El baño está ocupado","El tanque está lleno"],1,"SYSTEM INOP con luz encendida indica SISTEMA DE SUCCIÓN INOPERATIVO. LAV XX INOP identifica el baño que está inoperativo.","A320 Día 2");
Q("a2","¿Cuántos interfonos hay en el A320?",["2 en total","3 en las estaciones de TC de las puertas + 1 en la cabina de mando","5 repartidos por la cabina","1 solo en el galley"],1,"El sistema de interfonía es una red telefónica: 3 INTERFONOS en las estaciones de TC ubicadas en las puertas y 1 INTERFONO en la cabina de mando. Se usa para llamados de TM a TC, de TC a TM y de TC a TC.","A320 Día 2");
Q("a2","¿Qué sonido se escucha en el COCKPIT cuando la TC llama?",["Un chime HI","Un chime LO","Una chicharra (buzzer)","Una campana doble"],2,"Los chimes son secuencias de tonos con sonido alto (HI) o bajo (LO) en los parlantes del área respectiva. El sonido que se escucha en el COCKPIT corresponde a una CHICHARRA (BUZZER). Esta señal auditiva se inhibe en despegue y aterrizaje.","A320 Día 2");
Q("a2","¿Cuáles son las prioridades del sistema PA?",["Cabina de pasajeros, cockpit, entretenimiento","1) Cockpit, 2) Cabina de pasajeros, 3) Sistema de entretenimiento","1) Entretenimiento, 2) Cockpit, 3) Cabina","Todas son iguales"],1,"Prioridades del sistema PA: 1) COCKPIT · 2) CABINA DE PASAJEROS · 3) SISTEMA DE ENTRETENIMIENTO. El PA se usa para anuncios desde el cockpit, desde las estaciones de TC y mensajes pregrabados (PRAM).","A320 Día 2");
Q("a2","¿Qué significan las dos posiciones del switch EVAC en la cabina de mando?",["ON y OFF","CAPT & PURS (activable desde el cockpit y desde el FAP) y CAPT (solo desde el cockpit)","ARM y DISARM","AUTO y MANUAL"],1,"El switch EVAC tiene 2 posiciones: CAPT & PURS (el EVAC command puede activarse desde la cabina de mando Y desde el FAP) y CAPT (solo puede activarse desde el cockpit).","A320 Día 2");
Q("a2","¿Cuáles son las intensidades de iluminación de cabina desde el AAP?",["Solo encendido y apagado","CABIN BRT 100%, CABIN DIM 1 ~50% y CABIN DIM 2 ~10% (igual para ENTRY)","25%, 50% y 75%","Tres niveles iguales al 33%"],1,"Desde el AAP: CABIN BRT = 100% de intensidad · CABIN DIM 1 = 50% aproximadamente · CABIN DIM 2 = 10% aproximadamente. Lo mismo para ENTRY BRT, ENTRY DIM 1 y ENTRY DIM 2.","A320 Día 2");
Q("a2","¿Cuándo se pueden encender o resetear todas las luces de lectura a la vez desde el FAP?",["En cualquier momento","Solo cuando el avión se encuentra EN TIERRA","Solo en vuelo","Solo durante el embarque"],1,"El encendido o reseteo de todas las luces de lectura a la vez es posible en el FAP TOUCH SCREEN SOLO CUANDO EL AVIÓN SE ENCUENTRA EN TIERRA. Botón R/L SET para encender todas y R/L RESET para apagarlas.","A320 Día 2");
Q("a2","¿Qué ocurre con las luces del baño cuando la puerta está DESASEGURADA?",["Se apagan todas","Los tubos fluorescentes se iluminan con intensidad reducida, la luz auxiliar se enciende y la luz del espejo se apaga","Se encienden a máxima intensidad","Parpadean"],1,"Un micro switch en el marco de la puerta monitorea si está asegurada. Cuando la puerta está DESASEGURADA: los tubos fluorescentes se iluminan con intensidad reducida, la luz auxiliar se enciende y la luz del espejo se apaga.","A320 Día 2");
Q("a2","En operación normal, ¿cuándo se encienden automáticamente las luces fijas Salida/Exit y los Exit Markers?",["Al cerrar las puertas","Cuando el tren de aterrizaje está abajo","Al despegar","Al iniciar el descenso"],1,"En operación normal: cuando el TREN DE ATERRIZAJE ESTÁ ABAJO se encienden automáticamente las luces fijas Salida/Exit y los Exit Markers.","A320 Día 2");
Q("a2","¿En qué casos se activa AUTOMÁTICAMENTE la iluminación de emergencia?",["Solo si lo ordena el comandante","Cuando la iluminación general no funciona o se corta el suministro eléctrico (con el switch del cockpit en ARM), y cuando hay pérdida de presión de cabina","Solo en tierra","Al abrir una puerta"],1,"Se activa automáticamente cuando la iluminación general no funciona o se corta el suministro eléctrico normal estando el switch del cockpit en ARM, y cuando hay PÉRDIDA DE PRESIÓN DE LA CABINA. También puede activarse manualmente desde el cockpit o con el botón EMER del FAP.","A320 Día 2");
Q("a2","¿Qué son las indicaciones luminosas de piso?",["Las luces de los toboganes","Franjas fotoluminiscentes que se interrumpen al llegar a la salida; son la alternativa cuando las señales de salida y la iluminación general no están visibles (por ejemplo con humo)","Los Exit Markers","Las luces de lectura"],1,"Las indicaciones luminosas de piso son franjas fotoluminiscentes QUE SE INTERRUMPEN AL LLEGAR A LA SALIDA. Son la alternativa cuando las señales de salida y la iluminación general no están visibles, por ejemplo si la cabina está llena de humo.","A320 Día 2");
Q("a2","¿Cuándo se activan las luces exteriores de las salidas del sector alar?",["Al armar los toboganes","Solo cuando la cubierta de la salida en el interior de la cabina es removida","Al encender las luces de emergencia","Al abrir una puerta"],1,"Las luces de las salidas del sector alar iluminan la vía de escape sobre el ala y SE ACTIVAN SOLO CUANDO LA CUBIERTA DE LA SALIDA EN EL INTERIOR DE LA CABINA ES REMOVIDA (al quitar la cubierta se ilumina también el área de la manija dentro de la cabina).","A320 Día 2");

Q("a3","¿Cuántas salidas de emergencia tiene el A320?",["4 puertas solamente","4 puertas y 4 salidas sobre el sector alar","6 puertas","2 puertas y 2 salidas alares"],1,"Los A320 están equipados con 4 PUERTAS y 4 SALIDAS ubicadas sobre el sector alar (2 a cada lado). Las puertas son salidas a nivel de piso, consideradas salidas principales.","A320 Día 3");
Q("a3","¿Puede usarse el tobogán rampa del sector alar en un amaraje?",["Sí, funciona igual","No: las salidas pueden usarse en amaraje, pero el tobogán rampa NO, ya que no se desconecta del avión","Sí, si se desconecta","Solo si se infla manualmente"],1,"Las salidas del sector alar están equipadas con tobogán rampa, acondicionadas principalmente para evacuación EN TIERRA. Las salidas pueden ser usadas en un amaraje, NO ASÍ EL TOBOGÁN RAMPA, ya que no se desconecta del avión. El tobogán se despliega hacia el BORDE DE FUGA.","A320 Día 3");
Q("a3","¿Qué indica la luz blanca fija SLIDE ARMED?",["Que la puerta está abierta","Que el tobogán está armado; se enciende al subir ligeramente la palanca de control","Que hay presión residual","Que el tobogán falló"],1,"SLIDE ARMED: cuando el tobogán está armado y la palanca de control es ligeramente subida, se enciende una luz BLANCA FIJA con indicación SLIDE ARMED. Su función es alertar que el tobogán está armado.","A320 Día 3");
Q("a3","¿Qué indica la luz roja intermitente CABIN PRESSURE?",["Que el tobogán está armado","Que hay presión residual en cabina y la puerta NO debe ser abierta","Que falta presurización","Que la puerta está asegurada"],1,"CABIN PRESSURE: cuando al menos uno de los motores está apagado y el tobogán está desarmado, si hay presión residual en cabina se enciende una LUZ ROJA INTERMITENTE de advertencia. Su función es alertar que hay presión residual POR LO QUE LA PUERTA NO DEBE SER ABIERTA.","A320 Día 3");
Q("a3","¿Qué función cumple el actuador de la puerta?",["Cerrar la puerta automáticamente","Es un cilindro de nitrógeno presurizado que asiste al amortiguador para empujar la puerta durante la apertura en emergencia","Frenar la puerta con viento","Bloquear la puerta"],1,"Cada puerta tiene un dispositivo amortiguador/actuador detrás del brazo. En operación normal funciona como AMORTIGUADOR regulando el movimiento (especialmente con viento). El ACTUADOR es un cilindro de nitrógeno presurizado que asiste al amortiguador para EMPUJAR LA PUERTA durante la apertura en emergencia.","A320 Día 3");
Q("a3","¿Qué indica el indicador Locked/Unlocked de la puerta?",["El estado del tobogán","Puerta asegurada: LOCKED en verde. Puerta no asegurada: UNLOCKED en rojo","Si hay presión","Si la puerta está armada"],1,"Indicador Locked/Unlocked: PUERTA ASEGURADA = LOCKED en VERDE. PUERTA NO ASEGURADA = UNLOCKED en ROJO.","A320 Día 3");
Q("a3","¿Cuál es el chequeo pre-vuelo de las salidas de emergencia?",["Tobogán armado y puerta abierta","Tobogán DESARMADO, indicador en el piso NO alineado y presión del tobogán en rango verde (puerta cerrada)","Solo la presión","Puerta asegurada solamente"],1,"Chequeo pre-vuelo: tobogán DESARMADO, indicador en el piso NO ALINEADOS y presión del tobogán en RANGO VERDE (con la puerta cerrada).","A320 Día 3");
Q("a3","En el ARMADO de tobogán, ¿dónde queda el pin de seguridad?",["Junto al letrero DISARMED","Se retira del orificio junto al letrero DISARMED y se inserta en el orificio del brazo de la puerta, dejando la cinta NO visible","Se guarda en el galley","Se deja puesto donde estaba"],1,"Armado: retirar el pin del orificio al lado del letrero DISARMED, bajar la palanca amarilla a ARMED, verificar visor en ARMED (rojo) y círculo y flecha ALINEADOS, e insertar el pin en el orificio DEL BRAZO DE LA PUERTA dejando la cinta NO VISIBLE.","A320 Día 3");
Q("a3","Con el tobogán ARMADO, ¿cómo se ve el visor y los indicadores?",["Visor DISARMED verde, sin alinear","Visor en ARMED (rojo) y círculo y flecha ALINEADOS","Visor apagado","Ambos indicadores en ámbar"],1,"Tobogán ARMADO: visor en ARMED (ROJO) y círculo y flecha ALINEADOS. Tobogán DESARMADO: visor en DISARMED (VERDE) y círculo y flecha NO alineados.","A320 Día 3");
Q("a3","Tras el armado, ¿qué verifica el TAC 1 en el FAP?",["Que las puertas estén cerradas","DOORS SLIDES en color VERDE","DOORS SLIDES en ámbar","El botón CABIN READY"],1,"Reporte: el TAC1 pide status de puertas 4 por interfono (INTPH + AFT), el TC2 reporta PUERTAS EN AUTOMÁTICO, el TAC1 verifica en FAP «DOORS SLIDES» en color VERDE y la TM verifica en ECAM. En el desarmado, el FAP muestra DOORS AND SLIDES en color ÁMBAR.","A320 Día 3");
Q("a3","En el FAP Touch Screen, ¿cómo se muestra una PUERTA ABIERTA?",["Rectángulo verde interior","Rectángulo rojo en la parte EXTERIOR del diagrama del avión","Rectángulo ámbar interior","No se muestra"],1,"En DOORS/SLIDES: PUERTA ABIERTA = rectángulo ROJO en la parte EXTERIOR del diagrama. TOBOGÁN DESARMADO (puerta cerrada) = rectángulo ÁMBAR en la parte interior. TOBOGÁN ARMADO = rectángulo VERDE en la parte interior.","A320 Día 3");
Q("a3","En el FAP de botones, ¿qué indica SLIDES ARMED con luces verdes INTERMITENTES?",["Todos los toboganes armados","Que 1 o más toboganes están DESARMADOS","Todos desarmados","Falla del sistema"],1,"SLIDES ARMED con luces verdes INTERMITENTES indica que 1 o más toboganes están DESARMADOS. APAGADO indica que todos están desarmados. Con luces verdes ENCENDIDAS FIJAS indica que todos los toboganes están ARMADOS.","A320 Día 3");
Q("a3","Al abrir una puerta desde el EXTERIOR, ¿qué se verifica primero?",["Que el tobogán esté armado","Mirar por el visor y verificar la luz CABIN PRESSURE APAGADA","Que haya escalera","La presión del tobogán"],1,"Apertura desde el exterior: a) mirar por el visor y verificar luz CABIN PRESSURE APAGADA, b) empujar la aleta PUSH HERE, tomar la manilla y levantarla completamente hasta la línea verde horizontal, c) tirar la puerta hacia afuera y desplazarla hacia adelante hasta asegurarla.","A320 Día 3");
Q("a3","Al abrir una puerta desde el INTERIOR en operación normal, además de verificar CABIN PRESSURE apagada, ¿qué se comprueba?",["Que el galley esté asegurado","Mover levemente la palanca de apertura/cierre y verificar que la luz SLIDE ARMED esté APAGADA","Que haya pasajeros sentados","La presión de cabina en el FAP"],1,"Apertura desde el interior: verificar tobogán desarmado (palanca amarilla en DISARMED, círculo y flecha no alineados), sujetarse de la manilla A, verificar luz CABIN PRESSURE apagada, MOVER LEVEMENTE LA PALANCA Y VERIFICAR QUE LA LUZ SLIDE ARMED ESTÉ APAGADA, y desplazar la puerta empujando con la manilla B.","A320 Día 3");
Q("a3","¿Dónde están las cuerdas del sector alar (life lines) y para qué sirven?",["Bajo los asientos; para amarrar equipaje","En los OHB de cada lado en la zona alar; se instalan para sujeción y protección de pasajeros y tripulación en evacuación EN AGUA","En el galley; para el tobogán","En el cockpit; para escape"],1,"Las cuerdas de zona alar (LIFE LINES) están ubicadas en los OHB de cada lado, en la zona alar. Cuando las salidas sobre el ala son abiertas PARA EVACUACIÓN EN AGUA, las cuerdas deben ser instaladas para sujeción y protección de pasajeros y tripulación.","A320 Día 3");
Q("a3","¿Cuál es la zona de responsabilidad ZONA A?",["Desde el galley posterior hasta la cola","Desde el sector FWD hasta las salidas del sector alar","Todo el pasillo","Solo las puertas 4"],1,"ZONA A: desde el sector FWD hasta las salidas del sector alar. ZONA C: desde las salidas del sector alar hasta el sector AFT. Responsables de puertas: JC en 1L, TAC2 en 1R, TAC3 en 4R y TAC4 en 4L.","A320 Día 3");
Q("a3","¿En cuántos segundos se infla automáticamente un tobogán del A320?",["2 segundos","5 segundos aproximadamente","10 segundos","15 segundos"],1,"El tobogán se infla automáticamente en 5 SEGUNDOS aproximadamente. Para inflarlo manualmente se debe tirar la manilla roja PULL TO INFLATE ubicada en el piso. Lo mismo aplica al tobogán balsa y al tobogán rampa.","A320 Día 3");
Q("a3","Al usar el TOBOGÁN (no balsa) como elemento de flotación en agua, ¿qué hacen las personas?",["Lo abordan y se sientan dentro","Se sujetan de la cuerda alrededor del tubo de flotación estando en el agua, PERO NO LO ABORDAN","Lo usan como remo","Lo inflan por segunda vez"],1,"El tobogán se usa como elemento de flotación: las personas, estando EN EL AGUA, se sujetan de la cuerda alrededor del tubo de flotación PERO NO LO ABORDAN. No tiene características de balsa.","A320 Día 3");
Q("a3","¿Cuál es el flujo de salida de un TOBOGÁN simple vs un TOBOGÁN BALSA?",["Ambos 1 pax/segundo","Tobogán: 1 carril, 1 pasajero por segundo. Tobogán balsa: 2 carriles, 2 pasajeros por segundo","Ambos 2 pax/segundo","Tobogán 2 y balsa 1"],1,"TOBOGÁN: 1 carril, flujo de 1 pasajero por segundo. TOBOGÁN BALSA (modo tobogán) y TOBOGÁN RAMPA: 2 carriles, flujo de 2 pasajeros por segundo. Todos tienen luces en la zona de contacto con tierra y cuerda de reingreso (reentry line).","A320 Día 3");
Q("a3","¿Cómo se desconecta el tobogán o tobogán balsa?",["Cortando con el hacha","Levantar la cubierta FOR DITCHING ONLY, tirar completamente la manija blanca HANDLE y cortar la mooring line con el cuchillo","Tirando de la manilla roja","Presionando un botón en el FAP"],1,"Desconexión: 1) levantar la cubierta con inscripción FOR DITCHING ONLY, 2) tirar completamente la manija blanca HANDLE de desconexión, 3) cortar la cuerda de amarre (mooring line) con el CUCHILLO adosado al tubo de flotación.","A320 Día 3");
Q("a3","En modo balsa, ¿cómo deben distribuirse los pasajeros?",["Todos en un extremo","Desplazarse al otro extremo y sentarse alternadamente a ambos lados, de espalda a los tubos de flotación","De pie en el centro","Agarrados de las cuerdas exteriores"],1,"Se ordena a los pasajeros inflar su chaleco salvavidas, desplazarse al otro extremo de la balsa y SENTARSE ALTERNADAMENTE A AMBOS LADOS DE ESPALDA A LOS TUBOS DE FLOTACIÓN. Finalmente el TC aborda la balsa y la desconecta cortando la mooring line.","A320 Día 3");
Q("a3","¿Dónde están los kits de supervivencia y cómo se instalan?",["En el galley; se lanzan al agua","En OHB cercanos a las puertas (2 en cada sector), 1 por tobogán balsa; se ata el gancho del kit a la cuerda de tela blanca bajo el tobogán","En la bodega; los baja tierra","En el cockpit; los lleva la TM"],1,"Hay 1 kit de supervivencia para cada tobogán balsa, ubicados en un OHB cercano a las puertas (2 en cada sector). Para instalarlo se remueve el kit y se ATA EL GANCHO DEL KIT A LA CUERDA DE TELA BLANCA ubicada bajo el tobogán. Contiene elementos de protección, localización, agua y alimento, inflador, toldo y mástiles.","A320 Día 3");
