<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso TAC · Estudio para Pía</title>
<style>
/* ============ VUELO OYR · rediseño "vuelo nocturno" ============ */
:root{
  --ground:#E9EFF7; --ink:#1A2740; --muted:#5E6D88; --line:rgba(26,39,64,.16);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.86); --glass-border:rgba(255,255,255,.72);
  --inner:rgba(26,39,64,.06);
  --accent:#E85D1F; --accent-2:#F2A65A; --accent-soft:rgba(232,93,31,.14); --gold:#D9A13B;
  --ok:#1F9D61; --ok-soft:rgba(31,157,97,.15); --bad:#D64550; --bad-soft:rgba(214,69,80,.13);
  --c0:#4A7FC1; --c1:#2E9E8F; --c2:#7D6BC6; --c3:#E85D1F; --c4:#C05572;
  --shadow:0 8px 28px rgba(26,39,64,.13); --shadow-hover:0 16px 42px rgba(26,39,64,.2);
  --sky-top:#9FC3E8; --sky-mid:#CFE0F3; --sky-low:#EDF2F8; --horizon:rgba(255,196,130,.55);
  --star-op:0; --cloud:rgba(255,255,255,.8); --plane-far:rgba(50,80,130,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1220; --ink:#EAF0FA; --muted:#8FA0BC; --line:rgba(234,240,250,.13);
    --glass:rgba(16,26,49,.6); --glass-strong:rgba(21,33,60,.9); --glass-border:rgba(255,255,255,.1);
    --inner:rgba(255,255,255,.055);
    --accent:#FF8A4C; --accent-2:#FFB86B; --accent-soft:rgba(255,138,76,.17); --gold:#E8B84B;
    --ok:#3DBE7F; --ok-soft:rgba(61,190,127,.17); --bad:#F06A74; --bad-soft:rgba(240,106,116,.15);
    --c0:#6E9FD8; --c1:#46B5A6; --c2:#9C8CE0; --c3:#FF8A4C; --c4:#D97490;
    --shadow:0 10px 32px rgba(0,0,0,.42); --shadow-hover:0 18px 48px rgba(0,0,0,.55);
    --sky-top:#060C1B; --sky-mid:#101E3C; --sky-low:#243354; --horizon:rgba(255,126,61,.32);
    --star-op:.9; --cloud:rgba(140,170,230,.06); --plane-far:rgba(220,235,255,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1220; --ink:#EAF0FA; --muted:#8FA0BC; --line:rgba(234,240,250,.13);
  --glass:rgba(16,26,49,.6); --glass-strong:rgba(21,33,60,.9); --glass-border:rgba(255,255,255,.1);
  --inner:rgba(255,255,255,.055);
  --accent:#FF8A4C; --accent-2:#FFB86B; --accent-soft:rgba(255,138,76,.17); --gold:#E8B84B;
  --ok:#3DBE7F; --ok-soft:rgba(61,190,127,.17); --bad:#F06A74; --bad-soft:rgba(240,106,116,.15);
  --c0:#6E9FD8; --c1:#46B5A6; --c2:#9C8CE0; --c3:#FF8A4C; --c4:#D97490;
  --shadow:0 10px 32px rgba(0,0,0,.42); --shadow-hover:0 18px 48px rgba(0,0,0,.55);
  --sky-top:#060C1B; --sky-mid:#101E3C; --sky-low:#243354; --horizon:rgba(255,126,61,.32);
  --star-op:.9; --cloud:rgba(140,170,230,.06); --plane-far:rgba(220,235,255,.6);
}
:root[data-theme="light"]{
  --ground:#E9EFF7; --ink:#1A2740; --muted:#5E6D88; --line:rgba(26,39,64,.16);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.86); --glass-border:rgba(255,255,255,.72);
  --inner:rgba(26,39,64,.06);
  --accent:#E85D1F; --accent-2:#F2A65A; --accent-soft:rgba(232,93,31,.14); --gold:#D9A13B;
  --ok:#1F9D61; --ok-soft:rgba(31,157,97,.15); --bad:#D64550; --bad-soft:rgba(214,69,80,.13);
  --c0:#4A7FC1; --c1:#2E9E8F; --c2:#7D6BC6; --c3:#E85D1F; --c4:#C05572;
  --shadow:0 8px 28px rgba(26,39,64,.13); --shadow-hover:0 16px 42px rgba(26,39,64,.2);
  --sky-top:#9FC3E8; --sky-mid:#CFE0F3; --sky-low:#EDF2F8; --horizon:rgba(255,196,130,.55);
  --star-op:0; --cloud:rgba(255,255,255,.8); --plane-far:rgba(50,80,130,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--sky-mid); color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
.app{max-width:640px;margin:0 auto;padding:16px 16px 48px;position:relative;z-index:1}

/* ============ ESCENA: el cielo detrás de todo ============ */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sky-grad{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 52%,var(--sky-low) 100%)}
.sky-grad::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38vh;background:linear-gradient(180deg,transparent,var(--horizon))}
.stars{position:absolute;inset:-70% -30% -10% -30%;opacity:var(--star-op);background-repeat:repeat}
.stars.s1{
  background-image:
    radial-gradient(1.5px 1.5px at 20px 40px,rgba(255,255,255,.85) 50%,transparent 51%),
    radial-gradient(1px 1px at 140px 120px,rgba(255,255,255,.55) 50%,transparent 51%),
    radial-gradient(1.2px 1.2px at 260px 60px,rgba(255,255,255,.7) 50%,transparent 51%),
    radial-gradient(1px 1px at 330px 200px,rgba(255,255,255,.5) 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 90px 260px,rgba(255,255,255,.7) 50%,transparent 51%),
    radial-gradient(1px 1px at 370px 300px,rgba(255,255,255,.45) 50%,transparent 51%);
  background-size:420px 340px;
  animation:starDrift 200s linear infinite,twinkleA 5s ease-in-out infinite alternate;
}
.stars.s2{
  background-image:
    radial-gradient(1px 1px at 60px 90px,rgba(255,255,255,.5) 50%,transparent 51%),
    radial-gradient(.9px .9px at 200px 30px,rgba(255,255,255,.4) 50%,transparent 51%),
    radial-gradient(1.1px 1.1px at 300px 160px,rgba(255,255,255,.55) 50%,transparent 51%),
    radial-gradient(.8px .8px at 120px 210px,rgba(255,255,255,.4) 50%,transparent 51%),
    radial-gradient(1px 1px at 430px 280px,rgba(255,255,255,.45) 50%,transparent 51%);
  background-size:540px 440px;
  animation:starDrift 300s linear infinite reverse,twinkleB 7s ease-in-out infinite alternate;
}
@keyframes starDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-420px,140px,0)}}
@keyframes twinkleA{from{opacity:calc(var(--star-op)*.5)}to{opacity:var(--star-op)}}
@keyframes twinkleB{from{opacity:calc(var(--star-op)*.65)}to{opacity:calc(var(--star-op)*.95)}}
.hcloud{position:absolute;bottom:-10vh;width:62vw;height:26vh;border-radius:50%;background:var(--cloud);filter:blur(46px);animation:cloudDrift 46s ease-in-out infinite alternate}
.hc2{left:34vw;bottom:-14vh;width:74vw;animation-duration:62s;animation-delay:-22s}
.hc3{left:68vw;bottom:-8vh;animation-duration:54s;animation-delay:-38s}
.hc1{left:-16vw}
@keyframes cloudDrift{from{transform:translateX(-6vw)}to{transform:translateX(6vw)}}
.shoot{position:absolute;top:0;left:0;width:130px;height:2px;border-radius:2px;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));animation:shoot 13s linear infinite;animation-delay:4s}
@keyframes shoot{
  0%,86%{opacity:0;transform:translate(96vw,6vh) rotate(158deg)}
  89%{opacity:var(--star-op)}
  95%,100%{opacity:0;transform:translate(48vw,30vh) rotate(158deg)}
}
.far-plane{position:absolute;top:17%;left:0;font-size:13px;color:var(--plane-far);opacity:0;animation:farfly 36s linear infinite;animation-delay:3s}
.far-plane i{position:absolute;right:-5px;top:1px;width:3px;height:3px;border-radius:50%;background:#FF5B5B;animation:pulse 1.1s infinite}
@keyframes farfly{
  0%{transform:translateX(-6vw) rotate(12deg);opacity:0}
  3%{opacity:1}
  46%{opacity:1}
  50%,100%{transform:translateX(108vw) rotate(12deg);opacity:0}
}

/* ============ header: panel de embarque ============ */
.board{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
  border-radius:16px;padding:14px 18px;margin-bottom:18px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.board>div{position:relative;z-index:1}
.board .sky{position:absolute;inset:0;pointer-events:none;z-index:0}
.board .cloud{position:absolute;left:-15%;font-size:19px;opacity:.18;animation:drift linear infinite}
@keyframes drift{from{left:-15%}to{left:104%}}
.board .flyplane{position:absolute;top:64%;left:-10%;font-size:13px;opacity:.7;color:var(--accent-2);animation:flyby 13s linear infinite;animation-delay:1.5s}
@keyframes flyby{0%{left:-8%;transform:translateY(4px) rotate(-8deg)}100%{left:104%;transform:translateY(-9px) rotate(-8deg)}}
.board-title{font-weight:800;letter-spacing:.2em;font-size:15px;text-transform:uppercase}
.board-sub{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.board .plane{
  font-size:19px;transform:rotate(-45deg);display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;flex:none;border-radius:50%;margin-right:12px;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--glass-border);
}
.ticket-code{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);text-align:right;text-transform:uppercase}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#41D98B;animation:pulse 1.6s infinite;vertical-align:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.theme-btn{
  background:var(--inner);border:1px solid var(--glass-border);color:var(--ink);
  width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .15s ease;
}
.theme-btn:hover{transform:rotate(20deg) scale(1.08)}

/* ============ genérico ============ */
.screen{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  .board .flyplane,.board .cloud,.shoot,.far-plane,.stars,.hero-jet{display:none!important}
}
.eyebrow{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,6.5vw,31px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:4px 0 0}
h2{font-size:19px;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14.5px}
.backbtn{
  background:none;border:none;color:var(--muted);font:inherit;font-size:14px;
  cursor:pointer;padding:6px 0;margin-bottom:6px;display:inline-flex;align-items:center;gap:6px;
}
.backbtn:hover{color:var(--ink)}
button:focus-visible,.card-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* ============ hero + ruta de vuelo ============ */
.hero{margin:6px 0 18px}
.hero-frase{margin-top:4px;font-size:14px;color:var(--accent);font-weight:650;font-style:italic}
.heropath{position:relative;width:min(330px,88%);height:34px;margin:6px 0 0}
.heropath svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.heropath path{stroke:var(--muted);opacity:.6;stroke-width:2;fill:none;stroke-dasharray:6 8;animation:dashmove 26s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-400}}
.hero-jet{position:absolute;left:0;top:0;font-size:15px;color:var(--accent);animation:jetfly 1.6s .3s cubic-bezier(.5,.05,.5,.95) forwards}
@keyframes jetfly{
  0%{left:0;transform:translateY(20px) rotate(-16deg)}
  60%{transform:translateY(9px) rotate(-11deg)}
  100%{left:calc(100% - 16px);transform:translateY(-4px) rotate(-7deg)}
}
.rankrow{display:flex;align-items:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.epaulette{display:inline-flex;gap:3px;background:#101B33;border-radius:7px;padding:7px 10px;align-items:center;border:1px solid rgba(232,184,75,.5)}
.epaulette i{display:block;width:5px;height:15px;background:var(--gold);border-radius:1.5px;box-shadow:0 0 6px rgba(232,184,75,.5)}
.epaulette i.off{opacity:.22;box-shadow:none}
.rankname{font-weight:800;font-size:15px}
.ranknext{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em}
.stats-strip{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{
  display:flex;flex-direction:column;min-width:86px;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:13px;padding:9px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);
}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:ui-monospace,Consolas,monospace;margin-top:1px}

/* ============ tarjetas de embarque (modos) ============ */
.modes{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.pass{
  position:relative;display:flex;width:100%;text-align:left;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit;
  overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  animation:cardin .5s ease backwards;
}
.pass:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--accent-soft)}
.modes .pass:nth-child(1){animation-delay:.05s}
.modes .pass:nth-child(2){animation-delay:.11s}
.modes .pass:nth-child(3){animation-delay:.17s}
.modes .pass:nth-child(4){animation-delay:.23s}
.modes .pass:nth-child(5){animation-delay:.29s}
.modes .pass:nth-child(6){animation-delay:.35s}
.modes .pass:nth-child(7){animation-delay:.41s}
.modes .pass:nth-child(8){animation-delay:.47s}
@keyframes cardin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.pass-main{flex:1;padding:15px 16px;min-width:0}
.pass-stub{
  width:86px;flex:none;border-left:2px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;padding:10px 6px;text-align:center;
  background:var(--inner);
}
.pass-stub .big{font-size:21px;letter-spacing:0}
.pass h3{font-size:16.5px;margin-bottom:2px}
.pass p{font-size:13.5px;color:var(--muted)}
.pass .tagline{margin-top:7px;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* ============ categorías ============ */
.catgrid{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.card-btn{
  display:block;width:100%;text-align:left;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:13px 15px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  cursor:pointer;color:inherit;font:inherit;box-shadow:var(--shadow);
  transition:transform .15s ease,box-shadow .15s ease;
}
.card-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.cat-row{display:flex;align-items:center;gap:10px}
.cat-dot{width:11px;height:11px;border-radius:3px;flex:none}
.cat-name{font-weight:650;font-size:15px;flex:1}
.cat-pct{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--inner);border:1px solid var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.cat-sub{font-size:12.5px;color:var(--muted);margin-top:5px}

/* ============ ruleta ============ */
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:10px}
.wheelbox{position:relative;width:min(320px,84vw);filter:drop-shadow(0 14px 30px rgba(0,0,0,.3))}
.wheelbox svg{width:100%;height:auto;display:block}
.pointer{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:20px solid var(--accent);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2;
}
#wheelG{
  transition:transform 3.4s cubic-bezier(.12,.67,.14,.99);
  transform-box:view-box;transform-origin:110px 110px;  /* centro exacto del viewBox 0 0 220 220 */
  will-change:transform;
}
.spin-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:99px;
  font:700 16px/1 system-ui,sans-serif;letter-spacing:.06em;
  padding:15px 42px;cursor:pointer;box-shadow:0 8px 24px rgba(232,93,31,.35);
  text-transform:uppercase;transition:transform .15s ease;
}
.spin-btn:hover:not(:disabled){transform:translateY(-2px)}
.spin-btn:disabled{opacity:.55;cursor:default}
.hud{display:flex;gap:10px;justify-content:center}
.hud .stat{align-items:center}

/* ============ pregunta ============ */
.q-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:7px;font-family:ui-monospace,Consolas,monospace;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:99px;color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.2);
}
.q-count{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-card{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:18px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shadow);
}
.q-text{font-size:17.5px;font-weight:650;line-height:1.45;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:var(--inner);border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;cursor:pointer;color:inherit;font:inherit;font-size:15px;line-height:1.4;
  transition:border-color .12s ease,background .12s ease;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{
  flex:none;width:22px;height:22px;border-radius:6px;background:var(--glass-strong);border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;margin-top:1px;
}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.verdict{font-weight:800;font-size:15px;margin-top:15px;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{
  margin-top:9px;background:var(--inner);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:11px 13px;font-size:14.5px;color:var(--ink);
}
.why .src{display:block;margin-top:7px;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.next-btn{
  margin-top:15px;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;
  border-radius:12px;padding:13px;font:700 15px system-ui,sans-serif;cursor:pointer;letter-spacing:.03em;
  box-shadow:0 6px 18px rgba(232,93,31,.3);transition:transform .12s ease;
}
.next-btn:hover{transform:translateY(-1px)}

/* ============ flashcards ============ */
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.fchip{
  border:1.5px solid var(--line);background:var(--glass);color:var(--muted);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:99px;padding:6px 13px;font:600 12.5px system-ui,sans-serif;cursor:pointer;
}
.fchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.flash{perspective:1200px;cursor:pointer;margin-top:6px}
.flash-inner{position:relative;width:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:22px;text-align:center;
}
.face.back{transform:rotateY(180deg)}
.face .fq{font-size:18px;font-weight:700;text-wrap:balance}
.face .fa{font-size:15.5px;line-height:1.55}
.face .hint{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.flash-nav{display:flex;gap:10px;margin-top:14px}
.flash-nav button{
  flex:1;background:var(--glass);border:1.5px solid var(--glass-border);border-radius:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:12px;font:650 14.5px system-ui,sans-serif;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);
}
.flash-nav button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}

/* ============ examen / resultados ============ */
.result-hero{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  padding:26px 20px;text-align:center;margin-top:12px;position:relative;overflow:hidden;
}
.result-hero .score{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stamp{
  display:inline-block;margin-top:10px;padding:7px 18px;border:2.5px solid;border-radius:8px;
  font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:13px;
  transform:rotate(-4deg);
}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.stamp.bad{color:var(--bad);border-color:var(--bad)}
.review-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.review-item{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.review-item .rq{font-weight:650;font-size:14.5px}
.review-item .ra{font-size:13.5px;margin-top:6px}
.review-item .ra b.good{color:var(--ok)} .review-item .ra b.badtxt{color:var(--bad)}

/* ============ pasaporte ============ */
.passport{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pp-row{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.pp-stamp{
  float:right;font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.14em;
  border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:3px 8px;
  transform:rotate(3deg);text-transform:uppercase;font-weight:700;
}
.exam-history{margin-top:8px;font-size:13.5px;color:var(--muted)}
.exam-history li{margin-left:18px;font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.badge{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:12px 10px;text-align:center;
  box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.badge .bi{font-size:26px;line-height:1}
.badge .bn{font-weight:700;font-size:13px;margin-top:6px}
.badge .bd{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.badge.locked{opacity:.45;filter:grayscale(1)}
.backup-box{display:flex;gap:10px;margin-top:10px}
.backup-box button{
  flex:1;background:var(--glass);border:1.5px solid var(--glass-border);border-radius:12px;padding:11px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font:650 13.5px system-ui,sans-serif;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);
}
.danger{
  margin-top:22px;background:none;border:none;color:var(--muted);font:13px system-ui,sans-serif;
  text-decoration:underline;cursor:pointer;
}
footer{margin-top:34px;text-align:center;font-size:12.5px;color:var(--muted);position:relative;z-index:1}
footer .heart{color:var(--accent)}

/* ============ simulación: turno de vuelo ============ */
.flightpath{display:flex;align-items:center;gap:5px;margin:4px 0 12px;flex-wrap:wrap}
.fp-dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:background .2s}
.fp-dot.done{background:var(--ok)}
.fp-dot.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scene-setup{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:9px}
.seq-built{display:flex;flex-direction:column;gap:6px;min-height:48px;background:var(--inner);border:1.5px dashed var(--line);border-radius:12px;padding:9px;margin-top:13px}
.seq-built:empty::before{content:"Toca los pasos de abajo en el orden correcto…";color:var(--muted);font-size:13px;padding:3px}
.seq-chip{display:flex;align-items:flex-start;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:9px;padding:8px 11px;font:600 13px/1.35 system-ui,sans-serif;cursor:pointer;text-align:left;width:100%}
.seq-chip .n{font-family:ui-monospace,Consolas,monospace;opacity:.85;flex:none}
.seq-hint{font-size:12px;color:var(--muted);margin-top:7px}
.report-phase{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.report-phase:last-child{border-bottom:none}
.report-phase .rp-name{flex:1}
.report-phase .rp-score{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.report-phase .rp-score.good{color:var(--ok)} .report-phase .rp-score.meh{color:var(--bad)}

/* ============ carga especial ============ */
.pin-row{display:flex;gap:10px;margin-top:16px}
.pin-input{flex:1;background:var(--glass-strong);border:1.5px solid var(--glass-border);border-radius:12px;padding:13px;font:700 21px ui-monospace,Consolas,monospace;letter-spacing:.3em;text-align:center;color:var(--ink);width:100%;min-width:0}
.pin-input:focus{outline:3px solid var(--accent);outline-offset:1px}
.pin-go{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;border-radius:12px;padding:13px 20px;font:700 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(232,93,31,.3)}
.pin-msg{margin-top:10px;font-size:13.5px;color:var(--bad);min-height:20px;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.love-overlay{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#0B1B3A 0%,#20356B 38%,#7A4A78 68%,#E8794A 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:52px 22px 30px;overflow-y:auto;overflow-x:hidden}
.love-close{position:fixed;top:14px;right:16px;z-index:210;background:rgba(255,255,255,.18);border:none;color:#fff;font-size:17px;width:38px;height:38px;border-radius:50%;cursor:pointer}
.love-float{position:fixed;bottom:-46px;z-index:201;pointer-events:none;animation:floatup linear forwards}
@keyframes floatup{from{transform:translateY(0) rotate(-8deg);opacity:0}12%{opacity:1}to{transform:translateY(-114vh) rotate(10deg);opacity:.85}}
.love-card{position:relative;z-index:205;max-width:520px;width:100%;text-align:center;color:#FFF7EE}
.love-title{font-size:24px;font-weight:800;letter-spacing:.02em;text-wrap:balance;opacity:0;animation:lovein .8s ease forwards}
.love-line{font-size:16.5px;line-height:1.65;margin-top:16px;opacity:0;animation:lovein .8s ease forwards;text-wrap:balance}
.love-sign{margin-top:18px;font-size:15px;font-style:italic;opacity:0;animation:lovein .8s ease forwards}
@keyframes lovein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cat-stage{position:relative;z-index:205;margin-top:28px;opacity:0;animation:lovein 1s ease forwards;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:12px}
.cat-bubble{background:#FFF7EE;color:#4A3527;border-radius:14px;padding:10px 15px;font:600 14px/1.5 system-ui,sans-serif;max-width:330px;box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative}
.cat-bubble small{font-weight:500;color:#7A6350}
.cat-bubble::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top-color:#FFF7EE;border-bottom:0}
.cat-svg{width:min(240px,60vw);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.cat-eyes{animation:blink 4.5s infinite;transform-origin:100px 82px}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.cat-tail{animation:wag 3s ease-in-out infinite;transform-origin:168px 152px}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion: reduce){.love-float{display:none}}


/* ============ selector de ramos ============ */
.quick{margin-top:16px}
.daily-btn{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none;
  border-radius:15px;padding:14px 16px;box-shadow:0 8px 24px rgba(232,93,31,.32);
  font:inherit;transition:transform .15s ease;
}
.daily-btn:hover{transform:translateY(-2px)}
.daily-btn.done{background:var(--glass);color:var(--ink);border:1px solid var(--glass-border);box-shadow:var(--shadow);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.daily-btn .db-ic{font-size:24px;flex:none;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center}
.daily-btn.done .db-ic{background:var(--ok-soft);color:var(--ok)}
.daily-btn b{display:block;font-size:15.5px}
.daily-btn small{display:block;font-size:12.5px;opacity:.9;margin-top:2px}

.ramos{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.ramo-card{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:15px;padding:14px 15px;
  backdrop-filter:blur(13px) saturate(1.2);-webkit-backdrop-filter:blur(13px) saturate(1.2);
  box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease;
  animation:cardin .5s ease backwards;
}
.ramo-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.ramos .ramo-card:nth-child(1){animation-delay:.04s}
.ramos .ramo-card:nth-child(2){animation-delay:.09s}
.ramos .ramo-card:nth-child(3){animation-delay:.14s}
.ramos .ramo-card:nth-child(4){animation-delay:.19s}
.ramos .ramo-card:nth-child(5){animation-delay:.24s}
.ramos .ramo-card:nth-child(6){animation-delay:.29s}
.ramos .ramo-card:nth-child(7){animation-delay:.34s}
.ramo-ic{
  flex:none;width:46px;height:46px;border-radius:13px;display:inline-flex;
  align-items:center;justify-content:center;font-size:22px;
}
.ramo-body{flex:1;min-width:0}
.ramo-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ramo-top b{font-size:16px}
.ramo-ok{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  border:1.5px solid var(--ok);color:var(--ok);border-radius:5px;padding:2px 6px;font-weight:700}
.ramo-body small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.ramo-body .bar{margin-top:9px}
.ramo-meta{display:block;font-size:11.5px;color:var(--muted);margin-top:6px;
  font-family:ui-monospace,Consolas,monospace;letter-spacing:.02em}

.ramo-hero{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:18px;
  backdrop-filter:blur(15px) saturate(1.2);-webkit-backdrop-filter:blur(15px) saturate(1.2);
  box-shadow:var(--shadow);margin-bottom:4px;border-top:3px solid var(--rc);
}
.ramo-hero h1{font-size:clamp(22px,5.5vw,27px);margin:4px 0 4px}
.ramo-hero .stats-strip{margin-top:13px}


/* ============ mapa conceptual ============ */
.mapa{margin-top:16px;position:relative}
.mapa-rama{
  position:relative;padding-left:20px;margin-bottom:16px;
  border-left:2px solid var(--rc,var(--accent));
  animation:cardin .45s ease backwards;
}
.mapa-rama:nth-child(1){animation-delay:.04s}
.mapa-rama:nth-child(2){animation-delay:.09s}
.mapa-rama:nth-child(3){animation-delay:.14s}
.mapa-rama:nth-child(4){animation-delay:.19s}
.mapa-rama:nth-child(5){animation-delay:.24s}
.mapa-rama:nth-child(6){animation-delay:.29s}
.mapa-rama:nth-child(7){animation-delay:.34s}
.mapa-rama:last-child{margin-bottom:0}
.mapa-mod{
  position:relative;display:flex;align-items:center;gap:9px;margin-bottom:10px;
  font-weight:700;font-size:15.5px;
}
.mapa-mod::before{
  content:"";position:absolute;left:-27px;width:13px;height:13px;border-radius:50%;
  background:var(--rc,var(--accent));border:3px solid var(--sky-mid);
}
.mapa-mod .mm-pct{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:99px;background:var(--inner);color:var(--muted);
  border:1px solid var(--line);
}
.mapa-nodos{display:flex;flex-direction:column;gap:7px}
.mapa-nodo{
  position:relative;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;
  padding:10px 13px;box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .14s ease,border-color .14s ease;
}
.mapa-nodo::before{
  content:"";position:absolute;left:-21px;top:19px;width:19px;height:2px;
  background:var(--rc,var(--accent));opacity:.45;
}
.mapa-nodo:hover{transform:translateX(3px);border-color:var(--rc,var(--accent))}
.mapa-nodo .mn-t{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px}
.mapa-nodo .mn-t i{
  font-style:normal;font-size:11px;color:var(--muted);margin-left:auto;flex:none;
  transition:transform .2s ease;
}
.mapa-nodo.open .mn-t i{transform:rotate(90deg)}
.mapa-nodo .mn-d{
  font-size:13.5px;line-height:1.5;color:var(--muted);
  max-height:0;overflow:hidden;transition:max-height .3s ease,margin-top .3s ease;
}
.mapa-nodo.open .mn-d{max-height:400px;margin-top:7px}
.mapa-leyenda{font-size:12.5px;color:var(--muted);margin-top:4px}

/* ============ buscador ============ */
.search-box{display:flex;gap:9px;margin-top:14px}
.search-input{
  flex:1;min-width:0;background:var(--glass-strong);border:1.5px solid var(--glass-border);
  border-radius:13px;padding:13px 15px;font:15px system-ui,sans-serif;color:var(--ink);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.search-input:focus{outline:3px solid var(--accent);outline-offset:1px}
.search-meta{font-size:13px;color:var(--muted);margin-top:12px}
.res-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.res-item{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:13px;
  padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left;
  font:inherit;color:inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .14s ease;
}
.res-item:hover{transform:translateY(-2px)}
.res-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.res-chip{
  font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:99px;color:#fff;font-weight:700;
}
.res-kind{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.res-q{font-weight:650;font-size:14.5px;line-height:1.4}
.res-a{font-size:13.5px;color:var(--ok);margin-top:5px;font-weight:600}
.res-w{font-size:13px;color:var(--muted);line-height:1.5;
  max-height:0;overflow:hidden;transition:max-height .3s ease,margin-top .3s ease}
.res-item.open .res-w{max-height:500px;margin-top:8px}
mark{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 2px;border-radius:3px}
.search-empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px}


/* ============ alfabeto aeronáutico ============ */
.alfa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:14px}
.alfa-cell{
  display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;color:inherit;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:10px 6px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:var(--shadow);
  transition:transform .14s ease,border-color .14s ease;
}
.alfa-cell:hover{transform:translateY(-2px);border-color:var(--accent)}
.alfa-cell.sonando{border-color:var(--accent);background:var(--accent-soft)}
.alfa-cell.flojo{border-color:var(--bad)}
.alfa-cell .ac-l{font-size:22px;font-weight:800;line-height:1.1;color:var(--accent)}
.alfa-cell .ac-p{font-size:13.5px;font-weight:650}
.alfa-cell .ac-f{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--muted);letter-spacing:.03em}

.alfa-zona,.spell-zona{text-align:center}
.alfa-preg{font-size:14px;color:var(--muted);margin-bottom:6px}
.alfa-big{
  font-size:clamp(56px,17vw,84px);font-weight:800;line-height:1.05;letter-spacing:-.02em;
  color:var(--accent);margin:4px 0 10px;
}
.alfa-oir{
  background:var(--inner);border:1.5px solid var(--glass-border);border-radius:99px;
  padding:8px 18px;font:600 13.5px system-ui,sans-serif;color:var(--ink);cursor:pointer;margin-bottom:6px;
}
.alfa-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.alfa-opts.chips{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.alfa-op{
  background:var(--inner);border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;
  font:650 15.5px system-ui,sans-serif;color:var(--ink);cursor:pointer;
  transition:border-color .12s ease,background .12s ease;
}
.alfa-op:hover:not(:disabled){border-color:var(--accent)}
.alfa-op:disabled{cursor:default}
.alfa-op.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.alfa-op.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.alfa-op.dim{opacity:.45}
.alfa-op.usado{opacity:.3}
.chip-op{padding:10px 8px;font-size:14px}
.alfa-after{margin-top:14px}
.alfa-after .verdict{justify-content:center}
.alfa-undo{
  display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);
  font:13px system-ui,sans-serif;text-decoration:underline;cursor:pointer;
}

.spell-sigla{
  font-family:ui-monospace,Consolas,monospace;font-size:clamp(34px,10vw,46px);font-weight:800;
  letter-spacing:.14em;color:var(--accent);margin:2px 0 2px;
}
.spell-desc{font-size:13px;color:var(--muted);margin-bottom:12px}
.spell-slots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:6px}
.spell-slot{
  min-width:76px;padding:9px 11px;border-radius:10px;font:650 13.5px system-ui,sans-serif;
  background:var(--inner);border:1.5px dashed var(--line);color:var(--muted);
}
.spell-slot i{font-style:normal;font-family:ui-monospace,Consolas,monospace;font-weight:800;opacity:.5}

.cl-fila::after{
  content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
