Q("su1","¿Cuáles son las PRIORIDADES en una situación de supervivencia, en orden?",["Agua, alimento, protección y localización","Protección · Localización · Agua · Alimento","Localización, protección, alimento y agua","Alimento, agua, refugio y señales"],1,"Las prioridades son, en orden: 1) PROTECCIÓN · 2) LOCALIZACIÓN (incluido el código de señales visuales tierra/aire) · 3) AGUA · 4) ALIMENTO.","Supervivencia M1");
Q("su1","¿Cuál es el rol de la Tripulación de Cabina en una supervivencia?",["Buscar ayuda por su cuenta","Ejercer LIDERAZGO POSITIVO: mantener el ánimo alto, la cohesión de los sobrevivientes y el correcto uso del equipo","Racionar el agua únicamente","Esperar en silencio el rescate"],1,"La TC debe ejercer LIDERAZGO POSITIVO. Claves: la motivación por vivir es vital, evitar caer en baja moral, correcto uso del equipo de supervivencia, velar por la seguridad, mantener el ánimo alto y la cohesión de los sobrevivientes.","Supervivencia M1");
Q("su1","¿Cuáles son los tres factores personales clave para sobrevivir?",["Fuerza, resistencia y velocidad","Control mental (actitud psíquica para dominar la situación), experiencia (lograda con práctica) e ingenio (inventar y crear soluciones)","Comida, agua y refugio","Juventud, salud y entrenamiento"],1,"Los tres factores: CONTROL MENTAL (actitud psíquica para dominar la situación) · EXPERIENCIA (lograda con la práctica) · INGENIO (inventar y crear soluciones). «La vida es un 10% de lo que te sucede y un 90% cómo reaccionamos a ello».","Supervivencia M1");
Q("su1","¿Cuáles son los obstáculos COMUNES en una supervivencia?",["Solo el frío y el hambre","Ansiedad, dolor, frío, sed, hambre, fatiga y privación del sueño","Los animales salvajes","La falta de herramientas"],1,"OBSTÁCULOS COMUNES: ansiedad, dolor, frío, sed, hambre, fatiga y privación del sueño. OBSTÁCULOS MENTALES: desconocimiento, incomodidad, debilidad propia, miedo a las personas, y terreno y clima.","Supervivencia M1");
Q("su1","¿Qué condiciones del lugar hay que evaluar tras un aterrizaje de emergencia?",["Solo la temperatura","Zona geográfica (montaña, desierto, mar, nieve, bosque), meteorología, material disponible de la aeronave y cantidad de heridos","La distancia al aeropuerto","La hora del día"],1,"Condiciones del lugar a evaluar: ZONA GEOGRÁFICA (montaña, desierto, mar, nieve, bosque), METEOROLOGÍA, MATERIAL con el que se cuenta (restos de la aeronave) y CANTIDAD DE HERIDOS.","Supervivencia M1");

Q("su2","¿Qué tamaño deben tener las señales del código visual tierra/aire?",["1 metro de largo","Aproximadamente 6 metros de largo, 4 de ancho y 1 de espesor, para ser visibles desde grandes alturas","30 centímetros","10 metros de diámetro"],1,"Las señales deben hacerse lo más grandes y llamativas posibles: aproximadamente 6 METROS DE LARGO, 4 METROS DE ANCHO y 1 METRO DE ESPESOR, ya que tienen que ser visibles desde grandes alturas. El código internacional OACI exige señales de más de 3 metros de longitud.","Supervivencia M2");
Q("su2","¿Cómo se aumenta el contraste de una señal en el terreno?",["Pintándola de blanco","Cavando los signos como trincheras y amontonando la tierra a los costados, para aumentar la profundidad de la sombra","Usando solo piedras claras","Haciéndola más pequeña"],1,"Hay que contrastar con el material del terreno: CAVAR LOS SIGNOS COMO SI FUERAN TRINCHERAS, AMONTONANDO LA TIERRA A LOS COSTADOS para que aumente la profundidad de la sombra. Se pueden usar piedras, troncos, ramas, tierra o nieve, y mejor aún si van acompañadas de fuego.","Supervivencia M2");
Q("su2","¿Cómo se clasifican los medios de señalización?",["Solo visuales y sonoros","Radioeléctricos (ELT, PLB, EPIRB), pirotécnicos (bengalas), codificados (espejo, paños, cuerpo) y no codificados (silbato, linterna)","Diurnos y nocturnos","Naturales y artificiales"],1,"Se clasifican en: RADIOELÉCTRICOS (ELT aeronáutico, PLB personal, EPIRB marítimo) · PIROTÉCNICOS (bengalas día/noche: humo de día, fuego de noche) · CODIFICADOS (espejo, latas o papel aluminio, paños de colores, señales con el cuerpo, naturales) · NO CODIFICADOS (silbato, megáfono, linterna, luces del chaleco).","Supervivencia M2");
Q("su2","¿Cómo indica una aeronave que ENTENDIÓ tu mensaje?",["Aterrizando de inmediato","De día: alabeo (inclinación de las alas). De noche: dos destellos con los faros de aterrizaje o encendiendo y apagando dos veces las luces de navegación","Lanzando una bengala","Sobrevolando en círculos"],1,"Mensaje entendido por la aeronave: DE DÍA, alabeo (inclinación de las alas del avión). DE NOCHE, destellos dos veces con los faros de aterrizaje o encendiendo y apagando dos veces las luces de navegación.","Supervivencia M2");
Q("su2","¿Qué es el TRIÁNGULO DE FUEGO como señal?",["El tetraedro de la combustión","Tres fogatas separadas entre 15 y 30 metros formando un triángulo, que indican un pedido de auxilio","Una señal de peligro de incendio","Un tipo de refugio"],1,"El TRIÁNGULO DE FUEGO se forma con TRES FOGATAS colocadas entre 15 Y 30 METROS de distancia formando un triángulo: indican un pedido de auxilio. La altura de la hoguera no debe superar el tamaño de una persona. Use HUMO de día y FUEGO de noche.","Supervivencia M2");
Q("su2","¿Cómo se produce humo BLANCO y humo NEGRO para señalizar?",["Con distintos combustibles químicos","Humo NEGRO: restos de la aeronave. Humo BLANCO: hojas verdes, musgos o rociando el fuego con agua","Blanco de día y negro de noche","No se puede controlar el color"],1,"HUMO NEGRO: se logra quemando restos de la aeronave. HUMO BLANCO: se agregan hojas verdes, musgos o se rocía con agua el fuego. Se elige el que contraste con el terreno.","Supervivencia M2");
Q("su2","¿Dónde NO se debe construir un refugio?",["Cerca del avión","En el lecho seco de ríos, en zonas ventosas o de drenaje pobre, y en montaña sin protección de avalanchas","En zonas boscosas","En terreno plano"],1,"Construcción de refugios: NO ACAMPE EN EL LECHO SECO DE RÍOS · evite zonas ventosas o de drenaje pobre · en zonas subtropicales aísle el refugio de la humedad del suelo · en montaña elija lugares protegidos de avalanchas, lluvia, inundaciones y vientos.","Supervivencia M2");
Q("su2","Al construir un refugio en la NIEVE, ¿hacia dónde debe ir la entrada?",["Hacia el viento, para ventilar","En la dirección OPUESTA a la del viento, amontonando la nieve extraída como protección","Hacia el sur siempre","Hacia el avión"],1,"En la nieve: cave un pozo grande, aísle del suelo colocando telas, troncos o ramas en el piso, y CONSTRUYA LA ENTRADA EN LA DIRECCIÓN OPUESTA A LA DEL VIENTO, amontonando la nieve extraída como protección.","Supervivencia M2");
Q("su2","Si se hace fuego dentro de un refugio, ¿qué precaución es obligatoria?",["Apagarlo antes de dormir","Dejar siempre buena ventilación, aún con temperaturas bajas, porque las llamas producen MONÓXIDO DE CARBONO","Hacerlo solo de día","Usar solo carbón"],1,"Al producir fuego en el interior de un refugio, recuerde siempre —AÚN CON TEMPERATURAS BAJAS— DEJAR UNA BUENA VENTILACIÓN, pues las llamas producen MONÓXIDO DE CARBONO.","Supervivencia M2");
Q("su2","¿Qué significa la regla JAG en supervivencia?",["Juntar, Alimentar, Guardar","JUNTE - ACUMULE - GUARDE","Jerarquía, Acción, Grupo","Justificar, Analizar, Gestionar"],1,"La regla JAG: JUNTE - ACUMULE - GUARDE. Aplica al manejo de recursos disponibles durante la supervivencia.","Supervivencia M2");
Q("su2","¿Cuánto tiempo se puede sobrevivir sin agua y cuándo se bebe la primera ración?",["3 días; beber de inmediato","De 8 a 10 días; esperar 24 horas antes de beber la primera ración","1 mes; beber al segundo día","5 días; beber cada hora"],1,"Días máximos de sobrevivir sin agua: 8 A 10 DÍAS. Hay que RACIONAR: esperar 24 HORAS antes de beber la primera ración. Del segundo al sexto día, 500 cm³ por día y por persona.","Supervivencia M2");
Q("su2","¿Cuánto tiempo resiste el ser humano sin agua a 48 °C?",["10 días","7 días","2 días","1 día"],2,"Resistencia sin agua: a 10 °C → 10 DÍAS · a 32 °C → 7 DÍAS · a 48 °C → 2 DÍAS.","Supervivencia M2");
Q("su2","¿Cómo se purifica el agua hirviéndola en altura?",["3 minutos siempre","De 5 a un máximo de 15 minutos, agregando 1 minuto más por cada 300 metros de altura","30 minutos","No se puede hervir en altura"],1,"Hervir el agua entre 3 y 5 minutos y luego filtrar las cenizas. EN ALTURA: hervirla de 5 a un máximo de 15 minutos y ADICIONAR 1 MINUTO MÁS CADA 300 METROS DE ALTURA. Otras formas: pastillas de cloro o gotas de yodo, filtros improvisados y sedimentación.","Supervivencia M2");
Q("su2","¿Cuántas gotas de yodo se agregan por litro de agua para purificarla?",["1 gota","3 gotas por litro, o 6 si el agua está muy sucia, dejándola media hora en reposo","10 gotas","20 gotas"],1,"Pastillas de cloro o gotas de yodo (halazone o iodine): agregar 3 GOTAS DE YODO POR LITRO de agua, o 6 SI SON MUY SUCIAS, agitar hasta que se mezcle bien y dejarla MEDIA HORA EN REPOSO antes de beberla.","Supervivencia M2");
Q("su2","¿Cuál de estas recomendaciones sobre el agua es CORRECTA?",["Beber el líquido lechoso de las plantas","El vuelo de las aves al anochecer y al amanecer conduce a las aguadas","Beber agua de mar en pequeñas cantidades","Beber orina si no hay agua"],1,"El vuelo de las aves al anochecer y al amanecer CONDUCE A LAS AGUADAS, y los rastros de animales llevan a sus abrevaderos. NUNCA beber agua salada ni orina, y NO beber el líquido lechoso de las plantas. Beber preferentemente al anochecer y al amanecer.","Supervivencia M2");
Q("su2","¿En qué consiste la REGLA DE COMESTIBILIDAD?",["Comer solo lo conocido","Ingerir una porción del tamaño de una nuez y esperar 8 horas; si no hay náuseas ni vómitos, comer una porción del tamaño del puño y esperar otras 8 horas","Cocinar todo por 1 hora","Probar con la lengua solamente"],1,"Regla de comestibilidad: siempre trate de COCINAR el posible alimento · ingiera una pequeña cantidad DEL TAMAÑO DE UNA NUEZ y espere 8 HORAS · si no hay náuseas ni vómitos, coma otra porción DEL TAMAÑO DEL PUÑO y espere 8 HORAS MÁS · si no hay malestar, coma una porción mayor.","Supervivencia M2");
Q("su2","¿Qué NO se debe ingerir según las reglas de alimentación en supervivencia?",["Aves","Algas marinas, peces de colores y formas extrañas, y agua de mar","Alimentos cocinados","Raciones del kit"],1,"NO ingerir ALGAS MARINAS, PECES DE COLORES Y FORMAS extrañas, ni AGUA DE MAR. Las aves son comestibles. Hay que proteger los alimentos de los insectos y consumir 2/3 de las raciones de emergencia.","Supervivencia M2");

Q("su3","¿Cuáles son las acciones inmediatas en supervivencia EN TIERRA?",["Quedarse dentro del avión","Alejarse 100 metros del avión considerando el viento, activar el ELT, improvisar refugio y atender heridos","Buscar el pueblo más cercano","Encender fuego de inmediato"],1,"Acciones inmediatas en tierra: ALEJARSE DEL AVIÓN (100 M) considerando el viento · ACTIVAR EL ELT · improvisar refugio · atender heridos, buscar asistencia médica y tranquilizar. Cuando pase el peligro de fuego: permanecer cerca del área del accidente, rescatar equipo, soltar toboganes para usarlos como refugio y recuperar el kit de supervivencia.","Supervivencia M3");
Q("su3","En el DESIERTO, ¿cuándo conviene trasladarse si es necesario?",["Al mediodía","Solo de noche","Al amanecer","En cualquier momento"],1,"DESIERTO: permanecer en la sombra el mayor tiempo posible durante el día · mantener la ropa puesta y evitar transpirar (deshidratación) · mantener cabeza y cuello cubiertos · SI ES NECESARIO TRASLADARSE, HACERLO SÓLO DE NOCHE · la presencia de pájaros y animales indica agua · en tormentas de arena, proteger ojos y cubrir boca y nariz.","Supervivencia M3");
Q("su3","En el TRÓPICO, ¿cuál es el peligro principal?",["La falta de agua","Los insectos, por las enfermedades que transmiten","El frío nocturno","Los desprendimientos"],1,"TRÓPICO: EL PELIGRO SON LOS INSECTOS (enfermedades). Se puede disponer de alimentos y agua, pero hay que hervir el agua o usar tabletas purificadoras y cocer los alimentos. El follaje tupido dificultará el rescate: buscar un claro cercano al avión para hacer señales.","Supervivencia M3");
Q("su3","En la NIEVE, ¿qué se recomienda respecto del agua?",["Comer nieve directamente","Si dispone de agua, agregar nieve gradualmente; derretir preferentemente hielo","Beber solo agua del kit","No beber hasta el rescate"],1,"NIEVE: evitar el congelamiento manteniendo cuerpo y ropa secos · evitar transpirar para no humedecer la ropa · proteger los ojos · mover permanentemente las extremidades · buscar refugio o cavar zanjas · SI DISPONE DE AGUA, AGREGAR NIEVE GRADUALMENTE; DERRETIR PREFERENTEMENTE HIELO.","Supervivencia M3");
Q("su3","¿Cuáles son las primeras acciones al terminar el abordaje de la balsa?",["Esperar instrucciones por radio","Cortar la mooring line y alejarse del avión, activar el ELT y tirar el ancla","Repartir el agua","Levantar el toldo"],1,"Acciones inmediatas en el mar (simultáneas, asignadas por la TC a cargo de la balsa): CORTAR MOORING LINE y alejarse del avión · ACTIVAR ELT · TIRAR ANCLA · presentación de la TAC y conteo de sobrevivientes · solicitar médico · rescatar equipo y repartir tabletas de mareo · atender heridos · ATAR LAS BALSAS ENTRE SÍ · mantener higiene · mantener la balsa seca y estable · registro en bitácora.","Supervivencia M3");
Q("su3","En MARES FRÍOS y CALIENTES, ¿qué peces son comestibles?",["Todos los peces del mar","Camarones y peces que NO tengan colores vivos ni formas extrañas","Solo los peces grandes","Ninguno, solo el kit"],1,"Tanto en mares fríos como calientes: los CAMARONES Y PECES QUE NO TENGAN COLORES VIVOS NI FORMAS EXTRAÑAS son comestibles. En ambos casos se recolecta agua de lluvia y rocío utilizando el toldo.","Supervivencia M3");
Q("su3","¿Cuál es la diferencia en el uso del toldo entre mares fríos y calientes?",["No hay diferencia","En mares fríos se usa para protegerse del frío; en mares calientes se pone dejando las partes laterales ABIERTAS","En calientes no se usa","En fríos se deja abierto"],1,"MARES FRÍOS: usar el toldo para protegerse del frío y mantener el calor. MARES CALIENTES: poner el toldo DEJANDO LAS PARTES LATERALES ABIERTAS. En ambos: mantener la balsa seca, mover extremidades y proteger piel y ojos.","Supervivencia M3");
Q("su3","¿Cuáles son los 4 subsistemas de la balsa adicional?",["Balsa, remos, motor y ancla","Una balsa inflable reversible amarilla, dos tubos de flotación con dos sistemas de inflado, un kit de supervivencia y accesorios, y una funda con manillas","Solo la balsa y el kit","Balsa, toldo, agua y comida"],1,"La balsa adicional consiste en 4 subsistemas principales: I) una balsa inflable, REVERSIBLE, de color AMARILLO · II) dos tubos de flotación y dos sistemas de inflado · III) un kit de supervivencia y accesorios · IV) una funda o contenedor con manillas para su traslado.","Supervivencia M3");
Q("su3","¿Qué contiene el KIT DE SUPERVIVENCIA?",["Solo agua y comida","Elementos de supervivencia, localización, protección, medios de sustento de vida apropiados para el vuelo y equipos para señales pirotécnicas","Solo el toldo","Herramientas de reparación"],1,"El kit de supervivencia es un equipo asociado a las balsas; SU CONTENIDO VARÍA SEGÚN EL FABRICANTE. Contiene elementos de supervivencia, LOCALIZACIÓN, PROTECCIÓN, medios de sustento de vida apropiados para el vuelo y equipos para hacer SEÑALES PIROTÉCNICAS de auxilio.","Supervivencia M3");
Q("su3","¿Cuáles son los elementos de LOCALIZACIÓN del kit?",["Balde, esponja e inflador","Toldo, barras fosforescentes, bengalas, espejo de señales, linternas, marcador de agua y silbato","Agua y caramelos","Cortaplumas y parches"],1,"Elementos de LOCALIZACIÓN: TOLDO (localización y protección) · BARRAS FOSFORESCENTES · BENGALAS · ESPEJO DE SEÑALES · LINTERNAS · MARCADOR DE AGUA · SILBATO.","Supervivencia M3");
Q("su3","Al instalar el toldo, ¿cómo se colocan las paletas?",["En cualquier orden","Haciendo coincidir los números de las paletas con los números escritos en el tubo de flotación de la balsa","De izquierda a derecha","Empezando por el mástil"],1,"El toldo trae PALETAS NUMERADAS que DEBEN COINCIDIR CON LOS NÚMEROS ESCRITOS EN LA BALSA (tubo de flotación). Las paletas vienen con velcro para adosarse al tubo y ganchos que se sujetan a un broche. Tiene 1 rampa de abordaje y 1 ventanilla de ventilación que debe coincidir con la rampa. Al final se infla el mástil.","Supervivencia M3");
Q("su3","¿Cuánto duran las BARRAS FOSFORESCENTES y para qué se usan?",["2 horas; para leer","12 horas; para demarcar áreas en la balsa","24 horas; para señalizar al avión","6 horas; para cocinar"],1,"Las BARRAS FOSFORESCENTES son tubos plásticos transparentes con una duración de 12 HORAS. Su uso es DEMARCAR ÁREAS EN LA BALSA.","Supervivencia M3");
Q("su3","¿Cuándo se usan las BENGALAS?",["Apenas se aborda la balsa","Cuando se tiene la CERTEZA de que algún tipo de rescate está cerca","Cada 6 horas","Solo de noche"],1,"Las BENGALAS son para hacer señales pirotécnicas CUANDO SE TIENE LA CERTEZA DE QUE ALGÚN TIPO DE RESCATE ESTÁ CERCA. No se malgastan.","Supervivencia M3");
Q("su3","¿Cuál es el alcance aproximado del ESPEJO DE SEÑALES?",["1 km","5 km","18,5 km","50 km"],2,"El ESPEJO DE SEÑALES se usa de día con sol, e incluso en días brumosos y de noche con luna llena. Su alcance aproximado es de 18,5 KM.","Supervivencia M3");
Q("su3","¿Qué es el MARCADOR DE AGUA y cuánto dura?",["Un flotador; 24 horas","Polvo compacto colorante amarillo verdoso fosforescente, soluble en agua; dura aproximadamente 3½ horas en mar calmo y es TÓXICO","Una boya; 12 horas","Tinta permanente; 1 semana"],1,"MARCADOR DE AGUA: polvo compacto colorante (AMARILLO VERDOSO FOSFORESCENTE), soluble en agua (nieve o hielo). Duración aproximada de 3½ HORAS EN MAR CALMO. SON TÓXICOS.","Supervivencia M3");

Q("su4","¿Cuáles son los elementos de PROTECCIÓN del kit de supervivencia?",["Bengalas y espejo","Balde de achique, cortaplumas, esponja, inflador, kit farmacéutico, manual de la balsa, manual de supervivencia y parches tipo mariposa","Agua y caramelos","Toldo y silbato"],1,"Elementos de PROTECCIÓN: BALDE DE ACHIQUE · CORTAPLUMAS · ESPONJA · INFLADOR · KIT FARMACÉUTICO · MANUAL DE LA BALSA · MANUAL DE SUPERVIVENCIA · PARCHES TIPO MARIPOSA.","Supervivencia M4");
Q("su4","¿Para qué sirve el BALDE DE ACHIQUE?",["Para cocinar","Para sacar agua de la balsa y también para recolectar agua","Para inflar la balsa","Para guardar alimentos"],1,"BALDE DE ACHIQUE: flexible e impermeable, con borde superior metálico para facilitar su uso. Se utiliza para SACAR AGUA DE LA BALSA y RECOLECTAR AGUA.","Supervivencia M4");
Q("su4","¿Para qué se usa la ESPONJA del kit?",["Para limpiar el espejo","Para mantener la balsa y las personas SECAS","Para filtrar agua","Para tapar filtraciones"],1,"ESPONJA: fabricada de material orgánico absorbente. Se usa para MANTENER LA BALSA Y LAS PERSONAS SECAS.","Supervivencia M4");
Q("su4","¿Qué es el PARCHE TIPO MARIPOSA?",["Un vendaje del kit farmacéutico","Dos placas metálicas —una con borde de goma— unidas por un alambre que se ajusta mediante una mariposa, para reparar la balsa","Una señal de localización","Un flotador de emergencia"],1,"PARCHE TIPO MARIPOSA: cada parche tiene dos placas metálicas, una de ellas con un borde de goma, que se une a la otra por un alambre, AJUSTÁNDOSE MEDIANTE UNA MARIPOSA. Sirve para reparar perforaciones de la balsa.","Supervivencia M4");
Q("su4","¿Qué contiene el MANUAL DE SUPERVIVENCIA de la balsa?",["Solo instrucciones de la balsa","Información en INGLÉS sobre supervivencia en distintos entornos, hojas en blanco al inicio para la bitácora y temas religiosos al final","Mapas de navegación","Recetas de alimentos"],1,"MANUAL DE SUPERVIVENCIA: contiene información EN INGLÉS respecto a supervivencia en diferentes entornos. En su inicio trae HOJAS EN BLANCO DESTINADAS A BITÁCORA y en la parte final contiene TEMAS RELIGIOSOS. El MANUAL DE LA BALSA contiene información de funcionamiento y reparación.","Supervivencia M4");
Q("su4","¿Para qué es el AGUA del kit de supervivencia y cuándo se bebe?",["Para cocinar; de inmediato","Con fines de primeros auxilios; los adultos sanos no requieren agua hasta después de 24 horas","Para lavarse; cada 6 horas","Solo para los heridos; sin límite"],1,"El AGUA del kit es CON FINES DE PRIMEROS AUXILIOS, disponible en botellas o bolsas plásticas (cantidad variable según el avión). Se raciona. LOS ADULTOS SANOS NO REQUIEREN AGUA HASTA DESPUÉS DE 24 HORAS; antes de tomar la primera ración, conservarla en la boca mucho tiempo, enjuagar y luego tragar.","Supervivencia M4");
Q("su4","¿Por qué los CARAMELOS son la ración alimenticia de la balsa?",["Porque duran más","Por su alta concentración de glucosa y aporte de energía SIN necesidad de agua","Porque son livianos","Porque calman la sed"],1,"Los CARAMELOS son considerados raciones alimenticias POR SU ALTA CONCENTRACIÓN DE GLUCOSA Y APORTE DE ENERGÍA SIN LA NECESIDAD DE AGUA. Se racionan según la cantidad de personas y la situación, y se ingieren de preferencia DESPUÉS DE 24 HORAS.","Supervivencia M4");
Q("su4","¿Qué caso histórico ilustra la resiliencia humana en supervivencia?",["El vuelo 1549 en el Hudson","El vuelo 571 de la Fuerza Aérea Uruguaya, estrellado en los Andes el 13 de octubre de 1972","El accidente de Tenerife","El vuelo 232 de United"],1,"El Vuelo 571 de la Fuerza Aérea Uruguaya se estrelló en los Andes el 13/OCT/1972; los sobrevivientes fueron rescatados el 21/DIC/1972. La tragedia de los Andes revela la resiliencia humana: los 16 sobrevivientes («la Sociedad de la Nieve») enfrentaron condiciones extremas, y su COHESIÓN GRUPAL y adaptación son ejemplo de la capacidad de sobreponerse.","Supervivencia M4");
Q("su4","En el ejercicio de simulación en agua, ¿cuál es el orden de las prioridades a bordo de la balsa?",["Agua, alimento y luego protección","PROTECCIÓN → LOCALIZACIÓN → AGUA/ALIMENTOS","Localización primero siempre","Alimento, agua y refugio"],1,"Las acciones inmediatas en la balsa siguen el orden de prioridades: PROTECCIÓN → LOCALIZACIÓN → AGUA/ALIMENTOS. En la práctica: cortar mooring line, presentarse y contar, recuperar el kit, desplegar ancla, rescatar pasajeros a la deriva con la heaving line, activar ELT, inflar mástil, distribuir elementos del kit y colocar el toldo.","Supervivencia M4");
Q("su4","¿Con qué se rescata a los pasajeros que quedan a la deriva?",["Con el ancla","Con la heaving line (cuerda de rescate)","Con el balde de achique","Nadando hasta ellos"],1,"Para rescatar pasajeros a la deriva (conscientes e inconscientes) se usa la HEAVING LINE (cuerda de rescate). Forma parte de las acciones inmediatas en la balsa junto con cortar la mooring line, desplegar el ancla y activar el ELT.","Supervivencia M4");



C("su1","Prioridades de supervivencia","PROTECCIÓN → LOCALIZACIÓN → AGUA → ALIMENTO. Factores personales: control mental, experiencia e ingenio. La TC ejerce liderazgo positivo: ánimo alto y cohesión del grupo.");

const KEY="oyr-pia-v2";
let S={stats:{},best:0,exams:{},flights:[],daily:{last:null,streak:0,best:0},ach:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
/* migración desde la v1 (claves numéricas = orden original de OYR) */
try{
  const old=localStorage.getItem("oyr-pia-v1");
  if(old&&!localStorage.getItem(KEY+"-mig")){
    const O=JSON.parse(old);
    if(O&&O.stats){
      const oyrQ=QS.filter(q=>RAMO_OF_MOD[q.c]==="oyr");
      Object.keys(O.stats).forEach(k=>{const i=parseInt(k,10);if(!isNaN(i)&&oyrQ[i])S.stats[oyrQ[i].id]=O.stats[k];});
    }
    if(O&&O.best)S.best=Math.max(S.best,O.best);
    if(O&&O.daily)S.daily=O.daily;
    if(O&&O.ach)S.ach=Object.assign({},O.ach,S.ach);
    if(O&&O.flights)S.flights=O.flights;
    if(O&&Array.isArray(O.exams)&&O.exams.length)S.exams.oyr=O.exams;
    localStorage.setItem(KEY+"-mig","1");
  }
}catch(e){}
if(Array.isArray(S.exams))S.exams={oyr:S.exams};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function stat(id){return S.stats[id]||(S.stats[id]={s:0,r:0,w:0,last:null});}

/* ---------- MÉTRICAS ---------- */
function qsOf(sel){ /* sel: id de ramo o de módulo o null=todo */
  if(!sel)return QS;
  if(RAMO_BY_ID[sel])return QS.filter(q=>RAMO_OF_MOD[q.c]===sel);
  return QS.filter(q=>q.c===sel);
}
function cardsOf(sel){
  if(!sel)return CARDS;
  if(RAMO_BY_ID[sel])return CARDS.filter(c=>RAMO_OF_MOD[c.c]===sel);
  return CARDS.filter(c=>c.c===sel);
}
function mastery(sel){
  const qs=qsOf(sel);
  const dom=qs.filter(q=>{const st=S.stats[q.id];return st&&st.last==="r";}).length;
  return {dom,total:qs.length,pct:qs.length?Math.round(dom/qs.length*100):0};
}
function seen(sel){return qsOf(sel).filter(q=>{const st=S.stats[q.id];return st&&st.s>0;}).length;}
function failedOf(sel){return qsOf(sel).filter(q=>{const st=S.stats[q.id];return st&&st.last==="w";});}
function examsOf(rid){return S.exams[rid]||[];}
function examPassed(rid){return examsOf(rid).some(e=>e.pct>=(RAMO_BY_ID[rid]?RAMO_BY_ID[rid].ap:80));}
function ramoAprobado(rid){return mastery(rid).pct>=80&&examPassed(rid);}

let toastQ=[],toastBusy=false;
function toast(msg){toastQ.push(msg);if(!toastBusy)nextToast();}
function nextToast(){
  const m=toastQ.shift();
  if(m==null){toastBusy=false;return;}
  toastBusy=true;

const FRASES=["¿Lista para ganar altura hoy?","Cabina lista, mente lista.","Un metro más de pista cada día.","El uniforme está cada vez más cerca ✨","Hoy también se vuela alto.","Racha que se respeta no se corta 🔥","Tripulación constituida: tú y tus ganas."];
function animCount(el){
  const target=parseFloat(el.dataset.count||"0");const suf=el.dataset.suffix||"";
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||target<=0){el.textContent=Math.round(target)+suf;return;}
  const t0=performance.now();const dur=750;
  const tick=t=>{const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(target*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

/* Se muestra mientras la novedad sea reciente Y ella no la haya abierto todavía. */
const NOVEDADES={
  geo:"2026-07-27", abc:"2026-07-27", sup:"2026-07-27",
  bus:"2026-07-26", mapa:"2026-07-26", a320:"2026-07-26", pau:"2026-07-26", prevac:"2026-07-26"
};
const DIAS_NUEVO=21;
function esNuevo(id){
  const f=NOVEDADES[id];
  if(!f)return false;
  if(S.visto&&S.visto[id])return false;                      /* ya la abrió */
  const dias=(Date.now()-new Date(f+"T00:00:00").getTime())/86400000;
  return dias>=-1.5&&dias<=DIAS_NUEVO;   /* el margen cubre husos horarios por detrás */
}
function tagNuevo(id){return esNuevo(id)?'<span class="tag-new">nuevo</span>':"";}
function marcarVisto(id){
  if(!id||!NOVEDADES[id])return;
  S.visto=S.visto||{};
  if(!S.visto[id]){S.visto[id]=todayStr();save();}
}

/* ---------- SELECCIÓN DE PREGUNTAS ---------- */
let recent=[];
function pickQ(sel){
  let pool=qsOf(sel);
  const fresh=pool.filter(x=>recent.indexOf(x.id)<0);
  if(fresh.length>=3)pool=fresh;
  let total=0;const weights=pool.map(x=>{
    const st=S.stats[x.id];let w;
    if(!st||st.s===0)w=4;
    else w=1+3*(st.w/(st.r+st.w||1))+(st.last==="w"?2:0);
    total+=w;return w;
  });
  let r=Math.random()*total;
  for(let k=0;k<pool.length;k++){r-=weights[k];if(r<=0){remember(pool[k].id);return pool[k];}}
  const last=pool[pool.length-1];remember(last.id);return last;
}
function remember(id){recent.push(id);if(recent.length>10)recent.shift();}
function record(q,ok){const st=stat(q.id);st.s++;ok?st.r++:st.w++;st.last=ok?"r":"w";save();checkAch();}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ================= RULETA ================= */
let wheelRot=0;
function Wheel(rid){
  const r=RAMO_BY_ID[rid], mods=r.mods;
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`
    <button class="backbtn">← ${esc(r.n)}</button>
    <div class="eyebrow">Modo ruleta · ${esc(r.n)}</div>
    <h2>Gira y responde</h2>
    <p class="sub">La ruleta favorece un poquito tus módulos más débiles.</p>
    <div class="wheelwrap">
      <div class="hud">
        <div class="stat"><b id="hudStreak">${session.streak}</b><span>Racha</span></div>
        <div class="stat"><b id="hudPts">${session.points}</b><span>Puntos</span></div>
        <div class="stat"><b>${S.best}</b><span>Récord</span></div>
      </div>
      <div class="wheelbox">
        <div class="pointer"></div>
        <svg viewBox="0 0 220 220" aria-label="Ruleta de módulos"><g id="wheelG"></g>
          <circle cx="110" cy="110" r="26" fill="var(--glass-strong)" stroke="var(--line)" stroke-width="2"></circle>
          <text x="110" y="117" text-anchor="middle" font-size="20">${r.ic}</text>
        </svg>
      </div>
      <button class="spin-btn" id="spinBtn">Girar</button>
    </div>`;
  el.querySelector(".backbtn").addEventListener("click",()=>go(RamoHome,rid));
  view.appendChild(el);
  const g=el.querySelector("#wheelG");
  const N=mods.length, step=360/N;
  const pal=["#4A7FC1","#2E9E8F","#7D6BC6","#E8850C","#C05572","#4E8FA8"];
  const CX=110, CY=110;   /* centro real del viewBox: el giro pivotea aquí */
  mods.forEach((mo,i)=>{
    const a0=(i*step-90)*Math.PI/180, a1=((i+1)*step-90)*Math.PI/180, R=104;
    const x0=CX+Math.cos(a0)*R,y0=CY+Math.sin(a0)*R,x1=CX+Math.cos(a1)*R,y1=CY+Math.sin(a1)*R;
    const large=step>180?1:0;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M${CX} ${CY} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`);
    p.style.fill=pal[i%pal.length];
    p.style.stroke="var(--sky-mid)";p.setAttribute("stroke-width","2.5");
    g.appendChild(p);
    const mid=(i*step+step/2-90)*Math.PI/180, r2=66;
    const tx=(CX+Math.cos(mid)*r2).toFixed(1), ty=(CY+Math.sin(mid)*r2).toFixed(1);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",tx);t.setAttribute("y",ty);
    t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");
    t.setAttribute("font-size","8");t.setAttribute("font-weight","800");t.setAttribute("fill","#fff");
    t.setAttribute("transform",`rotate(${i*step+step/2} ${tx} ${ty})`);
    t.textContent=(mo.n.length>16?mo.n.slice(0,15)+"…":mo.n).toUpperCase();
    g.appendChild(t);
  });
  g.style.transform=`rotate(${wheelRot}deg)`;
  el.querySelector("#spinBtn").addEventListener("click",()=>{
    const btn=el.querySelector("#spinBtn");btn.disabled=true;
    let tot=0;const ws=mods.map(mo=>{const w=1+(100-mastery(mo.id).pct)/40;tot+=w;return w;});
    let rr=Math.random()*tot,idx=0;
    for(let i=0;i<N;i++){rr-=ws[i];if(rr<=0){idx=i;break;}}
    const jitter=(Math.random()*(step*0.6)-step*0.3);
    const target=-(idx*step+step/2)+jitter;
    const cur=((wheelRot%360)+360)%360;
    wheelRot+=5*360+((((target-cur)%360)+360)%360);
    g.style.transform=`rotate(${wheelRot}deg)`;
    const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(()=>{
      go(Question,{sel:mods[idx].id,mode:"wheel",rid,onNext:()=>go(Wheel,rid)});
    },reduced?150:3500);
  });
}

/* ================= PREGUNTA ================= */
function Question(ctx){
  const q=ctx.q||pickQ(ctx.sel);
  const mo=MOD_BY_ID[q.c], ra=RAMO_BY_ID[RAMO_OF_MOD[q.c]];
  const order=shuffle(q.o.map((_,k)=>k));
  const el=document.createElement("div");el.className="screen";
  const counter=ctx.total?`<span class="q-count">PREG ${String(ctx.n).padStart(2,"0")}/${ctx.total}</span>`
    :`<span class="q-count">RACHA ${session.streak}</span>`;
  el.innerHTML=`
    <button class="backbtn">← ${ctx.mode==="wheel"?"Ruleta":ctx.mode==="exam"?"Abandonar examen":"Salir"}</button>
    <div class="q-meta">
      <span class="chip" style="background:${ra.col}">${ra.ic} ${esc(mo.n)}</span>
      ${counter}
    </div>
    <div class="q-card">
      <div class="q-text">${esc(q.q)}</div>
      <div class="opts"></div>
      <div class="after"></div>
    </div>`;
  el.querySelector(".backbtn").addEventListener("click",()=>{
    if(ctx.mode==="wheel")go(Wheel,ctx.rid);
    else if(ctx.mode==="study")go(ModPick,ctx.rid);
    else if(ctx.rid)go(RamoHome,ctx.rid);
    else go(Home);
  });
  const opts=el.querySelector(".opts");
  const letters=["A","B","C","D"];
  let answered=false;
  order.forEach((oi,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="key">${letters[k]}</span><span>${esc(q.o[oi])}</span>`;
    b.addEventListener("click",()=>{
      if(answered)return;answered=true;
      const ok=oi===q.a;
      [...opts.children].forEach((btn,j)=>{
        btn.disabled=true;
        if(order[j]===q.a)btn.classList.add("correct");
        else if(j===k&&!ok)btn.classList.add("wrong");
        else btn.classList.add("dim");
      });
      record(q,ok);
      if(ctx.mode==="wheel"){
        if(ok){session.streak++;session.points+=10+Math.min(session.streak,5)*2;if(session.streak>S.best){S.best=session.streak;save();}}
        else session.streak=0;
      }
      const after=el.querySelector(".after");
      const cheers=["¡Eso, tripulante! 🛫","¡Perfecto! ✨","¡Cabina libre! ✅","¡Directo al mando! 👩‍✈️","¡Correctísimo! 🎯"];
      const ouch=["Casi… mira el porqué 👇","No era esa, pero ahora no se te olvida:","A revisar el detalle:","Tranquila, esta cae de nuevo:"];
      const head=ok?cheers[Math.floor(Math.random()*cheers.length)]:ouch[Math.floor(Math.random()*ouch.length)];
      const extra=ctx.mode==="exam"?"":`<div class="why">${esc(q.w)}<span class="src">Fuente: ${esc(q.s)} · ALAS</span></div>`;
      after.innerHTML=`<div class="verdict ${ok?"ok":"bad"}">${ok?"✔":"✘"} ${head}</div>${extra}
        <button class="next-btn">${ctx.mode==="exam"?(ctx.n<ctx.total?"Siguiente pregunta →":"Ver resultado ✈"):"Continuar →"}</button>`;
      after.querySelector(".next-btn").addEventListener("click",()=>ctx.onNext(q,oi,ok));
      after.querySelector(".next-btn").focus();
    });
    opts.appendChild(b);
  });
  const keyH=(ev)=>{const idx="1234".indexOf(ev.key);if(idx>=0&&idx<order.length&&!answered)opts.children[idx].click();};
  document.addEventListener("keydown",keyH);
  view.appendChild(el);
  const obs=new MutationObserver(()=>{if(!document.body.contains(el)){document.removeEventListener("keydown",keyH);obs.disconnect();}});
  obs.observe(view,{childList:true});
}

function ModPick(rid){

function startStudy(mid,rid){
  const qs=qsOf(mid).slice();
  qs.sort((a,b)=>{
    const sa=S.stats[a.id],sb=S.stats[b.id];
    const ka=sa?(sa.last==="w"?0:sa.s?2:1):1, kb=sb?(sb.last==="w"?0:sb.s?2:1):1;
    return ka-kb||Math.random()-0.5;
  });
  runSeq(qs,"study",rid,mid);
}
function runSeq(qs,mode,rid,mid){
  let n=0,rights=0;
  const step=()=>{
    if(n>=qs.length){go(SeqDone,{rights,total:qs.length,mode,rid,mid});return;}
    go(Question,{q:qs[n],mode,n:n+1,total:qs.length,rid,onNext:(q,oi,ok)=>{if(ok)rights++;n++;step();}});
  };
  step();
}
function SeqDone(r){
  const el=document.createElement("div");el.className="screen";
  const pct=Math.round(r.rights/r.total*100), nice=pct>=80;
  let extra="";
  if(r.mode==="daily"){
    const t=todayStr();
    if(S.daily.last!==t){
      S.daily.streak=(S.daily.last===yesterdayStr())?S.daily.streak+1:1;
      S.daily.last=t;S.daily.best=Math.max(S.daily.best||0,S.daily.streak);save();
    }
    checkAch();
    extra=`<p class="sub" style="margin-top:10px">🔥 Racha: <b>${S.daily.streak} día${S.daily.streak===1?"":"s"}</b> — nos vemos mañana.</p>`;
  }
  const title=r.mode==="redo"?"Repaso de errores":r.mode==="daily"?"Vuelo del día":"Estudio · "+(MOD_BY_ID[r.mid]?MOD_BY_ID[r.mid].n:"");
  el.innerHTML=`
    <div class="result-hero">
      <div class="eyebrow">${esc(title)}</div>
      <div class="score">${r.rights}/${r.total}</div>
      <p class="sub">${nice?"¡Dominado! Sigue así y el examen será un paseo.":"Buen avance — lo que fallaste volverá a aparecer hasta que caiga."}</p>
      <span class="stamp ${nice?"ok":"bad"}">${r.mode==="daily"?"Hecho por hoy":nice?"Módulo OK":"En progreso"}</span>
      ${extra}
    </div>
    <div class="flash-nav">
      <button id="again">Repetir</button>
      <button class="primary" id="menu">Volver</button>
    </div>`;
  el.querySelector("#again").addEventListener("click",()=>{
    if(r.mode==="redo")go(Redo,r.rid); else if(r.mode==="daily")runDaily(); else startStudy(r.mid,r.rid);
  });
  el.querySelector("#menu").addEventListener("click",()=>r.rid?go(RamoHome,r.rid):go(Home));
  view.appendChild(el);
  if(nice)confetti();
}
function runDaily(){
  const used={},idxs=[];let guard=0;
  while(idxs.length<10&&guard++<400){const q=pickQ(null);if(!used[q.id]){used[q.id]=1;idxs.push(q);}}
  runSeq(idxs,"daily",null,null);

function Redo(rid){

    const n=Math.min(10,qsOf(mo.id).length);
    const b=document.createElement("button");b.className="card-btn";

      <span class="cat-name">${esc(mo.n)}</span><span class="cat-pct">${n} preg</span></div>`;
    b.addEventListener("click",()=>runExam(rid,mo.id));
    grid.appendChild(b);
  });
  view.appendChild(el);
}
function runExam(rid,mid){
  const r=RAMO_BY_ID[rid];
  let sel=[];
  if(mid){ sel=shuffle(qsOf(mid)).slice(0,10); }
  else{
    const per=Math.max(1,Math.floor(20/r.mods.length));
    r.mods.forEach(mo=>{sel=sel.concat(shuffle(qsOf(mo.id)).slice(0,per));});
    const restPool=shuffle(qsOf(rid).filter(q=>sel.indexOf(q)<0));
    while(sel.length<20&&restPool.length)sel.push(restPool.pop());
    sel=shuffle(sel).slice(0,20);
  }
  const answers=[];const t0=Date.now();let n=0;
  const step=()=>{
    if(n>=sel.length){go(finishExam,rid,mid,sel,answers,Date.now()-t0);return;}
    go(Question,{q:sel[n],mode:"exam",n:n+1,total:sel.length,rid,onNext:(q,oi,ok)=>{answers.push({q,oi,ok});n++;step();}});
    const meta=view.querySelector(".q-meta");
    if(meta){
      const t=document.createElement("span");t.className="timer";meta.appendChild(t);
      if(examT)clearInterval(examT);
      examT=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);
        t.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);
    }
  };
  step();
}
function finishExam(rid,mid,sel,answers,ms){
  if(examT){clearInterval(examT);examT=null;}
  const r=RAMO_BY_ID[rid];
  const right=answers.filter(a=>a.ok).length;
  const pct=Math.round(right/sel.length*100);
  const pass=pct>=r.ap;
  const mins=Math.floor(ms/60000),secs=Math.floor(ms/1000)%60;
  if(!mid){
    S.exams[rid]=S.exams[rid]||[];
    S.exams[rid].push({d:todayStr(),pct,right,total:sel.length,t:`${mins}:${String(secs).padStart(2,"0")}`});
    if(S.exams[rid].length>12)S.exams[rid]=S.exams[rid].slice(-12);
    save();
  }
  checkAch();
  const el=document.createElement("div");el.className="screen";
  const wrongs=answers.filter(a=>!a.ok);
  el.innerHTML=`
    <div class="result-hero">
      <div class="eyebrow">${mid?"Examen de módulo · "+esc(MOD_BY_ID[mid].n):"Examen · "+esc(r.n)} · ${mins}:${String(secs).padStart(2,"0")} min</div>
      <div class="score">${pct}%</div>
      <p class="sub">${right} de ${sel.length} correctas · aprobación ${r.ap}%</p>
      <span class="stamp ${pass?"ok":"bad"}">${pass?(pct>=95?"Excelencia":"Aprobado"):"Reintentar"}</span>
      <p class="sub" style="margin-top:12px">${pass?(pct>=95?"Nivel jefa de cabina. Impecable, "+NOMBRE+" 👑":"¡Aprobado! El cielo te queda cerca ✈"):"Aún no — revisa abajo tus errores con la explicación y vuelve a intentarlo."}</p>
    </div>
    ${wrongs.length?`<h2 style="margin-top:22px">Revisión de errores</h2><div class="review-list"></div>`:""}
    <div class="flash-nav" style="margin-top:18px">
      <button id="again">Nuevo examen</button>
      <button class="primary" id="menu">Volver al ramo</button>
    </div>`;
  const list=el.querySelector(".review-list");
  if(list)wrongs.forEach(a=>{
    const d=document.createElement("div");d.className="review-item";
    d.innerHTML=`<div class="rq">${esc(a.q.q)}</div>
      <div class="ra">Tu respuesta: <b class="badtxt">${esc(a.q.o[a.oi])}</b><br>Correcta: <b class="good">${esc(a.q.o[a.q.a])}</b></div>
      <div class="why" style="margin-top:9px">${esc(a.q.w)}<span class="src">Fuente: ${esc(a.q.s)} · ALAS</span></div>`;
    list.appendChild(d);
  });
  el.querySelector("#again").addEventListener("click",()=>runExam(rid,mid));
  el.querySelector("#menu").addEventListener("click",()=>go(RamoHome,rid));
  view.appendChild(el);
  if(pass)confetti();
}

function Flash(rid){
  const r=RAMO_BY_ID[rid];

    const el=document.createElement("div");el.className="screen";

    view.appendChild(el);return;
  }

  el.innerHTML=`<button class="backbtn">← ${esc(r.n)}</button>
    <div class="eyebrow">Tarjetas · ${esc(r.n)}</div>
    <h2>Toca la tarjeta para voltearla</h2>
    <div class="chips-row"></div>
    <div class="flash" tabindex="0" role="button" aria-label="Voltear tarjeta">
      <div class="flash-inner"><div class="face front"></div><div class="face back"></div></div>
    </div>
    <div class="flash-nav">
      <button id="prev">← Anterior</button>
      <button class="primary" id="next">Siguiente →</button>
    </div>`;
  el.querySelector(".backbtn").addEventListener("click",()=>go(RamoHome,rid));
  const chips=el.querySelector(".chips-row");
  const all=document.createElement("button");all.className="fchip on";all.textContent="Todas";
  all.addEventListener("click",()=>{sel=null;rebuild();});
  chips.appendChild(all);
  const withCards=r.mods.filter(mo=>cardsOf(mo.id).length);
  withCards.forEach(mo=>{
    const b=document.createElement("button");b.className="fchip";
    b.textContent=mo.n.length>18?mo.n.slice(0,17)+"…":mo.n;
    b.addEventListener("click",()=>{sel=mo.id;rebuild();});
    chips.appendChild(b);
  });
  const flash=el.querySelector(".flash");
  function rebuild(){
    [...chips.children].forEach((b,k)=>b.classList.toggle("on",sel==null?k===0:withCards[k-1]&&withCards[k-1].id===sel));
    deck=shuffle(cardsOf(sel||rid));i=0;render();
  }
  function render(){
    const c=deck[i];const mo=MOD_BY_ID[c.c];
    flash.classList.remove("flipped");
    el.querySelector(".front").innerHTML=`<span class="chip" style="background:${r.col}">${esc(mo.n)}</span>
      <div class="fq">${esc(c.f)}</div><span class="hint">Tarjeta ${i+1}/${deck.length} · toca para ver</span>`;
    el.querySelector(".back").innerHTML=`<div class="fa">${esc(c.b)}</div><span class="hint">Curso TAC · ALAS</span>`;
  }
  flash.addEventListener("click",()=>flash.classList.toggle("flipped"));
  flash.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flash.classList.toggle("flipped");}});
  el.querySelector("#next").addEventListener("click",()=>{i=(i+1)%deck.length;render();});
  el.querySelector("#prev").addEventListener("click",()=>{i=(i-1+deck.length)%deck.length;render();});
  view.appendChild(el);
  render();
}

/* ================= PASAPORTE ================= */
function Passport(){
  const el=document.createElement("div");el.className="screen";
  const ri=rankIdx();
  el.innerHTML=`<button class="backbtn">← Menú</button>
    <div class="eyebrow">Documento de viaje</div>
    <h2>🛂 Pasaporte de ${NOMBRE}</h2>
    <div class="rankrow">
      <span class="epaulette">${ri?"<i></i>".repeat(ri):'<i class="off"></i>'}</span>
      <span class="rankname">${RANKS[ri][0]}</span>
      <span class="ranknext">${ri>=5?"Rango máximo 👑":`Siguiente: ${RANKS[ri+1][0]} al ${RANKS[ri+1][1]}%`}</span>
    </div>
    <p class="sub">Un ramo recibe su timbre cuando llegas al 80% de dominio Y apruebas su examen.</p>
    <div class="passport"></div>
    <h2 style="margin-top:22px">Insignias 🏅</h2>
    <div class="badges"></div>
    <h2 style="margin-top:22px">Turnos de vuelo 🧭</h2>
    <ul class="exam-history">${(S.flights||[]).length?S.flights.slice().reverse().map(f=>`<li>${f.d} — ${f.pct}% (${f.right}/${f.total} decisiones)</li>`).join(""):"<li>Aún sin turnos volados.</li>"}</ul>
    <h2 style="margin-top:22px">Respaldo 💾</h2>
    <p class="sub">Tu progreso vive en este navegador. Copia tu respaldo de vez en cuando y podrás restaurarlo aquí o en otro dispositivo.</p>
    <div class="backup-box">
      <button id="exp">📋 Copiar respaldo</button>
      <button id="imp">📥 Restaurar respaldo</button>
    </div>
    <button class="danger" id="reset">Borrar todo mi progreso</button>`;
  el.querySelector(".backbtn").addEventListener("click",()=>go(Home));
  const pp=el.querySelector(".passport");
  RAMOS.forEach(r=>{
    const m=mastery(r.id), ok=ramoAprobado(r.id), ex=examsOf(r.id);
    const best=ex.length?Math.max(...ex.map(e=>e.pct)):null;
    const d=document.createElement("div");d.className="pp-row";
    d.innerHTML=`${ok?'<span class="pp-stamp">✈ Aprobado</span>':""}
      <div class="cat-row"><span class="cat-dot" style="background:${r.col}"></span>
      <span class="cat-name">${r.ic} ${esc(r.n)}</span><span class="cat-pct">${m.pct}%</span></div>
      <div class="bar"><i style="width:${m.pct}%;background:${r.col}"></i></div>
      <div class="cat-sub">${m.dom} de ${m.total} preguntas dominadas · examen: ${best!=null?best+"% (mejor de "+ex.length+")":"pendiente"}</div>`;
    pp.appendChild(d);
  });
  const bg=el.querySelector(".badges");
  ACH.forEach(a=>{
    const got=!!S.ach[a.id];
    const d=document.createElement("div");d.className="badge"+(got?"":" locked");
    d.innerHTML=`<div class="bi">${a.icon}</div><div class="bn">${a.n}</div><div class="bd">${got?"Conseguida el "+S.ach[a.id]:a.d}</div>`;
    bg.appendChild(d);
  });
  el.querySelector("#exp").addEventListener("click",async()=>{
    const code="OYR2."+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{await navigator.clipboard.writeText(code);toast("Respaldo copiado ✔");}
    catch(e){prompt("Copia este código de respaldo:",code);}
  });
  el.querySelector("#imp").addEventListener("click",()=>{
    const code=prompt("Pega aquí tu código de respaldo:");
    if(!code)return;
    try{
      const S2=JSON.parse(decodeURIComponent(escape(atob(code.trim().replace(/^OYR\d\./,"")))));
      if(!S2||typeof S2!=="object"||!S2.stats)throw 0;
      S=Object.assign({stats:{},best:0,exams:{},flights:[],daily:{last:null,streak:0,best:0},ach:{},alfa:{best:0,fallos:{},vistas:0},geo:{best:0,fallos:{},recordReloj:0}},S2);
      if(Array.isArray(S.exams))S.exams={oyr:S.exams};
      save();toast("Progreso restaurado ✔");go(Passport);
    }catch(e){toast("Ese código no es válido");}
  });
  el.querySelector("#reset").addEventListener("click",()=>{
    if(confirm("¿Segura que quieres borrar todo el progreso? Esto no se puede deshacer.")){
      S={stats:{},best:0,exams:{},flights:[],daily:{last:null,streak:0,best:0},ach:{},alfa:{best:0,fallos:{},vistas:0},geo:{best:0,fallos:{},recordReloj:0}};save();
      session={streak:0,points:0};go(Passport);
    }
  });
  view.appendChild(el);
}

];
const SIM_PICK=[1,1,1,2,2,1,3,1,2];
const SIM=[
/* F0 · Presentación */
{ph:0,set:"Hoy vuelas SCL → Lima como TAC 3 en un A320.",t:"Llegas a la puerta de embarque justo a la hora de salida del vuelo y el TAC1 te llama la atención. ¿Por qué?",o:["Porque la ejecución normal del vuelo comienza con la presentación de la TAC una hora antes del vuelo","Porque había que llegar 15 minutos antes","Porque el briefing es después del embarque","No tiene razón: basta llegar antes del cierre de puertas"],a:0,w:"La ejecución normal del vuelo comienza con la presentación de la TAC en la puerta de embarque UNA HORA antes del vuelo, y termina al completar el post vuelo.",s:"Día 1"},
{ph:0,set:"Preparas tu bolso la noche anterior: llevas licencia con habilitación, credencial y cédula.",t:"El vuelo es internacional (SCL → Lima). ¿Qué documentos te faltan?",o:["Ninguno, con eso basta","Bitácora de vuelo, CMA vigente y pasaporte vigente","Solo el pasaporte","Certificado de antecedentes y pasaporte"],a:1,w:"El TCP porta: bitácora (experiencia reciente), licencia con habilitación, CMA vigente, credencial, cédula y pasaporte vigente en vuelos internacionales y regionales. Chequear documentación es tarea del día anterior.",s:"Día 1"},
{ph:0,set:"Revisas tus documentos antes de salir de casa.",t:"Notas que tu CMA (Certificación Médica Aeronáutica) venció ayer. ¿Qué corresponde?",o:["Volar igual y renovarla a la vuelta","No estás habilitada para volar: la vigencia de tus documentos es tu responsabilidad y debes reportarlo","Pedirle permiso al TAC1 para volar sin CMA","Basta con llevar la licencia"],a:1,w:"Es responsabilidad del TAC contar con todo documento VIGENTE. Sin CMA vigente no se está habilitado; corresponde reportarlo de inmediato.",s:"Día 1"},
/* F1 · Briefing */
{ph:1,set:"En la sala designada, el TAC1 informa matrícula, cantidad de pax y horarios. Luego el Comandante realiza su reunión breve con la tripulación de cabina.",t:"Al terminar esa reunión, ¿qué acaba de ocurrir formalmente?",o:["Se dio inicio al embarque","Se dio por constituida la tripulación","Se cerró el plan de vuelo","Nada formal: es solo protocolo"],a:1,w:"Tras el briefing operacional del Comandante (crew coordination) se da por CONSTITUIDA la tripulación.",s:"Día 1"},
{ph:1,set:"El Comandante desarrolla su briefing operacional.",t:"Entre los puntos que aborda está el acceso al cockpit. ¿Qué coordina al respecto?",o:["Las 3 claves de acceso","Que la puerta quedará abierta en crucero","Que nadie puede acercarse al área crítica","La contraseña del wifi de cabina"],a:0,w:"El briefing operacional aborda: documentación, PSV y hora máx. de apertura de puertas, RT e INFOPS, ruta, aeronave, pax/carga, ACCESO AL COCKPIT (3 CLAVES), combustible y recomendaciones.",s:"Día 1"},
/* F2 · Pre-vuelo a bordo */
{ph:2,set:"Abordas el avión por primera vez en el día.",t:"¿Qué corresponde hacer en tu zona antes del embarque?",o:["Preparar el carro de servicio","Asegurar tu equipaje en el lugar designado y chequear los equipos de emergencia: cantidad, ubicación y operatividad","Esperar instrucciones del Comandante en el jumpseat","Revisar los pasaportes de los pasajeros"],a:1,w:"En el pre-vuelo a bordo cada TAC asegura su equipaje y efectúa el chequeo de equipos de emergencia (EEL: cantidad, ubicación, operatividad), más elementos de servicio y aseo de cabina y baños.",s:"Día 1"},
{ph:2,set:"Durante tu chequeo encuentras una linterna de emergencia inoperativa.",t:"¿Dónde queda registrado el hallazgo?",o:["En un mensaje de WhatsApp al supervisor","En el CLB (Cabin Log Book), escrito en inglés","En la tarjeta de seguridad del asiento","No se registra si hay otra linterna"],a:1,w:"El CLB registra uso, deterioro o daño de equipos de emergencia y fallas de sistemas de cabina. Se escribe en INGLÉS y el TAC1 lo chequea antes del vuelo para constatar acciones correctivas.",s:"Día 1"},
{ph:2,set:"Te toca el chequeo de asientos de tu zona.",t:"¿Cuántos asientos revisas como mínimo y qué buscas en cada uno?",o:["Todos los asientos del avión, solo el cinturón","Al menos 8 asientos aleatorios: cinturón, cojín de flotación/salvavidas y tarjeta de seguridad","4 asientos de la primera fila","Solo los asientos de salida de emergencia"],a:1,w:"Durante el chequeo pre-vuelo se revisan AL MENOS 8 ASIENTOS ALEATORIOS de la zona asignada: cinturón de seguridad, cojín como flotación/salvavidas y tarjeta de seguridad (o de salida de emergencia si corresponde).",s:"Día 3"},
/* F3 · Embarque */
{ph:3,set:"Embarque en curso. Un pasajero sentado junto a la ventana te hace señas.",t:"Te dice: «señorita, el ala tiene como una capa de hielo». ¿Qué haces?",o:["Le explicas que el avión resiste el hielo","Reportas INMEDIATAMENTE al Comandante","Lo anotas para comentarlo en el debriefing","Avisas a mantenimiento cuando termine el embarque"],a:1,w:"Clean Aircraft Concept: prohibido despegar con hielo adherido a superficies críticas. El TAC reporta INMEDIATAMENTE al Comandante si observa o recibe información de contaminación en las alas.",s:"Día 2"},
{ph:3,set:"Sube un pasajero con un violonchelo con asiento pagado (CBBG).",t:"¿Dónde lo ubicas?",o:["En cualquier asiento libre","En asiento ventana, con el pasajero en el asiento contiguo, cubierto y sujeto con cinturón (más extensión si hace falta)","En la fila de salida de emergencia, que tiene más espacio","De pie en el galley posterior"],a:1,w:"El CBBG va en asiento VENTANA (no restringe el pasillo), pax al lado, máximo 1 asiento extra por pax, sin mercancías peligrosas, sin tapar letreros y totalmente cubierto, asegurado con el cinturón.",s:"Día 2"},
{ph:3,set:"Hoy viaja en el jumpseat 4R una inspectora ajena a la tripulación.",t:"En tu briefing le muestras cinturón/arnés, PSU, chaleco spare amarillo y la tarjeta. ¿Qué instrucción clave le das para una evacuación?",o:["«Usted salta primero por el tobogán»","«En caso de evacuación, usted deberá detener a los pasajeros mientras yo abro la puerta»","«Usted infla el tobogán con la palanca roja»","«Usted queda a cargo de dar las órdenes»"],a:1,w:"El briefing a persona ajena en jumpseat cierra con: «en caso de evacuación, usted deberá detener a los pasajeros mientras yo abro la puerta». Debe cumplir los mismos requisitos que un pax de salida de emergencia.",s:"Día 2"},
{ph:3,set:"En la fila de salida de emergencia hay un adolescente de 14 años viajando solo.",t:"¿Qué corresponde?",o:["Puede quedarse si es alto y fuerte","Reubicarlo: no cumple la edad mínima de 15 años para ocupar salida de emergencia","Pedirle autorización a los padres por teléfono","Hacerle el briefing igual y dejarlo"],a:1,w:"Para ocupar asiento en salida de emergencia se requiere al menos 15 AÑOS (además de poder operar la salida). Si un pax no cumple requisitos y rehúsa cambiarse: informar al TAC1 y al Comandante.",s:"Día 2"},
{ph:3,set:"Una pasajera embarazada de 32 semanas embarca sonriente.",t:"¿Qué debes verificar?",o:["Nada, puede volar libremente","Que cuente con Medif: entre las semanas 29 y 38 se requiere el certificado médico de compatibilidad con el vuelo","Que viaje acompañada","Que se siente cerca del baño"],a:1,w:"El Medif es exigible a embarazadas desde la semana 29 a la 38 (entre otros casos: infantes <7 días, post cirugía, infectocontagiosas, yeso en extremidad inferior, concentrador de O2…).",s:"Día 2"},
{ph:3,set:"Llega a la puerta un container refrigerado: transporte de órganos.",t:"¿Cuál es el procedimiento?",o:["Se guarda en un OHB libre","El TAC1 lo recibe con su documentación, se guarda en el cockpit y el Comandante es notificado mediante NOTOC","Se amarra en un asiento CBBG","Se rechaza: no pueden viajar órganos en cabina"],a:1,w:"TAC1 recibe container + documentación → se guardan en el COCKPIT → Comandante notificado mediante NOTOC (Notification to Captain).",s:"Día 4"},
/* F4 · Cierre y armado */
{ph:4,must:1,type:"order",t:"Terminó el embarque. Ordena la secuencia correcta desde aquí hasta los toboganes armados:",items:["Confirmar briefings realizados, equipaje asegurado y pax en sus asientos","Con el total de pax informado, solicitar al Piloto al Mando la autorización de cierre","Cerrar puertas y verificar su estado en el FAP","Retiro de puente/escalera y área adyacente despejada","Orden del Piloto al Mando vía PA: «puertas en automático, cross check y reportar»","TACs arman toboganes, hacen cross check y reportan"],w:"El TAC1 confirma briefings/equipaje/pax → solicita autorización de cierre al Piloto al Mando → cierre y verificación en FAP → retirado el puente y despejada el área, el Piloto al Mando ordena por PA el armado → los TAC arman, cross check y reportan.",s:"Día 3"},
{ph:4,set:"Recién cerradas las puertas, escuchas por PA: «TRIPULACIÓN, PUERTAS EN MANUAL, CROSS CHECK Y REPORTAR».",t:"¿Es la orden que esperabas?",o:["Sí, es la orden estándar tras el cierre","No: para el armado de toboganes la orden es «puertas en AUTOMÁTICO»; «en manual» corresponde al desarmado en el arribo","Sí, manual y automático son sinónimos","No: la orden correcta es «cabina libre»"],a:1,w:"Armado (salida): «PUERTAS EN AUTOMÁTICO, CROSS CHECK Y REPORTAR». Desarmado (arribo): «PUERTAS EN MANUAL, CROSS CHECK Y REPORTAR».",s:"Día 3"},
{ph:4,set:"El Comandante informa que la puerta 4R quedó inoperativa para este vuelo.",t:"¿Cómo cambia la demostración de seguridad?",o:["No cambia","Se hace en vivo excluyendo la salida afectada, y la puerta inoperativa se señaliza visiblemente con cartel","Se omite la demo","Se hace solo en video"],a:1,w:"Con salida inoperativa: el Comandante instruye al TAC1 (pax, ubicaciones, bloqueo de filas), los pasajeros son advertidos, la demo se hace EN VIVO excluyendo la salida afectada y la puerta se indica VISIBLEMENTE con cartel.",s:"Día 3"},
/* F5 · Despegue */
{ph:5,set:"El avión rueda a la pista. Suena: «TRIPULACIÓN, PRÓXIMOS AL DESPEGUE». La TAC2 sigue asegurando un galley.",t:"¿Cuándo puede darse el reporte de cabina libre?",o:["Ahora mismo, el galley puede esperar","Solo cuando todos los TAC estén sentados y asegurados con cinturón y arnés","Después de rotar en el despegue","Cuando lo pida un pasajero"],a:1,w:"El reporte de CABINA LIBRE debe efectuarse cuando los TAC están SENTADOS y asegurados con cinturón y arnés. TAC1 deja el FAP en CABIN STATUS y presiona CABIN READY desde su asiento.",s:"Día 3"},
{ph:5,set:"Sentada en tu jumpseat mirando hacia atrás del avión, adoptas tu posición: cabeza contra el apoyacabeza, pies separados, manos sobre las piernas.",t:"Mientras tanto haces tu revisión silenciosa. ¿Qué repasas?",o:["El menú del servicio y las ventas del duty free","Órdenes para evacuar, salidas a utilizar, geografía, equipos EGA, ABP, toboganes y pax a cargo","La lista de pasajeros frecuentes","Los anuncios de bienvenida"],a:1,w:"Revisión silenciosa (silence review): órdenes para evacuar, salidas a utilizar, geografía, equipos de emergencia, ABP, toboganes y pasajeros a cargo. Se repite en el descenso.",s:"Día 4"},
/* F6 · Crucero */
{ph:6,set:"A los 20 minutos de crucero el avión empieza a sacudirse: turbulencia moderada sin aviso.",t:"¿Qué haces primero?",o:["Seguir el servicio con cuidado","Leer la fraseología de turbulencia («vuelve a tu asiento y abrocha tu cinturón»), asegurar cabina y asegurarte tú","Llamar al cockpit para preguntar qué pasa","Repartir chalecos salvavidas"],a:1,w:"Ante turbulencia: anuncio «Estamos pasando por una zona de turbulencia. Vuelve a tu asiento y abrocha tu cinturón de seguridad», verificación de cabina y tripulación asegurada. No se interrumpe al cockpit en cabina estéril salvo emergencia.",s:"Día 4"},
{ph:6,set:"A 35.000 ft, el Primer Oficial necesita salir del cockpit al baño.",t:"¿Qué debe ocurrir mientras está fuera?",o:["Nada especial, es un momento corto","Un TAC ingresa y permanece en el cockpit (conociendo las máscaras Quick Donning) y el piloto en los controles usa su máscara de O2 por estar sobre 25.000 ft","Se apaga el piloto automático","El TAC1 toma los controles"],a:1,w:"Si queda un solo piloto: sobre 25.000 ft usa la máscara de O2 hasta que el otro vuelva, y un TAC ingresa y permanece en la cabina de mando, sentado con cinturón y sabiendo usar las Quick Donning.",s:"Día 4"},
{ph:6,set:"Un pasajero te muestra el techo: sale un «humo blanco» de los conductos de aire.",t:"¿Qué es lo más probable y cómo actúas?",o:["Incendio eléctrico: inicias evacuación","Condensación: informas al Comandante y das a los pasajeros una explicación adecuada","Fumigación automática programada","Falla de presurización: bajan las máscaras"],a:1,w:"La CONDENSACIÓN es humedad con apariencia de humo blanco desde los conductos del techo. El TAC debe conocer el fenómeno, informar al Comandante y tranquilizar a los pasajeros con una buena explicación.",s:"Día 4"},
{ph:6,set:"Un pasajero lleva dos vasos de vino, insulta a otro pasajero y no obedece cuando le pides que vuelva a su asiento, aunque sin agredir físicamente.",t:"¿Cómo lo clasificas y qué haces?",o:["Categoría 1: lo ignoras","Categoría 2 (desafiante, no acata instrucciones): informas al TAC1 y al Comandante","Categoría 3: lo esposas de inmediato","No es disruptivo hasta que golpee a alguien"],a:1,w:"Cat 2: actitud desafiante, no acata instrucciones de la tripulación; requiere apoyo y reporte por la línea de mando. Cat 1 es leve y controlable; Cat 3 implica agresión física y/o amenazas.",s:"Día 4"},
{ph:6,set:"Vuelo de 2 h 30 min. Terminó el primer servicio y la cabina está tranquila.",t:"¿Cada cuánto corresponde hacer los chequeos preventivos?",o:["Cada 10 minutos","Como mínimo cada 30 minutos mientras no se esté entregando servicio","Una vez por vuelo","Solo si el Comandante lo pide"],a:1,w:"En vuelos de más de 1 hora: chequeos preventivos mínimo CADA 30 MINUTOS mientras no haya servicio en curso. Los organiza el TAC1. Buscan humo, recalentamiento, olores, derrames, hielo, comportamiento de pax.",s:"Día 4"},
{ph:6,set:"Notas a un pasajero parado largo rato frente al baño delantero, mirando insistentemente hacia el cockpit.",t:"¿Qué corresponde?",o:["Nada: puede estar donde quiera","Está en el área crítica: puede circular para ir al baño, pero debes mantener control y supervisión ante su comportamiento inusual","Ordenarle volver a su asiento esposado","Abrir la puerta del cockpit para preguntar"],a:1,w:"El área crítica (galley delantero, baño delantero, sector frente a 1L/1R) se protege contra interferencia ilícita. Los pax pueden circular hacia el baño, pero el TAC mantiene control y alerta ante comportamiento inusual; la TM vigila por cámaras.",s:"Día 4"},
{ph:6,set:"La TAC4 se desmaya en el galley posterior a mitad de vuelo.",t:"¿Qué corresponde hacer?",o:["Sentarla en su jumpseat y seguir","Ubicarla en un asiento de pasajero, darle primeros auxilios e instruir a un ABP sentado próximo a las salidas de emergencia","Pedir un médico y nada más","Aterrizar de emergencia siempre"],a:1,w:"TAC incapacitado: asiento de pasajero + primeros auxilios + instruir un ABP cerca de las salidas (su puerta podría quedar sin operador). El retorno a base con un TAC menos requiere coordinación y autorización de la DGAC.",s:"Día 4"},
{ph:6,set:"Vuelan de regreso hacia SCL. El Comandante avisa que en 10 minutos cruzan la cordillera.",t:"¿Qué hace la tripulación de cabina?",o:["Nada distinto al resto del crucero","Anuncio a los pax, cierre de funciones de servicio, galley y baños asegurados, OHB cerrados, cinturones chequeados y cada TAC asegurado en su jumpseat con cinturón y arnés","Solo bajar las luces","Repartir oxígeno preventivo"],a:1,w:"Hacia SCL, 10 minutos antes del cruce: fraseología («…próximos a cruzar las cumbres más altas de toda América…»), cierre del servicio, galley y baños asegurados, OHB cerrados, pax con cinturón y TACs asegurados con cinturón y arnés.",s:"Día 4"},
/* F7 · Descenso */
{ph:7,set:"El Comandante anuncia el inicio del descenso.",t:"¿Cuáles son tus funciones ahora?",o:["Iniciar un último servicio de café","Retirar remanentes del servicio (pax y cockpit), leer fraseología, chequeo de cabina libre, ajustar iluminación si es nocturno, ir al puesto y repetir la revisión silenciosa","Desarmar los toboganes","Abrir las cortinas y esperar"],a:1,w:"En descenso: retirar servicio, fraseología, chequeo de cabina libre, iluminación (nocturno), puestos para el aterrizaje con reporte de «cabina libre» y nueva revisión silenciosa. Además el TAC1 reporta el CLB al Comandante al INICIO del descenso.",s:"Día 4"},
{ph:7,set:"Recuerdas que durante el vuelo anotaste una falla en el CLB.",t:"¿Cuándo corresponde reportarla al Comandante?",o:["Después de aterrizar","Al inicio del descenso, sin interferir con la cabina de mando estéril","En pleno aterrizaje","Al día siguiente por correo"],a:1,w:"El TAC1 reporta el CLB al Comandante AL INICIO DEL DESCENSO, sin interferir la cabina de mando estéril.",s:"Día 1"},
/* F8 · Aterrizaje y post-vuelo */

/* ================= BUSCADOR GLOBAL ================= */
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function resaltar(txt,terms){
  let out=esc(txt);
  terms.forEach(t=>{
    if(t.length<2)return;
    const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
    const plain=norm(out);
    let idx=plain.indexOf(norm(t));
    if(idx<0)return;
    out=out.replace(re,"<mark>$1</mark>");
  });
  return out;
}
function Buscar(){
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`<button class="backbtn">← Menú</button>
    <div class="eyebrow">Buscador</div>
    <h2>🔎 Busca en todo el curso</h2>
    <p class="sub">Escribe un concepto, una sigla o un número — por ejemplo «PBE», «TESTI», «90 segundos» o «litio» — y te muestro dónde aparece.</p>
    <div class="search-box">
      <input class="search-input" type="search" placeholder="Buscar en ${QS.length} preguntas y ${CARDS.length} tarjetas…" aria-label="Buscar">
    </div>
    <div class="search-meta"></div>
    <div class="res-list"></div>`;
  el.querySelector(".backbtn").addEventListener("click",()=>go(Home));
  const input=el.querySelector(".search-input");
  const meta=el.querySelector(".search-meta");
  const list=el.querySelector(".res-list");
  const sugerencias=["PBE","TESTI","90 segundos","batería de litio","cabina estéril","WOCL","tobogán","UMR","PSV","hipoxia"];
  function vacio(){
    meta.textContent="";
    list.innerHTML=`<div class="search-empty">Prueba con: ${sugerencias.map(s=>`<b>${s}</b>`).join(" · ")}</div>`;
  }
  function buscar(q){
    const terms=norm(q).split(/\s+/).filter(t=>t.length>1);
    if(!terms.length){vacio();return;}
    const hits=[];
    QS.forEach(x=>{
      const hay=norm(x.q+" "+x.o.join(" ")+" "+x.w);
      if(terms.every(t=>hay.indexOf(t)>=0))hits.push({tipo:"P",x});
    });
    CARDS.forEach(c=>{
      const hay=norm(c.f+" "+c.b);
      if(terms.every(t=>hay.indexOf(t)>=0))hits.push({tipo:"T",x:c});
    });
    list.innerHTML="";
    if(!hits.length){
      meta.textContent="";
      list.innerHTML=`<div class="search-empty">Sin resultados para «${esc(q)}». Prueba con menos palabras o una sigla.</div>`;
      return;
    }
    const porRamo={};
    hits.forEach(h=>{const rid=RAMO_OF_MOD[h.x.c];(porRamo[rid]=porRamo[rid]||[]).push(h);});
    const nR=Object.keys(porRamo).length;
    meta.textContent=`${hits.length} resultado${hits.length===1?"":"s"} en ${nR} ramo${nR===1?"":"s"}`;
    const orig=q.split(/\s+/).filter(t=>t.length>1);
    hits.slice(0,60).forEach(h=>{
      const ra=RAMO_BY_ID[RAMO_OF_MOD[h.x.c]], mo=MOD_BY_ID[h.x.c];
      const b=document.createElement("button");b.className="res-item";
      if(h.tipo==="P"){
        b.innerHTML=`<div class="res-top">
            <span class="res-chip" style="background:${ra.col}">${ra.ic} ${esc(ra.n)}</span>
            <span class="res-kind">${esc(mo.n)}</span></div>
          <div class="res-q">${resaltar(h.x.q,orig)}</div>
          <div class="res-a">✔ ${resaltar(h.x.o[h.x.a],orig)}</div>
          <div class="res-w">${resaltar(h.x.w,orig)}</div>`;
      }else{
        b.innerHTML=`<div class="res-top">
            <span class="res-chip" style="background:${ra.col}">${ra.ic} ${esc(ra.n)}</span>
            <span class="res-kind">Tarjeta · ${esc(mo.n)}</span></div>
          <div class="res-q">${resaltar(h.x.f,orig)}</div>
          <div class="res-w">${resaltar(h.x.b,orig)}</div>`;
      }
      b.addEventListener("click",()=>b.classList.toggle("open"));
      list.appendChild(b);
    });
    if(hits.length>60){
      const p=document.createElement("p");p.className="sub";p.style.marginTop="10px";
      p.textContent=`Mostrando los primeros 60 de ${hits.length}. Afina la búsqueda para ver menos.`;
      list.appendChild(p);
    }
  }
  let t=null;
  input.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>buscar(input.value.trim()),160);});
  vacio();
  view.appendChild(el);
  input.focus();
}

/* ---------- audio: voz del navegador, sin librerías ---------- */
let vozAlfa=null, vozLista=false;
function cargarVoz(){
  if(vozLista||typeof speechSynthesis==="undefined")return;
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return;
  vozAlfa=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  vozLista=true;
}
if(typeof speechSynthesis!=="undefined"){
  cargarVoz();
  speechSynthesis.addEventListener("voiceschanged",()=>{vozLista=false;cargarVoz();});
}
function decir(txt){
  if(typeof speechSynthesis==="undefined")return false;
  try{
    cargarVoz();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    if(vozAlfa){u.voice=vozAlfa;u.lang=vozAlfa.lang;}else{u.lang="en-US";}
    u.rate=.85;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false;}
}

/* ================= PRÁCTICA ================= */
function AlfaPractica(){
  const st=alfaStats();
  let racha=0, aciertos=0, total=0;
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`<button class="backbtn">← Alfabeto</button>
    <div class="q-meta">
      <span class="chip" style="background:var(--accent)">⚡ Práctica</span>
      <span class="q-count" id="rr">RACHA 0</span>
    </div>
    <div class="q-card"><div class="alfa-zona"></div></div>`;
  el.querySelector(".backbtn").addEventListener("click",()=>go(Alfabeto));
  const zona=el.querySelector(".alfa-zona"), rr=el.querySelector("#rr");
  const pool=ALFA.concat(ALFA_NUM);
  function ronda(){
    /* pondera: las falladas salen más */
    let tot=0;const w=pool.map(([l])=>{const x=1+(st.fallos[l]||0)*2.5;tot+=x;return x;});
    let r=Math.random()*tot, idx=0;
    for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){idx=i;break;}}
    const [l,p]=pool[idx];
    const inverso=Math.random()<.45;
    const otras=shuffle(pool.filter(x=>x[0]!==l)).slice(0,3);
    const ops=shuffle([pool[idx]].concat(otras));
    zona.innerHTML=`
      <div class="alfa-preg">${inverso?"¿Qué letra es…?":"¿Cómo se dice?"}</div>
      <div class="alfa-big">${inverso?p:l}</div>
      ${inverso?"":`<button class="alfa-oir" type="button">🔊 Escuchar</button>`}
      <div class="alfa-opts"></div>
      <div class="alfa-after"></div>`;
    const oir=zona.querySelector(".alfa-oir");
    if(oir)oir.addEventListener("click",()=>decir(p));
    const cont=zona.querySelector(".alfa-opts");
    let listo=false;
    ops.forEach(([ol,op])=>{
      const b=document.createElement("button");b.className="alfa-op";
      b.textContent=inverso?ol:op;
      b.addEventListener("click",()=>{
        if(listo)return;listo=true;total++;
        const ok=ol===l;
        [...cont.children].forEach(x=>{
          x.disabled=true;
          const esta=x.textContent===(inverso?l:p);
          if(esta)x.classList.add("ok");
          else if(x===b&&!ok)x.classList.add("no");
          else x.classList.add("dim");
        });
        if(ok){
          aciertos++;racha++;
          if(st.fallos[l]){st.fallos[l]--;if(st.fallos[l]<=0)delete st.fallos[l];}
          if(racha>st.best){st.best=racha;}
          decir(p);
        }else{
          racha=0;st.fallos[l]=(st.fallos[l]||0)+1;
        }
        st.vistas++;save();
        rr.textContent="RACHA "+racha;
        const after=zona.querySelector(".alfa-after");
        after.innerHTML=`<div class="verdict ${ok?"ok":"bad"}">${ok?"✔ "+l+" es "+p:"✘ "+l+" es "+p}</div>
          <button class="next-btn">Siguiente →</button>`;
        after.querySelector(".next-btn").addEventListener("click",ronda);
        after.querySelector(".next-btn").focus();
      });
      cont.appendChild(b);
    });
  }
  view.appendChild(el);
  ronda();
}

/* ================= DELETREO ================= */
function AlfaDeletreo(){
  const st=alfaStats();
  let n=0, ok=0;
  const lote=shuffle(SIGLAS).slice(0,8);
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`<button class="backbtn">← Alfabeto</button>
    <div class="q-meta">
      <span class="chip" style="background:var(--accent)">🔤 Deletreo</span>
      <span class="q-count" id="cc">1/${lote.length}</span>
    </div>
    <div class="q-card"><div class="spell-zona"></div></div>`;
  el.querySelector(".backbtn").addEventListener("click",()=>go(Alfabeto));
  const zona=el.querySelector(".spell-zona"), cc=el.querySelector("#cc");
  function ronda(){
    if(n>=lote.length){
      zona.innerHTML=`<div style="text-align:center">
        <div class="score">${ok}/${lote.length}</div>
        <p class="sub">${ok===lote.length?"Perfecto: deletreas como tripulante ✈":"Buen entrenamiento — repite y se te queda."}</p>
        <button class="next-btn" id="otra">Otra tanda →</button></div>`;
      zona.querySelector("#otra").addEventListener("click",()=>go(AlfaDeletreo));
      if(ok===lote.length)confetti();
      return;
    }
    const [sig,desc]=lote[n];
    cc.textContent=(n+1)+"/"+lote.length;
    const letras=sig.split("");
    let puestas=[];
    const opciones=shuffle(letras.map(l=>ALFA_MAP[l].p).concat(
      shuffle(ALFA.filter(a=>letras.indexOf(a[0])<0)).slice(0,4).map(a=>a[1])));
    zona.innerHTML=`
      <div class="alfa-preg">Deletrea esta sigla</div>
      <div class="spell-sigla">${sig}</div>
      <div class="spell-desc">${esc(desc)}</div>
      <div class="spell-slots"></div>
      <div class="alfa-opts chips"></div>
      <div class="alfa-after"></div>`;
    const slots=zona.querySelector(".spell-slots"), cont=zona.querySelector(".alfa-opts");
    function pintaSlots(){
      slots.innerHTML="";
      letras.forEach((l,i)=>{
        const d=document.createElement("span");d.className="spell-slot";
        if(puestas[i]){d.textContent=puestas[i];d.classList.add("lleno");}
        else d.innerHTML=`<i>${l}</i>`;
        slots.appendChild(d);
      });
    }
    pintaSlots();
    opciones.forEach(p=>{
      const b=document.createElement("button");b.className="alfa-op chip-op";b.textContent=p;
      b.addEventListener("click",()=>{
        if(puestas.length>=letras.length)return;
        puestas.push(p);b.disabled=true;b.classList.add("usado");
        decir(p);
        pintaSlots();
        if(puestas.length===letras.length){
          const correcto=letras.every((l,i)=>puestas[i]===ALFA_MAP[l].p);
          if(correcto)ok++; else letras.forEach(l=>{st.fallos[l]=(st.fallos[l]||0)+1;});
          save();
          [...cont.children].forEach(x=>x.disabled=true);
          const after=zona.querySelector(".alfa-after");
          const sol=letras.map(l=>ALFA_MAP[l].p).join(" · ");
          after.innerHTML=`<div class="verdict ${correcto?"ok":"bad"}">${correcto?"✔ Impecable":"✘ Era: "+sol}</div>
            <button class="next-btn">${n<lote.length-1?"Siguiente sigla →":"Ver resultado ✈"}</button>`;
          after.querySelector(".next-btn").addEventListener("click",()=>{n++;ronda();});
          if(correcto)setTimeout(()=>decir(sol.replace(/ · /g," ")),300);
        }
      });
      cont.appendChild(b);
    });
    const undo=document.createElement("button");undo.className="alfa-undo";undo.textContent="↶ Borrar último";
    undo.addEventListener("click",()=>{
      if(!puestas.length||zona.querySelector(".alfa-after").innerHTML)return;
      const q=puestas.pop();
      const btn=[...cont.children].find(x=>x.textContent===q&&x.disabled);
      if(btn){btn.disabled=false;btn.classList.remove("usado");}
      pintaSlots();
    });
    zona.querySelector(".alfa-after").before(undo);
  }
  view.appendChild(el);
  ronda();
}

function GeoPractica(ambito){

  if(!ambito){

    el.innerHTML=`<button class="backbtn">← Aeropuertos</button>
      <div class="eyebrow">Práctica</div>

     ["🌎","Internacionales",`Los ${AEROP.filter(a=>!ES_CHILE(a[3])).length} destinos del resto del mundo.`,"inter"],

    ].forEach(([ic,t,d,k])=>{
      const b=document.createElement("button");b.className="pass";
      b.innerHTML=`<span class="pass-main"><h3>${ic} ${t}</h3><p>${d}</p></span>
        <span class="pass-stub"><span class="big">${ic}</span><span>IATA</span></span>`;
      b.addEventListener("click",()=>go(GeoPractica,k));m.appendChild(b);
    });
    view.appendChild(el);return;
  }
  const pool=AEROP.filter(a=>ambito==="todos"||(ambito==="chile"?ES_CHILE(a[3]):!ES_CHILE(a[3])));
  let racha=0;
  const el=document.createElement("div");el.className="screen";
  el.innerHTML=`<button class="backbtn">← Elegir</button>
    <div class="q-meta">
      <span class="chip" style="background:var(--accent)">🎯 ${ambito==="chile"?"Chile":ambito==="inter"?"Internacionales":"Todos"}</span>
      <span class="q-count" id="rr">RACHA 0</span>
    </div>
    <div class="q-card"><div class="alfa-zona"></div></div>`;
  el.querySelector(".backbtn").addEventListener("click",()=>go(GeoPractica));
  const zona=el.querySelector(".alfa-zona"), rr=el.querySelector("#rr");
  function ronda(){
    let tot=0;const w=pool.map(([s])=>{const x=1+(st.fallos[s]||0)*2.5;tot+=x;return x;});
    let r=Math.random()*tot, idx=0;
    for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){idx=i;break;}}
    const [sig,ciu,nom]=pool[idx];
    const inverso=Math.random()<.45;
    const otras=shuffle(pool.filter(x=>x[0]!==sig&&x[1]!==ciu)).slice(0,3);
    const ops=shuffle([pool[idx]].concat(otras));
    zona.innerHTML=`<div class="alfa-preg">${inverso?"¿Cuál es la sigla de…?":"¿Qué ciudad es?"}</div>
      <div class="${inverso?"geo-ciudad":"alfa-big"}">${inverso?esc(ciu):sig}</div>
      <div class="alfa-opts"></div><div class="alfa-after"></div>`;
    const cont=zona.querySelector(".alfa-opts");
    let listo=false;
    ops.forEach(([os,oc])=>{
      const b=document.createElement("button");b.className="alfa-op";
      b.textContent=inverso?os:oc;
      b.addEventListener("click",()=>{
        if(listo)return;listo=true;
        const ok=os===sig;
        [...cont.children].forEach(x=>{
          x.disabled=true;
          if(x.textContent===(inverso?sig:ciu))x.classList.add("ok");
          else if(x===b&&!ok)x.classList.add("no");
          else x.classList.add("dim");
        });
        if(ok){racha++;if(st.fallos[sig]){st.fallos[sig]--;if(st.fallos[sig]<=0)delete st.fallos[sig];}
          if(racha>st.best)st.best=racha;}
        else{racha=0;st.fallos[sig]=(st.fallos[sig]||0)+1;}
        save();rr.textContent="RACHA "+racha;
        const after=zona.querySelector(".alfa-after");
        after.innerHTML=`<div class="verdict ${ok?"ok":"bad"}">${ok?"✔":"✘"} ${sig} · ${esc(ciu)}</div>
          <div class="geo-nombre">${esc(nom)}</div>
          <button class="next-btn">Siguiente →</button>`;
        after.querySelector(".next-btn").addEventListener("click",ronda);
        after.querySelector(".next-btn").focus();
      });
      cont.appendChild(b);
    });
  }
  view.appendChild(el);ronda();
}
