Q("ega3","Con el avión ya detenido en una evacuación no planificada en tierra, ¿qué hace el TAC?",["Abre la puerta de inmediato","Sale del jumpseat, chequea condiciones exteriores, espera instrucción de la TM e informa cualquier situación de riesgo","Evacúa solo","Enciende el PA"],1,"Con avión detenido: salir del jumpseat y chequear condiciones exteriores, esperar instrucción de la TM e informar cualquier situación de riesgo. Con la orden de evacuación se inicia; ante situación catastrófica, se inicia la evacuación sin esperar.","EGA Día 3");
Q("ega3","En una evacuación en agua (ditching), ¿qué orden se da al detectar agua?",["«SALTEN AL AGUA»","«PÓNGASE EL CHALECO SALVAVIDAS / PUT LIFE VEST ON»","«ABRAN LAS VENTANAS»","«ESPEREN EL RESCATE»"],1,"Al chequear condiciones exteriores y detectar agua, el TAC saca y se pone el chaleco salvavidas ordenando: «PÓNGASE EL CHALECO SALVAVIDAS / PUT LIFE VEST ON».","EGA Día 3");
Q("ega3","En ditching, ¿qué se hace con el tobogán en las puertas?",["Se deja conectado siempre","Se desconecta (FOR DITCHING ONLY) previo a ordenar a los pasajeros que salten al agua por esa salida","Se corta con el hacha","Se desinfla"],1,"En ditching se desconecta el tobogán (FOR DITCHING ONLY) previo a ordenar a los pasajeros que salten al agua por esa salida. El tobogán se usa como dispositivo de flotación.","EGA Día 3");
Q("ega3","En ditching, tras evacuar, ¿qué se busca para cortar el mooring line?",["Un extintor","El cuchillo «Knife» del tobogán","El hacha del cockpit","Una tijera del FAK"],1,"Al utilizar el tobogán como dispositivo de flotación, se debe buscar el cuchillo «Knife» y cortar el mooring line (cuerda de amarre).","EGA Día 3");
Q("ega3","En ditching por salidas del sector alar, ¿qué se instala y cómo?",["Una escalera de cuerda","Una cuerda en el marco, ordenando a un asistente que salga, infle su chaleco y enganche la punta de la cuerda en el ala","Un tobogán rampa","Una red de contención"],1,"Si es necesario usar las salidas del sector alar como último recurso en ditching: instalar cuerda en el marco y ordenar a un asistente que salga, infle su chaleco y enganche la punta de la cuerda en el ala.","EGA Día 3");
Q("ega3","¿Qué es una evacuación PLANIFICADA?",["La que se ensaya en entrenamiento","Aquella en que hay un tiempo variable entre la declaración de emergencia y el contacto en tierra o agua, durante el cual la TC prepara cabina y pasajeros","La que ocurre en el aeropuerto de destino","La que se hace por desembarque rápido"],1,"En una evacuación planificada se dispone de un tiempo variable (entre la declaración de emergencia y el contacto en tierra o agua) en que la TC debe aplicar procedimientos para preparar la cabina y los pasajeros para el aterrizaje forzoso o amaraje.","EGA Día 3");

Q("ega4","¿Qué significa la sigla TESTI?",["Tiempo, Emergencia, Salidas, Tripulación, Instrucciones","Tipo de emergencia, Evacuación necesaria, Señal de evacuación, Tiempo disponible, Información adicional","Todos Estamos Seguros Toda Instrucción","Tripulación, Equipos, Salidas, Toboganes, Instrucción"],1,"TESTI: T = Tipo de emergencia · E = Evacuación necesaria · S = Señal de evacuación · T = Tiempo disponible · I = Información adicional. Es la información esencial que entrega el comandante al JC/TAC1.","EGA Día 4");
Q("ega4","En el TESTI, ¿qué confirma la «T» de Tipo de emergencia?",["El tipo de avión","Si es aterrizaje forzoso o ditching","La cantidad de pasajeros","El tipo de pista"],1,"La T de Tipo de emergencia: el JC confirma si se trata de un aterrizaje forzoso o de un ditching.","EGA Día 4");
Q("ega4","En el TESTI, en caso de ditching, ¿qué se asume respecto de la evacuación?",["Que se evaluará después del contacto","Que la evacuación es necesaria","Que no habrá evacuación","Que la decide el TAC1"],1,"En la E de Evacuación necesaria: el JC/TAC1 confirma si el comandante estima necesaria la evacuación o si será evaluada, y el área probable (aeropuerto, selva, mar…). EN DITCHING SE ASUME EVACUACIÓN NECESARIA.","EGA Día 4");
Q("ega4","¿Por qué es crítica la «T» de Tiempo disponible en el TESTI?",["Para avisar a los pasajeros la hora de llegada","Porque permite a la TAC administrar el tiempo restante para la preparación de cabina","Para calcular el combustible","Para coordinar con el catering"],1,"La coordinación respecto al tiempo disponible es CRÍTICA para que la TAC pueda administrar el tiempo restante de preparación de cabina. El JC/TAC1 confirma el tiempo remanente y verifica en su reloj la hora desde la cual empieza a contar.","EGA Día 4");
Q("ega4","¿Cuáles son los 7 pasos de la preparación de cabina, en orden?",["Fraseología, TESTI, ABP, Cabina, Brace, Aviso, Contacto","TESTI, Fraseología, ABP, Cabina, Aviso «próximos al aterrizaje», Aviso «brace for impact», Después del contacto","Cabina, ABP, TESTI, Fraseología, Brace, Aterrizaje, Evacuación","TESTI, ABP, Cabina, Fraseología, Brace, Contacto, Evacuación"],1,"Los pasos son: 1) TESTI · 2) Fraseología · 3) ABP · 4) Cabina · 5) Aviso «PRÓXIMOS AL ATERRIZAJE» · 6) Aviso «BRACE FOR IMPACT» · 7) Después del contacto.","EGA Día 4");
Q("ega4","Antes de leer la fraseología de preparación de cabina, ¿cómo se ajustan las luces?",["Se apagan para ahorrar energía","Al nivel de iluminación MAYOR, para favorecer la visualización de los tripulantes","A DIM 2","Se dejan como están"],1,"Previo a la lectura de la fraseología, las luces de cabina se ajustan al nivel de iluminación MAYOR para favorecer la visualización de los tripulantes de cabina. Los TAC se ubican a lo largo de la cabina y el JC/TAC1 lee por PA desde la estación FWD.","EGA Día 4");
Q("ega4","¿Cuál es la función PRINCIPAL de un ABP en una emergencia?",["Abrir las puertas antes que el TAC","Mantener a las personas atrás mientras las puertas son abiertas por los TAC","Contar a los pasajeros","Calmar a los niños"],1,"La función principal de los ABP es mantener a las personas atrás mientras las puertas son abiertas por los TAC. En segunda instancia, abrir la salida en caso de que el TAC quede incapacitado.","EGA Día 4");
Q("ega4","En un aterrizaje forzoso, ¿qué hacen los ABP una vez abierta la salida?",["Suben a la balsa primero","Ser los primeros en salir y permanecer abajo ayudando a las personas a salir del tobogán y alejarlas del avión","Cerrar la puerta detrás del último pax","Buscar el ELT"],1,"En aterrizaje forzoso los ABP deben ser los primeros en salir y permanecer abajo ayudando a las personas a salir del tobogán y a alejarse del avión. También abren las salidas del sector alar.","EGA Día 4");
Q("ega4","¿Cuántos ABP se requieren por cada tipo de salida?",["1 por puerta y 2 por salida del sector alar","2 por cada puerta y 1 por cada salida del sector alar","2 por cada salida, sin distinción","3 por puerta"],1,"El número de ABP depende del tipo de salida: DOS por cada puerta y UNO por cada salida del sector alar.","EGA Día 4");
Q("ega4","¿Dónde se sientan los ABP asignados a una puerta?",["En la última fila","En asientos de pasillo lo más cercano a la salida","En la salida del sector alar","En el jumpseat"],1,"Los ABP se reubican cerca de la puerta donde asistirán: para salida del sector alar, adyacente a la salida; para puertas, en asientos de PASILLO lo más cercano a la salida; para balsa auxiliar, en asiento de pasillo cercano a la balsa.","EGA Día 4");
Q("ega4","¿Cómo define la OACI a un ABP?",["Un pasajero que paga por asiento preferente","Pasajeros seleccionados por la tripulación para asistir en el manejo de una emergencia cuando sea requerido; su asistencia es voluntaria","Un tripulante fuera de servicio","Un pasajero con entrenamiento militar obligatorio"],1,"La OACI define ABP como pasajeros seleccionados por la tripulación para asistir en el manejo de una situación de emergencia cuando sea requerido. Su asistencia es VOLUNTARIA. La selección se basa en su habilidad para entender instrucciones, habilidad física y capacidad de mantener la calma.","EGA Día 4");
Q("ega4","En la instrucción a un ABP, ¿qué se le dice sobre mirar por el visor?",["Que no lo use","Que si hay fuego o peligro afuera NO abra la puerta, la bloquee y se dirija a la otra salida","Que abra igual porque hay que salir","Que espere 10 segundos"],1,"Al ABP se le instruye: «Mire por este visor, si hay fuego o peligro afuera no abra la puerta, bloquee y diríjanse a la otra salida». Si no ve peligro: sujetarse de la manilla, tomar la palanca roja y llevarla completamente hasta arriba.","EGA Día 4");
Q("ega4","¿En cuántos segundos se infla el tobogán, según la instrucción al ABP?",["3 segundos","10 segundos","30 segundos","60 segundos"],1,"Se instruye al ABP que el tobogán se inflará en 10 SEGUNDOS; si no se infla, deben bloquear la salida y dirigir a las personas a otra salida. Si no se infla automáticamente, tirar la aleta roja (PULL TO INFLATE) en la parte inferior derecha.","EGA Día 4");
Q("ega4","Al terminar la instrucción, ¿qué preguntas se le hacen al ABP?",["Su nombre y asiento","Cuándo podrá venir a esta puerta, qué pasa si ve fuego afuera, cómo se abre la puerta y cómo sacará al TAC de su asiento","Si tiene miedo a volar","Si sabe nadar"],1,"Se le pregunta: ¿Cuándo podrán venir a esta puerta? ¿Qué pasa si ve fuego o peligro afuera? ¿Cómo se abre la puerta? ¿Cómo me sacará de mi asiento? Al terminar, se sientan en los asientos más cercanos, con cinturón, se les indica su nueva posición de protección y se les pide leer la tarjeta de seguridad.","EGA Día 4");
Q("ega4","¿A qué altura da la TM el anuncio «TRIPULACIÓN PRÓXIMOS AL ATERRIZAJE / AMARAJE»?",["A 500 pies","A 2.000 pies, aproximadamente 2 minutos antes del contacto","A 10.000 pies","Al iniciar el descenso"],1,"El comandante da el anuncio «TRIPULACIÓN PRÓXIMOS AL ATERRIZAJE / AMARAJE» a los 2.000 PIES, aproximadamente 2 minutos antes del contacto. Todos los TAC se aseguran en sus jumpseats y reportan CABINA PREPARADA.","EGA Día 4");
Q("ega4","¿A qué altura se da el anuncio «BRACE FOR IMPACT»?",["A 2.000 pies","A 500 pies sobre el terreno, unos 30 segundos antes del contacto","A 1.000 pies","Al tocar la pista"],1,"La TM da por PA «BRACE FOR IMPACT» a los 500 PIES sobre el terreno, aproximadamente 30 segundos antes del aterrizaje/amaraje. Luego el JC/TAC1 da por PA dos veces «PROTÉJASE… PROTÉJASE… BRACE… BRACE» y toda la TAC lo repite a viva voz asumiendo su posición de protección hasta que el avión se detenga.","EGA Día 4");
Q("ega4","En el paso 4 (Cabina) de la preparación, ¿qué se verifica?",["Solo los baños","Salidas armadas y sin obstrucciones, pasillos despejados, cortinas aseguradas, baños desocupados cerrados y asegurados, galleys, OHB y closets asegurados","La temperatura de cabina","El catering"],1,"Paso 4 Cabina: verificar salidas armadas y sin objetos que obstruyan su acceso, pasillos despejados, cortinas aseguradas, baños desocupados con puerta cerrada y asegurada, galleys, OHB y closets asegurados. Se solicita asistencia voluntaria para pax con necesidades especiales y, si el tiempo lo permite, se reúnen familias.","EGA Día 4");
Q("ega4","Después del contacto, ¿quién determina si la evacuación es necesaria?",["El TAC1","El comandante, que evaluará la situación y ordenará EVACUAR EVACUAR accionando el Evac Command","Los ABP","El SSEI"],1,"El comandante evalúa la situación para determinar si la evacuación es o no necesaria. Si lo es, ordena «EVACUAR EVACUAR / EVACUATE EVACUATE» y acciona el Evac Command.","EGA Día 4");

Q("ega5","El botiquín MK (Medical Kit), ¿quién puede usarlo?",["Cualquier TAC","Exclusivamente personal de salud calificado y con autorización del comandante (médicos, enfermeras, matronas y paramédicos acreditados)","Solo el TAC1","El pasajero que lo necesite"],1,"El MK contiene medicamentos y elementos para ser usados EXCLUSIVAMENTE por personal de salud calificado y con autorización del comandante: médicos, enfermeras, matronas y personal paramédico acreditado. Contiene fármacos, insumos, equipo de intubación endotraqueal, guía farmacológica, sellos de recambio y planilla de control.","EGA Día 5");
Q("ega5","¿Qué significa un sello de color ROJO en el botiquín MK o FAK?",["Que está vencido","Que ha sido utilizado y uno o varios elementos están bajo stock mínimo","Que está operativo","Que es de uso exclusivo del comandante"],1,"Sello VERDE: operativo. Sello AMARILLO: verificar con la TM en el libro de vuelo. Sello ROJO: ha sido utilizado y la cantidad de uno o varios elementos está bajo el stock mínimo.","EGA Día 5");
Q("ega5","¿Cuál es la diferencia clave entre el MK y el FAK?",["El FAK es más grande","El FAK (First Aid Kit) contiene elementos de primeros auxilios y PUEDE ser utilizado o abierto por la TC","El MK lo abre la TC y el FAK el médico","No hay diferencia"],1,"El FAK (First Aid Kit) contiene elementos para prestar primeros auxilios y PUEDE ser utilizado o abierto por la TC. El MK solo por personal de salud calificado con autorización del comandante.","EGA Día 5");
Q("ega5","¿Para qué sirve el Neceser de Precaución Universal (NPU/UPK)?",["Para dar oxígeno","Como protección para limpiar productos corporales (sangre, orina, vómito) en casos de sospecha de enfermedad infectocontagiosa; además tiene elementos para manejo de MP","Para apagar fuegos","Para primeros auxilios avanzados"],1,"El NPU se usa como medida de protección para limpiar productos corporales (sangre, orina, vómito, etc.) en casos de sospecha de enfermedad infectocontagiosa. Además contiene elementos para el manejo de Mercancías Peligrosas.","EGA Día 5");
Q("ega5","Al limpiar residuos líquidos con el NPU, ¿qué se aplica?",["Agua caliente","Gel granulado absorbente, y luego desinfectante germicida retirado con paño absorbente","Alcohol puro","Detergente común"],1,"Para eliminar residuos líquidos se aplica gel granulado absorbente; se recomienda limpieza adicional con desinfectante germicida esparcido sobre la superficie y retirado con paño absorbente. Para salpicaduras en la piel: abundante agua y jabón.","EGA Día 5");
Q("ega5","Con el NPU, ¿cómo se recogen objetos punzantes o cortantes?",["Con guantes dobles","Nunca directamente con las manos: se usa la pala de mano y el escobillón provistos","Con una bolsa plástica","Con pinzas del FAK"],1,"No se deben tomar objetos punzantes o cortantes (vidrio, agujas) directamente con las manos, pues pueden atravesar los guantes: se utiliza la pala de mano y escobillón provistos. Los materiales contaminados van en bolsas plásticas cerradas, lejos de los pasajeros, y se entregan a servicio de pasajeros al arribo.","EGA Día 5");
Q("ega5","¿Para qué se utiliza el DEA?",["Para la reanimación respiratoria","Para el tratamiento de la fibrilación ventricular","Para medir la presión arterial","Para administrar oxígeno"],1,"El DEA (Desfibrilador Externo Automático) se utiliza para el tratamiento de la fibrilación ventricular. Su chequeo pre vuelo: verificar que esté a bordo, asegurado y accesible.","EGA Día 5");
Q("ega5","En el uso del DEA en adultos, ¿dónde va el parche derecho?",["Sobre el esternón","Bajo la clavícula derecha","En la espalda","En el costado izquierdo"],1,"Parche DERECHO: bajo la clavícula derecha. Parche IZQUIERDO: sobre las costillas, al costado izquierdo, bajo el pecho.","EGA Día 5");
Q("ega5","¿Qué se debe hacer al usar el DEA en un niño de menos de 25 kilos u 8 años?",["Usar solo un parche","Insertar la llave lactante/niño en el equipo y colocar un electrodo por delante y otro por detrás del tórax","No se puede usar el DEA","Usar la mitad de la carga"],1,"En niños de menos de 25 kg u 8 años: insertar la llave lactante/niño en el equipo y colocar un electrodo por delante y otro por detrás del tórax. No se debe tocar a la persona mientras el DEA analiza.","EGA Día 5");
Q("ega5","¿Qué contiene el DEMO KIT?",["Extintor, PBE y guantes","1 cinturón de seguridad, 1 máscara de oxígeno y 1 chaleco salvavidas","Tarjetas de seguridad y megáfono","Botiquín y linterna"],1,"El DEMO KIT es el bolso con los equipos para efectuar la demostración de seguridad en vivo: 1 cinturón de seguridad, 1 máscara de oxígeno y 1 chaleco salvavidas.","EGA Día 5");
Q("ega5","¿De qué color es el chaleco salvavidas de la tripulación?",["Amarillo, igual que el de pasajeros","Rojo fosforescente","Naranja","Blanco"],1,"El chaleco salvavidas es AMARILLO para pasajeros y ROJO FOSFORESCENTE para la tripulación.","EGA Día 5");
Q("ega5","¿A partir de qué peso puede un infante usar un chaleco salvavidas de ADULTO?",["Más de 10 kilos","Más de 15 kilos","Más de 20 kilos","Cualquier peso"],1,"El chaleco de adulto puede ser usado por un infante con peso MAYOR a 15 kilos. Los chalecos de infante (Aeromarine, Switlik, Hoover) son para peso MENOR a 15 kilos.","EGA Día 5");
Q("ega5","¿Cómo se usa un chaleco de adulto en un infante o menor?",["No se puede usar","Pasando la cinta entre las piernas, amarrando a la cintura e inflando al salir del avión","Solo inflándolo antes","Amarrándolo al asiento"],1,"Para usar un chaleco de adulto en un infante o menor se debe pasar la cinta ENTRE LAS PIERNAS, amarrar a la cintura e inflar al salir del avión.","EGA Día 5");
Q("ega5","¿Cuándo deben inflar los adultos su chaleco salvavidas?",["Antes de salir del asiento","Al salir del avión","En el asiento, apenas se ordena","Cuando estén en el agua"],1,"Los adultos deben inflar su chaleco AL SALIR del avión (no dentro de la cabina). El chaleco se activa accionando la manija roja o soplando la boquilla; la luz de localización se activa con el agua.","EGA Día 5");
Q("ega5","¿Qué caracteriza al chaleco de infante respecto al de adulto?",["Es de color rojo","Tiene una cuerda para sujetar el chaleco del infante al del adulto","No tiene luz","No se puede inflar"],1,"Los chalecos de infante (Aeromarine, Switlik, Hoover) son amarillos, para menores de 15 kg, con luz de localización activada por agua, inflado automático por manija roja y boquillas manuales, y CUERDA PARA SUJETAR el chaleco del infante al del adulto.","EGA Día 5");
Q("ega5","¿Por cuánto tiempo emite señales el ELT?",["12 horas","24 horas","48 horas","72 horas"],2,"El ELT (Emergency Locator Transmitter) es un equipo radiotransmisor que emite señales de emergencia por 48 HORAS.","EGA Día 5");
Q("ega5","¿Cuáles son las frecuencias internacionales del ELT y cómo se reconocen?",["100 y 200 MHz","243 y 121.5 MHz (bip de intervalos cortos) y 406.25 MHz (bip de intervalos largos, COSPAS-SARSAT)","500 MHz solamente","121.5 MHz solamente"],1,"Frecuencias: 243 y 121.5 MHz → se reconoce por bip de intervalos CORTOS. 406.25 MHz → bip de intervalos LARGOS (sistema COSPAS-SARSAT).","EGA Día 5");
Q("ega5","En el ELT RESCU 406 (S), ¿qué se necesita para activarlo en TIERRA?",["Solo levantar la antena","Mezclar la sal del saco con 1 litro (media bolsa) de agua, té o café en la bolsa plástica e insertar la parte inferior del ELT","Presionar un botón","Conectarlo a la batería del avión"],1,"ELT RESCU 406 (S) en tierra: romper sello para liberar antena, retirar la cuerda, desplegar la bolsa plástica, remover el saco de sal, mezclar la sal con 1 litro (media bolsa) de agua/té/café e insertar la parte inferior del ELT asegurando que la solución salina cubra los orificios. Colocarlo vertical en espacio libre.","EGA Día 5");
Q("ega5","¿Cómo se apaga un ELT que está funcionando en el agua?",["Se le quita la antena","Se saca del agua y se pone en posición invertida","Se sumerge completamente","No se puede apagar"],1,"La señal se interrumpe al sacarlo del agua y ponerlo en posición invertida. Luego se aparta la antena, se dobla al lado y se asegura con la cuerda. (En modelos con switch: llevarlo a posición OFF).","EGA Día 5");
Q("ega5","En el ELT RESCU 406 (SE), ¿cuáles son las 4 posiciones del switch rotatorio?",["ON/OFF/TEST/RESET","XMT / OFF / ARM / TEST","ARM/OFF/ON/SET","A/B/C/D"],1,"El ELT RESCU 406 (SE) tiene un switch rotatorio de 4 posiciones: XMT / OFF / ARM / TEST, ubicado en la base del equipo. Se activa automáticamente en agua estando en ARM (no requiere sal), o manualmente en tierra en XMT (no requiere agua).","EGA Día 5");
Q("ega5","¿Cuánto tarda el sello soluble en liberar la antena del ELT en el agua?",["Inmediatamente","Aproximadamente 5 minutos después de estar el equipo en el agua","30 minutos","1 hora"],1,"El sello soluble que sujeta la antena la libera automáticamente aproximadamente 5 MINUTOS después de estar el equipo en el agua.","EGA Día 5");
Q("ega5","¿Cuál es la duración y el alcance aproximado de los extintores de halón?",["30 segundos y 10 metros","6 a 8 segundos (8 a 10 en el Kidde con manómetro) y alcance aproximado de 2 metros","2 minutos y 5 metros","15 segundos y 1 metro"],1,"Los extintores duran de 6 a 8 segundos (el Halon Kidde Aerospace con manómetro: 8 a 10 segundos) y tienen un alcance aproximado de 2 METROS.","EGA Día 5");
Q("ega5","¿Hacia dónde se dirige la descarga del extintor?",["Hacia las llamas más altas","Hacia la BASE del fuego, descargando la totalidad del extintor","Hacia el techo","En círculos alrededor del fuego"],1,"Se apunta y se dirige la descarga a la BASE DEL FUEGO, y se descarga la totalidad del extintor. El equipo se mantiene en posición vertical.","EGA Día 5");
Q("ega5","En el chequeo pre vuelo de un extintor con manómetro, ¿qué se verifica?",["Solo que esté a bordo","Manómetro en rango verde, pin insertado, sello instalado, vigencia, accesible y asegurado","Que esté lleno pesándolo","La fecha de fabricación"],1,"Chequeo pre vuelo de extintor con manómetro: manómetro en RANGO VERDE, pin insertado, sello/precinto instalado, vigencia, accesible y asegurado. (En el modelo sin manómetro se verifica el disco rojo intacto y la vigencia).","EGA Día 5");
Q("ega5","¿Para qué sirve el PBE?",["Para apagar fuegos","Es el Equipo de Protección ante la presencia de Humo","Para dar oxígeno a un pasajero","Para proteger las manos del calor"],1,"PBE (Protective Breathing Equipment) es el equipo de protección ante la presencia de humo. El extintor de halón es para extinción de todo tipo de fuego, el hacha para remover paneles y mamparos, y los guantes antiflama para proteger las manos.","EGA Día 5");
Q("ega5","En el PBE Air Liquide, ¿qué indica el visor de inspección?",["El nivel de oxígeno","Si el indicador está VERDE el equipo está operativo; si está ROJO, la bolsa fue perforada o rota y NO está operativo","La fecha de vencimiento","La presión del cilindro"],1,"PBE Air Liquide: el visor de la parte superior permite ver el indicador. Verde = operativo. Rojo = bolsa perforada/rota, no operativo. Suministra oxígeno por al menos 15 minutos. Si el sello amarillo está roto o ausente pero el indicador está verde, el equipo sigue operativo.","EGA Día 5");
Q("ega5","¿Cuánto dura el PBE Dräger?",["10 minutos","15 minutos","20 minutos","30 minutos"],2,"El PBE Dräger tiene una duración de 20 MINUTOS. (El Air Liquide y el Scott/Avox suministran oxígeno por al menos 15 minutos).","EGA Día 5");
Q("ega5","En el PBE Dräger, ¿qué indica la cinta amarilla pre cortada?",["El tiempo restante","Si está INTACTA, el equipo está operativo; si está rota, el empaque fue perforado y no está operativo","Que ya fue usado","La talla del equipo"],1,"PBE Dräger: la cinta amarilla pre cortada intacta indica que está operativo; rota indica empaque perforado/roto (no operativo). Si el sello sobre el seguro metálico está dañado o ausente pero la cinta amarilla está intacta, el equipo mantiene su condición de operativo.","EGA Día 5");
Q("ega5","En el PBE SCOTT/AVOX, ¿qué color del indicador de humedad significa NO operativo?",["Gris","Blanco","Rosado","Azul"],2,"PBE Scott/Avox: si el indicador de humedad cambia a ROSADO, el empaque fue perforado o roto y NO está operativo. Si cambia a gris o blanco, el equipo SIGUE operativo. El chequeo pre vuelo es: equipo con indicador de color NO EN ROSADO, asegurado y accesible.","EGA Día 5");
Q("ega5","¿Cuál es la capacidad del equipo de oxígeno portátil?",["150 litros","310 litros","500 litros","1000 litros"],1,"El oxígeno portátil es un equipo de 310 LITROS de capacidad que provee oxígeno de flujo continuo, disponible para descompresión (asistir a la TC y pasajeros) y para atención de primeros auxilios.","EGA Día 5");
Q("ega5","En el oxígeno portátil de 2 salidas, ¿cuál es el flujo y duración de la salida HI?",["2 lts/min por 150 minutos","4 lts/min por 75 minutos","6 lts/min por 50 minutos","8 lts/min por 30 minutos"],1,"Flujos: HI = 4 lts/min, 75 minutos, para adulto · LOW = 2 lts/min, 150 minutos, para infante · HI+LO = 6 lts/min, 50 minutos, para 2 personas.","EGA Día 5");
Q("ega5","En el oxígeno portátil, la salida LOW (2 lts/min) se usa para…",["Adultos","Infantes, con duración de 150 minutos","Dos personas","Descompresión"],1,"La salida LOW entrega 2 lts/min, dura 150 minutos y se usa para INFANTE. La HI entrega 4 lts/min por 75 minutos para adulto.","EGA Día 5");
Q("ega5","¿Qué remanente de oxígeno debe dejarse al usar la botella en primeros auxilios?",["100 psi","300 psi","500 psi por botella, para ser usado en caso de descompresión","1000 psi"],2,"Al usar el equipo para dar oxígeno de primeros auxilios se debe dejar un remanente de 500 PSI por botella, para ser usado en caso de descompresión.","EGA Día 5");
Q("ega5","En el chequeo pre vuelo del oxígeno portátil, ¿qué presión mínima se exige en el primer vuelo de la mañana?",["1000 PSI","1200 PSI","1500 PSI","2000 PSI"],2,"La aguja debe estar bajo la marca blanca de 2000 psi: 1500 PSI para el primer vuelo de la mañana y 1200 PSI para los siguientes vuelos del día. Además: máscara conectada a la salida HI, tubo sin fisuras, máscara adicional sellada, arnés operativo, asegurado y accesible.","EGA Día 5");
Q("ega5","¿Cómo se abre la válvula del oxígeno portátil?",["Girando la perilla a favor de los punteros del reloj","Girando la perilla CONTRA los punteros del reloj","Presionando un botón","Tirando de una anilla"],1,"Se abre la válvula girando la perilla CONTRA los punteros del reloj, se siente o escucha el flujo de salida y se coloca la máscara sobre boca y nariz pasando la banda elástica alrededor de la cabeza.","EGA Día 5");
Q("ega5","¿Quién realiza el chequeo pre vuelo del hacha?",["El TAC1","La Tripulación de Mando","El TAC de la zona delantera","Mantenimiento"],1,"El hacha está ubicada en la CABINA DE MANDO y su chequeo pre vuelo lo efectúa la TM. Se usa para remoción de elementos, paneles, mamparos, etc. Tiene hoja cortante, punta y mango aislante de electricidad.","EGA Día 5");
Q("ega5","¿Qué caracteriza a las linternas de emergencia?",["Funcionan con pilas desechables","Se encienden automáticamente al sacarlas de su posición y tienen precinto/sello que se rompe al retirarlas","Deben encenderse con un switch","Son de un solo uso"],1,"Las linternas son removibles, con baterías recargables y precinto/sello que se rompe al sacarlas. Se encienden AUTOMÁTICAMENTE al sacarlas de su posición. Chequeo pre vuelo: asegurada en su posición y operativa (verificando luz intermitente).","EGA Día 5");
Q("ega5","¿Cuál es el chequeo pre vuelo del megáfono?",["Verificar la batería con un tester","Que esté operativo al presionar el gatillo, asegurado y accesible","Que tenga el sello verde","Solo que esté a bordo"],1,"Chequeo pre vuelo del megáfono: operativo al presionar el gatillo, asegurado y accesible. Tiene batería propia, botón push to talk, micrófono en la base y correa de sujeción.","EGA Día 5");
Q("ega5","¿Cuándo se incorpora una balsa adicional o auxiliar como equipamiento?",["En todos los vuelos","En aviones con toboganes balsa cuya capacidad de sobrecarga no alcanza lo exigido, y en aviones con toboganes que operan rutas extendidas sobre agua","Solo en vuelos nocturnos","Cuando lo pide el comandante"],1,"Las balsas adicionales se incorporan en 2 situaciones: 1) aviones con toboganes balsa cuya capacidad de sobrecarga no alcanza lo exigido por normativa (o para cubrir la pérdida de un tobogán balsa) y 2) aviones con toboganes que operan rutas extendidas sobre agua.","EGA Día 5");
Q("ega5","¿De qué color es el chaleco luminiscente de tripulante?",["Amarillo","Anaranjado de alta visibilidad, con la inscripción Tripulante/Crew en la parte posterior","Rojo","Verde"],1,"El chaleco luminiscente es sin mangas, de color ANARANJADO de alta visibilidad, con la inscripción Tripulante/Crew en la parte posterior. Al no ser requisito, su uso depende de cada operador aéreo.","EGA Día 5");

Q("ega6","¿Cuáles son los 4 elementos que intervienen en el fuego?",["Aire, agua, tierra y fuego","Combustible (material reductor), oxígeno (comburente), calor (temperatura) y reacción en cadena","Humo, llama, calor y chispa","Papel, gas, electricidad y metal"],1,"El fuego es un proceso químico en el que intervienen 4 elementos: combustible (material reductor), oxígeno (comburente), calor (temperatura) y reacción en cadena. Se clasifican dependiendo del material combustible.","EGA Día 6");
Q("ega6","¿Cuál es el método de extinción que corresponde al extintor de halón?",["Sofocación","Enfriamiento","Remoción","Inhibición de la reacción en cadena"],3,"Métodos de extinción: Sofocación (reduciendo el oxígeno) · Enfriamiento (agua u otro líquido no inflamable) · Remoción (segregación del material combustible) · INHIBICIÓN DE LA REACCIÓN EN CADENA (utilizando el extintor de halón).","EGA Día 6");
Q("ega6","¿A partir de cuántos segundos son tóxicos los efectos del humo sobre las personas?",["30 segundos","60 segundos","Aproximadamente 90 segundos","3 minutos"],2,"Todo material en combustión genera humo. Los efectos producidos sobre las personas al haber grandes cantidades de humo son tóxicos aproximadamente a los 90 SEGUNDOS.","EGA Día 6");
Q("ega6","¿Cuáles son los tres roles en el combate del fuego?",["Comandante, TAC1 y TAC2","Atacante, informante y asistente","Piloto, copiloto y jefe de cabina","Líder, apoyo y observador"],1,"Los roles son: ATACANTE (identifica tipo y origen, se protege, ataca con extintor), INFORMANTE (informa a la TM y mantiene la comunicación) y ASISTENTE (provee equipo, prepara equipo adicional, remueve material inflamable). Además está la tripulación de soporte.","EGA Día 6");
Q("ega6","¿Qué hace el TAC que detecta el fuego (atacante)?",["Llama primero a la TM","Identifica tipo y origen, avisa a un segundo TAC que será el informante, se protege (PBE si es necesario) y ataca el fuego con el extintor","Evacúa el sector","Corta la energía del avión"],1,"El atacante: identifica tipo de fuego y origen, avisa a un segundo TAC (que se constituye como informante), se protege (considerar PBE si es necesario), ataca el fuego con extintor y se asegura de que esté apagado usando líquido para enfriar si es necesario.","EGA Día 6");
Q("ega6","¿Qué información debe entregar el INFORMANTE a la TM?",["Solo que hay fuego","Quién habla y desde dónde, ubicación y fuente, severidad/densidad/color/olor, progreso del combate, número de extintores usados y restantes, y hace cuánto comenzó","La cantidad de pasajeros afectados","El nombre del pasajero involucrado"],1,"El informante comunica: quién habla y desde dónde, ubicación y fuente, severidad/densidad/color/olor, progreso del combate del fuego, número de extintores utilizados y restantes, y hace cuánto tiempo comenzó el combate. Mantiene la comunicación entre cabina y TV.","EGA Día 6");
Q("ega6","¿Cuál es una función del ASISTENTE en el combate del fuego?",["Informar a la TM","Proveer el equipo necesario, tener otro extintor disponible, remover material inflamable y estar preparado para reemplazar al atacante","Evacuar a los pasajeros","Apagar los sistemas eléctricos del avión"],1,"El asistente: provee el equipo necesario y tiene otro extintor disponible, prepara equipo adicional, remueve material inflamable del área si es necesario, previene a los pasajeros para que se protejan del humo y se mantengan agachados, y debe estar preparado para REEMPLAZAR al atacante e intercambiar roles.","EGA Día 6");
Q("ega6","¿Qué hace la tripulación de soporte durante un fuego?",["Ataca el fuego con un segundo extintor","Reubica pasajeros, administra primeros auxilios y calma a los pasajeros; si es necesario los ordena mantener la cabeza baja y respirar a través de paños","Informa a la TM","Abre las salidas"],1,"La tripulación de soporte no combate directamente el fuego pero: reubica pasajeros, administra primeros auxilios y calma/tranquiliza. Si es necesario ordena a los pax del área afectada mantener la cabeza tan baja como sea posible y respirar a través de paños/telas/ropa para filtrar gases y partículas.","EGA Día 6");
Q("ega6","Después de apagar un fuego, ¿qué debe hacerse con el área afectada?",["Ventilarla abriendo una salida","Empaparla para prevenir que el fuego se reinicie","Cubrirla con una manta","Nada, ya está apagado"],1,"Cuando el fuego esté apagado, el área afectada debe ser EMPAPADA para prevenir que el fuego se reinicie.","EGA Día 6");
Q("ega6","En un humo/fuego en el baño CON calor y humo, ¿cómo se usa la puerta?",["Se cierra con seguro desde afuera","Se abre y se usa como protección al atacar, descargando el halón; luego se cierra y se espera unos minutos","Se deja abierta todo el tiempo","Se retira de sus bisagras"],1,"Con calor y humo: protegerse con PBE, ABRIR LA PUERTA USÁNDOLA COMO PROTECCIÓN, atacar descargando halón, cerrar la puerta y esperar unos minutos, luego entrar manteniendo la puerta abierta, cancelar alarma, ubicar el foco, descargar otro halón si es necesario y mantener el lugar vigilado.","EGA Día 6");
Q("ega6","Ante un PED con sobrecalentamiento (sin llamas), ¿qué se hace primero?",["Descargar el extintor","Identificar el artículo, pedir al pasajero que apague el aparato y desconectar la fuente de energía","Sumergirlo en agua","Tirarlo al baño"],1,"Sobrecalentamiento: identificar el artículo, pedir al pasajero que apague el aparato, desconectar la fuente de energía, desconectar el aparato de la fuente (si no es peligroso), desconectar la fuente de energía del asiento si corresponde y verificar que se mantenga desconectado el resto del vuelo.","EGA Día 6");
Q("ega6","Ante un fuego de batería de litio, ¿qué se hace después de suprimir las llamas con halón?",["Guardarlo en el OHB","Verter agua o líquido NO ALCOHÓLICO en el PED para enfriar","Aplicar más halón","Envolverlo en una manta"],1,"Fuego en PED: tomar equipo de combate, descargar halón. Cuando las llamas se hayan suprimido (o si solo hay humo): verter AGUA o líquido NO ALCOHÓLICO en el PED para enfriar y aplicar el procedimiento de almacenamiento de batería de litio.","EGA Día 6");
Q("ega6","¿Cuál es el procedimiento de almacenamiento de una batería de litio/PED después de un fuego?",["Guardarla en el galley","Con guantes de protección: ponerla en un recipiente lleno de agua o líquido no alcohólico, guardarlo en el baño posterior, bloquear el baño y vigilar","Entregarla al pasajero","Ponerla en la bodega"],1,"Cuando el PED o batería pueda moverse de forma segura: ponerse guantes de protección para fuego, tomar un recipiente (gabinete o basurero de baño), llenarlo con agua o líquido no alcohólico, sumergir el PED o batería, guardar el recipiente en el BAÑO POSTERIOR, bloquear el baño y vigilar.","EGA Día 6");
Q("ega6","En un fuego en el OHB, ¿cómo se descarga el extintor?",["Abriendo completamente el OHB","Abriendo LIGERAMENTE el OHB, solo para que entre la boquilla del halón, descargando dentro y luego cerrando y asegurando","Desde el pasillo, hacia arriba","Sin abrirlo, por las rendijas"],1,"Fuego en OHB: el atacante verifica si hay calor; si lo hay, usa PBE y halón, abre LIGERAMENTE el OHB (solo para que entre la boquilla), descarga el extintor dentro y cierra y asegura el OHB, repitiendo si es necesario. El asistente se pone PBE y obtiene agua o líquido no inflamable.","EGA Día 6");
Q("ega6","Ante humo/fuego de un equipo eléctrico en el galley, ¿qué debe hacer la TC?",["Descargar halón de inmediato","Apagar el equipo y desactivar el circuit breaker asociado, que está en el panel eléctrico del galley","Cortar la energía general del avión","Evacuar el galley"],1,"Cuando la fuente se identifica como un equipo eléctrico: apagar el equipo y DESACTIVAR EL CIRCUIT BREAKER asociado, que se encuentra en el panel eléctrico del galley.","EGA Día 6");
Q("ega6","En un fuego en el horno, ¿por qué se mantiene la puerta cerrada?",["Para que no salga humo a la cabina","Para privar de oxígeno al fuego","Para que no se dañe el horno","Para no quemarse las manos"],1,"Se mantiene la puerta del horno CERRADA para privar de oxígeno al fuego, se apaga el horno y se desactiva el circuit breaker asociado. Si empeora: usar PBE y guantes, abrir ligeramente la puerta lo suficiente para insertar la boquilla del halón, descargar, cerrar y repetir según sea necesario.","EGA Día 6");
Q("ega6","En un fuego que involucra Mercancías Peligrosas, ¿qué se hace una vez extinguido?",["Nada más","Mantener supervisión por si se vuelve a encender y aplicar el procedimiento de derrame o pérdida de MMPP","Abrir el OHB para ventilar","Guardar el artículo en la bodega"],1,"Fuego con MMPP: identificar el artículo, combatir con halón y EPP, mover pasajeros si es posible, informar a la TV y a otros TC, MANTENER SUPERVISIÓN por si se vuelve a encender, aplicar el procedimiento de derrame o pérdida de MMPP y seguir instrucciones del Comandante.","EGA Día 6");
Q("ega6","¿Cuál es el procedimiento general para la extinción de fuego?",["Evacuar, informar, atacar","Identificar (tipo de fuego), informar (lugar, humo, acciones), atacar con halón y desconectar circuitos eléctricos si es necesario","Descargar todos los extintores disponibles","Esperar instrucciones de la TM"],1,"El procedimiento general: IDENTIFICAR (tipos de fuego) → INFORMAR (lugar del fuego, cantidad de humo, acciones tomadas) → ATACAR CON HALÓN (usando equipos de protección) → DESCONECTAR CIRCUITOS ELÉCTRICOS si es necesario.","EGA Día 6");

/* ================= MP · MERCANCÍAS PELIGROSAS ================= */
Q("mp1","¿Cómo se define una Mercancía Peligrosa (MMPP/DGR)?",["Cualquier objeto frágil","Artículos o sustancias capaces de poner en peligro la salud, seguridad, propiedad y el medio ambiente, y que figuren en la lista de la reglamentación","Todo lo que va en bodega","Los líquidos de más de 100 ml"],1,"Son artículos o sustancias que son capaces de poner en peligro la salud, seguridad, propiedad y el medio ambiente, y que figuren en la lista de la reglamentación de Mercancías Peligrosas.","MP Módulo I");
Q("mp1","¿Qué consecuencias tiene el incumplimiento de la reglamentación de MP?",["Solo una amonestación verbal","Pone en grave peligro la seguridad y puede significar multas, suspensiones u otras sanciones","Ninguna si no hubo accidente","Solo afecta al expedidor"],1,"El incumplimiento de las disposiciones emanadas por las autoridades reguladoras pone en grave peligro la seguridad. Además puede significar multas, suspensiones u otras sanciones.","MP Módulo I");
Q("mp1","¿Cuál es la regulación internacional que rige el transporte aéreo de MP?",["El Convenio de Montreal","El Anexo 18 de OACI y el Documento 9284 AN/905","La norma IATA 121","El DAR 63"],1,"El Anexo 18 de OACI y el Doc. 9284 AN/905 (Instrucciones Técnicas para el Transporte sin Riesgo de Mercancías Peligrosas por Vía Aérea) constituyen la regulación internacional. La reglamentación de IATA (RMP) se publica para proporcionar procedimientos operativos.","MP Módulo I");
Q("mp1","¿Qué organismos desarrollan la base de las normativas de MP?",["Solo la OACI","El Comité de Expertos de la ONU (COE) y el OIEA para materiales radiactivos; la OACI usa ambas como base","IATA y la FAA","La DGAC y la JAC"],1,"El Comité de Expertos de las Naciones Unidas (COE) desarrolla procedimientos para el transporte seguro de MP; el OIEA (Organismo Internacional de Energía Atómica) los desarrolla para materiales radiactivos. La OACI utiliza ambas disposiciones como base.","MP Módulo I");
Q("mp1","Según el Código Aeronáutico Art. 195, ¿qué sanción tiene transportar objetos peligrosos sin cumplir la reglamentación?",["Solo multa administrativa","Presidio o reclusión menores en sus grados medio a máximo, o multa de 30 a 200 ingresos mínimos mensuales","Cancelación de la licencia solamente","Amonestación escrita"],1,"Art. 195: «El que transportare o hiciere transportar objetos peligrosos para la seguridad de la Aeronave, sin cumplir con las disposiciones legales o reglamentarias, será castigado con presidio o reclusión menores en sus grados medio a máximo o multa de treinta a doscientos ingresos mínimos mensuales». La misma pena aplica a quien ordene el vuelo o conduzca la aeronave con exceso de peso o mala distribución de carga.","MP Módulo I");
Q("mp1","¿Quién es el «expedidor» en el transporte de MP?",["La línea aérea","El agente de carga","El pasajero","La DGAC"],1,"Expedidor = Agente de Carga. Antes de aceptar una MP debe: reconocer e identificar las MP enviadas como carga, conocer la documentación necesaria, reconocer las etiquetas, evaluar la aceptación, actuar ante incidentes y colaborar con la detección de MP ocultas.","MP Módulo I");
Q("mp1","¿Cuál es la responsabilidad de la Tripulación de Cabina respecto a las MP?",["Aceptar la carga en bodega","Orientar al pasajero sobre las MP permitidas (dónde y bajo qué normas) y advertir al capitán de los artículos no admitidos detectados en tierra o vuelo","Clasificar las MP con su número UN","Firmar la declaración del expedidor"],1,"La TC debe orientar al pasajero sobre medidas de seguridad si lleva MP permitidas, indicando dónde (en su persona, en su equipaje de mano) y bajo qué normas, y advertir al capitán de los artículos detectados en tierra (embarque) o vuelo que no sean admitidos. Además evalúa la aceptación y reconoce las etiquetas.","MP Módulo I");
Q("mp1","¿Qué es el NOTOC?",["Un tipo de embalaje","La Notificación de cargas especiales al capitán, entregada por escrito antes de la salida del vuelo","Un número de identificación ONU","Una etiqueta de manipulación"],1,"NOTOC = «Notificación de cargas especiales al capitán». El operador debe proporcionar al piloto al mando, tan pronto como sea practicable y previo a la salida, información escrita o preimpresa exacta y legible sobre las MP que se transportarán como carga.","MP Módulo I");
Q("mp1","¿Cuál de estas cargas NO requiere NOTOC?",["DGR (mercancías peligrosas)","AVI (animales vivos)","Equipaje de mano de los pasajeros","HUM (restos humanos no cremados)"],2,"Requieren NOTOC: DGR (mercancías peligrosas), AVI (animales vivos), HUM (restos humanos no cremados), HEG (huevos fértiles), LHO (órganos humanos para trasplante) y HEA (cargas pesadas que exceden los 90 kilos).","MP Módulo I");
Q("mp1","¿Qué significa la sigla HEA en las cargas que requieren NOTOC?",["Heavy: cargas pesadas que exceden los 90 kilos","Health: material sanitario","Heating: material que genera calor","Helium: gas comprimido"],0,"HEA = Heavy: cargas pesadas que exceden los 90 kilos. También requieren NOTOC: DGR, AVI (animales vivos), HUM (restos humanos no cremados), HEG (huevos fértiles) y LHO (órganos humanos para trasplante).","MP Módulo I");
Q("mp1","Según el DAN 18, ¿por cuánto tiempo debe conservar el explotador la documentación de MP?",["1 mes","3 meses después del vuelo","6 meses","1 año"],1,"El explotador que acepte MP deberá conservar por un período NO INFERIOR A TRES (3) MESES después del vuelo copia de la declaración del expedidor, de la lista de aceptación y de la información entregada al piloto al mando, disponibles a requerimiento de la DGAC.","MP Módulo I");
Q("mp1","¿Qué es la etiqueta GHS/SGA?",["La etiqueta de las 9 clases de peligro","El Sistema Globalmente Armonizado: medio básico para informar los peligros y precauciones de un producto químico, fijado en el recipiente o embalaje externo","La etiqueta de manipulación de bodega","El número UN"],1,"GHS (Globally Harmonized System) / SGA (Sistema Globalmente Armonizado): es un medio básico para informar al usuario de los peligros y precauciones de seguridad de un producto químico. Consta de elementos informativos escritos, impresos o gráficos fijados directamente en el recipiente o embalaje externo.","MP Módulo I");

Q("mp2","¿Cuál de estas NO es una limitación en el transporte de MP?",["No todas las MP pueden transportarse por vía aérea","Algunas solo pueden transportarse en modalidad de Dispensa","Otras solo en aviones cargueros puros","Todas las MP pueden ir en avión de pasajeros si van bien embaladas"],3,"Las limitaciones son: no todas las MP pueden transportarse por vía aérea; algunas solo en modalidad de «Dispensa»; otras solo en aviones cargueros puros; y otras se pueden transportar en aviones de pasajeros y de carga.","MP Módulo II");
Q("mp2","¿Qué factores del transporte aéreo generan riesgo para las MP?",["Velocidad y altitud","Vibración, temperatura, presión y humedad","Ruido y peso","Turbulencia y hielo"],1,"Los factores que contribuyen a generar riesgo en el transporte aéreo son: VIBRACIÓN, TEMPERATURA, PRESIÓN y HUMEDAD.","MP Módulo II");
Q("mp2","¿Qué son las Mercancías Peligrosas PROHIBIDAS?",["Las que no caben en la bodega","Sustancias que bajo condiciones normales de transporte son susceptibles de reaccionar peligrosamente, producir llama o emisiones de gases o vapores tóxicos, corrosivos o inflamables","Las que no tienen etiqueta","Las que pesan más de 90 kilos"],1,"Es cualquier sustancia que bajo condiciones normales de transporte sea susceptible de reaccionar peligrosamente, producir llama o emisiones de gases o vapores tóxicos, corrosivos o inflamables. Ejemplos: nitroglicerina, cloro, dinamita, cerillos, fuegos artificiales, carbón animal o vegetal, cloruro de etilo.","MP Módulo II");
Q("mp2","¿Qué es una Dispensa Estatal?",["Un permiso para no pagar tasas","El permiso para transportar una MP prohibida","Una exención de embalaje","Un descuento en el flete"],1,"La Dispensa Estatal es el permiso para transportar una MP que figura como PROHIBIDA en la reglamentación.","MP Módulo II");
Q("mp2","¿Cuál de estas es una forma de detectar MP ocultas?",["Preguntar al pasajero su destino","Ruido de aerosoles activados, bultos generando humo o gases, cajas reutilizadas con restos de etiquetas, equipos motorizados con resto de combustible, empaques mojados o superficies muy calientes o frías","Pesar el equipaje","Revisar el pasaporte"],1,"Formas de detectar MP ocultas: ruido de aerosoles activados, bultos generando humo o gases, cajas reutilizadas con restos de etiquetas, equipos motorizados con resto de combustible, empaques mojados o manchados, y superficies excesivamente calientes o frías.","MP Módulo II");
Q("mp2","¿Cuál de estos elementos del propio avión es considerado Mercancía Peligrosa?",["Los asientos","Las botellas de oxígeno, los extintores, las baterías y los generadores de oxígeno","Las tarjetas de seguridad","Los carros de servicio"],1,"Las MP son parte del material de vuelo: baterías del avión (2), aceite de motor (residuos), rampas de escape/lanchas salvavidas, extintores (APU, bodega, container de residuos), combustible, fluido hidráulico, uranio en contrapesos, mecanismos (flaps), botellas de oxígeno (portátiles, tripulación, pasajeros), generadores de oxígeno, repelente de lluvia, refrigerantes, extractor de humos y señales de tritio.","MP Módulo II");
Q("mp2","¿Qué organismo vela por las MP en el correo aéreo?",["La OACI","La Unión Postal Universal (UPU)","IATA","La DGAC"],1,"La Unión Postal Universal (UPU) vela por todo lo relacionado con las políticas de transporte de mercancías peligrosas en el correo. Solo lo permitido está dispuesto en el capítulo 2.4.2 de la RMP.","MP Módulo II");
Q("mp2","¿Pueden las MP en cantidades EXCEPTUADAS ir en el equipaje del pasajero?",["Sí, en equipaje de mano","Sí, en equipaje facturado","No están permitidas ni como equipaje de mano, ni facturado, ni en el correo","Solo con autorización del capitán"],2,"Las mercancías peligrosas en cantidades exceptuadas NO están permitidas ni como equipaje de mano ni facturado, ni en el correo.","MP Módulo II");
Q("mp2","¿Qué son las MP de cantidad limitada?",["Las que se transportan una vez al año","Mercancías que, transportadas en cantidades limitadas, presentan un peligro menor y pueden transportarse sin riesgos en embalajes de buena calidad","Las que solo caben en un bulto","Las que se acaban en el vuelo"],1,"Las Recomendaciones de la ONU reconocen que si se transportan las mercancías en cantidades limitadas, presentan un peligro menor y pueden transportarse sin riesgos en embalajes de buena calidad.","MP Módulo II");
Q("mp2","¿Puede un Estado ser más restrictivo que las Instrucciones Técnicas de la OACI?",["No, la OACI es la máxima autoridad","Sí, algunos Estados usan su derecho legítimo a ser más restrictivos","Solo con autorización de IATA","Solo en vuelos internacionales"],1,"Algunos Estados usan su derecho legítimo a ser MÁS RESTRICTIVOS que las Instrucciones Técnicas de la OACI. Del mismo modo, nada obliga a un operador a transportar un determinado artículo, ni le impide imponer condiciones especiales (variaciones de los operadores).","MP Módulo II");
Q("mp2","A partir de qué suceso nace la TSA?",["El accidente de Tenerife","El atentado del 11 de septiembre de 2001","El secuestro de Entebbe","La caída del vuelo Lockerbie"],1,"El 11 de septiembre de 2001, tras el atentado de las Torres Gemelas, nace la TSA (Administración de Seguridad en el Transporte de USA). Varios países ajustaron su reglamentación tras ese suceso.","MP Módulo II");

Q("mp3","¿Qué es la CLASIFICACIÓN de una mercancía peligrosa?",["Ponerle una etiqueta","El proceso mediante el cual las sustancias peligrosas son asignadas a una de las 9 Clases de Peligro, expresadas en números arábigos del 1 al 9","Asignarle un número UN","Determinar su embalaje"],1,"Clasificación: proceso mediante el cual las sustancias peligrosas son asignadas a una de las 9 Clases de Peligro, expresadas en números arábigos (del 1 al 9), que sirven para identificar el peligro dentro de un determinado artículo o sustancia.","MP Módulo III");
Q("mp3","¿Qué Clase corresponde a los EXPLOSIVOS?",["Clase 1","Clase 2","Clase 3","Clase 9"],0,"Clase 1: EXPLOSIVOS. Mezcla sólida o líquida que tiene en sí misma la capacidad de experimentar reacción química produciendo gases a una temperatura, presión y velocidad tales que pueden ocasionar daños. Ejemplos: granadas, morteros, bengalas.","MP Módulo III");
Q("mp3","La Clase 2 corresponde a los GASES. ¿Qué es la división 2.3?",["Gases inflamables","Gases no inflamables no tóxicos","Gases tóxicos (ej: bromo, cloro)","Gases licuados"],2,"Clase 2 GASES: División 2.1 = gases inflamables (ej. hidrógeno) · División 2.2 = gases no inflamables no tóxicos (ej. helio) · División 2.3 = GASES TÓXICOS (ej. bromo, cloro).","MP Módulo III");
Q("mp3","¿Cuál es el punto de inflamación que define a los Líquidos Inflamables (Clase 3)?",["30 °C","45 °C","60 °C","100 °C"],2,"Clase 3 LÍQUIDOS INFLAMABLES: son líquidos cuyo punto de inflamación es de 60 °C. Pueden presentar además características tóxicas o corrosivas. Ejemplos: barnices, aguarrás, pinturas, alcoholes, adhesivos.","MP Módulo III");
Q("mp3","¿Qué caracteriza a la división 4.3 de los Sólidos Inflamables?",["Sólido inflamable común","Sólido espontáneamente combustible o pirofórico","Sólido que emite gases inflamables al contacto con el agua","Sólido oxidante"],2,"Clase 4 SÓLIDOS INFLAMABLES: División 4.1 = sólido inflamable · División 4.2 = sólido espontáneamente combustible, pirofórico · División 4.3 = sólido que emite GASES INFLAMABLES AL CONTACTO CON EL AGUA. Ejemplos: cerillos, magnesio, algodón húmedo, fósforos, carburo de silicio.","MP Módulo III");
Q("mp3","¿Qué son las sustancias de Clase 5?",["Tóxicos e infecciosos","Oxidantes (5.1) y peróxidos orgánicos (5.2): pueden provocar o favorecer la combustión desprendiendo oxígeno","Corrosivos","Radiactivos"],1,"Clase 5 OXIDANTES Y PERÓXIDOS ORGÁNICOS: División 5.1 = sustancias oxidantes/comburentes · División 5.2 = peróxidos orgánicos. Son líquidos o sólidos que pueden provocar o favorecer la combustión (desprenden oxígeno), aumentando el riesgo de incendio. Ejemplos: abono agrícola, generadores químicos de oxígeno, lejía.","MP Módulo III");
Q("mp3","¿Qué división de la Clase 6 corresponde a los materiales infecciosos?",["6.1","6.2","6.3","6.4"],1,"Clase 6 TÓXICOS E INFECCIOSOS: División 6.1 = sustancias tóxicas (clasificadas según la DL50 oral, inhalatoria y dérmica) · División 6.2 = MATERIALES INFECCIOSOS. Ejemplos: insecticidas, muestras de diagnóstico, virus.","MP Módulo III");
Q("mp3","¿Cuál es el peligro particular de los materiales radiactivos (Clase 7)?",["Que explotan fácilmente","Que emiten radiación dañina para la salud que NO puede ser detectada por ninguno de los sentidos humanos","Que se derraman con facilidad","Que son corrosivos"],1,"La peligrosidad de los materiales radiactivos es que emiten ciertos tipos de radiación que puede ser dañina para la salud pero que NO puede ser detectada por ninguno de los sentidos humanos (vista, oído, olfato, tacto). Ejemplos: uranio, torio, plutonio, radio, carbono C14, radón, polonio.","MP Módulo III");
Q("mp3","¿Qué define a la Clase 8, Corrosivos?",["Que producen humo","Sustancias que por reacción química pueden causar daño severo o destrucción a la piel, tejidos, metales, textiles, etc.","Que se calientan solas","Que emiten radiación"],1,"Clase 8 CORROSIVOS: cualquier sustancia que por reacción química pueda causar daño severo o destrucción a la piel, los tejidos, metales, textiles, etc. Ejemplos: ácido muriático, soda cáustica, mercurio, amonio cuaternario.","MP Módulo III");
Q("mp3","¿Qué incluye la Clase 9, Misceláneos?",["Solo material magnético","Materiales con propiedades narcóticas, nocivas o irritantes, o que pongan en serio peligro la seguridad del vuelo y no estén en las 8 clases restantes","Solo baterías","Solo pilas y motores"],1,"Clase 9 MISCELÁNEO: materiales con propiedades narcóticas, nocivas, irritantes o que en determinado momento pongan en serio peligro la seguridad del vuelo y que no estén contemplados en las 8 restantes clases. Ejemplos: motores de combustión interna (motosierras, cortadoras de césped), imanes, pilas.","MP Módulo III");
Q("mp3","¿Qué significa IDENTIFICAR una mercancía peligrosa?",["Ponerle una etiqueta de peligro","Asignarle un número ONU (UN Number) de 4 dígitos y un nombre apropiado de expedición según su peligrosidad","Determinar su clase","Pesarla y medirla"],1,"Identificar es asignar a la MMPP un número de las ONU (UN Number), número de 4 dígitos, y un nombre apropiado de expedición de acuerdo con su peligrosidad.","MP Módulo III");
Q("mp3","¿Qué indica el ID 8000?",["Que la MP es explosiva","Que la MMPP NO está clasificada ni oficializada por el comité de expertos de MMPP de la ONU","Que está prohibida","Que requiere dispensa"],1,"El ID 8000 se usa cuando la MMPP NO está clasificada y oficializada por el comité de expertos de MMPP de la ONU.","MP Módulo III");
Q("mp3","En la lista de MP, la Acetona figura como UN 1090, Clase 3. ¿Qué etiqueta le corresponde?",["Gas tóxico","Líquido inflamable","Corrosivo","Sólido inflamable"],1,"UN 1090 Acetona, Clase o División 3 → etiqueta de riesgo: LÍQUIDO INFLAMABLE. La columna A es el N° UN o ID, la B el nombre apropiado de expedición, la C la clase o división y la D la(s) etiqueta(s) de peligro.","MP Módulo III");
Q("mp3","Si en la lista de MP el Cloro (UN 1017) figura como «Prohibido» en todas las columnas de transporte, significa que…",["Puede ir en avión de carga","No puede transportarse ni en avión de pasajeros ni de carga, salvo con Dispensa Estatal","Solo va en cantidades limitadas","Requiere embalaje especial"],1,"El Cloro UN 1017, división 2.3 (riesgos secundarios 5.1 y 8), figura como Prohibido tanto en aviones de pasajeros y carga como en avión de carga solamente. Su transporte solo sería posible mediante Dispensa Estatal.","MP Módulo III");

Q("mp4","¿Cuál es la regla general de la Tabla 2.3A?",["Todas las MP están permitidas si van declaradas","Las MP no deben transportarse ni dentro ni como equipaje facturado, ni como equipaje de mano de pasajeros o tripulación, EXCEPTO lo previsto en la tabla","Solo se permiten en equipaje facturado","Solo se permiten con aprobación del operador"],1,"Tabla 2.3A: «Las mercancías peligrosas no deben ser transportadas ni dentro o como equipaje facturado, ni como equipaje de mano de los pasajeros o de la tripulación, EXCEPTO lo que está previsto a continuación». Lo permitido en equipaje de mano también se permite «en la persona», salvo que se especifique lo contrario.","MP Módulo IV");
Q("mp4","¿Dónde pueden llevarse los fósforos de seguridad (un paquete pequeño) o un encendedor pequeño?",["En el equipaje facturado","EN LA PERSONA","En el equipaje de mano","Están totalmente prohibidos"],1,"Fósforos (cerillas) de seguridad en un paquete pequeño, o un encendedor pequeño que no contenga combustible líquido no absorbido: permitidos EN LA PERSONA. No en equipaje de mano ni facturado.","MP Módulo IV");
Q("mp4","Un pasajero lleva un arma de electrochoque (Taser). ¿Qué corresponde?",["Va en bodega","Va en cabina con aprobación del operador","Está PROHIBIDA en equipaje de mano, facturado y en la persona","Requiere solo informar al capitán"],2,"Las armas de electrochoque (Taser) contienen MP como explosivos, gases comprimidos o baterías de litio: se PROHIBEN dentro del equipaje de mano, facturado o en la persona.","MP Módulo IV");
Q("mp4","Un pasajero lleva gas pimienta para defensa personal. ¿Qué corresponde?",["Permitido en bodega","Permitido en cabina","PROHIBIDO en la persona, equipaje facturado y equipaje de mano","Permitido con aprobación del operador"],2,"Los elementos discapacitadores como gas pimienta, rociador o mace, que contengan una sustancia irritante o discapacitadora, están PROHIBIDOS en la persona, en equipaje facturado y en equipaje de mano.","MP Módulo IV");
Q("mp4","¿Cuál es el límite general para las baterías de litio de repuesto que puede llevar un pasajero?",["Sin límite","Deben ser de 12 V o menos y 100 Wh o menos; máximo 2 baterías de repuesto por persona","Máximo 5 baterías de 200 Wh","Solo 1 batería de cualquier capacidad"],1,"Baterías no derramables: deben ser de 12 V o menos y 100 Wh o menos. Cada persona puede llevar un máximo de 2 BATERÍAS DE REPUESTO. Las baterías de repuesto van protegidas individualmente para evitar cortocircuitos y solo en equipaje de mano.","MP Módulo IV");
Q("mp4","Para dispositivos médicos electrónicos portátiles (PMED), ¿cuál es el rango de capacidad especial permitido?",["Hasta 100 Wh","Superior a 100 Wh sin exceder los 160 Wh, y contenido de litio superior a 2 g sin exceder 8 g","Hasta 300 Wh","Sin límite con receta médica"],1,"Para PMED se permite capacidad superior a 100 Wh sin exceder los 160 Wh, y contenido de litio superior a 2 g sin exceder 8 g. Deben estar protegidas individualmente para evitar cortocircuitos y se permite un máximo de 2 baterías de repuesto SOLO en equipaje de mano.","MP Módulo IV");
Q("mp4","¿Cómo deben transportarse los cigarrillos electrónicos y vaporizadores?",["En el equipaje facturado","Desarmados, con la batería aparte y protegida para impedir su activación involuntaria","Encendidos en la persona","En la bodega, en caja rígida"],1,"E-cigarros, pipas y otros vaporizadores personales deberán ir DESARMADOS con la batería aparte y protegida para impedir su activación involuntaria. Van en cabina, nunca en equipaje facturado.","MP Módulo IV");
Q("mp4","Un equipaje con baterías de litio EXTRAÍBLES va a ser facturado. ¿Qué corresponde?",["Se factura tal cual","Las baterías deben ser extraídas y transportadas en la cabina","Se prohíbe el equipaje","Se avisa al capitán y se factura"],1,"Equipaje dotado de baterías de litio EXTRAÍBLES: las baterías deben ser extraídas si el equipaje ha de ser facturado, y las baterías extraídas deben transportarse EN LA CABINA.","MP Módulo IV");
Q("mp4","¿Qué límite tienen las baterías NO extraíbles de un equipaje inteligente?",["100 Wh","Máximo 0,3 g de metal litio o, para ion litio, no exceder 2,7 Wh","160 Wh","No hay límite"],1,"Equipaje con baterías NO extraíbles: las baterías deben contener un máximo de 0,3 g de metal litio o, para ion litio, no exceder de 2,7 Wh. Si exceden esos valores, el equipaje está PROHIBIDO.","MP Módulo IV");
Q("mp4","Una silla de ruedas con batería de ION LITIO (WCLB), ¿qué requisitos tiene?",["Ninguno especial","Terminales aislados, retirar la batería, y que no exceda 300 Wh (o dos baterías de máximo 160 Wh cada una)","Puede ir con la batería instalada","Está prohibida"],1,"Ayudas motrices impulsadas por baterías de ion litio (WCLB): terminales de baterías aislados, retirar la batería, y la batería no debe exceder los 300 Wh; si son dos baterías, no deben exceder los 160 Wh cada una.","MP Módulo IV");
Q("mp4","Una silla de ruedas con batería húmeda NO derramable (WCBD), ¿qué requisitos tiene?",["Debe desconectarse siempre","Batería desconectada y bornes protegidos contra cortocircuitos; la batería de gel no requiere desconexión si los terminales están aislados","Va prohibida","Solo con dispensa estatal"],1,"Ayudas motrices con baterías húmedas NO derramables (WCBD): batería desconectada, bornes protegidos contra cortocircuitos. La batería de GEL no requiere ser desconectada siempre que los terminales estén aislados. Si se puede desconectar, se llevará en un contenedor rígido.","MP Módulo IV");
Q("mp4","¿Cuál es el peligro de una batería DERRAMABLE?",["Que se descarga rápido","Que contiene ácido sulfúrico diluido (líquido corrosivo) y no puede voltearse, ya que al liberarse puede causar daños de consideración","Que emite radiación","Que explota con el calor"],1,"Las baterías derramables tienen tapas atornillables por donde se ingresa líquido (agua destilada). El peligro es que no se pueden voltear porque su contenido es ácido sulfúrico diluido (líquido corrosivo) que al ser liberado puede causar daños de consideración. Las inderramables son selladas y pueden ir en cualquier posición.","MP Módulo IV");
Q("mp4","¿Qué requisito tiene un hornillo de acampada usado que lleva un pasajero?",["Va prohibido siempre","Drenado al menos por una hora, destapado por mínimo 6 horas para evaporar el residuo, sellado con tapa bien asegurada y envuelto en material absorbente","Solo lavarlo con agua","Declararlo al capitán"],1,"Hornillos de acampada y contenedores que hayan contenido combustible inflamable líquido: drenados al menos por 1 HORA, destapados por mínimo 6 HORAS para evaporar el residuo, sellados con tapa bien asegurada y envueltos en material absorbente.","MP Módulo IV");
Q("mp4","Un motor de combustión interna que lleva un pasajero debe cumplir la disposición A70. ¿Qué exige?",["Que sea nuevo","Estanque lavado o purgado de vapores o líquidos inflamables, documento que lo acredita, y tapado y sellado","Que pese menos de 10 kilos","Que vaya en cabina"],1,"Motores de combustión interna o de pilas de combustible (disposición A70): estanque lavado o purgado de vapores o líquidos inflamables, documento que lo acredita, y tapados y sellados.","MP Módulo IV");
Q("mp4","¿Qué artículos de la Tabla 2.3A exigen que el PILOTO AL MANDO esté informado de su ubicación?",["Todos los aerosoles","Los 5 artículos: OXYG, WCLB, WCBD, WCBW y los que requieren aprobación del operador","Solo las baterías de litio","Ninguno"],1,"Existen artículos en la Tabla 2.3A de los cuales el piloto al mando DEBE estar informado de su ubicación, identificados con los códigos OXYG (cilindros de oxígeno), WCLB, WCBD y WCBW (ayudas motrices con distintos tipos de batería).","MP Módulo IV");
Q("mp4","¿Qué es el Anexo A en el manejo de MP de pasajeros?",["La lista de MP prohibidas","La Autorización del explotador para transportar MP por un pasajero o miembro de la tripulación, en 3 copias (pasajero, explotador y AVSEC)","La declaración del expedidor","El NOTOC"],1,"Anexo A: Autorización del explotador para transportar MP por un pasajero o miembro de la tripulación. Copia 1 pasajero, copia 2 explotador de aeronaves, copia 3 AVSEC. Se usa cuando se requiere aprobación del operador y cuando el piloto al mando debe estar informado de la ubicación. El Anexo B es el Acta de entrega de MP al explotador.","MP Módulo IV");
Q("mp4","Un pasajero lleva un termómetro clínico de mercurio. ¿Qué clase es y está permitido?",["Clase 6, prohibido","Clase 8 (corrosivos), permitido según la Tabla 2.3A","Clase 9, prohibido","Clase 3, permitido"],1,"El termómetro y barómetro de mercurio y el termómetro clínico o médico que contenga mercurio están en la Clase 8 (Corrosivos) y figuran en la Tabla 2.3A como permitidos bajo condiciones (ver 2.3.3.1).","MP Módulo IV");
Q("mp4","Un pasajero necesita viajar con oxígeno médico. ¿Qué exige el DAN 121?",["Que lo traiga de su casa","Que el equipo sea proporcionado por el operador, de tipo aprobado y mantenido conforme a un programa aprobado por la DGAC, con prescripción médica","Que lo compre en el aeropuerto","Que viaje acompañado"],1,"DAN 121 / punto 153: el operador permitirá que un pasajero con prescripción médica transporte y opere un equipo de oxígeno cuando sea proporcionado por el operador, de un tipo debidamente aprobado que cumpla requisitos de fabricación, empaque, marcas, rotulación y mantenimiento, y mantenido por el operador conforme a un programa aprobado por la DGAC.","MP Módulo IV");

Q("mp5","¿Qué son las etiquetas de MANIPULACIÓN?",["Las que indican la clase de peligro","Las destinadas a indicar visualmente los cuidados adicionales que requieren algunos embarques para su correcta manipulación durante almacenaje y estiba","Las del embalaje externo","Las del GHS"],1,"Las etiquetas de manipulación proporcionan una indicación visual sobre los cuidados adicionales que requieren algunos embarques, para la correcta manipulación durante su almacenaje y estiba en las bodegas de la aeronave. Las etiquetas de PELIGRO corresponden a una de las 9 clases o divisiones.","MP Módulo V");
Q("mp5","Si una etiqueta de MP fue colocada por error en un artículo que no es MP, ¿qué corresponde?",["Dejarla, no molesta","La etiqueta deberá ser removida o tachada para evitar confusiones","Cambiarla por otra","Reportarlo a la DGAC"],1,"Cuando una etiqueta de MP sea colocada a un artículo que no se considere Mercancía Peligrosa, la etiqueta deberá ser REMOVIDA O TACHADA de manera de evitar confusiones.","MP Módulo V");
Q("mp5","¿Cuál es la diferencia entre ACCIDENTE e INCIDENTE imputable a MP?",["El accidente ocurre en tierra y el incidente en vuelo","El accidente ocasiona lesiones MORTALES O GRAVES o daños de consideración; el incidente ocasiona lesiones, daños o vulneración de un embalaje sin llegar a ser accidente","No hay diferencia","El incidente solo lo declara el capitán"],1,"ACCIDENTE imputable a MP: ocurrencia que ocasiona lesiones MORTALES O GRAVES a alguna persona o daños de consideración a la propiedad y el medio ambiente. INCIDENTE: ocurrencia que no constituye accidente y que ocasiona lesiones, daños a la propiedad o medio ambiente, incendio, ruptura, derramamiento, fugas, radiación o cualquier manifestación de que se vulneró la integridad de un embalaje. También lo es toda ocurrencia que pueda haber puesto en peligro a la aeronave o sus ocupantes.","MP Módulo V");
Q("mp5","¿Un incidente imputable a MP debe producirse necesariamente a bordo de la aeronave?",["Sí, siempre","No, no tiene que producirse necesariamente a bordo","Solo si hay pasajeros","Solo en vuelo"],1,"Por definición, el incidente imputable a mercancías peligrosas «no tiene que producirse necesariamente a bordo de alguna aeronave».","MP Módulo V");
Q("mp5","¿Quién informa un incidente relacionado con MP?",["El TAC1","El Piloto al mando","El expedidor","El personal de rampa"],1,"Quien informa es el PILOTO AL MANDO. El Estado donde ocurra el incidente deberá investigar las circunstancias según su gravedad y remitir notificación a la OACI y a los demás Estados interesados.","MP Módulo V");
Q("mp5","¿A quiénes se envía el formulario de notificación de accidentes/incidentes de MP?",["Solo a la OACI","Al Estado donde ocurrió, al de origen, al de matrícula, al del explotador, a todo Estado que haya facilitado información y a la OACI","Solo a la aerolínea","Al fabricante del avión"],1,"El Estado que investiga debe enviar el formulario lo antes posible a: a) el Estado en que ocurrió el accidente, b) el Estado de origen, c) el Estado de matrícula, d) el Estado del explotador, e) todo otro Estado que haya facilitado información pertinente y f) la OACI.","MP Módulo V");
Q("mp5","¿Cuál es la secuencia del ciclo de incidentes/accidentes con MP?",["Reporte, sanción, multa","Reporte, investigación, recomendación, aplicación y verificación","Detección, aislamiento, limpieza","Notificación, cierre, archivo"],1,"El ciclo es: Reporte → Investigación → Recomendación → Aplicación → Verificación.","MP Módulo V");
Q("mp5","Cuando se sospecha que un accidente de aviación es imputable a MP, ¿cómo se investiga?",["Por separado del accidente","La investigación relativa a las MP constituirá PARTE de la investigación del accidente de aviación, bajo coordinación del investigador encargado","Solo la investiga el operador","No se investiga"],1,"Cuando exista certeza o sospecha de que un accidente de aviación (según el Anexo 13 del Convenio de Chicago) es imputable al transporte de MP, la investigación relativa a las MP constituirá PARTE de la investigación del accidente, bajo la coordinación del investigador encargado.","MP Módulo V");

Q("mp6","Ante un derrame de MP en TIERRA, ¿cuál es la secuencia de acciones?",["Limpiar, reportar, continuar","AÍSLE, EVALÚE, ACTÚE y REPORTE","Evacuar, llamar, esperar","Neutralizar, embalar, despachar"],1,"En caso de derrames en tierra: AÍSLE (mantenga a las personas alejadas del área) · EVALÚE (obtenga información apropiada: NOTOC, detalles del derrame y otras cargas cercanas) · ACTÚE (comuníquese con el centro de coordinación y de ser necesario el SSEI) · REPORTE (efectúe el informe adecuado).","MP Módulo VI");
Q("mp6","Ante un derrame o filtración de una sustancia, ¿a quién se llama?",["A la aerolínea únicamente","A las autoridades pertinentes (S.S.E.I.), proporcionando toda la información sobre las sustancias afectadas","A la DGAC directamente","Al fabricante"],1,"En caso de derrame o filtración: aislar la zona, llamar a las autoridades pertinentes (S.S.E.I. — Servicio de Seguridad y Extinción de Incendios) y proporcionar toda la información referente a las sustancias que pudieren verse afectadas en el siniestro.","MP Módulo VI");
Q("mp6","¿Qué documento es la guía para incidentes con MP en vuelo?",["El Doc 9284 AN/905","El Doc. 9481 AN/928 de OACI","El Anexo 18","El DAN 18"],1,"El Doc. 9481 AN/928 de OACI: «Orientación sobre respuestas de emergencia para afrontar incidentes aéreos relacionados con mercancías peligrosas». Es la guía de respuesta para un incidente con MP en vuelo.","MP Módulo VI");
Q("mp6","En la clasificación de compartimientos de carga, ¿qué caracteriza a la Clase D?",["Es de fácil acceso","Tiene detector de humo y extintor integral","Está diseñado para controlar el fuego LIMITANDO CRÍTICAMENTE EL SUMINISTRO DE OXÍGENO","Es solo para aviones de carga"],2,"Clase A: se puede actuar en caso de incendio, fácil acceso. Clase B: acceso suficiente para alcanzar el incendio con extintor manual y hay detector aprobado. Clase C: detector aprobado más sistema integral desde el puesto del piloto. Clase D: diseñado para controlar el fuego LIMITANDO CRÍTICAMENTE EL SUMINISTRO DE OXÍGENO. Clase E: únicamente aviones de carga.","MP Módulo VI");
Q("mp6","¿Qué compartimiento de carga pertenece únicamente a los aviones destinados a transporte de carga?",["Clase A","Clase C","Clase D","Clase E"],3,"El compartimiento Clase E pertenece únicamente a los aviones destinados al transporte de carga.","MP Módulo VI");
Q("mp6","En la tabla de respuesta de emergencia, ¿qué significa la clave alfabética «W»?",["Corrosivo","Comburente","Si se moja emite gases venenosos o inflamables","Material magnético"],2,"Claves alfabéticas: A = anestésico · C = corrosivo · E = explosivo · F = inflamable · H = muy combustible · I = irritante/lacrimógeno · L = escaso o ningún otro riesgo · M = material magnético · N = nocivo · P = veneno · S = combustión espontánea o pirofórico · W = SI SE MOJA EMITE GASES VENENOSOS O INFLAMABLES · X = comburentes.","MP Módulo VI");
Q("mp6","¿Qué NUNCA debe hacerse ante un fuego con clave alfabética «W»?",["Usar halón","Echar AGUA","Usar oxígeno al 100%","Ventilar la cabina"],1,"En la tabla de respuesta de emergencia, para varios procedimientos se indica: «Todos los agentes de que se disponga, NUNCA SE ECHE AGUA en caso de la Clave Alfabética W» (porque si se moja emite gases venenosos o inflamables).","MP Módulo VI");
Q("mp6","¿Qué significa la clave alfabética «P» en la tabla de respuesta de emergencia?",["Pirofórico","Veneno","Presión","Peligroso"],1,"P = VENENO. (S = combustión espontánea o pirofórico · N = nocivo · I = irritante/lacrimógeno).","MP Módulo VI");
Q("mp6","En el procedimiento 1 de la tabla de respuesta, ¿qué se ordena respecto al oxígeno y al humo?",["Ventilar al máximo","Úsese oxígeno al 100% y prohíbase fumar","Reducir el oxígeno","No usar oxígeno"],1,"Procedimiento 1 (explosión que puede provocar fallas estructurales): «Úsese Oxígeno al 100%, Prohíbase Fumar». La mayoría de los procedimientos indican usar oxígeno al 100% y mantener la máxima ventilación posible.","MP Módulo VI");
Q("mp6","¿Cuáles son las medidas iniciales del checklist ante un incidente con MP?",["Aterrizar de inmediato","Seguir los procedimientos de emergencia para eliminar fuego o humo, encender la señal de prohibido fumar, considerar aterrizar lo antes posible y desconectar circuitos eléctricos no indispensables","Evacuar la cabina","Contactar al expedidor"],1,"Medidas iniciales (Doc 9481 Sec. 3.1): seguir los procedimientos de emergencia pertinentes para eliminar el fuego o el humo, encender la señal de prohibido fumar, considerar la posibilidad de aterrizar lo antes posible y considerar desconectar los circuitos eléctricos que no sean indispensables.","MP Módulo VI");
Q("mp6","Después de aterrizar por un incidente con MP, ¿qué debe hacerse antes de abrir los compartimientos de carga?",["Ventilar la bodega","Hacer desembarcar a los pasajeros y a la tripulación","Llamar al expedidor","Fotografiar la carga"],1,"Después del aterrizaje: hacer desembarcar a los pasajeros y a la tripulación ANTES de abrir las puertas de cualquier compartimiento de carga, informar al personal de tierra/servicios de emergencia sobre la naturaleza del producto y dónde está estibado, y consignar la anotación en el libro de mantenimiento.","MP Módulo VI");
Q("mp6","Si hay evidencias físicas de fuego, ruido o emanaciones de gases durante un incidente con MP, ¿qué corresponde?",["Acercarse a identificar el artículo","¡Alejarse del área inmediatamente!","Descargar el extintor a distancia","Abrir el OHB para ventilar"],1,"La regla es categórica: «Si hay evidencias físicas de fuego, ruido o emanaciones de gases, ¡ALÉJESE DEL ÁREA INMEDIATAMENTE!».","MP Módulo VI");
Q("mp6","¿Qué debe notificar el piloto al ATC ante un incidente con MP, como mínimo?",["El peso de la carga","El número ONU de las mercancías peligrosas que se transporten","El nombre del expedidor","La clase de compartimiento"],1,"Si la situación lo permite, se debe notificar al ATC (Air Traffic Control), como mínimo, el NÚMERO ONU de las mercancías peligrosas que se transporten. También hay que determinar la clave del procedimiento de respuesta y usar la tabla como ayuda.","MP Módulo VI");
Q("mp6","¿Cuál de estos elementos sugiere la OACI para el equipo de respuesta a emergencias con MP?",["Un extintor adicional","Bolsas grandes de polietileno, ligaduras, tarjetas de identificación, guantes largos de goma, máscara contra salpicaduras, anteojos contra humo, cinta adhesiva y papel absorbente","Un botiquín completo","Una manta ignífuga"],1,"El equipo sugerido por OACI incluye: bolsas grandes de polietileno, ligaduras para bolsas, tarjetas de identificación para las bolsas, guantes largos de goma, máscara protectora contra salpicaduras, anteojos contra humo, máscara protectora contra partículas microorgánicas, cinta adhesiva y papel absorbente.","MP Módulo VI");

/* ================= AVSEC · SEGURIDAD DE AVIACIÓN ================= */
Q("av1","¿Qué significa la sigla AVSEC?",["Aviation Service","Aviation Security: seguridad de aviación a nivel mundial","Aviación Segura Certificada","Air Vehicle Section"],1,"AVSEC es genérica y se refiere al ámbito de la SEGURIDAD DE AVIACIÓN a nivel mundial (AV = Aviation, SEC = Security). Su misión es «prevenir, contrarrestar y, en lo posible, evitar la comisión de actos ilícitos que atenten contra la Seguridad de la Aviación Civil».","AVSEC Módulo I");
Q("av1","Según el Anexo 17 de OACI, ¿cómo se define la seguridad aeroportuaria?",["La vigilancia con cámaras","La protección de la aviación contra los actos de interferencia ilícita mediante una combinación de medidas y recursos humanos y materiales","El control de acceso a la pista","La seguridad operacional del vuelo"],1,"Definición del Anexo 17 de OACI: es la protección de la aviación contra los actos de interferencia ilícita mediante una combinación de medidas y recursos humanos y materiales.","AVSEC Módulo I");
Q("av1","¿Cuándo y dónde fue creada la OACI, y dónde tiene su sede?",["1919 en La Haya, sede en Ginebra","1944 con el Convenio de Chicago, sede en Montreal (Canadá)","1963 con el Convenio de Tokio, sede en París","1999 con el Convenio de Montreal, sede en Nueva York"],1,"La OACI fue creada en 1944 con el Convenio de Chicago y tiene su sede en Montreal (Canadá). Está formada por 193 Estados miembros (incluido Chile) y su legislación base son los Anexos y Manuales.","AVSEC Módulo I");
Q("av1","¿Qué regula el Convenio de Montreal de 1999?",["Los actos de interferencia ilícita","La responsabilidad de las aerolíneas en caso de accidentes: derechos y compensaciones para los pasajeros","El transporte de mercancías peligrosas","Las licencias del personal"],1,"El Convenio de Montreal (28 de mayo de 1999), que reemplazó al Convenio de Varsovia de 1929, regula la responsabilidad de las aerolíneas en caso de accidentes aéreos, estableciendo derechos y compensaciones por lesiones o muerte de pasajeros, pérdida/daño/retraso de equipaje y retrasos de vuelos.","AVSEC Módulo I");
Q("av1","¿Qué establece el Convenio de Tokio de 1963?",["Los límites de indemnización por equipaje","Las normas sobre delitos cometidos a bordo de aeronaves, la jurisdicción de los Estados y las facultades del comandante","La creación de la OACI","El transporte de MP"],1,"El Convenio de Tokio (1963), «Convenio sobre las infracciones y otros actos cometidos a bordo de las aeronaves», armoniza las normas sobre delitos cometidos en aeronaves, establece la jurisdicción de los Estados y define las facultades del comandante para manejar incidentes y entregar sospechosos a las autoridades. Ratificado por 186 países.","AVSEC Módulo I");
Q("av1","¿Sobre qué versa el Anexo 17 de OACI y cuándo fue adoptado?",["Investigación de accidentes, 1951","Protección de la Aviación Civil Internacional contra actos de interferencia ilícita, adoptado el 22 de marzo de 1974","Transporte de mercancías peligrosas, 1981","Licencias al personal, 1944"],1,"El Anexo 17 fue adoptado por el consejo de la OACI el 22 de marzo de 1974 y versa específicamente sobre el programa de seguridad técnica de la aviación patrocinada por la OACI: Protección de la Aviación Civil Internacional contra actos de interferencia ilícita.","AVSEC Módulo I");
