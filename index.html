Q("av1","¿Cuándo y dónde surge la IATA?",["1944 en Chicago","1919 en La Haya, Países Bajos, fundada por 32 naciones y 53 miembros; reconocida por OACI en 1945","1974 en Montreal","2002 en Bruselas"],1,"La IATA surge en La Haya, Países Bajos, en 1919, fundada por 32 naciones y 53 miembros de Europa y Norteamérica; en 1945 fue reconocida por OACI. Actualmente la forman 290 compañías aéreas de 117 países que suman más del 80% del tráfico aéreo.","AVSEC Módulo I");
Q("av1","¿De qué departamento del gobierno de EE.UU. depende la TSA?",["Del Departamento de Estado","Del Departamento de Seguridad Nacional (DHS - Department of Homeland Security)","De la FAA","Del Departamento de Transporte solamente"],1,"La TSA (Administración de Seguridad en el Transporte) es una agencia del Departamento de Seguridad Nacional de los Estados Unidos (DHS). Gestiona sistemas de seguridad en aeropuertos, metros y ferrocarriles norteamericanos.","AVSEC Módulo I");
Q("av1","¿Qué es la EASA?",["La agencia de seguridad de EE.UU.","El organismo de la Unión Europea responsable de la seguridad de la aviación civil, fundada en 2002","Una aerolínea europea","El equivalente europeo de IATA"],1,"EASA es el organismo de la Unión Europea responsable de la seguridad de la aviación civil. Fundada en 2002, realiza certificación, regulación y estandarización, además de investigaciones y monitoreo. Su normativa incluye la Part-145 y regula el uso profesional de drones.","AVSEC Módulo I");
Q("av1","¿Quién creó la DGAC y en qué fecha?",["El Presidente de la República, en 1944","El Comodoro Arturo Merino Benítez, el 28 de marzo de 1930","La Fuerza Aérea, en 1968","La JAC, en 1990"],1,"La DGAC de Chile fue establecida el 28 de marzo de 1930 por el Comodoro Arturo Merino Benítez, como parte de la recién creada Subsecretaría de Aviación y la Fuerza Aérea Nacional (FAN). Depende de la Fuerza Aérea de Chile.","AVSEC Módulo I");
Q("av1","¿Qué ley aprueba el Código Aeronáutico chileno?",["Ley N° 16.752 de 1968","Ley N° 18.916 de 1990","Ley N° 20.321","Ley N° 20.000"],1,"La Ley N° 18.916 de 1990 aprueba el Código Aeronáutico. La Ley N° 16.752 de 1968 fija la organización y funciones de la DGAC.","AVSEC Módulo I");
Q("av1","Según el Art. 194 bis del Código Aeronáutico, ¿qué sanción tienen los que atentan contra una aeronave SIN violencia ni intimidación?",["Solo multa","Presidio menor en su grado medio a máximo","Cadena perpetua","Amonestación"],1,"Art. 194 bis: «Los que sin emplear violencia, amenaza de violencia ni intimidación atentaren en contra de una aeronave en vuelo o en servicio y realizaren actos que pongan o puedan poner en peligro la vida, la integridad personal o la salud de sus pasajeros o tripulantes, serán sancionados con presidio menor en su grado medio a máximo».","AVSEC Módulo I");
Q("av1","¿Qué es el PNSAC?",["El Programa Nacional de Seguridad de la Aviación Civil","El Programa Nacional de Carga Aérea","La norma de credenciales aeroportuarias","El plan de emergencia del aeropuerto"],0,"PNSAC = Programa Nacional de Seguridad de la Aviación Civil. Otros: PNSCA (Seguridad de la Carga Aérea), PNISAC (Instrucción de Seguridad) y PNCCSAC (Control de Calidad de Seguridad). Todos derivan del DAR 17.","AVSEC Módulo I");
Q("av1","¿Qué regula el DAR 17?",["El transporte de mercancías peligrosas","La seguridad y protección de la aviación civil contra los actos de interferencia ilícita","Las licencias del personal","La operación de aeronaves"],1,"El DAR 17 es el «Reglamento de Seguridad, protección de la Aviación Civil contra los actos de Interferencia Ilícita». El DAR 18 regula el transporte sin riesgo de mercancías peligrosas.","AVSEC Módulo I");

Q("av2","¿Quiénes deben pasar el control de seguridad para entrar a una zona crítica o restringida?",["Solo los pasajeros","Todo el personal que trabaje en el aeropuerto, igual que los pasajeros","Solo la tripulación","Solo los visitantes"],1,"Al igual que los pasajeros, todo el personal que trabaje en el aeropuerto y tenga que pasar a una zona crítica o restringida está en la obligación de pasar el control de seguridad. Los trabajadores deben mostrar acreditación e identificación; todos los objetos pasan por rayos X.","AVSEC Módulo II");
Q("av2","¿Por qué se controla también a los empleados del aeropuerto?",["Por estadística","Porque alguien puede introducirse simulando ser un empleado, pueden haber coaccionado a un empleado, o pueden haber colocado un objeto prohibido sin su conocimiento","Por exigencia del sindicato","Para contar al personal"],1,"Se controla porque: alguien puede introducirse simulando ser un empleado, pueden haber coaccionado a un empleado a introducir algo prohibido, o pueden haber colocado un objeto prohibido sin conocimiento del empleado.","AVSEC Módulo II");
Q("av2","¿Qué son los artículos RETENIDOS?",["Los que se requisan definitivamente","Objetos prohibidos de embarcar en cabina por constituir riesgo, pero que SÍ pueden transportarse en bodega sin acceso durante el vuelo","Los que se devuelven al pasajero","Los que pasan a la autoridad"],1,"RETENIDOS: objetos prohibidos de embarcar en la cabina porque pueden constituir un riesgo al ser transportados por el pasajero en su vestimenta o equipaje de mano, PERO que pueden ser transportados en la bodega de tal manera que ninguna persona tenga acceso al elemento durante el vuelo.","AVSEC Módulo II");
Q("av2","¿Qué son los artículos PROHIBIDOS (requisados)?",["Los que van en bodega","Aquellos que no deben subir a los aviones porque son motivo de constante riesgo para el vuelo, los lleve un pasajero o no","Los que superan los 100 ml","Los que no caben en el OHB"],1,"PROHIBIDOS (requisados): todos aquellos que no deben subir a los aviones porque son motivo de constante riesgo para el vuelo, ya sea que lo lleve un pasajero o no. Ejemplos: cortaplumas, cuchillos, tijeras, palillos de tejer, clavos, punzones.","AVSEC Módulo II");
Q("av2","¿Qué exige el DAR 17 respecto de las verificaciones de seguridad de la aeronave?",["Que las haga solo la policía","Que los explotadores realicen verificaciones cuando la aeronave esté operando, estacionada o pernoctando en una zona de seguridad restringida","Que se hagan una vez al mes","Que las haga el fabricante"],1,"El DAR 17 exige que los explotadores de aeronaves realicen verificaciones de seguridad cuando una aeronave esté operando, estacionada o pernoctando en una zona de seguridad restringida.","AVSEC Módulo II");
Q("av2","¿Quién puede realizar la verificación de seguridad de la aeronave?",["Solo personal de seguridad privada","Tripulación de vuelo, tripulación de cabina, personal de seguridad privada o personal calificado definido por el explotador en su programa de seguridad","Solo la DGAC","Solo el comandante"],1,"La verificación de seguridad de la aeronave podrá ser realizada por tripulación de vuelo, tripulación de cabina, personal de seguridad privada o personal calificado definido por el explotador de aeronave en su programa de seguridad.","AVSEC Módulo II");
Q("av2","¿Cuáles son las áreas a verificar en la inspección de seguridad de la cabina?",["Solo los baños","Cabina de pasajeros, baños, cocinas y exterior","Solo los OHB","Cockpit y bodega"],1,"Las áreas a verificar son: CABINA DE PASAJEROS, BAÑOS, COCINAS y EXTERIOR. Es la tripulación de cabina la que informa VERBALMENTE al comandante la finalización del proceso de verificación y las eventuales observaciones.","AVSEC Módulo II");
Q("av2","La revisión de seguridad de la aeronave, ¿qué debe incluir?",["Solo el interior","La inspección completa y detallada del interior y exterior de la aeronave, la inspección de personas que no son pasajeros que ingresen después de la inspección, y notificación al comandante al finalizar","Solo las zonas de pasajeros","Solo el equipaje"],1,"Debe incluir: inspección completa y detallada del interior y exterior de la aeronave, inspección de todas las personas que no son pasajeros que requieren ingresar después de realizada la inspección, y notificación verbal o escrita al comandante al finalizar.","AVSEC Módulo II");
Q("av2","¿Qué ocurre con un usuario que rehúsa someterse al control y revisión de seguridad?",["Se le permite el ingreso igual","Se le NIEGA el ingreso a la aeronave y el personal de seguridad privada comunica al supervisor del vuelo los motivos","Se le revisa por sorpresa","Se le cobra una multa"],1,"Se negará el ingreso a la aeronave a los usuarios que rehúsen someterse al control y revisión de seguridad cuando corresponda. El personal de seguridad privada comunicará al supervisor del vuelo presente en el lugar, para informar sobre los motivos de la negación de ingreso.","AVSEC Módulo II");
Q("av2","¿Qué se hace con los objetos olvidados (RFP) en las aeronaves?",["Se botan","Se entregan a Lost & Found, se registran en World Tracer y se etiquetan; se entregan solo en el aeropuerto tras verificar la propiedad","Se envían al domicilio del pasajero","Se rematan"],1,"Los objetos olvidados (RFP) se entregan a Lost & Found, donde se registran en World Tracer y se etiquetan. Si el pasajero reclama el objeto, se verifica la propiedad y se entrega solo en el aeropuerto (no se realizan envíos).","AVSEC Módulo II");
Q("av2","Según el procedimiento de algunas líneas aéreas, ¿qué plazo tienen los objetos no reclamados?",["1 semana","Si no se reclama en 2 meses va a la Central de Equipajes hasta completar 4 meses; luego se desecha o dona","6 meses","1 año"],1,"Si el artículo no es reclamado en 2 meses, se envía a la Central de Equipajes donde permanece hasta completar 4 meses. Luego se desecha o dona según autorización. Los artículos de valor se guardan en bodega con inventario mensual.","AVSEC Módulo II");
Q("av2","¿Qué ocurre con los pasajeros en tránsito provenientes de vuelos internacionales?",["Pasan directo","Todo pasajero y equipaje proveniente de vuelos internacionales debe ser REINSPECCIONADO antes de ingresar a zona estéril o embarcar, incluso si continúa en un vuelo nacional","Solo se revisa el equipaje facturado","Solo si hay alerta"],1,"Los explotadores deben aplicar controles de seguridad a pasajeros en tránsito o conexión y a su equipaje de mano. Todo pasajero y equipaje proveniente de vuelos internacionales debe ser reinspeccionado antes de ingresar a zona estéril o embarcar, incluso si continúa en un vuelo nacional.","AVSEC Módulo II");
Q("av2","A la llegada del vuelo, ¿qué se hace con el equipaje en conexión?",["Se descarga al final","Se descarga primero, se cuenta y se separa del equipaje local; luego se traslada a la zona de rayos X","Va directo a la cinta","Se deja en la aeronave"],1,"El equipaje en conexión debe descargarse PRIMERO, contarse y separarse del equipaje local. El tractorista lleva el equipaje local a aduana, mientras que el equipaje en conexión se traslada a la zona de rayos X.","AVSEC Módulo II");

Q("av3","¿Cómo se define un acto de interferencia ilícita?",["Un atraso operacional intencional","Actos o tentativas destinados a comprometer la seguridad de la aviación civil","Un error de la tripulación","Una falla mecánica provocada"],1,"Son actos, o tentativas, destinados a comprometer la seguridad de la aviación civil. Incluyen: apoderamiento ilícito de aeronaves en vuelo o en tierra, toma de rehenes, atentados y sabotajes contra instalaciones, intrusión por la fuerza, introducción de armas o artefactos peligrosos con fines criminales, y comunicación de información falsa que comprometa la seguridad.","AVSEC Módulo III");
Q("av3","¿Cuál de estos NO es un acto de interferencia ilícita?",["Toma de rehenes a bordo","Comunicación de información falsa que comprometa la seguridad","Un pasajero que se niega a apagar su teléfono","Introducción a bordo de armas con fines criminales"],2,"Los actos de interferencia ilícita son: apoderamiento ilícito de aeronaves, toma de rehenes, atentados y sabotajes contra instalaciones, intrusión por la fuerza, introducción de armas o artefactos peligrosos con fines criminales, y comunicación de información falsa que comprometa la seguridad. Un pax que no apaga el teléfono es un disruptivo, no una interferencia ilícita.","AVSEC Módulo III");
Q("av3","Una vez producida una interferencia ilícita, ¿qué puede hacer la DGAC?",["Solo informar a la prensa","Pedir apoyo a fuerzas de orden o armadas, proteger a pasajeros y tripulantes, transmitir información del vuelo y retener la aeronave (salvo que liberarla resguarde vidas)","Cancelar la licencia del operador","Cerrar el aeropuerto por 24 horas"],1,"La DGAC puede: pedir apoyo a fuerzas de orden, fuerzas armadas u otros organismos competentes; tomar medidas para proteger a pasajeros y tripulantes; transmitir información del vuelo a aeropuertos y autoridades involucradas; y retener la aeronave, salvo que liberarla sea necesario para resguardar vidas humanas.","AVSEC Módulo III");
Q("av3","¿Cómo se define una amenaza de bomba?",["Solo la que se recibe por escrito","Amenaza comunicada, anónima o de otro tipo, real o falsa, que sugiere que la seguridad de una aeronave o instalación puede estar en peligro por un explosivo u otro artefacto","La que confirma la policía","La que detecta el escáner"],1,"Amenaza de bomba: amenaza comunicada, anónima o de otro tipo, REAL O FALSA, que sugiere o indica que la seguridad de una aeronave en vuelo o en tierra, aeródromo, aeropuerto o instalación de aeronáutica civil puede estar en peligro debido a un explosivo u otro tipo de artefacto.","AVSEC Módulo III");
Q("av3","¿Se informa a los pasajeros de una amenaza de bomba?",["Siempre, de inmediato","No, a menos que se deba realizar búsqueda en cabina u otra maniobra que pueda ser advertida por ellos","Solo a los de primera clase","Solo si es específica"],1,"Los pasajeros NO serán informados de amenaza de bomba, a menos que se deba realizar búsqueda en cabina u otra maniobra que pueda ser advertida por éstos. Los anuncios a pasajeros serán realizados por el comandante en español e inglés.","AVSEC Módulo III");
Q("av3","Durante la búsqueda en cabina, ¿qué se les pide a los pasajeros?",["Que salgan del avión","Que identifiquen su equipaje de mano y objetos personales","Que cierren los ojos","Que se cambien de asiento"],1,"Durante la búsqueda en cabina, la TC debe pedir a los pasajeros que identifiquen su equipaje de mano y objetos personales. La TC realiza la búsqueda en su zona de responsabilidad, coordinada con el resto, incluyendo baños, galley y cockpit, aplicando el procedimiento del QRH y el MTAC.","AVSEC Módulo III");
Q("av3","Si se encuentra un objeto sospechoso, ¿qué NO debe hacerse?",["Informar al capitán","Manipularlo, cortar cables, abrirlo, acceder a sus componentes o levantarlo","Describir su ubicación","Anotar su color y forma"],1,"Si se encuentra un objeto sospechoso NO debe manipularse, no cortar cables, no abrirlo, no acceder a sus componentes ni levantarlo, ya que podría activarse por movimiento. Se informa al capitán con el máximo de detalles: ubicación exacta y descripción (tamaño, color, olor particular, forma).","AVSEC Módulo III");
Q("av3","¿Qué se desliza bajo el objeto sospechoso antes de trasladarlo a la UMR?",["Una manta","Una tarjeta de seguridad, verificando que no tenga cables ni conexiones que podrían activarlo","Una bandeja del galley","Papel absorbente"],1,"Antes del traslado a la UMR se desliza cuidadosamente una TARJETA DE SEGURIDAD bajo el objeto, verificando que no tiene cables ni conexiones que podrían activarlo.","AVSEC Módulo III");
Q("av3","Ante un dispositivo sospechoso a bordo, ¿a qué distancia se aleja a los pasajeros?",["1 fila","Al menos 4 filas, reubicando a más personas por fila si el vuelo está lleno","10 filas","Al otro extremo del avión"],1,"Se debe alejar a los pasajeros AL MENOS 4 FILAS, reubicando a más personas por fila si el vuelo está lleno, y pedir que quienes estén cerca del artefacto se cubran la cabeza, usen cinturón y mantengan la cabeza baja. Los asientos en posición vertical, mesas guardadas y todos los PED apagados.","AVSEC Módulo III");
Q("av3","En un secuestro, ¿cuál es el objetivo principal de la tripulación?",["Negociar con los secuestradores","La protección del cockpit, aplicando todos los medios e iniciativas coercitivas para evitar el ingreso a la cabina de mando","Evacuar a los pasajeros","Contactar a la prensa"],1,"Si una o varias personas intentan coaccionar a la tripulación para apoderarse del avión o variar la ruta, la tripulación y cualquier empleado de la compañía a bordo considerará como OBJETIVO PRINCIPAL LA PROTECCIÓN DEL COCKPIT, aplicando todos los medios e iniciativas coercitivas a su alcance para evitar el ingreso a la cabina de mando.","AVSEC Módulo III");
Q("av3","¿Qué indica el código 7500?",["Emergencia general","Que el avión ha sido secuestrado o sufre una amenaza","Fallo de radio","Falta de combustible"],1,"Códigos: «7500» indica que el avión ha sido SECUESTRADO o sufre una amenaza · «7700» es el código general de emergencia · «7600» indica fallo de radio.","AVSEC Módulo III");
Q("av3","¿Qué indica el código 7600?",["Secuestro","Emergencia general","Fallo de radio","Fuego a bordo"],2,"«7600» indica un FALLO DE RADIO. «7500» = secuestro o amenaza. «7700» = emergencia general.","AVSEC Módulo III");
Q("av3","¿Para qué se utiliza el «Código Bravo»?",["Para avisar de un niño perdido","Para asustar deliberadamente y hacer más fácil identificar la fuente real de la amenaza","Para llamar al comandante","Para indicar fuego"],1,"El «Código Bravo» se utiliza para asustar deliberadamente y hacer que sea más fácil identificar la fuente real de la amenaza. El «Código Adam» es utilizado por el personal para alertar de la desaparición de algún niño.","AVSEC Módulo III");
Q("av3","¿Qué es el «Código Adam»?",["Un código de secuestro","El código utilizado para alertar de la desaparición de algún niño","Un código de incendio","Un código de evacuación"],1,"El «Código Adam» es utilizado por el personal para alertar de la desaparición de algún niño.","AVSEC Módulo III");
Q("av3","¿Cuál es el protocolo de toda comunicación por interfonía entre tripulantes?",["Hablar rápido y colgar","Identificarse, indicar el área de origen del llamado y entregar información clara y precisa","Usar solo códigos","Esperar autorización del comandante"],1,"Todas las comunicaciones deben cumplir el protocolo: identificarse, indicar el área de origen del llamado y entregar información clara y precisa. Ante actividad sospechosa, se llama al cockpit usando la CONTRASEÑA acordada en el briefing operacional.","AVSEC Módulo III");
Q("av3","¿Desde cuándo y hasta cuándo debe permanecer cerrada y asegurada la puerta del cockpit?",["Solo durante el despegue","Desde el inicio de la cabina de mando estéril hasta que las puertas sean abiertas para el desembarque, excepto para el acceso y salida de personas autorizadas","Solo en vuelos internacionales","Durante el servicio de a bordo"],1,"La puerta de la cabina de mando debe permanecer cerrada y asegurada desde el inicio de la cabina de mando estéril hasta que las puertas sean abiertas para el desembarque, excepto cuando sea necesario permitir el acceso y salida de personas autorizadas.","AVSEC Módulo III");
Q("av3","Ante sospecha de un acto ilícito EN TIERRA, ¿qué debe hacer la tripulación de mando?",["Despegar cuanto antes","Tratar por todos los medios de mantenerse en tierra; el Comandante debe tratar de inutilizar la aeronave para que no pueda volver a despegar","Rodar hasta la pista","Apagar las comunicaciones"],1,"Si la situación ocurre en tierra, la tripulación de mando tratará por todos los medios de MANTENERSE EN TIERRA. El Comandante debe tratar por todos los medios de inutilizar la aeronave con el propósito de que no pueda volver a despegar (por ejemplo, dejando los FLAPS FULL después del aterrizaje).","AVSEC Módulo III");
Q("av3","En caso de violencia a bordo, ¿cuáles son las acciones a aplicar?",["Aislar al agresor en el baño","Proteger y asegurar el acceso a la cabina de mando, solicitar apoyo de pasajeros ABP y reasignar funciones a la tripulación de cabina","Aterrizar de inmediato","Desconectar el PA"],1,"En caso de violencia a bordo: proteger y asegurar el acceso a la cabina de mando, solicitar apoyo de pasajeros ABP y reasignar funciones a la tripulación de cabina. El Comandante se comunica con ATC y/o la compañía; el personal de tierra notifica al representante de seguridad.","AVSEC Módulo III");
Q("av3","Si una aeronave víctima de interferencia ilícita aterriza en Chile, ¿a quién notifica la DGAC?",["Solo a la aerolínea","Al Ministerio de Relaciones Exteriores para coordinar con el Estado de matrícula y del explotador; además a los Estados con ciudadanos afectados y a la OACI","Solo a Carabineros","A la prensa"],1,"La DGAC notificará al Ministerio de Relaciones Exteriores para coordinar con el Estado de matrícula y el del explotador. Además informará rápidamente a los Estados con ciudadanos fallecidos o lesionados, a los Estados con ciudadanos tomados como rehenes o presentes en la aeronave, y a la OACI.","AVSEC Módulo III");

/* ================= RAE · REGLAMENTACIÓN AERONÁUTICA ================= */
Q("rae1","¿Cuál es la relación entre la ONU y la OACI?",["Son organismos independientes","La OACI es la agencia de la ONU que establece normas y reglamentos internacionales para la aviación civil","La ONU depende de la OACI","La OACI pertenece a IATA"],1,"La ONU, a través de su agencia OACI, establece normas y reglamentos internacionales para la aviación civil en materia de seguridad, eficiencia y sostenibilidad, promoviendo la protección del medio ambiente y la reducción de emisiones.","RAE Día 1");
Q("rae1","¿Qué es la IATA y a quién representa?",["Un organismo gubernamental que regula a los Estados","Una organización NO gubernamental que representa a las aerolíneas del mundo y trabaja en colaboración con OACI","La autoridad aeronáutica de EE.UU.","El sindicato de tripulantes"],1,"La IATA (Asociación Internacional de Transporte Aéreo) es una organización NO GUBERNAMENTAL que trabaja en estrecha colaboración con OACI y representa a las aerolíneas del mundo. Promueve la seguridad aérea, facilita el comercio aéreo, desarrolla estándares y prácticas y reduce costos.","RAE Día 1");
Q("rae1","¿Qué es la FAA y qué es el FAR?",["Organismos europeos","La FAA es la entidad gubernamental de EE.UU. que regula la aviación civil, y el FAR es su Reglamento Federal de Aviación","Dos aerolíneas norteamericanas","Normas de la OACI"],1,"FAA: Federal Aviation Administration, entidad gubernamental de EE.UU. responsable de regular y normar todos los aspectos de la aviación civil. FAR: Federal Aviation Regulation, contiene las normas y regulaciones establecidas por la FAA (diseño de aeronaves, reglas de operación, entrenamiento de pilotos, etc.).","RAE Día 1");
Q("rae1","¿De qué organismo depende la DGAC y qué ley la rige?",["Del Ministerio de Transportes; Ley 20.321","De la Comandancia en Jefe de las FFAA de Chile; Ley orgánica 16.752","Del Ministerio del Interior; Ley 18.916","De la JAC; Ley 20.000"],1,"La DGAC es un organismo dependiente de la Comandancia en Jefe de las FFAA de Chile, que norma y fiscaliza la actividad aérea dentro del espacio aéreo chileno y a empresas nacionales que vuelan en el extranjero. Su ley orgánica es la Ley 16.752.","RAE Día 1");
Q("rae1","¿Cuál de estas NO es una función de la DGAC según la Ley 16.752?",["Aprobar, controlar y fiscalizar aeródromos públicos y privados","Otorgar licencias al personal aeronáutico y convalidar las de otros Estados","Fijar las tarifas de los pasajes aéreos","Dictar normas para que la operación de aeronaves se efectúe dentro de los límites de la seguridad aérea"],2,"Funciones de la DGAC: aprobar/controlar/fiscalizar aeródromos, organizar y proporcionar servicios al tránsito aéreo, otorgar licencias al personal aeronáutico (convalidar, suspender y cancelar), dictar normas de seguridad aérea y fiscalizar las actividades de la aviación civil.","RAE Día 1");
Q("rae1","¿Qué es la JAC y de qué ministerio depende?",["De la DGAC; regula licencias","Organismo de la Administración Civil del Estado dependiente del Ministerio de Transportes y Telecomunicaciones, ejerce la dirección superior de la aviación civil","De la FACh; opera aeropuertos","Del Ministerio del Interior; controla fronteras"],1,"La JAC (Junta de Aeronáutica Civil) es un organismo de la Administración Civil del Estado, dependiente del Ministerio de Transportes y Telecomunicaciones. Su misión es ejercer la dirección superior de la aviación civil en Chile y promover el desarrollo, la eficiencia y el mejor precio del transporte aéreo nacional e internacional.","RAE Día 1");
Q("rae1","¿Qué es un DAR y quién puede modificarlo?",["Una norma técnica que modifica el Director de la DGAC","Reglamentos Aeronáuticos mandatorios («LEY»), cuya numeración deriva de los Anexos OACI; solo los puede modificar el Presidente de la República","Un procedimiento operativo","Una circular informativa"],1,"DAR: «LEY», Reglamentos Aeronáuticos mandatorios; su numeración se deriva de los Anexos al Convenio de Aviación Civil Internacional (OACI) y SOLO LOS PUEDE MODIFICAR EL PRESIDENTE DE LA REPÚBLICA.","RAE Día 1");
Q("rae1","¿Qué es un DAN y quién puede modificarlo?",["Una ley del Congreso","Norma Aeronáutica que regula materias de orden técnico u operacional; solo la puede modificar el Director de la DGAC","Una circular","Un procedimiento de la aerolínea"],1,"DAN: Norma Aeronáutica, regula materias de orden técnico u operacional. SOLO LA PUEDE MODIFICAR EL DIRECTOR DE LA DGAC.","RAE Día 1");
Q("rae1","¿Qué son los DAP y los DAC?",["Dos tipos de licencia","DAP: Procedimientos Aeronáuticos que detallan los procesos para cumplir los reglamentos. DAC: Circulares de la DGAC que instruyen, informan y clarifican materias","Dos anexos de OACI","Documentos de la aerolínea"],1,"DAP: Procedimientos Aeronáuticos, detalla los procesos a seguir para el cumplimiento de los Reglamentos Aeronáuticos. DAC: Circulares de la DGAC, publicaciones que instruyen, informan y clarifican materias relativas a la reglamentación aeronáutica, seguridad, operativas, técnicas y administrativas.","RAE Día 1");
Q("rae1","Según el Artículo 1 del Código Aeronáutico:",["Chile comparte su espacio aéreo con países vecinos","El Estado de Chile tiene la soberanía exclusiva del espacio aéreo sobre su territorio","El espacio aéreo es internacional","La OACI regula el espacio aéreo chileno"],1,"Artículo 1: El Estado de Chile tiene la SOBERANÍA EXCLUSIVA del espacio aéreo sobre su territorio.","RAE Día 1");
Q("rae1","Según el Artículo 5 del Código Aeronáutico, las aeronaves chilenas…",["Solo se rigen por ley chilena en Chile","Están sometidas a la ley chilena estén en espacio aéreo con o sin soberanía","Se rigen por la ley del país donde vuelen","Se rigen por la ley de la OACI"],1,"Artículo 5: Las aeronaves chilenas, estén en espacio aéreo con o sin soberanía, están sometidas a la LEY CHILENA. (Artículo 2: las aeronaves nacionales o extranjeras y las personas y cosas a bordo en territorio chileno están sometidas a las leyes chilenas).","RAE Día 1");
Q("rae1","Según el Artículo 52 del Código Aeronáutico, ¿qué requiere una aeronave para ser autorizada a volar?",["Un seguro vigente","La previa expedición de un Certificado de Aeronavegabilidad por la autoridad aeronáutica","La autorización del comandante","Un plan de vuelo aprobado"],1,"Artículo 52: Ninguna aeronave será autorizada para el vuelo sin la previa expedición de un CERTIFICADO DE AERONAVEGABILIDAD por parte de la autoridad aeronáutica. Se presume que la aeronave con certificado vigente reúne las condiciones técnicas para volar.","RAE Día 1");
Q("rae1","Según el Artículo 58, ¿cómo se divide el Personal de Vuelo?",["Pilotos y mecánicos","Tripulación de Vuelo y Tripulación Auxiliar","Personal de tierra y de aire","Comandantes y primeros oficiales"],1,"Artículo 58: El Personal de Vuelo se divide en Tripulación de Vuelo y Tripulación Auxiliar. El personal de tierra incluye: personal de mantenimiento, controlador de tránsito aéreo, encargado de operaciones de vuelo, operador de servicios de vuelo y operador de carga y estiba.","RAE Día 1");
Q("rae1","Según el Artículo 67 (obligaciones del comandante), este debe:",["Vender los pasajes","Impedir el embarque de personas o carga que puedan constituir un peligro para la seguridad del vuelo","Fijar el itinerario","Contratar a la tripulación"],1,"Artículo 67: entre las obligaciones del comandante está impedir el embarque de personas que puedan constituir un peligro para la seguridad del vuelo, de los pasajeros o de la carga, así como impedir el embarque o transporte de carga peligrosa; y adoptar durante el vuelo las medidas que estime necesarias para la seguridad.","RAE Día 1");
Q("rae1","Según el Artículo 71 del Código Aeronáutico, el comandante puede:",["Cambiar la matrícula del avión","Imponer las medidas preventivas y coercitivas necesarias para mantener la seguridad y conservar el orden y disciplina a bordo","Despedir tripulantes","Modificar el reglamento"],1,"Artículo 71: El comandante de la aeronave podrá imponer las medidas preventivas y coercitivas necesarias para mantener la seguridad de la aeronave, de las personas o de los bienes, o para conservar el orden y disciplina a bordo.","RAE Día 1");
Q("rae1","Según el Artículo 90, ¿qué documentos debe portar toda aeronave que vuele sobre territorio nacional?",["Solo el plan de vuelo","Certificado de matrícula, de aeronavegabilidad, licencias y habilitaciones de la tripulación, bitácora y documentos relativos a la aeronave, pasajeros, carga y correspondencia","Solo la matrícula","El manual de operaciones"],1,"Artículo 90: Toda aeronave que vuele sobre territorio nacional debe portar certificado de matrícula, certificado de aeronavegabilidad, licencias y habilitaciones de la tripulación, bitácora y documentos relativos a la aeronave, pasajeros, carga y correspondencia.","RAE Día 1");
Q("rae1","Según el Artículo 96, ¿qué diferencia a un servicio «regular» de uno «no regular»?",["El tamaño del avión","El regular se realiza en forma continua y sistemática según condiciones prefijadas (itinerarios y horarios); los demás son no regulares (chárter)","El regular es nacional y el no regular internacional","El precio del pasaje"],1,"Artículo 96: son «regulares» los realizados en forma continua y sistemática de acuerdo con condiciones prefijadas, tales como itinerarios y horarios. Los demás son «no regulares» (chárter).","RAE Día 1");
Q("rae1","Según el Artículo 97, un vuelo SCL–CCP es:",["Servicio internacional","Servicio de transporte aéreo nacional o cabotaje","Vuelo chárter","Vuelo regional"],1,"Artículo 97: el servicio de transporte aéreo NACIONAL O CABOTAJE es el que se presta entre dos o más puntos del territorio de la República, aunque se vuele sobre territorio extranjero (ej. SCL/CCP). El internacional es entre puntos de Estados diferentes (ej. SCL/EZE), o entre dos puntos nacionales cuando se hubiere previsto escala intermedia en otro Estado.","RAE Día 1");
Q("rae1","Según el Artículo 185, ¿cuáles son las sanciones a las infracciones que no constituyan delito?",["Solo multa","Amonestación escrita, multa de 5 a 500 ingresos mínimos mensuales, suspensión de permisos o licencias hasta 3 años, y cancelación definitiva","Cárcel inmediata","Suspensión de por vida"],1,"Artículo 185: a) amonestación escrita; b) multa de cinco a quinientos ingresos mínimos mensuales; c) suspensión de los permisos o licencias por un plazo de hasta TRES AÑOS; y d) cancelación definitiva de los permisos o licencias.","RAE Día 1");
Q("rae1","Según el Artículo 193, ¿qué ocurre con el personal aeronáutico que trabaja bajo la influencia del alcohol o drogas?",["Solo se le suspende un mes","Presidio o reclusión menores en grados medio a máximo y multa de 10 a 100 UTM; en caso de reincidencia, cancelación definitiva de la licencia","Se le da una amonestación","Se le baja el sueldo"],1,"Artículo 193: será castigado con presidio o reclusión menores en sus grados medio a máximo y multa de diez a cien unidades tributarias mensuales. EN CASO DE REINCIDENCIA, el tribunal decretará la CANCELACIÓN DEFINITIVA de su licencia.","RAE Día 1");
Q("rae1","¿Qué sanciona la Ley 20.000?",["El transporte de mercancías peligrosas","El tráfico ilícito de estupefacientes y sustancias sicotrópicas","Los actos de interferencia ilícita","Las infracciones aeronáuticas"],1,"La Ley 20.000 sanciona el tráfico ilícito de estupefacientes y sustancias sicotrópicas. Quien posea, transporte, guarde o porte pequeñas cantidades sin autorización será castigado con presidio de 541 días a 5 años y multa de 10 a 40 UTM, salvo que justifique tratamiento médico o consumo personal exclusivo y próximo en el tiempo.","RAE Día 1");
Q("rae1","¿Cuándo y por qué se creó el Alfabeto Radiofónico?",["En 1930 por la DGAC","En 1944 por la OACI, para establecer un sistema de comunicación universal que evitara confusiones fonéticas y errores en la transmisión","En 1974 por IATA","En 1963 con el Convenio de Tokio"],1,"El Alfabeto Radiofónico se creó en 1944 por la OACI, con el objetivo de establecer un sistema de comunicación universal para la aviación que evitara confusiones fonéticas y errores en la transmisión de información vital (ej: matrícula CML, aeropuerto SCL).","RAE Día 1");
Q("rae1","¿Qué es el DAN 152?",["El reglamento de licencias","El Sistema de Gestión de Seguridad Operacional (SMS) para empresas aéreas que operan en Chile","La norma de mercancías peligrosas","El reglamento de operación"],1,"DAN 152: SMS, Sistema de Gestión de Seguridad Operacional para empresas aéreas que operan en Chile. Establece los requisitos para implementar y operar el SMS con el fin de prevenir accidentes e incidentes y mejorar continuamente la seguridad operacional.","RAE Día 1");
Q("rae1","¿Qué es el SARSEV (DAN 13-01)?",["Un sistema de radar","Un programa NO PUNITIVO de reportes anónimos y voluntarios de sucesos donde interviene el error humano y que pudieran poner en riesgo la seguridad operacional","Un sistema de rescate","Un registro de licencias"],1,"SARSEV: Sistema Anónimo de Reportes de Seguridad de Vuelo. Programa NO PUNITIVO de registro de reportes anónimos y voluntarios de sucesos o situaciones en las cuales interviene el error humano y que pudieran poner en riesgo la seguridad operacional, permitiendo identificar peligros y recomendar medidas preventivas.","RAE Día 1");

Q("rae2","¿Qué regulan el DAR 01, DAR 63 y DAN 63?",["La operación de aeronaves","La obtención, renovación, convalidación, suspensión y cancelación de licencias y habilitaciones del personal aeronáutico y sus atribuciones","El transporte de MP","La seguridad contra interferencia ilícita"],1,"El DAR 01 es el Reglamento de Licencias al personal aeronáutico; el DAR 63 y DAN 63 son los reglamentos de licencias para miembros de la tripulación EXCEPTO PILOTOS. Se aplican a la obtención, renovación, convalidación, suspensión y cancelación de licencias y habilitaciones, y a las atribuciones que confieren.","RAE Día 2");
Q("rae2","¿Cuáles son los requisitos para el otorgamiento de la licencia de Auxiliar de Cabina (DAN 63 Cap. D)?",["Solo ser mayor de edad","Edad mínima 18 años, competencia lingüística en español (leer, hablar, escribir y comprender), CMA, e instrucción teórica, práctica y experiencia acreditadas","Tener licencia de conducir","Ser chileno de nacimiento"],1,"Requisitos DAN 63 Cap. D: edad mínima 18 AÑOS, competencia lingüística (leer, hablar, escribir y comprender el idioma español), Certificación Médica Aeronáutica (CMA), y acreditar instrucción teórica, práctica, experiencia aeronáutica y demostrar competencias en las materias técnicas aeronáuticas.","RAE Día 2");
Q("rae2","¿Cuántas habilitaciones puede tener un TAC según el DAN 63?",["Solo 1","Máximo 2","Máximo 3, pudiendo incluir una cuarta si una de estas es de la familia de alguna anterior","Sin límite"],2,"Máximo 3 habilitaciones, pudiendo incluir una CUARTA si una de estas es de la familia de alguna anterior. Ejemplo: A320 – A321 – B787-8/9.","RAE Día 2");
Q("rae2","¿Qué exige la EXPERIENCIA RECIENTE de un TAC?",["Volar todos los meses","Haber realizado 3 despegues y 3 aterrizajes como TAC al menos cada 90 días por cada una de sus habilitaciones","Un vuelo al año","20 horas de vuelo mensuales"],1,"Experiencia reciente: haber realizado 3 despegues y 3 aterrizajes como Tripulante Auxiliar de Cabina a lo menos CADA 90 DÍAS por cada una de sus habilitaciones.","RAE Día 2");
Q("rae2","¿Qué requiere la REVALIDACIÓN de la licencia?",["Rendir todos los exámenes ante la DGAC","Antes de perder la vigencia: haber efectuado en los últimos 12 meses los simulacros de evacuación y prácticas, y al menos 3 vuelos en cada habilitación en los últimos 90 días","Solo presentar la CMA","Un curso inicial completo"],1,"REVALIDACIÓN: antes de perder la vigencia, haber efectuado en los últimos 12 meses los simulacros de evacuación y prácticas, y haber efectuado al menos 3 vuelos en cada habilitación en los últimos 90 días. RENOVACIÓN: cuando la licencia ya perdió su vigencia (requiere reentrenamiento). RECALIFICACIÓN: cuando se ha perdido la experiencia reciente.","RAE Día 2");
Q("rae2","Un TAC lleva MÁS de 24 meses desde su último vuelo. ¿Qué necesita para renovar?",["Solo la certificación médica","Certificación médica, reentrenamiento de competencias y rendir todos los exámenes teóricos y prácticos ante la DGAC (Curso Inicial)","Solo el reentrenamiento","Nada, la licencia no vence"],1,"Con MÁS de 24 meses desde el último vuelo: además de la certificación médica, deberá tener reentrenamiento de sus competencias Y rendir todos los exámenes teóricos y prácticos ante la DGAC (Curso Inicial). Con MENOS de 24 meses: certificación médica más certificado de reentrenamiento.","RAE Día 2");
Q("rae2","¿Cada cuánto debe rendir un TAC la verificación de competencias (prueba de pericia) ante la DGAC?",["Cada 6 meses","Cada 3 años según el DAN 63 (el DAN 121 lo exige de forma anual), según la política interna de la compañía","Cada 5 años","Solo al obtener la licencia"],1,"Todo TAC cada 3 AÑOS deberá rendir una verificación de competencias (prueba de pericia) ante la DGAC. El DAN 121 lo exige de forma ANUAL, por lo que depende de la política interna de la compañía realizarlo dentro de uno de los 2 plazos.","RAE Día 2");
Q("rae2","¿Cuáles son los objetivos del ATC?",["Vender espacio aéreo","Prevenir colisiones y acelerar y mantener ordenadamente el movimiento del tránsito aéreo","Controlar los pasajeros","Fiscalizar licencias"],1,"Objetivos del ATC (Control de Tránsito Aéreo): prevenir colisiones, y acelerar y mantener ordenadamente el movimiento del tránsito aéreo.","RAE Día 2");
Q("rae2","¿Qué información contiene una licencia según el DAR 01?",["Solo el nombre y la foto","Indicativo de especialidad, fecha de vigencia y habilitaciones","El sueldo y la antigüedad","Las horas de vuelo totales"],1,"La licencia contiene: 1) Indicativo de especialidad, 2) fecha de vigencia y 3) habilitaciones.","RAE Día 2");

Q("rae3","Según el DAN 67, ¿cuáles son los tres resultados posibles del análisis psicofísico de la DGAC?",["Aprobado, reprobado y pendiente","Apto, No Apto, y Apto con Dispensa Médica","Sano, enfermo y en tratamiento","Vigente, vencido y suspendido"],1,"DAN 67, resultados posibles: 1) APTO (cumple con todos los requisitos), 2) NO APTO (no cumple con uno o más requisitos), 3) APTO CON DISPENSA MÉDICA (la situación médica no afectaría la seguridad operacional).","RAE Día 3");
Q("rae3","¿Cómo define el DAN 121 a la Tripulación Auxiliar MÍNIMA?",["La que exige el contrato colectivo","Aquella que permite, en caso de emergencia, efectuar la evacuación total de la aeronave en un tiempo no mayor de 90 segundos","La que cabe en los jumpseats","2 tripulantes por avión"],1,"Tripulación auxiliar mínima: es aquella que permite, en caso de emergencia, efectuar la evacuación total de la aeronave en un tiempo NO MAYOR DE NOVENTA (90) SEGUNDOS.","RAE Día 3");
Q("rae3","¿Qué es la Tripulación Auxiliar REFORZADA?",["La que tiene más experiencia","La tripulación mínima a la que se adiciona un número determinado de tripulantes para cubrir un vuelo cuyo TV o PSV excede el máximo autorizado","La de vuelos internacionales","La que lleva un instructor"],1,"Tripulación Auxiliar Reforzada: tripulación mínima a la que se adiciona un número determinado de tripulantes con el propósito de cubrir un vuelo que, por su duración, el Tiempo de Vuelo o el Período de Servicio de Vuelo, excede el máximo autorizado.","RAE Día 3");
Q("rae3","Un vuelo XX201 con capacidad de 220 pasajeros. ¿Cuántos TAC mínimos requiere?",["3 TAC","4 TAC","5 TAC","6 TAC"],2,"Más de 100 asientos: 2 TAC + 1 adicional por cada unidad o parte de unidad de 50 asientos habilitados sobre 100. Sobre 100 quedan 120 asientos = 2 unidades de 50 + parte de 20 = 3 unidades → 2 + 3 = 5 TAC.","RAE Día 3");
Q("rae3","¿A quiénes aplica el Capítulo G del DAN 121 (períodos de servicio y descanso)?",["Solo a los pilotos","A todas las tripulaciones de operadores de transporte de pasajeros y carga con aeronaves grandes: más de 19 asientos y peso de despegue superior a 5.700 kg","Solo a vuelos internacionales","Solo a operadores chilenos"],1,"Aplica a todas las tripulaciones de todos los operadores dedicados al transporte de pasajeros y carga que utilicen aeronaves grandes (más de 19 asientos de pasajeros y peso de despegue certificado superior a 5.700 kg): operadores chilenos en vuelos nacionales e internacionales, y operadores extranjeros en vuelos de cabotaje en Chile.","RAE Día 3");
Q("rae3","Un TAC es trasladado como pasajero de SCL a EZE para buscar un avión. Ese tiempo se considera:",["PD (Período de Descanso)","TV (Tiempo de Vuelo)","PSV (Período de Servicio de Vuelo)","No se contabiliza"],2,"El traslado en vuelo por conveniencia del operador SÍ es considerado PSV. También son PSV los reentrenamientos periódicos en avión y entrenadores sintéticos (mock up) y las prácticas periódicas de evacuación en tierra o agua (ditching).","RAE Día 3");
Q("rae3","Desde que el avión comienza su movimiento para despegar (retiro de calzos) hasta que se detiene al finalizar el vuelo (postura de calzos) es:",["PSV","TV (Tiempo de Vuelo)","PS","PD"],1,"El TIEMPO DE VUELO (TV) va desde que el avión comienza su movimiento con el propósito de despegar (retiro de calzos) hasta que se detiene al finalizar el vuelo (postura de calzos).","RAE Día 3");
Q("rae3","Un TAC pernocta en un hotel en PUQ hasta el otro día. Ese tiempo es:",["PSV","PD (Período de Descanso)","PS","TV"],1,"El tiempo en que el tripulante aloja para pernoctar, liberado de toda función antes de su siguiente vuelo, corresponde al PERÍODO DE DESCANSO (PD).","RAE Día 3");
Q("rae3","Si un tripulante realiza 2 vuelos en un período de 24 horas, se denomina:",["Extensión de vuelo","Serie de vuelos","Jornada especial","Vuelo reforzado"],1,"SERIE DE VUELOS: combinación de vuelos que pueden ser realizados en un período de 24 horas consecutivas, sin que se excedan los límites de Tiempo de Vuelo (pilotos) ni de PSV (TAC). La serie de vuelos termina cuando se inicia un PD. Ej: SCL-EZE-SCL, cambio de avión, SCL-CCP-SCL.","RAE Día 3");
Q("rae3","¿Cuándo comienza y termina el PSV?",["Con el despegue y el aterrizaje","No inferior a 1 hora antes del ETD y finaliza 30 minutos después de la hora de llegada del vuelo","Al firmar el turno y al llegar a casa","Con el briefing y el debriefing solamente"],1,"El PSV comienza NO INFERIOR A 1 HORA ANTES DEL ETD (hora estimada de salida) y FINALIZA 30 MINUTOS DESPUÉS de la hora de llegada del vuelo.","RAE Día 3");
Q("rae3","¿Cuál es la fórmula del PSV de un vuelo?",["TV + PD + PS","Hora de llegada al aeropuerto (1 hr) + TV + debriefing (30 min)","TV + período de reposo a bordo + PD","Solo el tiempo de vuelo"],1,"PSV = 1 hora (presentación antes del ETD) + TV + 30 minutos (debriefing). Ejemplo: TV de 11:20 → PSV = 1 + 11:20 + 0:30 = 12:50 (≈13 hrs).","RAE Día 3");
Q("rae3","Un vuelo tiene un TV de 7 horas. ¿Cuál será el PSV mínimo?",["7:15","8:00","8:30","9:10"],2,"PSV = 1 hora antes del ETD + TV + 30 minutos de debriefing = 1:00 + 7:00 + 0:30 = 8:30 horas.","RAE Día 3");
Q("rae3","¿Cuál es el PSV máximo para una tripulación mínima (jornada ordinaria) y su extensión?",["10 horas, extensible a 12","12 horas, extensible a 14 horas","14 horas, extensible a 16","20 horas sin extensión"],1,"Tripulación mínima (jornada ordinaria): PSV máximo 12 HORAS, con extensión de 2 horas (hasta 14). Tripulación reforzada (jornada especial): 20 horas.","RAE Día 3");
Q("rae3","¿Por qué causas puede extenderse el PSV de 12 a 14 horas?",["Por decisión del TAC1","Por contingencias meteorológicas, emergencias médicas, mantenimiento consignado en el MEL, o cuando el Comandante lo determine por razones de seguridad","Por atrasos de pasajeros","Por falta de tripulación"],1,"El PSV de 12 hrs (en un lapso de 24 hrs) para una tripulación mínima podrá extenderse hasta 14 hrs por contingencias meteorológicas, emergencias médicas, mantenimiento de la aeronave consignado en el MEL (Minimum Equipment List), o cuando el Comandante lo determine por razones de seguridad.","RAE Día 3");
Q("rae3","¿Cuáles son los límites de PSV mensual, trimestral y anual?",["100, 300 y 1000","160, 450 y 1600","200, 600 y 2000","120, 360 y 1200"],1,"Límites de PSV: 160 horas al MES, 450 al TRIMESTRE y 1600 al AÑO.","RAE Día 3");
Q("rae3","¿Qué es una jornada ESPECIAL?",["La que se hace de noche","Aquella que se desarrolla por más de 12 horas para alcanzar destinos lejanos, sin exceder 20 horas en un lapso de 24, requiriendo adicionar TAC a la mínima","La de vuelos chárter","La que incluye 3 escalas"],1,"Jornada especial: se desarrolla por más de 12 horas para alcanzar destinos más lejanos, NO PUDIENDO EXCEDER EN CASO ALGUNO DE 20 HORAS en un lapso de 24 horas, requiriéndose adicionar a la TAC mínima un número determinado de TAC. Ej: SCL-IPC-SCL.","RAE Día 3");
Q("rae3","En jornada especial, ¿cuánto deben descansar a bordo los TAC cuando el PSV supera las 12 horas?",["30 minutos","A lo menos 1 hora, en forma rotativa, no pudiendo desarrollar labores efectivas por más de 14 horas","2 horas continuas","No hay descanso a bordo"],1,"En jornada especial, las TAC deberán descansar a bordo EN FORMA ROTATIVA A LO MENOS UNA HORA cuando el PSV supere las 12 hrs, no pudiendo en tal caso el trabajador desarrollar labores efectivas por un lapso superior a las 14 HORAS.","RAE Día 3");
Q("rae3","¿Cuál es el Período Nocturno según el DAN 121?",["De 22:00 a 07:00","El tiempo transcurrido entre las 21:00 y las 06:00 hora local","De 00:00 a 06:00","De 20:00 a 05:00"],1,"Período Nocturno: es el tiempo transcurrido entre las 21:00 hrs y las 06:00 hora local.","RAE Día 3");
Q("rae3","¿En qué consiste la restricción al PSV nocturno consecutivo del 50%?",["No se pueden hacer 2 vuelos nocturnos","Si un PSV fue mayor al 50% del Período Nocturno, solo podrá efectuarse un segundo PSV nocturno consecutivo que no exceda el 50% del Período Nocturno","Se debe descansar 24 horas","Solo aplica en invierno"],1,"Si un PSV ha sido mayor al 50% del Período Nocturno, podrán efectuar solo un segundo PSV nocturno consecutivo, el cual no podrá exceder el 50% del Período Nocturno. Ej: si el primer PSV fue de 5 hrs despegando a las 22 hrs, podrá tener un vuelo con PSV máximo de 4:30 hrs la noche siguiente.","RAE Día 3");
Q("rae3","¿Qué es el Período de Descanso Mínimo (PDM)?",["8 horas después de cualquier vuelo","10 horas liberado de toda función, tras cumplir un PSV de 7 horas o menos, antes de comenzar otro PSV dentro de 24 horas","12 horas siempre","24 horas obligatorias"],1,"PDM: 10 HORAS liberado de toda función, a que tiene derecho un tripulante luego de haber cumplido un PSV de 7 horas o menos, antes de comenzar otro PSV complementario dentro de 24 hrs.","RAE Día 3");
Q("rae3","Según la tabla PSV/PD, ¿qué descanso corresponde a un PSV de 9 horas?",["10 horas","11 horas","12 horas","13 horas"],2,"La tabla PSV→PD: 7 hrs o menos → 10 · 8 → 11 · 9 → 12 · 10 → 13 · 11 → 14 · … · 20 → 24. El traslado (45' en base o 20' en posta) no es parte del PDM.","RAE Día 3");
Q("rae3","Un TAC realiza un PSV que incluye un cambio de longitud geográfica de 45°. ¿Cuánto aumenta su PD?",["1 hora","2 horas, y luego 30 minutos por cada 15° adicionales","3 horas","No aumenta"],1,"Cuando un TAC realice un PSV que incluya un cambio de Longitud Geográfica de 45°, se deberá aumentar en 2 HORAS el PD correspondiente. En forma progresiva se continuará incrementando este descanso en 30 MINUTOS por cada 15° de longitud geográfica adicional.","RAE Día 3");
Q("rae3","¿Qué es el Rol de Vuelo y con cuánta anticipación debe entregarse?",["La lista de pasajeros; 24 horas antes","El instrumento de planificación de vuelos que corresponde a la jornada en turnos de trabajo; debe entregarse con al menos 5 días de anticipación","El plan de vuelo; 1 hora antes","El manifiesto de carga; el mismo día"],1,"El Rol de Vuelo es el instrumento de planificación de vuelos que corresponde a la jornada en turnos de trabajo de los tripulantes. Según el Art. 152 ter C de la Ley 20.321, el empleador deberá entregarlo con anticipación de a lo menos 5 DÍAS.","RAE Día 3");
Q("rae3","¿Qué regula la Ley N° 20.321?",["El transporte de mercancías peligrosas","El contrato especial de los tripulantes de vuelo y tripulantes auxiliares de aeronaves comerciales de pasajeros y carga","Las licencias aeronáuticas","La seguridad aeroportuaria"],1,"La Ley N° 20.321 trata sobre el contrato especial de los tripulantes de vuelo y tripulantes auxiliares de aeronaves comerciales de pasajeros y carga.","RAE Día 3");
Q("rae3","Según el Art. 152 ter H, ¿cuántas noches como máximo puede permanecer un trabajador fuera de su residencia?",["10 noches","15 noches","18 noches","30 noches"],2,"Art. 152 ter H (Días fuera de base): el trabajador NO podrá permanecer más de 18 NOCHES fuera de su lugar de residencia. Si sus labores se desarrollan hasta 5 días continuos tendrá 2 días de descanso; si se desarrollan entre 6 y 10 días, 4 días de descanso. Ningún trabajador podrá prestar servicios por más de 10 días continuados.","RAE Día 3");
Q("rae3","Si las labores de un tripulante se desarrollan entre 6 y hasta 10 días continuos, ¿a cuánto descanso tiene derecho?",["2 días","3 días","4 días","5 días"],2,"Hasta 5 días continuos → 2 días de descanso mínimo. Entre 6 y hasta 10 días continuos → 4 DÍAS de descanso. Ningún trabajador podrá prestar servicios por más de 10 días en forma continuada.","RAE Día 3");
Q("rae3","Según el Art. 152 ter K, ¿cuál es el descanso mensual obligatorio?",["48 horas","72 horas con 3 días","106 horas, comprendiendo 4 días íntegros y consecutivos que incluyan sábado y domingo","120 horas"],2,"Art. 152 ter K (Días libres): una vez cada mes corresponde un descanso de 106 HORAS, las que deben comprender 4 días íntegros y consecutivos e incluir sábado y domingo.","RAE Día 3");
Q("rae3","Si un tripulante debe volar en día feriado, ¿qué corresponde?",["Nada especial","El empleador deberá devolver los días volados en un período máximo de 60 días o bien pagarlos con un recargo","Se compensa con vacaciones","Se paga doble siempre"],1,"Art. 152 ter L (Feriados): si hubiera que volar en días feriados, el empleador deberá devolver los días volados en un período de máximo 60 DÍAS o bien pagarlos con un recargo.","RAE Día 3");
Q("rae3","¿En cuánto tiempo debe informar el operador a la DGAC el incumplimiento de la norma de PSV?",["24 horas","48 horas","96 horas","1 semana"],2,"El operador deberá informar a la DGAC en 96 HORAS el incumplimiento de esta norma. Los operadores son responsables de establecer y programar los TV, PSV, PS, PD y PR; los TV y PSV son los MÁXIMOS permitidos.","RAE Día 3");
Q("rae3","¿Qué es el Período de Reposo en Vuelo?",["El tiempo de crucero","El tripulante relevado de sus labores a bordo, en lugar exclusivo para tripulaciones, con reposo ininterrumpido y condiciones confortables según normas de la DGAC","El descanso en el jumpseat","La pausa del servicio"],1,"Período de Reposo en Vuelo: TC relevado de sus labores a bordo de la aeronave, en lugar exclusivo para las tripulaciones auxiliares, en condiciones confortables según normas técnicas de la DGAC (incluidas en el Manual de Operaciones), con reposo ININTERRUMPIDO. Se ocupa en forma rotativa, a lo menos 1 hora cuando el PSV supere las 12 horas.","RAE Día 3");

/* ========= FH · FACTORES HUMANOS (PREVAC 1-3 + ACTUACIÓN HUMANA 4-6) ========= */
Q("fh1","¿Cuál es la premisa fundamental sobre la que trabaja la prevención de accidentes?",["Los accidentes son inevitables","«TODOS LOS ACCIDENTES PUEDEN SER EVITADOS»","La culpa siempre es del piloto","La tecnología eliminará los accidentes"],1,"La OACI creó las Comisiones de Investigación de Accidentes basando su accionar en la premisa fundamental: «TODOS LOS ACCIDENTES PUEDEN SER EVITADOS».","PREVAC Clase 1");
Q("fh1","¿Cómo define la OACI un accidente de aviación?",["Cualquier falla mecánica","Una ocurrencia asociada con la operación de una aeronave, desde que una persona aborda con intención de volar hasta que todas desembarcan, en la que se constaten ciertos casos","Solo si hay fallecidos","Un incidente reportado a la DGAC"],1,"OACI: «Una ocurrencia asociada con la operación de una aeronave que tiene lugar durante el tiempo que cualquier persona aborda la aeronave con la intención de volar hasta que todas las personas de la misma hayan desembarcado, en la que se constate alguno de los casos» (lesiones severas o letales, daños o fallas estructurales, o aeronave perdida/inaccesible).","PREVAC Clase 1");
Q("fh1","¿Cuál de estos es un caso que configura accidente de aviación?",["Un retraso mayor a 3 horas","Que la aeronave se haya perdido o se encuentre completamente inaccesible","Un pasajero disruptivo","Una turbulencia severa"],1,"Los 3 casos son: 1) una persona recibe lesiones severas o letales por estar en la aeronave, contacto directo con cualquier parte de ella o exposición a una ráfaga de motor jet; 2) la aeronave presenta daños o fallas estructurales que afectan su tensión estructural, desempeño o características de vuelo y requerirían gran reparación o reemplazo; 3) la aeronave se ha perdido o está completamente inaccesible.","PREVAC Clase 1");
Q("fh1","¿Qué es una cuasi-colisión?",["Un choque en plataforma","Un término aeronáutico real que significa que dos aviones han pasado demasiado cerca uno de otro","Un aterrizaje duro","Una falla de radar"],1,"Cuasi-colisión es un término real utilizado en aeronáutica: significa que dos aviones han pasado demasiado cerca uno de otro. Suele producirse cuando hay exceso de tráfico o defecto de personal de control aéreo, y también se asocia al peligro aviario. Sus notificaciones siguen el mismo criterio que las demás a la Autoridad Aeronáutica.","PREVAC Clase 1");
Q("fh1","¿Qué documento de OACI es el Manual de prevención de accidentes de 1984?",["Doc 9284","Doc 9422","Doc 9481","Doc 9859"],1,"El Doc 9422 es el Manual de prevención de accidentes (1984). Fue sustituido por el Doc 9859, Manual de gestión de la seguridad operacional, cuya 2ª edición se publicó en 2009.","PREVAC Clase 1");
Q("fh1","¿Qué Anexo de OACI trata sobre investigación de accidentes?",["Anexo 13","Anexo 17","Anexo 18","Anexo 6"],0,"El Anexo 13 trata sobre investigación de accidentes e incidentes de aviación. (El 17 es seguridad contra actos de interferencia ilícita y el 18 el transporte sin riesgo de mercancías peligrosas).","PREVAC Clase 1");

Q("fh2","¿Qué es el concepto «Más tres / Menos ocho»?",["Los grados de inclinación en el despegue","La ventana de tiempo de los 3 primeros minutos de vuelo y los 8 últimos, donde ocurre el 80% de todos los accidentes","La diferencia horaria máxima","El margen de combustible"],1,"«Más tres/Menos ocho»: los accidentes de aviación tienen lugar en una ventana de tiempo muy pequeña, comprendida entre los 3 primeros minutos de vuelo y los 8 minutos últimos. EL 80% DE TODOS LOS ACCIDENTES ocurre en esos 11 minutos.","PREVAC Clase 2");
Q("fh2","¿Cuál es el fin último de la investigación de accidentes?",["Determinar culpables","La prevención de futuros accidentes e incidentes; NO está dirigida a determinar ni establecer culpa o responsabilidad","Calcular las indemnizaciones","Sancionar al operador"],1,"La investigación tiene un carácter EXCLUSIVAMENTE TÉCNICO; su fin último es la prevención de futuros accidentes e incidentes, y no está dirigida a determinar ni establecer culpa o responsabilidad de tipo alguno.","PREVAC Clase 2");
Q("fh2","En Chile, ¿quién es responsable de la emisión de los informes de investigación?",["El Director de la DGAC","El Presidente de la JIAA (Junta Investigadora de Accidentes de Aviación)","El comandante involucrado","El Ministerio de Transportes"],1,"En la República de Chile, la responsabilidad de emisión de los informes será del Presidente de la JIAA. Será elaborado preferentemente en formato OACI y quedará en poder del Departamento Prevención de Accidentes.","PREVAC Clase 2");
Q("fh2","¿Cuándo se designa una Junta Investigadora de Accidentes de Aviación?",["En todos los accidentes","Cuando se trate de accidentes que involucren aeronaves cuya masa máxima de despegue sea superior a 5.700 kg","Solo en accidentes con fallecidos","Solo en vuelos internacionales"],1,"La Junta Investigadora es una comisión de funcionarios aeronáuticos especialistas designados por el Director General de Aeronáutica Civil, cuando se trate de accidentes que involucren aeronaves cuya masa máxima de despegue sea superior a 5.700 KG. Actúa como Presidente el Director de Prevención de Accidentes o quien designe el DGAC.","PREVAC Clase 2");
Q("fh2","¿Cuáles son los tres conceptos que se repiten en la mayoría de los accidentes?",["Fatiga, estrés y error","Secuencia de eventos, precedente conocido y relación Hombre-Máquina-Medio Ambiente","Clima, terreno y tráfico","Piloto, avión y aeropuerto"],1,"De los estudios surgen tres conceptos que se repiten invariablemente: SECUENCIA DE EVENTOS, PRECEDENTE CONOCIDO y RELACIÓN HOMBRE-MÁQUINA-MEDIO AMBIENTE.","PREVAC Clase 2");
Q("fh2","¿Qué es la «secuencia de eventos»?",["El orden del checklist","La combinación de factores, acciones o circunstancias que se van encadenando hasta que los distintos componentes coinciden, produciéndose «inevitablemente» el accidente","La cronología del vuelo","El orden de la evacuación"],1,"Secuencia de eventos: es la combinación de factores, acciones o circunstancias que se van encadenando hasta llegar a un punto en el cual los distintos componentes coinciden, produciéndose «inevitablemente» el accidente. Cuando ocurre un accidente se está ante la culminación de una serie de hechos que tienen lugar en un orden fijo y lógico; un hecho es dependiente de otro.","PREVAC Clase 2");
Q("fh2","¿Qué es el «precedente conocido»?",["Un accidente famoso","El principio de que si un factor ha sido capaz de producir un accidente, mientras no se elimine o modifique, el accidente tenderá a repetirse","Un informe anterior","Una recomendación de OACI"],1,"Precedente conocido: parte del principio de reconocer que si un factor ha sido capaz de producir un accidente, MIENTRAS NO SE ELIMINE O MODIFIQUE, EL ACCIDENTE TENDERÁ A REPETIRSE. Es una de las herramientas más eficaces de la prevención de accidentes.","PREVAC Clase 2");
Q("fh2","¿Qué son los «factores contribuyentes»?",["Los culpables del accidente","Acciones, omisiones, acontecimientos o condiciones que, de haberse eliminado o evitado, habrían reducido la probabilidad del accidente o mitigado sus consecuencias","Las fallas mecánicas","Las condiciones meteorológicas"],1,"Factores contribuyentes: acciones, omisiones, acontecimientos, condiciones o una combinación de estos que, si se hubieran eliminado, evitado o estuvieran ausentes, habrían reducido la probabilidad de que el accidente ocurriese o habrían mitigado la gravedad de sus consecuencias. Su identificación NO implica asignación de culpa ni responsabilidad administrativa, civil o penal.","PREVAC Clase 2");
Q("fh2","¿Qué es la COMPLACENCIA?",["Ser amable con los pasajeros","Estado en que la atención consciente se ve disminuida por una sensación de seguridad y confianza en sí mismo","Aceptar órdenes sin cuestionar","La satisfacción laboral"],1,"Complacencia: estado en que la atención consciente se ve disminuida por una sensación de seguridad y confianza en sí mismo. Sus características en la conducta incluyen el exceso de confianza y el aburrimiento, que pueden disminuir sensiblemente el rendimiento.","PREVAC Clase 2");
Q("fh2","¿Qué es la ATENCIÓN CANALIZADA?",["Poner atención al comandante","Estado mental en que toda la atención se concentra en un estímulo con exclusión de todos los demás, omitiendo tareas o información de más prioridad","Escuchar activamente","Dividir la atención entre tareas"],1,"Atención canalizada: estado mental en el que toda la atención de la persona se concentra en un estímulo con exclusión de todos los demás. Constituye un problema cuando la persona omite ejecutar una tarea o procesar información de más prioridad, y por eso no advierte o no tiene tiempo de reaccionar ante estímulos que requieren atención inmediata.","PREVAC Clase 2");
Q("fh2","¿Cómo se define una AMENAZA en seguridad operacional?",["Un pasajero agresivo","Sucesos o errores que están FUERA del control de la tripulación de vuelo, que aumentan la complejidad de la operación y deben manejarse para mantener los márgenes de seguridad","Una falla mecánica","Un acto de interferencia ilícita"],1,"AMENAZA: «sucesos o errores que están fuera del control de la tripulación de vuelo, aumentan la complejidad de la operación y deben manejarse para mantener los márgenes de seguridad operacional». ERRORES: «acciones u omisiones, por parte de la tripulación, que dan lugar a desviaciones de las intenciones o expectativas».","PREVAC Clase 2");
Q("fh2","Según las estadísticas presentadas, ¿qué porcentaje de accidentes se produce por fallo del piloto?",["22%","35%","50%","70%"],2,"Las cinco causas principales: fallo del piloto 50%, fallo mecánico 22%, meteorología 12%, sabotajes 9% (incluye ataques terroristas, secuestros o detonación de artefactos) y otras causas 7% (errores de torre de control, gestión del tráfico, choque entre aviones, cálculo de combustible, errores de navegación).","PREVAC Clase 2");
Q("fh2","¿Qué porcentaje de los accidentes se debe a fallo mecánico?",["12%","22%","50%","9%"],1,"El fallo mecánico es responsable del 22% de los casos. También puede deberse al choque con aves e ingestión de las mismas en las turbinas.","PREVAC Clase 2");
Q("fh2","¿Cuál de estos es un principal factor contribuyente identificado estadísticamente?",["El exceso de tripulación","La falta de adherencia a procedimientos estandarizados en cualquier fase del vuelo","El uso de listas de chequeo","El exceso de comunicación"],1,"Los principales factores contribuyentes identificados: falta de adherencia a procedimientos estandarizados en cualquier fase del vuelo, baja alerta situacional, desorientación espacial, juicio y decisión inadecuados, y uso incorrecto de la fraseología estándar.","PREVAC Clase 2");

Q("fh3","En la relación Hombre-Máquina-Medio Ambiente, ¿qué aporta cada uno?",["Todos aportan errores por igual","El Hombre realiza «acciones con falta de seguridad», la Máquina posee «condiciones mecánicas inseguras» y el Medio Ambiente aporta «condiciones físicas inseguras»","Solo el hombre falla","El medio ambiente no influye"],1,"Los accidentes se producen cuando una persona lleva a cabo una «acción con falta de seguridad» o cuando existen «condiciones físicas» o «mecánicas inseguras». El Hombre: acciones con falta de seguridad · La Máquina: condiciones mecánicas inseguras · El Medio Ambiente: condiciones físicas inseguras.","PREVAC Clase 3");
Q("fh3","¿Cuál es la diferencia entre FUENTE y CAUSA de accidente?",["Son sinónimos","Una fuente no es en sí peligrosa (una actividad que encierra un peligro pero que en condiciones normales no lo provoca); la causa es la acción o condición insegura que lo produce","La fuente es humana y la causa mecánica","La causa es previa a la fuente"],1,"Una FUENTE de accidente no es en sí peligrosa: puede ser una actividad (por ejemplo el paracaidismo) que encierra un determinado peligro, pero que bajo condiciones normales no lo provoca. Las CAUSAS son las acciones con falta de seguridad o las condiciones físicas o mecánicas inseguras.","PREVAC Clase 3");
Q("fh3","¿Qué son los Factores Humanos?",["Los errores de los pilotos","Factores ambientales, organizativos y de trabajo, y características humanas e individuales que influyen en el comportamiento laboral de manera que pueden afectar la salud y la seguridad","La personalidad de la tripulación","Los conflictos entre tripulantes"],1,"Los Factores Humanos se refieren a factores ambientales, organizativos y de trabajo, y a las características humanas e individuales que influyen en el comportamiento en el trabajo de una manera que puede afectar a la salud y a la seguridad. El elemento humano es la parte más flexible, adaptable y valiosa del sistema, pero también la más vulnerable.","PREVAC Clase 3");
Q("fh3","¿Qué porcentaje de los accidentes se atribuye al error humano?",["30% a 40%","50% a 60%","Aproximadamente entre un 70% y 80%","Más del 95%"],2,"Aproximadamente entre un 70% y 80% de los accidentes son a causa del error humano.","PREVAC Clase 3");
Q("fh3","¿Cuáles son ejemplos de aspectos FISIOLÓGICOS que afectan la actuación humana?",["Estrés, ansiedad y motivación","Fatiga, barotrauma e hipoxia","Liderazgo y comunicación","Rutina y experiencia"],1,"Los aspectos fisiológicos son los factores físicos que pueden afectar la actuación de la persona; por ejemplo: FATIGA, BAROTRAUMA e HIPOXIA.","PREVAC Clase 3");
Q("fh3","¿Qué documento sustituyó al Manual de prevención de accidentes (Doc 9422)?",["El Anexo 13","El Doc 9859, Manual de gestión de la seguridad operacional, 2ª edición de 2009","El Doc 9284","El DAN 152"],1,"La 2ª edición del Manual de gestión de la seguridad operacional (Doc 9859), publicada en 2009, sustituye al Manual de prevención de accidentes (Doc 9422), que quedó obsoleto.","PREVAC Clase 3");
Q("fh3","¿Cómo se define la Psicología Aeronáutica?",["El estudio del miedo a volar","La aplicación de la psicología al desarrollo y operación de sistemas aeronáuticos seguros y efectivos desde el punto de partida del operador humano","La selección de tripulantes","La terapia post accidente"],1,"La Psicología Aeronáutica puede considerarse como «una aplicación de la psicología al campo del desarrollo y la operación de sistemas aeronáuticos seguros y efectivos, desde el punto de partida del operador humano», o «la aplicación del estudio de los factores humanos al dominio de la aviación».","PREVAC Clase 3");
Q("fh3","¿Quién debe notificar un accidente a la Autoridad Aeronáutica Civil del Estado?",["Solo la aerolínea","El piloto al mando; o si está herido seriamente o mortalmente o la aeronave está perdida, el explotador, propietario o el personal de operaciones, inmediatamente y de forma directa","El seguro","La torre de control"],1,"Todo piloto al mando de una aeronave involucrada en un accidente o —si esa persona está herida seriamente o mortalmente, o la aeronave está perdida— el explotador, propietario o personal de operaciones, notificará el accidente o incidente grave INMEDIATAMENTE Y DE FORMA DIRECTA a la Autoridad Aeronáutica Civil del Estado.","PREVAC Clase 3");
Q("fh3","¿Qué sucesos EDTO deben notificarse a la Autoridad Aeronáutica?",["Cualquier atraso","Parada de motor en vuelo, desviación o retorno, pérdida o falta de combustible no corregible, mal funcionamiento de un sistema significativo EDTO, u otro suceso que afecte la seguridad","Solo accidentes","Cambios de tripulación"],1,"En operaciones de rango extendido (EDTO) se notifica si el incidente involucra: parada de motor en vuelo, desviación o retorno, pérdida de combustible inadvertida o falta de disponibilidad o desbalance no corregible, mal funcionamiento de un sistema significativo EDTO, o cualquier otro suceso que afecte la seguridad operacional de una operación EDTO.","PREVAC Clase 3");

Q("fh4","¿Cuáles son ejemplos de barreras FÍSICAS en la comunicación?",["Prejuicios y creencias","Ruido, volumen y tono, fatiga, sueño, hambre, conectividad y barbijo","Diferencias de status","El idioma"],1,"Barreras FÍSICAS: ruido, volumen y tono, fatiga, sueño, hambre, conectividad y barbijo. Barreras PSICOSOCIALES: resentimiento, preocupación, diferencia de status/generacionales, prejuicios, creencias, opiniones sostenidas en forma dogmática e idioma.","AH Clase 4");
Q("fh4","¿Cuál de estas es una barrera PSICOSOCIAL en la comunicación?",["El ruido de los motores","Las opiniones sostenidas en forma dogmática","La fatiga","El barbijo"],1,"Barreras psicosociales: resentimiento, preocupación, diferencia de status/generacionales, prejuicios, creencias, OPINIONES SOSTENIDAS EN FORMA DOGMÁTICA e idioma.","AH Clase 4");
Q("fh4","¿Qué NO significa la escucha activa?",["Escuchar y entender desde el punto de vista del que habla","Comprender y dar sentido a lo que se escucha","Ir preparando la respuesta en la mente mientras el otro habla","Escuchar en forma atenta sin interrumpir"],2,"Escucha activa: escuchar y entender desde el punto de vista del que habla, comprender y dar sentido a lo que se escucha, escuchar en forma atenta SIN INTERRUMPIR. NO significa ir preparando la respuesta en la mente.","AH Clase 4");
Q("fh4","¿Qué es «parafrasear» en la escucha activa?",["Repetir textualmente lo dicho","Poder decir con otras palabras, las propias, lo que el emisor acaba de decir","Resumir al final","Corregir al que habla"],1,"Parafrasear: poder decir con otras palabras, las propias, lo que el emisor acaba de decir. Otras habilidades: mostrar empatía (ponerse en el lugar del otro, sin necesariamente estar de acuerdo), emitir palabras de refuerzo y resumir («si no entiendo mal…», «o sea, lo que estás diciendo es…», «¿es correcto?»).","AH Clase 4");
Q("fh4","¿Qué es mostrar EMPATÍA según el material?",["Mostrar alegría o simpatía","Ponerse en el lugar del otro; no significa aceptar ni estar de acuerdo","Dar la razón siempre","Consolar al otro"],1,"Mostrar empatía: no se trata de mostrar alegría o simpatía, sino simplemente ponernos en el lugar del otro. TAMPOCO SIGNIFICA ACEPTAR O ESTAR DE ACUERDO.","AH Clase 4");
Q("fh4","¿Qué es la ASERTIVIDAD?",["Tener siempre la razón","La capacidad de expresarse con la mayor eficiencia posible, sin temor a expresar las dudas, demostrando preocupación; se ubica entre la pasividad y la agresividad","Imponer la propia opinión","Evitar el conflicto callando"],1,"Asertividad: capacidad de expresarse con la mayor eficiencia posible, sin temor a expresar las dudas que puedan existir, demostrando preocupación. Es una estrategia comunicativa que se ubica EN EL MEDIO de dos conductas opuestas: pasividad y agresividad.","AH Clase 4");
Q("fh4","¿Qué caracteriza a un rumor?",["Que siempre es falso","Que es información cuya veracidad está en duda o no puede corroborarse, se transmite de boca en boca y se usa para condicionar el pensamiento o conducta","Que lo difunde la empresa","Que se publica oficialmente"],1,"El rumor: es información cuya veracidad está en duda o no puede corroborarse; se genera y transmite entre gente, de boca en boca (hoy en redes sociales); se utiliza como herramienta para condicionar el pensamiento o conducta de las personas; se reproduce rápidamente y se reenvía sin corroborar fuentes ni veracidad.","AH Clase 4");

Q("fh5","¿Cómo se define el liderazgo?",["El cargo más alto de la jerarquía","El proceso de influir en las personas; un líder es una persona cuyas ideas y acciones influyen sobre el pensamiento y comportamiento de otros","Dar órdenes","La antigüedad en la empresa"],1,"Liderazgo es el proceso de influir en las personas. Un LÍDER es una persona cuyas ideas y acciones influyen sobre el proceso de pensamiento y comportamiento de otros. Los líderes usan el poder validado por su autoridad como medio para alcanzar metas.","AH Clase 5");
Q("fh5","¿Cuál de estas es una característica que sostiene al líder?",["Autoritarismo","CONGRUENCIA: practican lo que predican","Distancia con el equipo","Perfeccionismo"],1,"Características que sostienen al líder: CONSTANCIA (coherentes, mantienen el rumbo), CONGRUENCIA (practican lo que predican), CONFIABILIDAD (están en su puesto cuando los necesitan), INTEGRIDAD (cumplen compromisos y promesas), COMPETENCIA (conocimientos, habilidades y actitudes) y CARISMA (entusiasmo, humor, vivacidad, fervor).","AH Clase 5");
Q("fh5","El estilo de líder que «se focaliza en resultados, persuade mediante la dirección, hace cambios rápidamente y aprende mediante la acción» es:",["Lógico","Dominante","Inspirador","Apoyador"],1,"Estilos: DOMINANTE (resultados, persuade dirigiendo, cambios rápidos, aprende actuando) · LÓGICO (innovación, persuade explicando, cambios cuidadosos, aprende estudiando) · INSPIRADOR (oportunidades, persuade con confianza, cambios radicales, aprende preguntando) · APOYADOR (facilita el trabajo, persuade participando, cambios lentos, aprende escuchando).","AH Clase 5");
Q("fh5","El estilo de líder que «se focaliza en la innovación, persuade mediante la explicación y aprende mediante el estudio» es:",["Dominante","Lógico","Inspirador","Apoyador"],1,"El líder LÓGICO se focaliza en la innovación, persuade mediante la explicación, hace cambios cuidadosamente y aprende mediante el estudio.","AH Clase 5");
Q("fh5","¿Cuál de estas es una barrera para el liderazgo efectivo?",["Delegar tareas","Culpar, amenazar, ser sarcástico, criticar destructivamente, sermonear y enjuiciar","Escuchar al equipo","Dar feedback"],1,"Barreras para el liderazgo efectivo: culpar, amenazar, ser sarcástico, criticar destructivamente, sermonear y enjuiciar.","AH Clase 5");
Q("fh5","En el liderazgo DIRECTIVO, ¿cómo es la comunicación?",["Bidireccional","Unidireccional: ubica la problemática, se hace cargo de la tarea y dice a los miembros qué hay que hacer","Circular","No hay comunicación"],1,"LIDERAZGO DIRECTIVO: muy enfocado en la tarea y menos en el equipo. Ubica la problemática, se hace cargo dirigiendo a los otros, considera alternativas, elige una y dice a los miembros qué hay que hacer. La comunicación es UNIDIRECCIONAL.","AH Clase 5");
Q("fh5","¿Qué caracteriza al liderazgo DELEGATIVO?",["El líder decide todo","Los miembros del equipo dirigen su propia actuación (grupo maduro): se sitúa el problema y se delega el proceso de toma de decisiones, aceptando ellos la responsabilidad","Se consulta pero decide el líder","Se vende la idea al equipo"],1,"LIDERAZGO DELEGATIVO: enfocado en la tarea y en los colaboradores. Los miembros del equipo dirigen su propia actuación: son un grupo maduro. Se sitúa el problema y se delega el proceso de toma de decisiones; los miembros aceptan la responsabilidad de la decisión.","AH Clase 5");
Q("fh5","¿Qué caracteriza al liderazgo PERSUASIVO?",["Solo se enfoca en la tarea","Enfocado tanto en la tarea como en el equipo: decide qué hacer y «vende» la idea explicando cómo beneficiará al equipo; comunicación bidireccional","Delega todo","Consulta y sigue la mayoría"],1,"LIDERAZGO PERSUASIVO: enfocado tanto en la tarea como en el equipo. Ubica el problema y decide qué hacer, vendiendo a los demás la idea y logrando el soporte mayoritario; explica de qué manera la idea beneficiará al equipo. La comunicación es BIDIRECCIONAL. (El PARTICIPATIVO se enfoca más en los colaboradores: consulta a los miembros y decide la mejor solución).","AH Clase 5");
Q("fh5","¿Cuál es la diferencia entre GRUPO y EQUIPO?",["El tamaño","El grupo son personas que trabajan en forma independiente hacia un objetivo global; el equipo es un conjunto con habilidades complementarias, comprometidas con un objetivo común y una forma de trabajo con responsabilidad de cada uno","El grupo es formal y el equipo informal","No hay diferencia"],1,"GRUPO: dos o más personas que trabajan en forma independiente para alcanzar un objetivo global; es fácil de formar pero no será eficaz. EQUIPO: pequeño conjunto de personas con habilidades COMPLEMENTARIAS, comprometidas con un objetivo común y una forma de trabajo que sostiene la responsabilidad de cada uno; es más complejo de formar porque cada miembro debe ser elegido por sus competencias.","AH Clase 5");
Q("fh5","¿Cuál de estas es una razón por la que los equipos fallan?",["Roles claros","Metas confusas, objetivos mal definidos, roles poco claros, problemas de comunicación, falta de confianza e individualismo","Visión compartida","Confianza mutua"],1,"Los equipos FALLAN cuando hay: metas confusas, objetivos mal definidos, roles poco claros, malas políticas, decisiones no adecuadas, procedimientos inadecuados, problemas de comunicación, falta de confianza e individualismo.","AH Clase 5");
Q("fh5","¿Qué es la SINERGIA?",["La suma simple de esfuerzos","Suma de energías individuales que se multiplica progresivamente y se refleja en el resultado del equipo; su esencia es la valoración de las diferencias","La jerarquía del equipo","La velocidad de trabajo"],1,"Sinergia: suma de energías individuales que se multiplica progresivamente y que se refleja en el resultado del equipo. La VALORACIÓN DE LAS DIFERENCIAS (mentales, emocionales y psicológicas) es la esencia de la sinergia. Se favorece con cohesión, asignación de roles, comunicación, definición de objetivos e interdependencia.","AH Clase 5");
Q("fh5","¿Por qué son buenos los equipos de trabajo?",["Porque reducen el personal","Mejoran la productividad y la seguridad, optimizan recursos, ayudan a mantener la conciencia situacional, son más creativos resolviendo problemas y generan decisiones de alta calidad","Porque evitan la responsabilidad individual","Porque aceleran los turnos"],1,"Los equipos son buenos porque: mejoran la productividad y aumentan la seguridad, mejoran la utilización de recursos disponibles, AYUDAN A MANTENER LA CONCIENCIA SITUACIONAL, son más creativos y eficientes resolviendo problemas, contribuyen a integrar y generan decisiones de alta calidad.","AH Clase 5");

Q("fh6","¿Cómo se define la Conciencia Situacional?",["Estar atento al radar","Correcta percepción de los elementos en un tiempo y espacio, correcta comprensión de su significado y correcta proyección para una toma de decisión adecuada","Conocer el plan de vuelo","Recordar los procedimientos"],1,"Conciencia situacional: correcta PERCEPCIÓN de los elementos en un determinado tiempo y espacio, luego la correcta COMPRENSIÓN del significado de los mismos, y finalmente la correcta PROYECCIÓN para una toma de decisión adecuada.","AH Clase 6");
Q("fh6","¿Qué corresponde al Nivel 2 de la Conciencia Situacional?",["Percepción del estado, atributos y dinámica del ambiente","Comprensión de la situación actual: síntesis del Nivel 1, estar atentos al presente y agregar esa información para formar un cuadro completo","Proyección del futuro inmediato","Toma de decisión"],1,"Nivel 1 PERCEPCIÓN: estado, atributos y dinámica del ambiente (afectada por la memoria a largo plazo, corto plazo y operativa; conocimiento, experiencia y entrenamiento). Nivel 2 COMPRENSIÓN de la situación actual: síntesis del nivel 1, formar un cuadro completo. Nivel 3 PROYECCIÓN del futuro inmediato: establecer futuras acciones y tomar decisiones adecuadas.","AH Clase 6");
Q("fh6","¿Cuáles son los factores que influyen en la Conciencia Situacional?",["El clima y la ruta","Atención, memoria de trabajo, estrés y fatiga","La antigüedad y el cargo","El tipo de avión"],1,"Factores que influyen en la C.S.: ATENCIÓN, MEMORIA DE TRABAJO, ESTRÉS y FATIGA.","AH Clase 6");
