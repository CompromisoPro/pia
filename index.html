Q("a3","En operación extendida sobre agua, ¿cuántas balsas adicionales lleva el A320 y de qué capacidad?",["2 balsas de 30","4 balsas adicionales en overhead bins, de capacidad 46-69 cada una","6 balsas de 20","1 balsa de 100"],1,"En operación extendida sobre agua, en aviones con toboganes, se incorporan en overhead bins 4 BALSAS ADICIONALES en el A320, de capacidad 46-69 cada una.","A320 Día 3");
Q("a3","¿Qué caracteriza al TOBOGÁN RAMPA?",["Se puede desconectar","No se puede desconectar del avión y se encuentra SIEMPRE armado","Solo sirve para agua","Se infla en 15 segundos"],1,"El tobogán rampa está en el sector de salidas alares para evacuación EN TIERRA. NO SE PUEDE DESCONECTAR del avión y SE ENCUENTRA SIEMPRE ARMADO. Se despliega hacia el borde de fuga del ala. Se verifica su inflado correcto por la BARANDA INFLABLE. Si falla el inflado, puede usarse como lona deslizante.","A320 Día 3");

Q("a4","¿Cómo se produce el oxígeno en la cabina de pasajeros del A320?",["Por un tanque central","Por generadores químicos que alimentan un grupo de máscaras","Por compresores eléctricos","Por botellas individuales"],1,"En la cabina de pasajeros el oxígeno es producido por GENERADORES QUÍMICOS que alimentan un grupo de máscaras. Cada máscara oronasal está adosada a una bolsa de almacenamiento que se conecta mediante una manguera al generador.","A320 Día 4");
Q("a4","¿Cómo se activa la máscara de oxígeno del pasajero?",["Solo poniéndosela","Tirando la manguera completamente hacia abajo, colocándola sobre nariz y boca, ajustando la banda elástica y respirando normalmente","Presionando un botón del PSU","Girando una válvula"],1,"Uso: a) tirar la manguera COMPLETAMENTE HACIA ABAJO, b) colocarla sobre nariz y boca, c) ajustar la banda elástica y respirar normalmente.","A320 Día 4");
Q("a4","¿A qué altitud de cabina opera automáticamente el sistema de oxígeno?",["10.000 pies","12.000 pies","14.000 pies","18.000 pies"],2,"El sistema opera AUTOMÁTICAMENTE cuando la presión de altitud de cabina disminuye a una presión equivalente a 14.000 PIES. También puede activarlo la TM desde la cabina de mando, o manualmente con el MRT.","A320 Día 4");
Q("a4","¿Qué es el MRT y cuántos hay en el A320?",["El sistema de oxígeno; 2","Manual Release Tool: herramienta para desasegurar manualmente la tapa del compartimento del PSU; hay 4 ubicados en algunos jumpseats","Un extintor; 4","Una llave de puertas; 1"],1,"MRT (Manual Release Tool): herramienta que se utiliza para desasegurar manualmente la tapa del compartimento del PSU, introduciendo la punta del MRT en el orificio del PSU. Se encuentran 4 MRT ubicados en algunos jumpseats, según el plano de equipos de emergencia del avión.","A320 Día 4");
Q("a4","¿Para cuántas personas está diseñada la cabina de mando del A320?",["Solo 2 pilotos","Dos tripulantes de mando y dos observadores","3 personas","4 pilotos"],1,"La cabina de mando está diseñada para DOS TRIPULANTES DE MANDO y DOS OBSERVADORES. Dos asientos de pilotos montados sobre columnas; el tercer y cuarto asientos son plegables.","A320 Día 4");
Q("a4","¿Cómo puede la TC abrir la puerta del cockpit en una emergencia?",["Con una llave","Introduciendo un código en el teclado (key pad) instalado al costado del FAP","Empujando fuerte","Con el hacha"],1,"La puerta de la cabina de mando es BLINDADA, se asegura automáticamente al cerrarse y puede abrirse manualmente desde el cockpit. EN EMERGENCIA la puerta puede ser abierta por la TC introduciendo un CÓDIGO EN EL TECLADO (KEY PAD), instalado al costado del FAP.","A320 Día 4");
Q("a4","Si falla un seguro del mecanismo de cierre de la puerta del cockpit, ¿qué existe?",["Nada, queda abierta","Un cerrojo de seguridad a nivel del centro de la puerta, al costado izquierdo","Una segunda puerta","Un sistema hidráulico"],1,"En el evento de que un seguro del mecanismo de cierre falle, existe un CERROJO DE SEGURIDAD a nivel del centro de la puerta de la cabina de mando, AL COSTADO IZQUIERDO.","A320 Día 4");
Q("a4","¿Qué equipos tienen los asientos de la Tripulación de Mando?",["Solo cinturón","Cinturón de seguridad, arnés, máscara quick donning, chaleco salvavidas, chaleco luminiscente y linterna","Solo máscara y chaleco","Cinturón y paracaídas"],1,"Los asientos del Comandante y Primer Oficial, ajustables en altura, posición y reclinación, disponen de: cinturón de seguridad, arnés, máscara quick donning, chaleco salvavidas, chaleco luminiscente y linterna.","A320 Día 4");
Q("a4","¿Cuántas ventanas del cockpit pueden usarse como vía de evacuación y desde dónde se abren?",["Las 4; desde afuera","Dos ventanas, y SOLO se pueden abrir desde el interior","Una; desde afuera","Ninguna"],1,"DOS ventanas en la cabina de mando pueden ser utilizadas en caso de emergencia como vías de evacuación alternativas. SOLO SE PUEDEN ABRIR DESDE EL INTERIOR.","A320 Día 4");
Q("a4","¿Qué largo tiene la cuerda de escape (escape rope) del cockpit y cuánto peso soporta?",["3 mts y 100 kg","5,5 mts con nudos y soporta 181 kg","10 mts y 200 kg","8 mts y 150 kg"],1,"Una cuerda de escape de 5,5 METROS con nudos está almacenada en un compartimento sobre cada ventana del cockpit. Las cuerdas pueden soportar una carga de 181 KG.","A320 Día 4");
Q("a4","¿Cómo se abren las ventanas de la cabina de mando?",["Girando una manivela","Presionar el botón de la palanca de apertura, rotar la palanca hacia atrás y deslizar la ventana hacia atrás sujetando la palanca","Empujando hacia afuera","Con el hacha"],1,"PRESIONAR el botón de la palanca de apertura, ROTAR la palanca hacia atrás y DESLIZAR la ventana hacia atrás sujetando la palanca.","A320 Día 4");
Q("a4","¿Cuántas máscaras quick donning hay en el cockpit y de dónde se alimentan?",["2 máscaras de un tanque","4 máscaras quick donning alimentadas por un tanque, en compartimentos dobles a cada lado","6 máscaras individuales","2 generadores químicos"],1,"UN TANQUE provee de oxígeno a 4 MÁSCARAS QUICK DONNING, ubicadas en compartimentos dobles a cada lado en la cabina de mando.","A320 Día 4");
Q("a4","En la máscara quick donning, ¿qué ocurre al presionar los clips rojos?",["Se libera el oxígeno puro","Se libera la máscara del compartimento y el arnés se INFLA; al soltarlos alrededor de la cabeza, el arnés se desinfla ajustándose","Se activa la sobrepresión","Se cierra la válvula"],1,"CLIPS ROJOS: al presionarlos se libera la máscara del compartimento y el arnés SE INFLA. Al ponerlo alrededor de la cabeza y soltar los clips, el arnés SE DESINFLA ajustándose a la cabeza.","A320 Día 4");
Q("a4","¿Para qué sirve el selector de sobrepresión (EMERGENCY) de la máscara quick donning?",["Para dar más caudal","Genera sobrepresión, lo que elimina la condensación y previene la entrada de humo, olores o ceniza a la máscara","Para apagar el oxígeno","Para hablar por el micrófono"],1,"SELECTOR DE SOBREPRESIÓN (EMERGENCY): genera sobre presión, lo cual elimina condensación y previene la entrada de HUMO, OLORES O CENIZA a la máscara.","A320 Día 4");
Q("a4","En la máscara quick donning, ¿qué diferencia hay entre N y 100%?",["N es normal y 100% es de emergencia","100% el regulador provee oxígeno puro; N provee a demanda una mezcla de aire ambiente y oxígeno","N es nitrógeno","No hay diferencia"],1,"N/100% SEL: en 100% el regulador provee OXÍGENO PURO. En N provee A DEMANDA una mezcla de aire ambiente y oxígeno. Las máscaras tienen arnés inflable, micrófono integrado y gafas contra humo, y pueden usarse con lentes ópticos.","A320 Día 4");
Q("a4","En la demostración de seguridad en vivo del A320, ¿dónde se ubican los TAC?",["Todos en el pasillo central","Frente a la fila 1, frente a la fila 12 y frente a la fila 22, mientras el TAC 1 lee la fraseología desde el galley","En las puertas","En los jumpseats"],1,"Demostración de seguridad en vivo: las ubicaciones son FRENTE A LA FILA 1, FRENTE A LA FILA 12 y FRENTE A LA FILA 22, mientras el TAC 1 lee la fraseología desde el galley. Las mismas ubicaciones se usan en la preparación de cabina.","A320 Día 4");

/* ========= PAU · PRIMEROS AUXILIOS Y FISIOLOGÍA DEL VUELO ========= */
Q("pa1","¿Qué establece la LEY DE BOYLE?",["Los gases se disuelven según la temperatura","El volumen de un gas es inversamente proporcional a la presión en que se encuentra","La presión aumenta con la altura","Los gases se expanden con el frío"],1,"LEY DE BOYLE: «el volumen de un gas es INVERSAMENTE PROPORCIONAL a la presión en que se encuentra». Explica la expansión de los gases atrapados en el cuerpo al ascender.","Fisiología del Vuelo");
Q("pa1","¿Qué establece la LEY DE HENRY?",["El volumen es inverso a la presión","La cantidad de gas disuelto en una solución es directamente proporcional a la presión de dicho gas sobre la solución","Los gases se difunden de menor a mayor concentración","La temperatura baja con la altura"],1,"LEY DE HENRY: «la cantidad de gas disuelto en una solución es DIRECTAMENTE PROPORCIONAL a la presión en que se encuentra dicho gas sobre la solución». Explica la enfermedad por descompresión (el nitrógeno sale en burbujas al bajar la presión).","Fisiología del Vuelo");
Q("pa1","¿Cómo se define la HIPOXIA?",["Exceso de oxígeno en sangre","Estado de deficiencia de oxígeno en la sangre, células y tejidos del organismo, con compromiso de la función de estos elementos","Aumento de la ventilación","Pérdida de presión de cabina"],1,"HIPOXIA: «estado de deficiencia de oxígeno en la sangre, células y tejidos del organismo, con compromiso de la función de estos elementos». Se produce por la disminución de la presión parcial de O2 en la sangre.","Fisiología del Vuelo");
Q("pa1","¿Cuáles son los 4 tipos de hipoxia?",["Alta, media, baja y crítica","Hipóxica, hipémica (anémica), por estancamiento (isquémica) e histotóxica (citotóxica)","Aguda, crónica, leve y severa","Pulmonar, cardíaca, cerebral y renal"],1,"Los 4 tipos: HIPÓXICA (fase respiratoria/ventilación alveolar) · HIPÉMICA o anémica (fase de transporte: falta de glóbulos rojos o hemoglobina) · POR ESTANCAMIENTO o isquémica (reducción del flujo de sangre en una zona) · HISTOTÓXICA o citotóxica (fase de utilización: las células no pueden usar el O2).","Fisiología del Vuelo");
Q("pa1","La hipoxia HIPÉMICA se produce en la fase de transporte. ¿Cuáles son sus causas comunes?",["Altitud y pérdida de presurización","Intoxicación por CO, pérdida de sangre o donación, y tabaquismo","Insuficiencia cardíaca y frío extremo","Alcohol e intoxicación alimentaria"],1,"HIPOXIA HIPÉMICA: se reduce el volumen de sangre que transporta el O2 por falta de glóbulos rojos o hemoglobina. Causas comunes: intoxicación por CO, pérdida de sangre y falta de ella (donación), y TABAQUISMO.","Fisiología del Vuelo");
Q("pa1","La hipoxia HISTOTÓXICA se produce en la fase de utilización. ¿Cuáles son sus causas?",["Altitud elevada","Intoxicación alimentaria, alcohol y tabaco","Insuficiencia cardíaca","Anemia"],1,"HIPOXIA HISTOTÓXICA: intoxicación de los tejidos, por lo que las células no son capaces de usar el O2. Causas comunes: intoxicación alimentaria, ALCOHOL y TABACO.","Fisiología del Vuelo");
Q("pa1","¿Cuál es la diferencia clave entre SÍNTOMAS y SIGNOS de la hipoxia?",["No hay diferencia","Los síntomas los siente uno mismo (no requiere un tercero); los signos los ve un observador (requiere un tercero)","Los signos son más graves","Los síntomas son visibles"],1,"Los SÍNTOMAS uno mismo los siente (no requiere un tercero): mareo, fatiga, náuseas, falta de aire, ansiedad, cefalea, bochornos, visión borrosa y tunelizada, parestesias. Los SIGNOS los ve un observador (requiere un tercero): aumento de frecuencia respiratoria, cianosis, confusión mental, deterioro del juicio, pérdida de coordinación, euforia o agresividad, pérdida de conciencia.","Fisiología del Vuelo");
Q("pa1","¿Cuáles son las 4 fases de la hipoxia?",["Leve, moderada, severa y crítica","Indiferente, de compensación, de trastornos y crítica (TUC)","Inicial, media, avanzada y final","Aguda, subaguda, crónica y terminal"],1,"Las características de la hipoxia se dan en 4 fases: FASE INDIFERENTE (comienzo insidioso) · FASE DE COMPENSACIÓN (severidad de los síntomas) · FASE DE TRASTORNOS (compromiso mental) · FASE CRÍTICA (TUC).","Fisiología del Vuelo");
Q("pa1","¿Cuál es el tratamiento de la hipoxia?",["Respirar en una bolsa","OXÍGENO: aporte de oxígeno y aumento de la presión parcial de O2","Descender rápidamente y descansar","Beber agua"],1,"Tratamiento de la hipoxia: OXÍGENO, OXÍGENO, OXÍGENO. La prevención se basa en el aporte de oxígeno, el aumento de la presión parcial de O2 y el conocimiento de los síntomas.","Fisiología del Vuelo");
Q("pa1","¿Qué es la HIPERVENTILACIÓN y qué produce?",["Falta de oxígeno; hipoxia","Aumento de la ventilación (frecuencia o profundidad respiratoria) que produce pérdida de CO2 y alcalosis respiratoria con aumento del pH sanguíneo","Exceso de CO2; acidosis","Falla pulmonar; neumotórax"],1,"HIPERVENTILACIÓN: condición fisiopatológica en la cual existe un aumento de la ventilación, ya sea por aumento de la frecuencia o profundidad de la respiración. Se produce PÉRDIDA DE CO2, llevando al organismo a una ALCALOSIS RESPIRATORIA con aumento del pH sanguíneo.","Fisiología del Vuelo");
Q("pa1","¿Cuáles son los 4 tipos de hiperventilación según su causa?",["Alta, media, baja y crítica","Voluntaria, emocional, por dolor y por hipoxia","Aguda, crónica, leve y severa","Pulmonar, cardíaca, nerviosa y muscular"],1,"Tipos según la causa: VOLUNTARIA (control sobre la propia respiración) · EMOCIONAL (miedo, ansiedad, tensión) · DOLOR (aumento de la frecuencia respiratoria) · HIPOXIA (impulso a aumentar la frecuencia respiratoria).","Fisiología del Vuelo");
Q("pa1","¿Cuál es el tratamiento de la hiperventilación?",["Administrar oxígeno al 100%","Control de la respiración, respirar en una bolsa / oxígeno OFF y mantener la calma","Descender de inmediato","Administrar suero"],1,"Tratamiento de la hiperventilación: CONTROL DE LA RESPIRACIÓN, respirar en una bolsa / oxígeno OFF, y mantener la calma. La prevención incluye el control de la respiración y el conocimiento de los síntomas. Sus efectos: vasoconstricción arterial que produce hipoxia por estancamiento del tejido nervioso del cerebro.","Fisiología del Vuelo");
Q("pa1","¿Qué son los DISBARISMOS?",["Los efectos de la hipoxia","Todos los fenómenos fisiopatológicos producidos por las diferencias de presión barométrica, EXCLUYENDO la hipoxia de altura","Las enfermedades del oído","Los efectos del jet lag"],1,"DISBARISMOS: son todos aquellos fenómenos fisiopatológicos producidos por las diferencias de presión barométrica, EXCLUYENDO LA HIPOXIA DE ALTURA. Se clasifican en: A) por efecto mecánico de los cambios de volumen de gases atrapados, y B) enfermedad por descompresión.","Fisiología del Vuelo");
Q("pa1","¿Cuál es la molestia MÁS FRECUENTE en las tripulaciones aéreas?",["La barotitis media","La expansión de gases gastrointestinales atrapados","El jet lag","La barodontalgia"],1,"La EXPANSIÓN DE GASES GASTROINTESTINALES atrapados es la molestia MÁS FRECUENTE en las tripulaciones aéreas. Puede producir dolor tipo cólico e hiperventilación. Sugerencias: evitar alimentos flatulentos e irritantes y evitar la aerofagia (tragar aire).","Fisiología del Vuelo");
Q("pa1","¿Por qué la BAROTITIS MEDIA es más frecuente en los DESCENSOS?",["Porque el avión desciende más rápido","Porque a la trompa de Eustaquio le es más fácil dejar SALIR que ENTRAR aire","Porque hay más presión de cabina","Porque los pasajeros duermen"],1,"La barotitis media es la molestia MÁS IMPORTANTE que narran las tripulaciones y causa de suspensión de vuelos. Es mucho más frecuente EN LOS DESCENSOS pues le es más fácil a la trompa de Eustaquio DEJAR SALIR QUE ENTRAR AIRE. Los tripulantes NO deben volar con afecciones de la vía aérea superior.","Fisiología del Vuelo");
Q("pa1","¿Cuándo ocurre la BAROSINUSITIS?",["En el descenso","Durante el ASCENSO, debido a la expansión gaseosa si el conducto de drenaje está obstruido","Solo en tierra","Al despegar"],1,"BAROSINUSITIS: su fisiopatología es similar a la barotitis, con presión en los senos paranasales. Ocurre DURANTE EL ASCENSO debido a la expansión gaseosa si el conducto de drenaje específico está obstruido.","Fisiología del Vuelo");
Q("pa1","¿Qué es la BARODONTALGIA?",["Dolor de oído","Dolor dental: bajo las obturaciones puede haber aire que, al disminuir la presión barométrica, aumenta su volumen y difunde hasta la raíz nerviosa","Dolor de garganta","Dolor de cabeza por altura"],1,"BARODONTALGIA: la dentina y la pulpa son estructuras porosas. Bajo las obturaciones puede haber aire; al disminuir la presión barométrica aumenta su volumen y ese aire difunde a través de la dentina y la pulpa hasta la RAÍZ NERVIOSA, produciendo dolor.","Fisiología del Vuelo");
Q("pa1","¿Qué son los BENDS en la enfermedad por descompresión?",["Manifestaciones pulmonares","Dolores articulares: burbujas de nitrógeno en las articulaciones que producen inflamación y dolor; solo se producen al ASCENSO y ceden al descender","Manifestaciones dérmicas","Alteraciones neurológicas"],1,"BENDS: burbujas de nitrógeno que se van a las articulaciones o zonas cercanas y producen INFLAMACIÓN Y DOLOR. Solo se producen AL ASCENSO y pueden inducir hiperventilación. La molestia CEDE AL DESCENDER por la compresión.","Fisiología del Vuelo");
Q("pa1","¿Qué son los CHOKES?",["Dolores articulares","Burbujas de N2 que obstruyen los vasos sanguíneos y capilares del pulmón, impidiendo el intercambio alveolo-capilar y pudiendo llevar a hipoxia","Manifestaciones cutáneas","Un tipo de hiperventilación"],1,"CHOKES (ahogos): las burbujas de N2 circulando en la sangre llegan a los vasos sanguíneos y capilares del PULMÓN produciendo obstrucción. No se produce el intercambio alveolo-capilar, pudiendo llevar a una HIPOXIA. Clínica: tos seca y dolor retroesternal.","Fisiología del Vuelo");
Q("pa1","¿Cuál es el cuadro MÁS GRAVE Y MORTAL de la enfermedad por descompresión?",["Los bends","Las manifestaciones dérmicas","Las manifestaciones cardiovasculares (vasomotoras): burbujeo masivo del aparato circulatorio que se manifiesta por shock","Los chokes"],2,"EPD TIPO II CARDIOVASCULAR: es el cuadro MÁS GRAVE Y MORTAL de todos. Hay burbujeo masivo de todo el aparato circulatorio y se manifiesta por SHOCK. El corazón colapsa por exceso de trabajo contra las burbujas.","Fisiología del Vuelo");
Q("pa1","¿Hasta cuánto tiempo después del vuelo puede producirse la enfermedad por descompresión?",["1 hora","6 horas","Hasta 24 horas (después de 24-36 horas el diagnóstico es dudoso)","72 horas"],2,"Por la diferencia en la capacidad de liberación de nitrógeno de los distintos tejidos, la EPD puede producirse HASTA 24 HORAS posterior al vuelo: 1 hora en el 50% de los casos, 6 horas en el 90%, y 24 horas en el 99%. DESPUÉS DE 24-36 HORAS EL DIAGNÓSTICO DE EPD ES DUDOSO.","Fisiología del Vuelo");
Q("pa1","¿Cuál de estos NO es un factor predisponente de la enfermedad por descompresión?",["Mayor velocidad de descompresión","Edad a partir de los 40 años","Ser hombre (los hombres tienen más EPD que las mujeres)","Colesterol elevado y alto índice de masa corporal"],2,"Factores predisponentes: a mayor velocidad de descompresión y mayor diferencial de presiones, más EPD; el ejercicio durante o después; EPD previa; edad desde los 40 años; colesterol elevado y alto IMC; exposiciones repetidas; y el buceo. Respecto al GÉNERO: las MUJERES tienen MÁS riesgo que los hombres.","Fisiología del Vuelo");
Q("pa1","¿Cuánto tiempo hay que esperar después de BUCEAR para poder volar?",["No hay restricción","Al menos 24 horas","6 horas","1 semana"],1,"Prevención de la descompresión: NO BUCEAR AL MENOS 24 HORAS ANTES DE VOLAR, y mantener una adecuada razón de ascenso. Tratamiento: reexponer a la persona a un ambiente de alta presión (cámara hiperbárica o reinmersión).","Fisiología del Vuelo");
Q("pa1","¿Cuál es la conducta ante una enfermedad por descompresión?",["Ascender para estabilizar","Descenso controlado pero inmediato, uso de O2, aterrizar apenas sea posible y buscar ayuda médica calificada","Esperar a que pase","Administrar analgésicos"],1,"Conducta en caso de EPD: DESCENSO CONTROLADO PERO INMEDIATO, uso de O2, aterrizar apenas sea posible y buscar ayuda médica calificada.","Fisiología del Vuelo");
Q("pa1","¿Cuáles son las ventajas de la presurización de cabina?",["Solo comodidad","Reduce la posibilidad de hipoxia, enfermedad por descompresión y disbarismos; da comodidad y movilidad, disminuye la fatiga, controla temperatura y humedad y permite la comunicación","Aumenta la performance del avión","Reduce el peso del avión"],1,"Ventajas: reduce la posibilidad de HIPOXIA, ENFERMEDAD POR DESCOMPRESIÓN y DISBARISMOS; comodidad, movilidad y disminución de la fatiga; control de temperatura y humedad; comunicación. Desventajas: aumenta el costo operacional, el peso y estructura del avión, reduce la performance y conlleva el RIESGO DE DESCOMPRESIÓN.","Fisiología del Vuelo");
Q("pa1","¿Cuáles son los signos físicos de una descompresión rápida o explosiva?",["Solo el ruido","Ruido, condensación, descenso brusco de la presión barométrica, descenso brusco de la temperatura y arrastre de objetos y personas","Aumento de temperatura","Olor a quemado"],1,"Signos físicos: RUIDO, CONDENSACIÓN, descenso brusco de la presión barométrica, DESCENSO BRUSCO DE LA TEMPERATURA y arrastre de objetos y personas. Consecuencias de la exposición: dilatación de gases, hipotermia, hipoxia y deshidratación.","Fisiología del Vuelo");
Q("pa1","¿Qué factores afectan la SEVERIDAD de una descompresión?",["Solo la altitud","El volumen de la cabina, el tamaño de la apertura y la altitud de vuelo","La cantidad de pasajeros","La velocidad del avión"],1,"Los factores que afectan la severidad de la descompresión son: el VOLUMEN DE LA CABINA, el TAMAÑO DE LA APERTURA y la ALTITUD DE VUELO. En una descompresión el TUC puede reducirse en 1/3 a 1/2.","Fisiología del Vuelo");
Q("pa1","En una descompresión rápida, ¿cuál es el orden de los procedimientos de emergencia personales?",["Ayudar a los pasajeros primero","1) Conectarse la máscara de oxígeno, 2) abrochar y ajustar el cinturón, 3) revisar conexiones de oxígeno, 4) controlar la respiración, 5) ayudar a tripulantes y pasajeros","Buscar ayuda médica primero","Revisar la cabina"],1,"Procedimientos de emergencia: 1) CONÉCTESE SU MÁSCARA DE OXÍGENO, 2) abroche y ajuste su cinturón, 3) revise conexiones de oxígeno, 4) controle su respiración, 5) ayude a tripulantes y pasajeros, 6) busque ayuda médica calificada si es necesario.","Fisiología del Vuelo");
Q("pa1","¿Qué es la SOBREDISTENSIÓN PULMONAR y qué puede producir?",["Un exceso de oxígeno","Por limitación de la tráquea no alcanza a salir todo el aire y el pulmón colapsa en una descompresión rápida; puede producir neumotórax, neumomediastino y embolia aérea","Una infección pulmonar","Hiperventilación crónica"],1,"SOBREDISTENSIÓN PULMONAR: el pulmón es una cavidad llena de aire comunicada al exterior por la tráquea. Por limitación de la tráquea no alcanza a salir todo el aire y el pulmón colapsa en una DESCOMPRESIÓN RÁPIDA O EXPLOSIVA. Se puede producir NEUMOTÓRAX, NEUMOMEDIASTINO y EMBOLIA AÉREA (aire en sangre).","Fisiología del Vuelo");
Q("pa1","¿En qué se basa el sistema integrado de orientación y equilibrio?",["Solo en la vista","Receptores vestibulares de ambos oídos internos, información visual macular y periférica, e información propioceptiva de receptores de tensión muscular y articular","Solo en el oído interno","En los instrumentos del avión"],1,"El sistema integrado de orientación y equilibrio es una función del Sistema Nervioso Central estructurada con información sensorial de: a) receptores VESTIBULARES de ambos oídos internos, b) información VISUAL macular y periférica, c) información PROPIOCEPTIVA desde los receptores de tensión muscular y articular.","Fisiología del Vuelo");
Q("pa1","¿Cómo se evita el DESLUMBRAMIENTO (encandilamiento)?",["Mirando hacia abajo","Cerrando un ojo (dura 2-3 minutos)","Usando lentes oscuros siempre","Aumentando la luz de cabina"],1,"El deslumbramiento o encandilamiento dura 2-3 MINUTOS y SE EVITA CERRANDO UN OJO. Otras ilusiones visuales: fenómeno autokinético, movimiento relativo, horizontes falsos, confusión de luces y falsas imágenes exteriores.","Fisiología del Vuelo");
Q("pa1","¿Cuál es el efecto del ALCOHOL en altura?",["Se reduce a la mitad","Se MULTIPLICA con la altura, ya que interfiere con la capacidad del cerebro para usar el O2","No cambia","Se elimina más rápido"],1,"El alcohol es un depresor del SNC; 80-90% pasa a sangre en 30 minutos. Produce pensamiento lento, incapacidad para tomar decisiones e incoordinación motora. SU EFECTO SE MULTIPLICA CON LA ALTURA ya que interfiere con la capacidad del cerebro para usar el O2. La normativa exige NO beber alcohol durante las 24 HORAS previas a un vuelo.","Fisiología del Vuelo");
Q("pa1","¿Qué efecto tiene el TABACO respecto de la hipoxia?",["Ninguno","El CO compite con el O2 en la sangre: el riesgo de hipoxia en altura es el DOBLE, y disminuye la tolerancia a la altura en 1.500-1.800 mts","Mejora la oxigenación","Solo afecta los pulmones"],1,"El cigarro contiene 5-8% de CO, que COMPITE CON EL O2 en sangre: el riesgo de hipoxia en altura es EL DOBLE. Disminuye la visión nocturna y la sensibilidad diurna, y disminuye la tolerancia a la altura en 1.500-1.800 mts. «Los tripulantes que fuman están volando antes del despegue».","Fisiología del Vuelo");
Q("pa1","¿Cuál de estos medicamentos NO debe automedicarse por su efecto en vuelo?",["Ninguno tiene efecto","Antihistamínicos (somnolencia), jarabes con codeína, relajantes musculares, tranquilizantes y anorexígenos","Solo los antibióticos","Solo los analgésicos"],1,"LA AUTOMEDICACIÓN ESTÁ PROHIBIDA. Antihistamínicos: somnolencia · Jarabes para la tos: codeína · Relajantes musculares: disminuyen la atención · Tranquilizantes naturales: somnolencia y reacciones lentas · Anorexígenos: derivados de anfetaminas, disminuyen el juicio y dan falsa seguridad · Analgésicos con codeína o morfina: disminuyen la atención.","Fisiología del Vuelo");

Q("pa2","¿Qué es el WOCL y en qué horario ocurre?",["El período de descanso legal; 22:00 a 06:00","Window of Circadian Low o Ventana de Mínimos Circadianos: entre las 02:00 y las 06:00, cuando el cuerpo registra su nivel más bajo de alerta","La jornada nocturna; 21:00 a 06:00","El turno de madrugada; 00:00 a 05:00"],1,"WOCL (Window of Circadian Low) o Ventana de Mínimos Circadianos: período comprendido generalmente ENTRE LAS 02:00 Y LAS 06:00 HORAS. Representa el momento en que el reloj biológico registra su nivel más bajo de alerta, temperatura corporal y rendimiento. Las autoridades lo usan para diseñar los límites de tiempo de vuelo y descanso.","Fatiga y Estrés");
Q("pa2","¿Qué son los MICROSUEÑOS?",["Siestas programadas","Episodios incontrolables de 2 a 30 segundos de desconexión cerebral","El sueño REM","Sueños durante el descanso a bordo"],1,"MICROSUEÑOS: episodios INCONTROLABLES (de 2 a 30 segundos) de desconexión cerebral. Son uno de los síntomas de fatiga más peligrosos operacionalmente.","Fatiga y Estrés");
Q("pa2","¿Por qué la fatiga es un peligro «insidioso»?",["Porque aparece de golpe","Porque el tripulante fatigado pierde la capacidad de autoevaluar su propio agotamiento","Porque no tiene síntomas","Porque solo afecta de noche"],1,"La fatiga es la disminución de la capacidad física o mental por falta de sueño, vigilia prolongada o alta carga de trabajo. Es un peligro INSIDIOSO porque el tripulante fatigado PIERDE LA CAPACIDAD DE AUTOEVALUAR SU PROPIO AGOTAMIENTO.","Fatiga y Estrés");
Q("pa2","¿Cuáles son causas AMBIENTALES de fatiga en cabina?",["Solo el ruido","Hipoxia leve (cabina presurizada a 8.000 pies), baja humedad (menos de 20%, que espesa la sangre) y ruido y vibración","Los pasajeros disruptivos","Los turnos largos"],1,"Causas ambientales: HIPOXIA LEVE (la menor presión de oxígeno a altitud de crucero, cabina presurizada a 8.000 pies, acelera el cansancio celular) · BAJA HUMEDAD (aire seco de menos de 20% de humedad que espesa la sangre, forzando al corazón) · RUIDO Y VIBRACIÓN que desgastan el sistema nervioso central.","Fatiga y Estrés");
Q("pa2","¿Cuál es un síntoma de fatiga especialmente crítico para la evacuación?",["La irritabilidad","El aumento drástico del tiempo de reacción, crítico para la evacuación de 90 segundos","El insomnio","La pérdida de apetito"],1,"Síntomas de fatiga: microsueños, fallas cognitivas (pérdida de la conciencia situacional, olvido de SOP como el armado/desarmado de puertas), LENTITUD con aumento drástico del tiempo de reacción (CRÍTICO PARA LA EVACUACIÓN DE 90 SEGUNDOS) y cambios de humor (irritabilidad y pérdida de empatía que destruyen el CRM).","Fatiga y Estrés");
Q("pa2","¿Qué es el FRMS?",["Un sistema de radar","Sistema de Gestión de Riesgos de Fatiga: la aerolínea programa roles que respeten los descansos legales","Un formulario de reporte","Un simulador de vuelo"],1,"FRMS: Sistema de Gestión de Riesgos de Fatiga. La aerolínea lo usa para programar roles que respeten los descansos legales (en Chile: mínimo 10 a 12 horas de descanso ininterrumpido), evitar secuencias excesivas y ajustar la programación si hay reportes de fatiga.","Fatiga y Estrés");
Q("pa2","Si un TCP se siente incapacitado por fatiga, ¿qué debe hacer?",["Volar igual y avisar después","Tiene la obligación legal y moral de reportarlo y marginarse del vuelo, amparado por la Cultura Justa del SMS","Pedir un café","Cambiar de turno con otro"],1,"Si un TCP se siente incapacitado por fatiga, tiene la OBLIGACIÓN LEGAL Y MORAL de reportarlo y MARGINARSE DEL VUELO, amparado por la CULTURA JUSTA del SMS.","Fatiga y Estrés");
Q("pa2","¿Cuál es la mejor cura para el estrés operativo?",["Dormir más","La preparación: un TCP que domina sus manuales, la normativa y la ubicación de sus equipos actuará en automático bajo presión","Evitar los vuelos largos","Delegar todo"],1,"CONOCIMIENTO Y ENTRENAMIENTO: la mejor cura para el estrés operativo es LA PREPARACIÓN. Un TCP que domina sus manuales, la normativa (DAN) y la ubicación de sus equipos de emergencia actuará EN AUTOMÁTICO bajo presión.","Fatiga y Estrés");
Q("pa2","¿Qué es la «visión de túnel» como síntoma agudo de estrés?",["Perder la visión periférica por hipoxia","Enfocarse en un solo problema ignorando el resto de la cabina","Ver borroso","Una ilusión visual nocturna"],1,"Síntomas agudos de estrés durante el vuelo: taquicardia, sudoración, respiración agitada, VISIÓN DE TÚNEL (enfocarse en un solo problema ignorando el resto de la cabina) y bloqueo mental (olvidar comandos de evacuación). Crónicos: ansiedad, insomnio, problemas gastrointestinales y burnout.","Fatiga y Estrés");
Q("pa2","¿Cómo ayuda el CRM a manejar el estrés en una emergencia médica?",["Reduciendo la carga de trabajo del capitán","El estrés disminuye cuando el trabajo se divide: uno atiende, otro informa al Capitán, otro busca el botiquín","Evitando la comunicación","Delegando en los pasajeros"],1,"Aplicación del CRM: el estrés disminuye cuando el trabajo SE DIVIDE. Un TCP estresado por una emergencia médica debe DELEGAR TAREAS al resto de la tripulación (uno atiende, otro informa al Capitán, otro busca el botiquín).","Fatiga y Estrés");
Q("pa2","¿Cuántos días se necesitan aproximadamente para resincronizar un cambio de 6 o más zonas horarias?",["2 días","4 días","7 días aproximadamente","14 días"],2,"Se necesitan 7 DÍAS (aproximadamente) para resincronizar un cambio de 6 o más zonas horarias. La desincronización se ha probado como factor causal o contribuyente de varios accidentes de aviación.","Fatiga y Estrés");
Q("pa2","¿Cuáles son los sincronizadores del ritmo circadiano?",["El sueño y el ejercicio","Comidas, horarios de trabajo, y horas de luz y oscuridad","La temperatura y la humedad","La altitud y la presión"],1,"Los SINCRONIZADORES del ritmo circadiano son: COMIDAS, HORARIOS DE TRABAJO y HORAS DE LUZ Y OSCURIDAD. Hay desincronización cuando el ritmo circadiano de una persona es inconsistente con los sincronizadores ambientales locales.","Fatiga y Estrés");
Q("pa2","¿Qué diferencia hay entre fatiga aguda y crónica?",["Ninguna, son sinónimos","La aguda se debe a hipoxia, estrés físico o psicológico y disminución de energía; la crónica es de raíz psicológica, requiere tiempo y consultar al médico","La aguda dura más","La crónica se cura durmiendo"],1,"FATIGA CRÓNICA: tiempo, raíz psicológica; consulte a su médico. FATIGA AGUDA: hipoxia, estrés físico o psicológico, disminución de energía. Recomendaciones: dormir 8 horas por noche, alimentación balanceada, ejercicio, evitar exceso de peso, no fumar ni beber alcohol. LA FATIGA ES EL MAYOR ENEMIGO A ENFRENTAR.","Fatiga y Estrés");
Q("pa2","¿Cuánto de los incidentes y accidentes está ligado al factor humano en la aviación moderna?",["30%","50%","80%","95%"],2,"En la aviación moderna, el 80% de los incidentes y accidentes están ligados al FACTOR HUMANO. Para un TCP la cabina es un entorno altamente demandante; la fatiga y el estrés no son signos de «debilidad» sino respuestas fisiológicas y psicológicas reales que degradan la capacidad de reaccionar en una emergencia.","Fatiga y Estrés");

Q("pa3","¿Cómo se definen los primeros auxilios?",["El tratamiento médico definitivo","La atención inmediata y/o temporal dada a víctimas de accidentes o situaciones de emergencia, hasta recibir la ayuda médica","La atención en el hospital","El uso del botiquín"],1,"PRIMEROS AUXILIOS: la atención inmediata y/o temporal dada a víctimas de accidentes o de situaciones de emergencia, HASTA RECIBIR LA AYUDA MÉDICA. Sus fundamentos: prevenir accidentes, capacitar al personal, evitar agravar las lesiones por un tratamiento inadecuado y procurar un transporte adecuado.","Emergencias Médicas");
Q("pa3","¿Cuáles son las reglas básicas ante una emergencia médica a bordo?",["Esperar al aterrizaje","Organizar un equipo de trabajo, solicitar vía PA un médico y confirmar su identificación, informar al Capitán y disponer del DEA cuando se requiera","Administrar medicamentos","Aislar al pasajero"],1,"Reglas básicas: organice un equipo de trabajo · solicite vía PA un médico u otra persona con entrenamiento médico Y CONFIRME SU IDENTIFICACIÓN · informe al Capitán y solicite médico o ambulancia en el siguiente aeropuerto si se requiere · disponga del DEA cuando así se requiera.","Emergencias Médicas");
Q("pa3","Un pasajero presenta piel pálida, fría y húmeda, confusión y respiración rápida. ¿Qué sospechas y qué haces?",["Hiperglicemia; dar agua","HIPOGLICEMIA; si está consciente administrar azúcar, caramelos o bebidas azucaradas; si está inconsciente asegurar la vía aérea y colocar azúcar bajo la lengua","Infarto; dar oxígeno","Shock; acostarlo"],1,"HIPOGLICEMIA: mareos, somnolencia, PIEL PÁLIDA FRÍA Y HÚMEDA, confusión/desorientación, respiración rápida y superficial, alteración de la visión y de la conciencia. Si está consciente: administrar azúcar, caramelos o bebidas azucaradas. Si está inconsciente: asegurar la vía aérea y colocar azúcar bajo la lengua. NO administrar medicamento.","Emergencias Médicas");
Q("pa3","¿Qué signos presenta una HIPERGLICEMIA?",["Piel pálida y fría","Somnolencia, aliento a alcohol, sed, piel seca y colorada y labios rojos","Sudoración excesiva","Convulsiones"],1,"HIPERGLICEMIA: somnolencia, ALIENTO A ALCOHOL, sed, PIEL SECA Y COLORADA, labios rojos. Acción: activar el mecanismo de emergencia si es necesario, dar agua si el pasajero lo solicita, asistir al pasajero en la administración de SU fármaco y mantener informado al Capitán.","Emergencias Médicas");
Q("pa3","Ante un infarto agudo al miocardio, ¿en qué posición se ubica al pasajero y cuánto oxígeno se le da?",["Acostado; 4 lts/min","Semisentado y cómodo; oxígeno a 2 lts/min","De pie; sin oxígeno","Posición de seguridad; 6 lts/min"],1,"IAM: activar el mecanismo de emergencia y solicitar el DEA, ubicar a la persona SEMISENTADA y cómoda, preguntar por enfermedades y medicamentos (asistirlo en su administración), proporcionar OXÍGENO A 2 LTS/MIN, mantener temperatura adecuada, NO proporcionar comida ni bebidas, y si pierde la conciencia evaluar RCP y DEA.","Emergencias Médicas");
Q("pa3","¿Cuáles son los 3 signos de la Escala Prehospitalaria de Cincinnati para ACV?",["Pulso, presión y temperatura","Asimetría facial, descenso del brazo y lenguaje anormal","Visión, audición y habla","Fuerza, equilibrio y memoria"],1,"Escala de Cincinnati: 1) ASIMETRÍA FACIAL (que muestre los dientes o sonría), 2) DESCENSO DEL BRAZO (cierra los ojos y mantiene ambos brazos extendidos 10 segundos), 3) LENGUAJE ANORMAL (que diga «el perro de San Roque no tiene rabo»). Si 1 de estos 3 signos es anormal, la probabilidad de ataque cerebral es del 72%.","Emergencias Médicas");
Q("pa3","Ante una CONVULSIÓN, ¿qué NO se debe hacer?",["Retirar objetos cercanos","Intentar detener la convulsión, afirmar al pasajero o colocar objetos entre sus dientes","Proteger la cabeza con cojines","Colocarlo en posición de seguridad al finalizar"],1,"Ante una convulsión: NO intentar detener la convulsión o afirmar al pasajero, NO colocar ningún tipo de objeto entre los dientes. Sí: retirar objetos cercanos que puedan causar lesiones, proteger colocando cojines o ropa doblada bajo su cabeza, colocarlo en posición de seguridad DESPUÉS de finalizada y revisarlo por posibles daños.","Emergencias Médicas");
Q("pa3","¿Qué es el SHOCK?",["Una impresión fuerte","Emergencia médica que pone en riesgo la vida: la sangre oxigenada llega en forma insuficiente a los órganos vitales por disminución de la presión sanguínea","Una convulsión","Una reacción alérgica"],1,"SHOCK: emergencia médica que pone en riesgo la vida, ya que la sangre oxigenada llega en forma insuficiente a los órganos vitales debido generalmente a la DISMINUCIÓN DE LA PRESIÓN SANGUÍNEA. Signos: comportamiento inusual, piel cianótica o pálida, respiración rápida, sudoración fría, pérdida de conciencia.","Emergencias Médicas");
Q("pa3","Ante una HEMORRAGIA, ¿qué NO se debe hacer?",["Aplicar compresión directa","Aplicar torniquete o retirar los paños aunque estén empapados","Usar guantes","Elevar el miembro lesionado"],1,"Ante una hemorragia: NO APLICAR TORNIQUETE y NO RETIRAR LOS PAÑOS aunque estén empapados (agregar más paños si es necesario). Sí: usar guantes, dejar al pasajero en reposo, aplicar compresión directa sobre la zona, elevar el miembro por sobre el nivel del corazón si es posible. Si hay un objeto empalado, ejercer presión ALREDEDOR sin retirarlo.","Emergencias Médicas");
Q("pa3","¿Cuál es la diferencia entre fractura, luxación y esguince?",["Son lo mismo","Fractura: rotura o fisura de un hueso · Luxación: separación de un hueso de su posición normal en una articulación · Esguince: daño de un ligamento al superar su rango normal de movimiento","La fractura es leve","El esguince afecta al hueso"],1,"FRACTURA: rotura o fisura en un hueso, generalmente por fuerzas directas o indirectas. DISLOCACIÓN O LUXACIÓN: separación de un hueso de su posición normal en una articulación, por grandes fuerzas externas. ESGUINCE: daño de un ligamento de una articulación cuando supera su rango normal de movimiento.","Emergencias Médicas");
Q("pa3","Ante una lesión musculoesquelética, ¿por cuánto tiempo se aplica frío y qué NO se debe hacer?",["5 minutos; no elevar","20 minutos de compresa fría o hielo; NO frotar la parte lesionada ni tratar de alinear la zona deformada","1 hora; no inmovilizar","10 minutos; no dar analgésicos"],1,"Acción: inmovilizar la parte lesionada, colocar compresa fría o hielo durante 20 MINUTOS, elevar la zona si es posible. NO FROTAR la parte lesionada y NO TRATAR DE ALINEAR la zona que tenga deformación.","Emergencias Médicas");
Q("pa3","Según la regla de los nueve, ¿qué porcentaje representa la cabeza y qué el tronco?",["Cabeza 18% y tronco 9%","Cabeza 9%, cuello 1%, tronco y región lumbar 18%, tórax anterior y abdomen 18%","Cabeza 5% y tronco 25%","Ambos 12%"],1,"Regla de los nueve: cabeza 9% · cuello 1% · tronco y región lumbar 18% · tórax anterior y abdomen 18% · cada extremidad inferior 18% · cada extremidad superior 9%.","Emergencias Médicas");
Q("pa3","¿Cuándo se considera «Gran Quemado»?",["Con cualquier quemadura de 3er grado","25% de quemaduras en el cuerpo de un adulto y 15% en un niño","10% en adultos","50% en cualquier caso"],1,"Se considera GRAN QUEMADO la extensión de un 25% de quemaduras en el cuerpo de un ADULTO y de un 15% en un NIÑO. Puede producir shock. Los factores de gravedad son la profundidad (grado A/1, AB/2 y B/3) y la extensión.","Emergencias Médicas");
Q("pa3","¿Qué caracteriza a una quemadura tipo B (3er grado)?",["Enrojecimiento y dolor","Destrucción de la piel pudiendo llegar al hueso, aparición de escaras y NO presenta dolor","Ampollas y dolor intenso","Solo compromete la primera capa"],1,"Quemadura A (1er grado): enrojecimiento, dolor y compromiso de la primera capa. Quemadura AB (2º grado): enrojecimiento, dolor intenso y AMPOLLAS. Quemadura B (3er grado): DESTRUCCIÓN DE LA PIEL pudiendo llegar al hueso, aparición de escaras, NO PRESENTA DOLOR.","Emergencias Médicas");
Q("pa3","En una quemadura AB con ampollas, ¿qué NO se debe hacer?",["Poner la zona bajo agua","Romper las ampollas o aplicar algo sobre la piel","Cubrir con apósito estéril","Favorecer el traslado a un centro asistencial"],1,"Quemadura AB: colocar la zona bajo agua algunos minutos, SI HAY AMPOLLAS NO LAS ROMPA, NO APLIQUE NADA SOBRE LA PIEL, cubrir con apósito estéril y favorecer el traslado. En quemadura B además: NO retire la ropa pegada, hidrate al pasajero y evite el contacto entre 2 zonas afectadas.","Emergencias Médicas");
Q("pa3","¿Cuáles son las quemaduras consideradas CRÍTICAS?",["Solo las de 3er grado","Las que dificultan la respiración, las de gran extensión, las de cabeza/cuello/manos/pies/genitales, las de niños o ancianos y las por químicos, explosiones o electricidad","Solo las de gran extensión","Las que producen ampollas"],1,"Quemaduras críticas: las que DIFICULTAN LA RESPIRACIÓN, las de GRAN EXTENSIÓN, las que afectan CABEZA, CUELLO, MANOS, PIES Y GENITALES, las que afectan a NIÑOS Y/O ANCIANOS, y las causadas por AGENTES QUÍMICOS, EXPLOSIONES O ELECTRICIDAD.","Emergencias Médicas");
Q("pa3","Ante un golpe en la cabeza, ¿qué es lo primero que se debe asegurar?",["Dar analgésicos","Que la persona no se mueva y estabilizar la columna cervical; movilizar en bloque si hay náuseas y vómitos","Sentarlo","Darle agua"],1,"GOLPE EN LA CABEZA: asegurarse de que la persona NO SE MUEVA, ESTABILIZAR LA COLUMNA CERVICAL, movilizar EN BLOQUE en caso de náuseas y vómitos (evitando la aspiración o asfixia), tratar hemorragias y evaluar RCP y DEA si pierde la conciencia.","Emergencias Médicas");
Q("pa3","Si una partícula está INCRUSTADA en el ojo de un pasajero, ¿qué se hace?",["Sacarla con una gasa","NO sacarla; cubrir AMBOS ojos para evitar el pestañeo","Lavar con agua a presión","Aplicar gotas"],1,"DAÑO OCULAR: evitar que el pasajero se toque el ojo. Si es una pequeña partícula, pedirle que pestañee rápido. NO SACAR la partícula u objeto extraño SI ESTÁ INCRUSTADO: cubrir AMBOS OJOS para evitar el pestañeo. Si la partícula sobresale, cubrir y aislar con un vaso plástico el ojo afectado.","Emergencias Médicas");
Q("pa3","Ante una intoxicación, ¿qué se hace con los vómitos?",["Provocarlos siempre","NO evitarlos y NO favorecerlos","Provocarlos solo si ingirió algo","Administrar antieméticos"],1,"INTOXICACIONES: las vías de ingreso pueden ser inhalación, contacto o ingesta (la más frecuente). Acción: ubicar cómodamente al pasajero, evaluar el estado de conciencia, NO EVITAR VÓMITOS y NO FAVORECER LOS VÓMITOS, alejar a los demás pasajeros si es necesario, proporcionar oxígeno si es necesario y tratar síntomas.","Emergencias Médicas");
Q("pa3","¿Qué información es importante obtener previo a un parto a bordo?",["Solo la edad de la madre","Semanas de embarazo, presentación del feto, si es uno o más bebés, si es su primer bebé, complicaciones y cantidad y duración de contracciones en 10 min","El nombre del médico","El seguro médico"],1,"Previo a un parto a bordo: semanas de embarazo, presentación del feto (normal o podálica), si es uno o más bebés, si es su primer bebé, si ha tenido complicaciones durante el embarazo, y cantidad y duración de las contracciones uterinas en 10 minutos. Cerca del 96% de los partos son normales.","Emergencias Médicas");
Q("pa3","¿Cuáles son las 3 fases del parto a bordo?",["Inicio, desarrollo y fin","Trabajo de parto avanzado, período expulsivo y alumbramiento","Contracciones, pujo y descanso","Dilatación, nacimiento y recuperación"],1,"Las 3 fases: 1) FASE DE TRABAJO DE PARTO AVANZADO (3 a 4 contracciones cada 10 min, de 40-50 seg), 2) FASE DE PERÍODO EXPULSIVO (5 o más contracciones cada 10 min, de 50-60 seg, pujo incontrolable y visualización del feto), 3) FASE DE ALUMBRAMIENTO (expulsión de la placenta).","Emergencias Médicas");
Q("pa3","En la fase de trabajo de parto avanzado, si NO se observan partes fetales, ¿en qué posición se coloca a la pasajera?",["Sentada","En decúbito IZQUIERDO","Boca abajo","De pie"],1,"Fase de parto avanzado: activar el mecanismo de emergencia, trasladar a la pasajera al GALLEY, ubicarla en «posición ginecológica», observar y verificar la presencia de partes fetales. EN CASO DE NO OBSERVAR PARTES FETALES, COLOCARLA EN DECÚBITO IZQUIERDO y evaluar constantemente su condición.","Emergencias Médicas");
Q("pa3","¿A qué distancia se ligan el cordón umbilical?",["1 dedo desde el abdomen","A 4 dedos desde su origen en el abdomen del recién nacido, y otra ligadura a 4 dedos de la primera, cortando entre ambas","A 10 cm","No se liga"],1,"Si no se ha cortado el cordón umbilical, líguelo a una distancia de 4 DEDOS desde su origen en el abdomen del recién nacido, haga otra ligadura a 4 DEDOS desde la primera y corte el cordón ENTRE AMBAS LIGADURAS.","Emergencias Médicas");
Q("pa3","¿Cómo se mantiene al recién nacido inmediatamente después del parto?",["Boca arriba y abrigado","Secarlo manteniéndolo BOCA ABAJO hasta que llore, para evitar la aspiración de secreciones; luego abrigarlo al nivel de la madre","Sentado","En el galley, aparte"],1,"Secar al recién nacido MANTENIÉNDOLO BOCA ABAJO HASTA QUE LLORE, para evitar la aspiración de secreciones. Abrigarlo manteniéndolo siempre al nivel de la madre, y colocarlo sobre la madre para favorecer el apego y el traspaso de calor.","Emergencias Médicas");
Q("pa3","¿Cuánto dura el alumbramiento y qué se hace con la placenta?",["Es inmediato; se desecha","Es lento (5 a 30 minutos) y no debe ser forzado; la placenta se guarda en la bolsa de mercancías peligrosas","1 hora; se entrega a la madre","No se expulsa en vuelo"],1,"El ALUMBRAMIENTO es la expulsión de la placenta, es LENTO (5 A 30 MINUTOS) y NO DEBE SER FORZADO. Se guarda la placenta en la BOLSA DE MERCANCÍAS PELIGROSAS. Producido el alumbramiento se favorece la contracción uterina con masaje abdominal compresivo para prevenir hemorragia.","Emergencias Médicas");

Q("pa4","¿Quién puede utilizar el Medical Kit (MK)?",["Cualquier tripulante","Exclusivamente personal de salud calificado","Solo el TAC1","El pasajero afectado"],1,"El MK es un botiquín con medicamentos y elementos para ser utilizados EXCLUSIVAMENTE POR PERSONAL DE SALUD CALIFICADO. Contiene fármacos (analgésicos, antipiréticos, antiinflamatorios, antiácido, antialérgico, anticonvulsionante, broncodilatador, corticoides, diurético, etc.), insumos, equipo de intubación (laringoscopio y tubos endotraqueales) y guía farmacológica.","Equipos Médicos");
Q("pa4","¿Cuál de estos elementos está en el FAK y NO en el MK?",["Laringoscopio","Parches oculares, vendajes y algodón (elementos de primeros auxilios que usa la TC)","Tubos endotraqueales","Esfigmomanómetro"],1,"El FAK (First Aid Kit) contiene elementos para primeros auxilios utilizables POR LA TRIPULACIÓN DE CABINA: fármacos (analgésicos, antiespasmódico, antiemético, descongestionante nasal, antiácido, antihistamínico) e insumos (algodón, vendajes, cinta adhesiva, PARCHES OCULARES, toallas, tijeras, guantes de procedimiento, termómetro).","Equipos Médicos");
Q("pa4","¿Cuándo se utiliza el Universal Precaution Kit (UPK)?",["Para primeros auxilios generales","Ante sospecha de un pasajero con enfermedad infectocontagiosa, para evitar el contacto con desechos biológicos y fluidos corporales","Para emergencias cardíacas","Para quemaduras"],1,"El UPK es un botiquín con elementos para ser utilizados ANTE SOSPECHA DE UN PASAJERO CON SÍNTOMAS DE ALGUNA ENFERMEDAD INFECTOCONTAGIOSA, de manera de evitar el contacto con desechos biológicos y otros fluidos corporales (sangre, orina, vómitos) en caso de que requieran ser limpiados.","Equipos Médicos");
Q("pa4","¿Puede sumergirse el DEA en agua o mojarse?",["Sí, es resistente al agua","No: el derrame de líquidos puede estropearlo o provocar peligro de incendio o descargas eléctricas","Solo los parches","Solo si está apagado"],1,"NO se debe sumergir ninguna parte del DEA en agua ni otros líquidos, ni permitir la entrada de líquidos en el dispositivo. El derrame de líquidos sobre el DEA puede estropearlo o provocar peligro de incendio o de descargas eléctricas.","Equipos Médicos");
Q("pa4","¿Qué precaución hay con un pasajero que tiene MARCAPASOS y el DEA?",["No se puede usar el DEA","Es posible que el DEA tenga sensibilidad limitada; no colocar electrodos directamente sobre el dispositivo implantado","Se debe duplicar la descarga","Hay que retirar el marcapasos"],1,"En pasajeros con marcapasos cardíacos es posible que el DEA tenga una SENSIBILIDAD LIMITADA y no detecte todos los ritmos pasibles de desfibrilación. Si sabe que el paciente tiene marcapasos, NO COLOQUE ELECTRODOS DIRECTAMENTE SOBRE EL DISPOSITIVO IMPLANTADO.","Equipos Médicos");
Q("pa4","¿Por qué hay que evitar burbujas de aire bajo los parches del DEA?",["Reducen la conductividad solamente","Pueden provocar QUEMADURAS en la piel del paciente durante la desfibrilación","Despegan los parches","Alteran la lectura del ritmo"],1,"Durante la desfibrilación, las BURBUJAS DE AIRE entre la piel y los parches pueden provocar QUEMADURAS EN LA PIEL del paciente. Para evitarlas, compruebe que los parches autoadhesivos se adhieran perfectamente sobre la piel. No utilice parches secos ni caducados.","Equipos Médicos");
Q("pa4","¿Cuál es el procedimiento ante una defunción a bordo?",["El TAC1 certifica la muerte","El diagnóstico de muerte solo lo hace un médico en vuelo; de otra forma se mantiene RCP hasta el aterrizaje","Se suspende toda maniobra","Se desvía el vuelo siempre"],1,"Defunción a bordo: el DIAGNÓSTICO DE MUERTE SÓLO POR UN MÉDICO EN VUELO. De otra forma SE MANTIENE RCP HASTA EL ATERRIZAJE. Informar la situación al Capitán y completar el Informe de Vuelo. El Capitán ordena custodia e inventario de los bienes del difunto, que serán entregados a las autoridades.","Equipos Médicos");
Q("pa4","Respecto de los medicamentos, ¿qué NO debe hacer la Tripulación de Cabina?",["Consultar por alergias","Nunca recomendar medicamentos, nunca administrar una inyección y no dar medicamentos a un menor no acompañado (UM)","Informar al capitán","Solicitar un médico"],1,"Consejos básicos: NUNCA RECOMENDAR MEDICAMENTOS a un pasajero · si un pasajero solicita un medicamento, consultar por alergias o intolerancias · NUNCA ADMINISTRAR UNA INYECCIÓN · NO DAR MEDICAMENTOS A UM (unaccompanied minor). La TC no debe prescribir ni administrar medicamentos.","Equipos Médicos");

Q("pa5","¿Cómo se define el Paro Cardiorrespiratorio (PCR)?",["La pérdida de conciencia","Cese de la actividad cardiaca mecánica: la víctima no responde, no tiene pulso y no respira o la respiración no es normal (jadea/boquea)","Un infarto","Una arritmia leve"],1,"PCR: «cese de la actividad cardiaca mecánica que se manifiesta en que la víctima NO RESPONDE, NO TIENE PULSO y NO RESPIRA o la respiración no es normal (por ejemplo, si sólo jadea/boquea)».","RCP · DEA · OVACE");
Q("pa5","¿Qué significa la secuencia C-V-R y para quién se usa?",["Cabeza-Vía-Respiración; solo adultos","Compresión, Vía respiratoria y Respiración; se usa para víctimas inconscientes de TODAS las edades","Circulación-Ventilación-Reanimación; solo niños","Es el orden inverso al correcto"],1,"C-V-R significa «Compresión, Vía respiratoria y Respiración». Empezar la RCP en esta secuencia proporciona mayores probabilidades de supervivencia a la víctima de paro cardíaco. La secuencia C-V-R se usa para víctimas inconscientes DE TODAS LAS EDADES.","RCP · DEA · OVACE");
Q("pa5","¿Cuántos segundos se evalúa la respiración antes de iniciar compresiones?",["3 segundos","5 a 10 segundos","30 segundos","1 minuto"],1,"Se revisa la respiración por 5 A 10 SEGUNDOS observando el pecho de la víctima. Si no respira o solo jadea/boquea, se comienzan las compresiones.","RCP · DEA · OVACE");
Q("pa5","¿Cuál es la relación compresiones/ventilaciones de un ciclo de RCP?",["15 compresiones y 2 ventilaciones","30 compresiones y 2 ventilaciones = 1 ciclo","20 y 1","5 y 1"],1,"30 COMPRESIONES x 2 VENTILACIONES = 1 CICLO. Las 2 respiraciones se soplan durante 1 segundo cada una, vigilando la elevación del pecho y evitando la hiperventilación.","RCP · DEA · OVACE");
Q("pa5","¿Cuál es la velocidad y profundidad de las compresiones en un ADULTO?",["60 por minuto y 1 pulgada","Por lo menos 100 por minuto y por lo menos 2 pulgadas de profundidad","150 por minuto y 3 pulgadas","80 por minuto y 1,5 pulgadas"],1,"En adultos: velocidad de POR LO MENOS 100 COMPRESIONES POR MINUTO y profundidad de POR LO MENOS 2 PULGADAS. Empujar con FUERZA y RÁPIDO, permitiendo la descompresión completa entre compresión y compresión.","RCP · DEA · OVACE");
Q("pa5","¿Cómo se dan las compresiones en un BEBÉ (menor de 1 año)?",["Con las 2 manos","Con 2 dedos en el centro del pecho, justo debajo de la línea de las tetillas","Con 1 mano","Con el talón de la mano"],1,"BEBÉ (menor de 1 año): 2 DEDOS colocados en el centro del pecho JUSTO DEBAJO de la línea de las tetillas, con profundidad de aproximadamente 1½ pulgadas. NIÑO (1 año hasta la pubertad): 1 o 2 manos, aproximadamente 2 pulgadas. ADULTO: 2 manos, al menos 2 pulgadas.","RCP · DEA · OVACE");
Q("pa5","¿Cómo se comprueba si reacciona un BEBÉ?",["Palmaditas en el hombro","Dando palmaditas en la PLANTA DEL PIE y hablándole en voz alta","Sacudiéndolo","Pellizcándolo"],1,"En adultos y niños se dan palmaditas en el HOMBRO y se les habla en voz alta. En BEBÉS se dan palmaditas en la PLANTA DEL PIE y se les habla en voz alta.","RCP · DEA · OVACE");
Q("pa5","Al abrir la vía aérea de un BEBÉ, ¿qué precaución hay?",["Inclinar la cabeza al máximo","NO inclinar demasiado la cabeza hacia atrás: se usa posición neutra, porque un estiramiento excesivo podría cerrar la vía aérea","No usar la maniobra frente-barbilla","Levantar solo el mentón"],1,"En el bebé se usa la maniobra frente-barbilla en POSICIÓN NEUTRA. NO INCLINES DEMASIADO LA CABEZA DEL BEBÉ HACIA ATRÁS: como la vía respiratoria del bebé no está completamente desarrollada, un estiramiento excesivo podría ocasionar el cierre de la misma.","RCP · DEA · OVACE");
Q("pa5","¿Cada cuánto deben cambiarse los auxiliadores durante la RCP y por qué?",["Cada 10 minutos; por cansancio","Cada 2 minutos, porque a los 1 minuto el auxiliador empieza a fatigarse y a los 5 recién se da cuenta","Cada 30 segundos","No se cambian"],1,"Cambiar de auxiliador CADA 2 MINUTOS de RCP. El dato clave: 1 minuto es lo que tarda un auxiliador en empezar a fatigarse y administrar compresiones poco profundas, y 5 minutos lo que tarda en DARSE CUENTA de que se ha fatigado.","RCP · DEA · OVACE");
Q("pa5","¿Hasta cuándo se realizan las maniobras de RCP a bordo?",["Hasta cansarse","Hasta disponer del DEA, que personal de salud se haga cargo, que la persona se recupere espontáneamente o que el médico declare la muerte","Máximo 10 minutos","Hasta el aterrizaje siempre"],1,"Realice las maniobras de RCP hasta que: disponga del DEA · personal de salud se haga cargo de la reanimación · la persona se recupere espontáneamente · el médico declare la muerte del pasajero.","RCP · DEA · OVACE");
Q("pa5","En un PCR de una EMBARAZADA, ¿qué debe hacer un tripulante durante las maniobras?",["Sentarla","Desplazar el abdomen de la madre hacia el lado IZQUIERDO de ella","Comprimir más arriba","No hacer RCP"],1,"En caso de Paro Cardiorrespiratorio en una embarazada, las maniobras deben realizarse COMO EN UN ADULTO; sin embargo, un tripulante deberá DESPLAZAR durante las maniobras EL ABDOMEN DE LA MADRE HACIA EL LADO IZQUIERDO DE ELLA.","RCP · DEA · OVACE");
Q("pa5","Al aplicar los parches del DEA, ¿qué NO se debe hacer?",["Secar la zona","Detener las compresiones","Afeitar la zona si es necesario","Encender el equipo"],1,"Al abrir el DEA y sacar los parches para ubicarlos en el pecho del pasajero: ¡NO SE DEBEN DETENER LAS COMPRESIONES! Los parches se ubican firmemente en la posición que indica la ilustración; si es necesario, secar y/o afeitar la zona.","RCP · DEA · OVACE");
Q("pa5","¿Qué NO se debe hacer mientras el DEA está ANALIZANDO?",["Mirar la pantalla","Tocar a la persona","Preparar las ventilaciones","Avisar al capitán"],1,"El DEA analizará automáticamente el ritmo cardíaco para determinar si es aconsejable una descarga. IMPORTANTE: NO SE DEBE TOCAR A LA PERSONA MIENTRAS EL DEA ESTÉ ANALIZANDO. Antes de la descarga, el socorrista mira rápidamente a la víctima de pies a cabeza para asegurarse de que nadie la esté tocando.","RCP · DEA · OVACE");
Q("pa5","En uso pediátrico del DEA, ¿dónde se ubican los electrodos?",["Ambos en el pecho","Un electrodo en el centro del tórax y otro en la ESPALDA del menor","Uno en cada brazo","Ambos en la espalda"],1,"USO PEDIÁTRICO: utilice los parches pediátricos y ubique un electrodo en el CENTRO DEL TÓRAX y otro en la ESPALDA del menor. Nunca use equipo o almohadillas pediátricas en adultos. Si la víctima es un niño y no tienes equipo pediátrico, usa un DEA para adultos programado para adultos.","RCP · DEA · OVACE");
Q("pa5","¿Qué se hace con el DEA una vez que el pasajero se recupera?",["Se apaga y guarda","Se mantiene con los parches puestos y encendido hasta que el pasajero reciba ayuda médica del aeropuerto","Se retiran los parches","Se reinicia el análisis"],1,"Mantenga el DEA CON LOS PARCHES PUESTOS Y ENCENDIDO hasta que el pasajero reciba ayuda médica del aeropuerto. Si la víctima comienza a moverse y a respirar, deja las almohadillas donde están y colócala en posición de recuperación.","RCP · DEA · OVACE");
Q("pa5","¿Cuál es la señal universal de atragantamiento?",["Toser fuerte","Una o dos manos en la garganta","Levantar el brazo","Golpear la mesa"],1,"La señal universal de atragantamiento es UNA O DOS MANOS EN LA GARGANTA. Asume que se trata de atragantamiento cuando una persona consciente DEJA DE HABLAR REPENTINAMENTE.","RCP · DEA · OVACE");
Q("pa5","Ante una obstrucción LEVE de la vía aérea, ¿qué se hace?",["Maniobra de Heimlich de inmediato","NO intervenir: animarla a que siga tosiendo hasta que se remueva la obstrucción, y observar que no derive en obstrucción severa","Golpear la espalda","Dar agua"],1,"Cuando la obstrucción es LEVE la persona tose con violencia e incluso puede hablar: NO INTERVENGAS. Si la persona puede hablar, entonces puede respirar. Pregúntale «¿Estás atragantado?», anímala a seguir tosiendo y observa que el proceso no desemboque en una obstrucción severa.","RCP · DEA · OVACE");
Q("pa5","¿Cómo se reconoce una obstrucción SEVERA?",["La persona tose con fuerza","No puede respirar ni toser efectivamente; puede emitir un sonido agudo al inhalar y su rostro y labios pueden ponerse morados","La persona habla entrecortado","Se toca el pecho"],1,"Cuando una persona tiene una obstrucción SEVERA NO PUEDE RESPIRAR NI TOSER EFECTIVAMENTE. Puede emitir un sonido agudo al inhalar y su rostro y labios pueden ponerse morados. Actúa rápidamente o la persona pronto perderá el conocimiento y morirá.","RCP · DEA · OVACE");
Q("pa5","¿Dónde se coloca el puño en las compresiones abdominales (Heimlich)?",["Sobre el esternón","Un poco más arriba del ombligo, con el pulgar hacia adentro, y por debajo de la punta del esternón","En el centro del pecho","Bajo las costillas laterales"],1,"Párate detrás de la persona y tómala por debajo de sus brazos. Cierra tu puño y colócalo UN POCO MÁS ARRIBA DE SU OMBLIGO, CON EL PULGAR HACIA ADENTRO, tomando tu puño con la otra mano. Para minimizar complicaciones, el puño debe quedar POR ENCIMA DEL OMBLIGO PERO POR DEBAJO DE LA PUNTA DEL ESTERNÓN. Realiza compresiones fuertes y rápidas hacia adentro y hacia arriba.","RCP · DEA · OVACE");
Q("pa5","¿Qué se hace si la víctima atragantada es una EMBARAZADA o una persona muy grande?",["Compresiones abdominales igual","Compresiones EN EL PECHO: puño en el centro del pecho, en la mitad inferior del esternón","Golpes en la espalda solamente","Esperar a que pierda la conciencia"],1,"Si el rescatador no puede rodear a la víctima con sus brazos por su tamaño, o porque se trata de una MUJER EMBARAZADA, aplica COMPRESIONES EN EL PECHO: coloca un puño en el CENTRO DEL PECHO, EN LA MITAD INFERIOR DEL ESTERNÓN, con el pulgar contra el pecho, encierra el puño con la otra mano y empuja rápida y fuertemente hasta que expulse el objeto o quede inconsciente.","RCP · DEA · OVACE");
Q("pa5","Si una persona atragantada pierde la conciencia, ¿qué se hace?",["Seguir con Heimlich en el suelo","Acostarla cuidadosamente, administrar RCP y revisar la boca después de cada serie de compresiones; solo si ve el objeto, sacarlo","Introducir los dedos a ciegas","Sentarla y darle agua"],1,"Cuando una persona atragantada no reacciona, acuéstala cuidadosamente en el suelo y ADMINISTRA RCP. Al administrar RCP, REVISA LA BOCA DESPUÉS DE CADA SERIE DE COMPRESIONES: SOLO SI VES EL OBJETO que causa la obstrucción, sácalo, y continúa con la RCP hasta que la persona respire normalmente.","RCP · DEA · OVACE");
Q("pa5","En un BEBÉ atragantado, ¿cuál es la secuencia?",["Compresiones abdominales","5 golpes en la espalda y 5 compresiones torácicas, revisando la vía aérea","Maniobra de Heimlich","Solo RCP"],1,"En bebés: 5 GOLPES EN LA ESPALDA y 5 COMPRESIONES TORÁCICAS, revisando la vía aérea. Al revisar la vía aérea, SOLO SI VE ALGO puede intentar sacarlo y evaluar la respiración; de lo contrario, inicie la RCP y el uso del DEA.","RCP · DEA · OVACE");
Q("pa5","Toda persona a la que se le han hecho compresiones abdominales…",["Puede seguir su viaje sin más","Debe ser revisada luego por un médico","Debe tomar líquidos","No requiere seguimiento"],1,"Toda persona a la que se le han hecho COMPRESIONES ABDOMINALES DEBE SER REVISADA LUEGO POR UN MÉDICO.","RCP · DEA · OVACE");
Q("pa5","¿En qué posición se coloca a una víctima inconsciente que SÍ respira normalmente?",["Boca arriba","En posición de recuperación (la RCP no es necesaria)","Sentada","Boca abajo"],1,"Si la víctima está inconsciente PERO RESPIRA NORMALMENTE, la RCP NO ES NECESARIA: coloca a la víctima en POSICIÓN DE RECUPERACIÓN.","RCP · DEA · OVACE");

/* ===== NEUROCIENCIA (módulo nuevo de Factores Humanos) ===== */
Q("fh7","¿Qué es la neurociencia y para qué sirve en la formación de tripulantes?",["El estudio de los aviones","El estudio del sistema nervioso, enfocado en comprender cómo el cerebro aprende, procesa información y se adapta; optimiza metodologías de enseñanza y competencias críticas","Una técnica de relajación","Un tipo de simulador"],1,"NEUROCIENCIA: estudio del sistema nervioso enfocado en comprender el cerebro y cómo aprende, procesa información y se adapta. Permite desvelar los mecanismos biológicos del aprendizaje y el comportamiento. En aviación mejora la percepción, optimiza decisiones bajo presión y contribuye a la seguridad aérea.","Neurociencia");
Q("fh7","¿Cuáles son las tres bases cerebrales del aprendizaje aplicadas a la aviación?",["Vista, oído y tacto","Memoria, atención y toma de decisiones","Lógica, emoción e intuición","Estudio, práctica y examen"],1,"Las bases cerebrales del aprendizaje son: MEMORIA (almacenar y recuperar procedimientos y protocolos de emergencia), ATENCIÓN (concentrarse en estímulos relevantes y filtrar distracciones) y TOMA DE DECISIONES (seleccionar el curso de acción más adecuado bajo presión).","Neurociencia");
Q("fh7","¿Qué son los ENGRAMAS MOTORES?",["Errores de memoria","Patrones automáticos en que se almacenan las acciones repetidas, facilitando respuestas reflejas y eficientes","Un tipo de checklist","Fallas del sistema nervioso"],1,"En la neuroplasticidad hay dos mecanismos clave: FORTALECIMIENTO SINÁPTICO (la práctica consolida vías neuronales para una ejecución más rápida y precisa, liberando recursos cognitivos) y CREACIÓN DE ENGRAMAS MOTORES (las acciones repetidas se almacenan como patrones automáticos, facilitando respuestas reflejas).","Neurociencia");
Q("fh7","¿Qué efecto tiene el CORTISOL elevado en el rendimiento?",["Mejora la concentración","Compromete la toma de decisiones, la memoria operativa y la capacidad de atención, disminuyendo la agilidad mental","Aumenta la fuerza física","No tiene efecto cognitivo"],1,"El CORTISOL elevado compromete funciones cerebrales esenciales en situaciones de alta tensión: afecta la toma de decisiones, la memoria operativa y la capacidad de atención, disminuyendo la agilidad mental y la resolución de problemas, con impacto en la seguridad aérea.","Neurociencia");
Q("fh7","¿Cómo ayudan las checklists desde el punto de vista neurocognitivo?",["Ahorran tiempo","Reducen la carga de la memoria de trabajo, organizando la información de forma lógica y visual para guiar la atención y minimizar errores críticos","Reemplazan el entrenamiento","Sirven solo como registro legal"],1,"Las checklists diseñadas con principios neurocognitivos REDUCEN LA CARGA DE LA MEMORIA DE TRABAJO. Organizan la información de forma lógica y visual para guiar la atención y minimizar errores críticos.","Neurociencia");
Q("fh7","¿Qué estructuras cerebrales participan en la toma de decisiones bajo presión?",["Solo el cerebelo","Corteza prefrontal, sistema límbico e hipocampo","El tronco encefálico","La médula espinal"],1,"En situaciones críticas el cerebro activa circuitos de respuesta rápida priorizando la supervivencia. La CORTEZA PREFRONTAL, el SISTEMA LÍMBICO y el HIPOCAMPO procesan información, gestionan estrés y recuerdan protocolos. La carga cognitiva y las emociones intensas pueden alterar la percepción y la velocidad de procesamiento.","Neurociencia");
Q("fh7","¿Qué caracteriza cerebralmente a un líder efectivo en crisis?",["Mayor fuerza física","Regulación emocional (control de la amígdala por la corteza prefrontal), toma de decisiones ágil, flexibilidad cognitiva y resiliencia neural","Menos empatía","Mayor velocidad de reacción muscular"],1,"Características cerebrales de líderes efectivos en crisis: REGULACIÓN EMOCIONAL (mayor control de la amígdala por la corteza prefrontal), TOMA DE DECISIONES ÁGIL, FLEXIBILIDAD COGNITIVA (adaptarse a escenarios inesperados) y RESILIENCIA NEURAL (recuperarse del estrés manteniendo el rendimiento).","Neurociencia");
Q("fh7","¿Qué estrategias neurocognitivas optimizan la atención en vuelo?",["Hacer varias tareas a la vez","Entrenamiento cognitivo, protocolos y checklists, conciencia situacional y técnicas de mindfulness","Aumentar la velocidad de trabajo","Reducir la comunicación"],1,"El cerebro tiene límites para procesar múltiples estímulos simultáneamente y la carga cognitiva excesiva compromete la seguridad. Estrategias: ENTRENAMIENTO COGNITIVO (atención selectiva), PROTOCOLOS Y CHECKLISTS, CONCIENCIA SITUACIONAL y TÉCNICAS DE MINDFULNESS.","Neurociencia");

/* ===== REFUERZO RAE · CENAFOM (Convenio de Chicago y normativa) ===== */
Q("rae1","¿Qué establece el Artículo 1 del Convenio de Chicago?",["La libertad de sobrevuelo","Que los Estados contratantes reconocen que todo Estado tiene soberanía plena y exclusiva en el espacio aéreo situado sobre su territorio","La creación de la OACI","Las normas de mercancías peligrosas"],1,"Convenio de Chicago, Artículo 1 (Soberanía): «Los Estados contratantes reconocen que todo Estado tiene soberanía PLENA Y EXCLUSIVA en el espacio aéreo situado sobre su territorio». Fue firmado en Chicago el 7 de diciembre de 1944 y acordó 18 anexos.","RAE Día 1");
Q("rae1","Según el Convenio de Chicago, ¿qué se considera «territorio» de un Estado?",["Solo la superficie terrestre","Las áreas terrestres y las aguas territoriales adyacentes bajo su soberanía, dominio, protección o mandato","El espacio aéreo únicamente","Las zonas urbanas"],1,"Artículo 2 (Territorio): «se consideran como territorio de un Estado las ÁREAS TERRESTRES Y LAS AGUAS TERRITORIALES ADYACENTES a ellas que se encuentren bajo la soberanía, dominio, protección o mandato de dicho Estado».","RAE Día 1");
Q("rae1","¿A qué aeronaves se aplica el Convenio de Chicago?",["A todas","Solamente a las aeronaves CIVILES, no a las de Estado (militares, de aduanas o de policía)","Solo a las militares","Solo a las de carga"],1,"Artículo 3: el Convenio se aplica SOLAMENTE A LAS AERONAVES CIVILES y NO a las aeronaves de Estado. Se consideran aeronaves de Estado las utilizadas en servicios MILITARES, DE ADUANAS O DE POLICÍA. Ninguna aeronave de Estado podrá volar sobre el territorio de otro Estado sin autorización.","RAE Día 1");
Q("rae1","¿Cuáles son los dos anexos más destacados del Convenio de Chicago para el TAC?",["Anexo 1 y Anexo 6","Anexo 17 (actos de interferencia ilícita) y Anexo 18 (transporte seguro de mercancías peligrosas por vía aérea)","Anexo 13 y Anexo 14","Anexo 2 y Anexo 11"],1,"El Convenio de Chicago acordó 18 ANEXOS, siendo los más destacados el ANEXO 17 (actos de interferencia ilícita) y el ANEXO 18 (transporte seguro de mercancías peligrosas por vía aérea).","RAE Día 1");
Q("rae1","¿Cuándo entró en vigor el Convenio de Tokio?",["En 1963, al ser firmado","Fue concluido el 14 de septiembre de 1963 y entró en vigor el 4 de diciembre de 1969","En 1944","En 1999"],1,"El Convenio de Tokio, sobre las Infracciones y Ciertos Otros Actos Cometidos a Bordo de las Aeronaves, fue concluido en Tokio el 14 DE SEPTIEMBRE DE 1963 y ENTRÓ EN VIGOR EL 4 DE DICIEMBRE DE 1969.","RAE Día 1");
Q("rae1","Según el Artículo 76 del Código Aeronáutico, la circulación de aeronaves chilenas…",["Requiere permiso para cada vuelo","Será libre dentro del territorio nacional y su espacio aéreo, sujeta solamente a las restricciones impuestas conforme a la ley","Está restringida a rutas fijas","Solo es libre de día"],1,"ARTÍCULO 76: «La circulación de aeronaves chilenas será LIBRE dentro del territorio nacional y su espacio aéreo, sujeta solamente a las restricciones impuestas conforme a la ley».","RAE Día 1");
Q("rae1","¿En qué año fue fundada la FAA?",["1944","1926","1958","1930"],1,"La FAA (Federal Aviation Administration) fue fundada en los Estados Unidos en 1926. Es la entidad gubernamental responsable de la regulación de todos los aspectos de la aviación civil en los Estados Unidos.","RAE Día 1");
Q("rae1","Además de normar y fiscalizar, ¿qué otras funciones desarrolla la DGAC?",["Solo fiscalizar","Desarrolla la infraestructura aeronáutica y presta servicios de navegación aérea, meteorología, aeroportuarios y seguridad operacional","Vende pasajes","Opera aerolíneas"],1,"La DGAC, además de normar y fiscalizar la actividad aérea del espacio aéreo chileno y de las empresas nacionales que vuelan al extranjero, DESARROLLA LA INFRAESTRUCTURA AERONÁUTICA y presta servicios de NAVEGACIÓN AÉREA, METEOROLOGÍA, AEROPORTUARIOS y SEGURIDAD OPERACIONAL.","RAE Día 1");

/* ===== TARJETAS DE LA ETAPA 3 ===== */
C("a1","A320 · datos generales","Techo 39.000 ft · crucero 880 km/h · largo 39 m · envergadura 34 m · altura 3,40 m · autonomía ~6 h · 2 motores bajo las alas · Fly by Wire · ECAM en cabina de mando · APU en el empenaje · a 39.000 ft la altitud de cabina es 8.000 ft.");
C("a1","Configuración 186","Jumpseat 2/3 · elemento de flotación: cojín o chaleco · salidas del sector alar en filas 11-12 / 12-13 · 1 máscara de oxígeno adicional en todas las filas · 2 bodegas presurizadas + bulk (calefaccionada), acceso por lado RH.");
C("a1","Detector de humo del baño","Está detrás de la rejilla del techo. Al activarse: triple chime LO repetitivo por 30 seg, luz roja intermitente en los AIP, ámbar en el ACP del área y fuera del baño, e indicación SMOKE en FAP y AAP. Reset silencia solo lo AUDITIVO. Extintor fijo: esfera roja de halón sobre el basurero, manómetro en verde.");
C("a2","FAP y AAP","FAP (Forward Attendant Panel): touch screen o pantalla de botones; controla los sistemas vía CIDS. Botón CABIN READY: tenue=inactivo, oscuro=activo, VERDE=presionado. AAP: panel al costado de la puerta 4L (iluminación posterior, Evac, Evac Reset).");
C("a2","Señales AIP y ACP","AIP: VERDE FIJA = comunicación normal · ROJA INTERMITENTE = llamado de emergencia del cockpit, alarma de humo, falla de succión o EVAC activado. ACP: normales fijas, anormales intermitentes; la luz AZUL de llamada de pasajero es SIEMPRE FIJA.");
C("a2","Agua, desechos y temperatura","Tanque de agua 200 litros · estanque de desechos 170 litros · temperatura seleccionable entre 18 °C y 30 °C desde el cockpit, y desde el FAP solo ±2,5 °C respecto de esa selección.");
C("a3","Puertas A320 · advertencias","SLIDE ARMED (luz blanca fija): el tobogán está armado. CABIN PRESSURE (luz roja intermitente): hay presión residual, NO ABRIR la puerta. Indicador: LOCKED verde = asegurada · UNLOCKED rojo = no asegurada.");
C("a3","Armado y desarmado","ARMADO: pin del letrero DISARMED → palanca amarilla a ARMED → visor ARMED (rojo) y círculo y flecha ALINEADOS → pin al brazo de la puerta, cinta NO visible. FAP: DOORS SLIDES VERDE. DESARMADO: al revés; visor DISARMED (verde), no alineados, cinta visible, FAP en ÁMBAR.");
C("a3","Dispositivos de evacuación","TOBOGÁN: 1 carril, 1 pax/seg, flotación sin abordar. TOBOGÁN BALSA: 2 carriles, 2 pax/seg, 2 tubos, se aborda. TOBOGÁN RAMPA (sector alar): 2 carriles, siempre armado, NO se desconecta. Todos se inflan en ~5 segundos; manual con PULL TO INFLATE.");
C("a3","Desconexión en ditching","Levantar cubierta FOR DITCHING ONLY → tirar completamente la manija blanca HANDLE → cortar la mooring line con el cuchillo. Kits de supervivencia: 1 por tobogán balsa, en OHB cercanos a las puertas; se ata el gancho a la cuerda de tela blanca bajo el tobogán.");
C("a4","Oxígeno del A320","Pasajeros: generadores químicos en el PSU. Se activa AUTOMÁTICAMENTE a 14.000 pies de altitud de cabina, desde el cockpit, o manualmente con el MRT (Manual Release Tool; hay 4 en jumpseats). Cockpit: 1 tanque para 4 máscaras quick donning.");
C("a4","Cabina de mando A320","Puerta blindada con key pad al costado del FAP y cerrojo de seguridad al centro-izquierda. 2 ventanas abribles SOLO desde el interior como vía de evacuación, con escape rope de 5,5 m que soporta 181 kg. Quick donning: clips rojos inflan el arnés, EMERGENCY da sobrepresión, N/100% mezcla o puro.");
C("pa1","Leyes de los gases","BOYLE: el volumen de un gas es inversamente proporcional a la presión (explica los gases atrapados). HENRY: el gas disuelto es directamente proporcional a la presión sobre la solución (explica la enfermedad por descompresión).");
C("pa1","Los 4 tipos de hipoxia","HIPÓXICA: fase respiratoria (altitud, pérdida de presurización) · HIPÉMICA: transporte (CO, hemorragia, tabaquismo) · POR ESTANCAMIENTO: flujo reducido (falla cardíaca, frío, Gs) · HISTOTÓXICA: utilización (alcohol, tabaco, intoxicación). Síntomas los siente uno; signos los ve un tercero.");
C("pa1","Disbarismos","Gases atrapados: expansión gastrointestinal (la molestia MÁS FRECUENTE), barotitis media (la más importante, peor en DESCENSO), barosinusitis (en ASCENSO), barodontalgia y sobredistensión pulmonar. EPD: bends, dérmicas, chokes, neurológicas y vasomotoras (la más grave).");
C("pa1","Enfermedad por descompresión","Puede aparecer hasta 24 h después del vuelo (50% en 1 h, 90% en 6 h, 99% en 24 h). NO bucear al menos 24 horas antes de volar. Conducta: descenso controlado inmediato, O2, aterrizar cuanto antes y ayuda médica. Tratamiento: cámara hiperbárica.");
C("pa2","WOCL y fatiga","WOCL (Window of Circadian Low): 02:00 a 06:00, el punto más bajo de alerta. Microsueños: 2 a 30 segundos incontrolables. La fatiga es insidiosa: el fatigado no puede autoevaluarse. Reportarla es obligación legal y moral (Cultura Justa del SMS). Resincronizar 6+ husos toma ~7 días.");
C("pa3","Emergencias médicas · claves","IAM y crisis asmática: SEMISENTADO. ACV y shock: posición de seguridad. Oxígeno de primeros auxilios: 2 lts/min. Hemorragia: compresión directa, NO torniquete, NO retirar paños. Convulsión: NO sujetar ni poner objetos en la boca. Golpe en la cabeza: estabilizar columna cervical.");
C("pa3","Escala de Cincinnati (ACV)","1) Asimetría facial (que sonría) · 2) Descenso del brazo (brazos extendidos 10 seg con ojos cerrados) · 3) Lenguaje anormal («el perro de San Roque no tiene rabo»). Con 1 signo anormal la probabilidad de ataque cerebral es del 72%.");
C("pa3","Quemaduras","Regla de los 9: cabeza 9% · cuello 1% · tronco 18% · tórax y abdomen 18% · cada pierna 18% · cada brazo 9%. Gran Quemado: 25% en adulto, 15% en niño. A (1º): enrojecimiento · AB (2º): ampollas, NO romperlas · B (3º): escaras y SIN dolor.");
C("pa3","Parto a bordo","3 fases: parto avanzado (3-4 contracciones/10 min) · expulsivo (5 o más, se ve el feto) · alumbramiento (placenta, 5-30 min, no forzar; va en bolsa de MMPP). Trasladar al galley, posición ginecológica. Sin partes fetales: decúbito IZQUIERDO. Cordón: ligar a 4 dedos y otra a 4 dedos, cortar entre ambas.");
C("pa4","Botiquines","MK: solo personal de salud calificado (fármacos, intubación). FAK: lo usa la TC (primeros auxilios). UPK: sospecha de enfermedad infectocontagiosa y fluidos. DEA: no mojar, no tocar al paciente al analizar, sin electrodos sobre marcapasos. NUNCA recomendar ni administrar medicamentos.");
C("pa5","RCP · números clave","C-V-R para todas las edades · 30 compresiones : 2 ventilaciones = 1 ciclo · al menos 100/min · adulto 2 pulgadas con 2 manos, niño ~2 con 1-2 manos, bebé ~1½ con 2 dedos · evaluar respiración 5-10 seg · cambiar de auxiliador cada 2 minutos.");
C("pa5","OVACE","Obstrucción LEVE (tose y habla): NO intervenir, animar a toser. SEVERA: compresiones abdominales sobre el ombligo y bajo el esternón. Embarazada u obeso: compresiones EN EL PECHO. Inconsciente: al suelo y RCP, revisando la boca tras cada serie (sacar el objeto SOLO si se ve). Bebé: 5 golpes en la espalda + 5 compresiones torácicas.");
C("fh7","Neurociencia aplicada","Neuroplasticidad: fortalecimiento sináptico + engramas motores (la repetición crea respuestas automáticas). El cortisol alto daña la memoria operativa y la atención. Las checklists reducen la carga de la memoria de trabajo. Líder en crisis: regulación emocional, decisión ágil, flexibilidad y resiliencia.");
